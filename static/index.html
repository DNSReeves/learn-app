/* ── PHYSIOLOGY visuals batch (operator, 2026-08-01: "add much more visual aids ...
   the sodium/potassium ATP-driven pump ... and the action potential of a nerve firing").
   Fills real gaps: 81 of 194 concepts had no visual. Narrated numbers are MEASURED off
   the plotted arrays (ANIMS._med_pump_debug), never hardcoded. ─────────────────────── */
/* ===== Physiology — two flagship canvas animations (operator-requested) =====
   1) med_nakpump        — the Na⁺/K⁺-ATPase running its real transport cycle
   2) med_actionpotential — a nerve firing, curve built in real time + channel states
   House rules followed: MED palette, _t/_lerp/clear/tween/sleep/narrate helpers,
   900×380 canvas, every animation ships BOTH <name>_static and <name>.
   HARD RULE: every number spoken in narration is COMPUTED from the data drawn.
   Computed values are exported on ANIMS._med_pump_debug at the bottom of this file. */

/* ---------- shared tiny helpers (namespaced; do not shadow house helpers) ---------- */
const _clamp01 = x => x < 0 ? 0 : (x > 1 ? 1 : x);
const _seg = (p, a, b) => _clamp01((p - a) / (b - a));
const _mvw = v => (v < 0 ? "minus " + Math.abs(Math.round(v)) : "plus " + Math.round(v));

/* =====================================================================
   1) Na⁺/K⁺-ATPase — the pump, as a working machine
   ===================================================================== */

/* stoichiometry is declared ONCE and both the drawing and the narration read it */
const PUMP_NA = 3;                 // Na⁺ exported per cycle
const PUMP_K  = 2;                 // K⁺ imported per cycle
const PUMP_NET = PUMP_NA - PUMP_K; // net positive charge exported per cycle
const PUMP_CYCLES = 3;             // cycles actually animated
const PUMP_ATP_LOW = 20, PUMP_ATP_HIGH = 30;   // % of cellular ATP budget (drawn as a band)

/* deterministic background ion cloud (same picture every run) */
function _pumpRng(seed) { let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
const PUMP_CLOUD = (() => {
  const r = _pumpRng(20260801), out = [];
  const box = (n, kind, x0, x1, y0, y1) => { for (let i = 0; i < n; i++) out.push({ kind, x: x0 + r() * (x1 - x0), y: y0 + r() * (y1 - y0) }); };
  box(15, "na", 62, 640, 58, 158);    // Na⁺ HIGH outside
  box(4, "k", 62, 640, 58, 158);    // K⁺  low  outside
  box(4, "na", 62, 640, 254, 318);   // Na⁺ low  inside
  box(15, "k", 62, 640, 254, 318);   // K⁺  HIGH inside
  return out;
})();

const PUMP_STEPS = [   // [phase-start, phase-end, caption]
  [0.00, 0.16, `${PUMP_NA} Na⁺ bind from INSIDE (pump faces in)`],
  [0.16, 0.28, "ATP → ADP: a phosphate is handed to the pump"],
  [0.28, 0.44, "phosphorylated → the pump EVERTS (now faces out)"],
  [0.44, 0.58, `grip on Na⁺ loosens → ${PUMP_NA} Na⁺ released OUTSIDE`],
  [0.58, 0.72, `${PUMP_K} K⁺ bind from outside`],
  [0.72, 0.82, "phosphate leaves (dephosphorylation)"],
  [0.82, 0.92, "pump REVERTS → faces in again"],
  [0.92, 1.00, `${PUMP_K} K⁺ released INSIDE — cycle complete: net ${PUMP_NET > 0 ? "+" : ""}${PUMP_NET} charge out`]
];

function drawNaKPump(ctx, cv, st) {
  clear(ctx, cv);
  const { pos = 0, title = "" } = st;                 // pos = cycles elapsed (float)
  const done = Math.min(PUMP_CYCLES, Math.floor(pos + 1e-9));
  const p = pos >= PUMP_CYCLES ? 1 : (pos - Math.floor(pos + 1e-9));
  const cx = 380, memTop = 168, memBot = 212, memMid = (memTop + memBot) / 2;

  _t(ctx, cv.width / 2, 26, title, { size: 17, bold: true, align: "center" });

  /* compartments */
  ctx.fillStyle = "rgba(111,168,220,0.07)"; ctx.fillRect(50, 50, 600, memTop - 50);
  ctx.fillStyle = "rgba(232,161,60,0.06)"; ctx.fillRect(50, memBot, 600, 322 - memBot);
  _t(ctx, 58, 66, "OUTSIDE the cell (extracellular fluid) — Na⁺ high", { col: MED.dim, size: 12 });
  _t(ctx, 646, 318, "INSIDE the cell (cytosol) — K⁺ high", { col: MED.dim, size: 12, align: "right" });

  /* lipid bilayer */
  ctx.fillStyle = "rgba(95,191,149,0.12)"; ctx.fillRect(50, memTop, 600, memBot - memTop);
  ctx.strokeStyle = MED.membrane; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(50, memTop); ctx.lineTo(650, memTop);
  ctx.moveTo(50, memBot); ctx.lineTo(650, memBot); ctx.stroke();

  /* background ion populations (the gradients the pump maintains) */
  for (const ion of PUMP_CLOUD) {
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = ion.kind === "na" ? MED.blocker : MED.post;
    ctx.beginPath(); ctx.arc(ion.x, ion.y, 5, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* pump body: cavity mouth opens DOWN when facing in, UP when everted */
  const evert = _seg(p, 0.28, 0.44) * (1 - _seg(p, 0.82, 0.92));
  const topGap = _lerp(7, 46, evert), botGap = _lerp(46, 7, evert);
  const lobe = (sgn) => {
    ctx.beginPath();
    ctx.moveTo(cx + sgn * 52, memTop - 6); ctx.lineTo(cx + sgn * topGap / 2, memTop - 6);
    ctx.lineTo(cx + sgn * botGap / 2, memBot + 6); ctx.lineTo(cx + sgn * 52, memBot + 6);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  };
  ctx.fillStyle = "rgba(95,191,149,0.30)"; ctx.strokeStyle = MED.membrane; ctx.lineWidth = 2;
  lobe(-1); lobe(1);
  _t(ctx, cx, memBot + 34, "Na⁺/K⁺-ATPase", { align: "center", col: MED.membrane, size: 12, bold: true });

  /* ATP / ADP / phosphate */
  const atpOn = p >= 0.16 && p < 0.30, phos = p >= 0.28 && p < 0.78;
  if (atpOn) _t(ctx, cx - 96, memMid + 4, "ATP →", { align: "right", col: MED.post, size: 13, bold: true });
  if (p >= 0.28 && p < 0.42) _t(ctx, cx - 96, memMid + 22, "ADP", { align: "right", col: MED.dim, size: 12 });
  if (phos) {
    ctx.fillStyle = MED.post; ctx.beginPath(); ctx.arc(cx + 60, memMid, 10, 0, 7); ctx.fill();
    _t(ctx, cx + 60, memMid + 4, "P", { align: "center", col: "#1b2027", size: 12, bold: true });
  }
  if (p >= 0.72 && p < 0.82) _t(ctx, cx + 78, memMid + 26, "Pᵢ off", { col: MED.dim, size: 11 });

  /* the transported ions — they MOVE between waypoints, never teleport */
  const naHomeY = 296, naOutY = 92, cavLow = memBot - 8, cavHigh = memTop + 8;
  for (let i = 0; i < PUMP_NA; i++) {
    const hx = cx - 46 + i * 46, sx = cx - 22 + i * 22, ox = cx - 58 + i * 58;
    let x, y;
    const kBind = _seg(p, 0.00, 0.16), kEv = _seg(p, 0.28, 0.44), kRel = _seg(p, 0.44, 0.58);
    x = _lerp(hx, sx, kBind); y = _lerp(naHomeY, cavLow, kBind);
    y = _lerp(y, cavHigh, kEv);
    x = _lerp(x, ox, kRel); y = _lerp(y, naOutY, kRel);
    const a = 1 - _seg(p, 0.64, 0.80);
    if (a <= 0.02) continue;
    ctx.globalAlpha = a; ctx.fillStyle = MED.blocker;
    ctx.beginPath(); ctx.arc(x, y, 9, 0, 7); ctx.fill();
    _t(ctx, x, y + 4, "Na", { align: "center", col: "#14181d", size: 10, bold: true });
  }
  ctx.globalAlpha = 1;
  for (let j = 0; j < PUMP_K; j++) {
    const hx = cx + 150 + j * 46, sx = cx - 14 + j * 28, ix = cx + 140 + j * 48;
    const a = _seg(p, 0.55, 0.60);
    if (a <= 0.02) continue;
    const kIn = _seg(p, 0.60, 0.72), kRev = _seg(p, 0.82, 0.92), kOut = _seg(p, 0.92, 1.00);
    let x = _lerp(hx, sx, kIn), y = _lerp(96, cavHigh, kIn);
    y = _lerp(y, cavLow, kRev);
    x = _lerp(x, ix, kOut); y = _lerp(y, 300, kOut);
    ctx.globalAlpha = a; ctx.fillStyle = MED.post;
    ctx.beginPath(); ctx.arc(x, y, 9, 0, 7); ctx.fill();
    _t(ctx, x, y + 4, "K", { align: "center", col: "#14181d", size: 10, bold: true });
  }
  ctx.globalAlpha = 1;

  /* running tally — the electrogenic point */
  const naOut = done * PUMP_NA + (p >= 0.58 && done < PUMP_CYCLES ? PUMP_NA : 0);
  const kIn = done * PUMP_K;
  const net = naOut - kIn;
  ctx.strokeStyle = "#33404f"; ctx.lineWidth = 1; ctx.strokeRect(666, 56, 218, 132);
  const cyc = Math.min(PUMP_CYCLES, done + (p > 0 && done < PUMP_CYCLES ? 1 : 0));
  _t(ctx, 678, 78, cyc === 0 ? "ready — 0 cycles run" : `cycle ${cyc} of ${PUMP_CYCLES}`, { col: MED.dim, size: 12 });
  _t(ctx, 678, 104, `Na⁺ pumped OUT:  ${naOut}`, { col: MED.blocker, size: 14, bold: true });
  _t(ctx, 678, 128, `K⁺ pumped IN:   ${kIn}`, { col: MED.post, size: 14, bold: true });
  ctx.strokeStyle = "#33404f"; ctx.beginPath(); ctx.moveTo(678, 140); ctx.lineTo(872, 140); ctx.stroke();
  _t(ctx, 678, 162, `net charge OUT:  ${net > 0 ? "+" : ""}${net}`, { col: MED.good, size: 15, bold: true });
  _t(ctx, 678, 180, "→ inside gets more negative", { col: MED.dim, size: 11 });

  /* ATP budget bar — the scale fact */
  const bx = 96, bw = 420, by = 336, bh = 12;
  ctx.strokeStyle = MED.dim; ctx.lineWidth = 1; ctx.strokeRect(bx, by, bw, bh);
  ctx.fillStyle = "rgba(232,161,60,0.75)";
  ctx.fillRect(bx + bw * PUMP_ATP_LOW / 100, by, bw * (PUMP_ATP_HIGH - PUMP_ATP_LOW) / 100, bh);
  ctx.fillStyle = "rgba(232,161,60,0.28)"; ctx.fillRect(bx, by, bw * PUMP_ATP_LOW / 100, bh);
  _t(ctx, bx - 8, by + 11, "ATP spend", { align: "right", col: MED.dim, size: 11 });
  _t(ctx, bx + bw + 12, by + 11, `≈${PUMP_ATP_LOW}–${PUMP_ATP_HIGH}% of the cell's ATP budget (more in neurons)`, { col: MED.fat, size: 12, bold: true });

  /* step caption */
  const step = PUMP_STEPS.find(s => p >= s[0] && p < s[1]) || PUMP_STEPS[PUMP_STEPS.length - 1];
  // LABEL-COLLISION (spot check, 2026-08-01): this stage caption sat at the same
  // height as the Na/K-ATPase protein label (memBot+34) and the two printed on top
  // of each other. Caught by LOOKING at a rendered contact sheet — a
  // paints-without-throwing check cannot see overlapping glyphs.
  _t(ctx, 350, 266, step[2], { align: "center", col: MED.post, size: 13, bold: true });
}

async function runNaKPump(cv, ctx, opts) {
  const L = opts.lines || [], title = opts.title;
  drawNaKPump(ctx, cv, { pos: 0, title });
  if (L[0]) await narrate(L[0]);
  /* cycle 1 — narrated, slow, step by step */
  const stops = [0.28, 0.58, 1.00];
  for (let i = 0; i < stops.length; i++) {
    if (L[i + 1]) await narrate(L[i + 1]);
    const a = i === 0 ? 0 : stops[i - 1], b = stops[i];
    await tween(1500, k => drawNaKPump(ctx, cv, { pos: _lerp(a, b, k), title }));
  }
  if (L[4]) await narrate(L[4]);
  /* cycles 2..N — faster, so the tally visibly climbs */
  for (let c = 1; c < PUMP_CYCLES; c++) {
    await tween(2000, k => drawNaKPump(ctx, cv, { pos: c + k, title }));
    await sleep(120);
  }
  drawNaKPump(ctx, cv, { pos: PUMP_CYCLES, title });
  if (L[5]) await narrate(L[5]);
}

/* =====================================================================
   2) ACTION POTENTIAL — deterministic model, plotted, then MEASURED
   ===================================================================== */
const AP_REST = -70, AP_TH = -55, AP_PEAK = 40, AP_AHP = -80;
const AP_S1 = 3, AP_S2 = 8, AP_S3 = 13;          // stimulus times (ms): weak, weak, strong
const AP_A1 = 8, AP_A2 = 12, AP_ATAU = 0.8;      // sub-threshold bump sizes (mV) / shape
const AP_TRAMP = 1.2, AP_TUP = 0.8, AP_TREP = 2.0, AP_TAHP = 3.2;
const AP_TTH = AP_S3 + AP_TRAMP;                 // threshold crossing
const AP_TPK = AP_TTH + AP_TUP;                  // peak
const AP_TMIN = AP_TPK + AP_TREP;                // bottom of the undershoot
const AP_TEND = 30, AP_DT = 0.05;

function ap_alpha(u, tau) { return u <= 0 ? 0 : (u / tau) * Math.exp(1 - u / tau); }
function ap_base(t) { return AP_REST + AP_A1 * ap_alpha(t - AP_S1, AP_ATAU) + AP_A2 * ap_alpha(t - AP_S2, AP_ATAU); }
const AP_V13 = ap_base(AP_S3);
function ap_v(t) {
  if (t < AP_S3) return ap_base(t);
  if (t < AP_TTH) { const u = (t - AP_S3) / AP_TRAMP; return AP_V13 + (AP_TH - AP_V13) * (1 - Math.exp(-4 * u)) / (1 - Math.exp(-4)); }
  if (t < AP_TPK) { const u = (t - AP_TTH) / AP_TUP; return AP_TH + (AP_PEAK - AP_TH) * (1 - (1 - u) * (1 - u)); }
  if (t < AP_TMIN) { const u = (t - AP_TPK) / AP_TREP; return AP_PEAK + (AP_AHP - AP_PEAK) * (u * u * (3 - 2 * u)); }
  return AP_REST + (AP_AHP - AP_REST) * Math.exp(-(t - AP_TMIN) / AP_TAHP);
}
/* THE ARRAY. Everything narrated below is measured off this, not asserted. */
const AP_TRACE = (() => { const n = Math.round(AP_TEND / AP_DT), a = []; for (let i = 0; i <= n; i++) { const t = i * AP_DT; a.push({ t, v: ap_v(t) }); } return a; })();

const AP_M = (() => {
  const V = AP_TRACE;
  let pk = 0, mn = 0, sub = -1e9;
  for (let i = 0; i < V.length; i++) {
    if (V[i].v > V[pk].v) pk = i;
    if (V[i].v < V[mn].v) mn = i;
    if (V[i].t < AP_S3 && V[i].v > sub) sub = V[i].v;
  }
  /* threshold = the kink on the rising limb: max upward curvature after the last
     return-to-rest and before the peak (the point where the rise turns regenerative) */
  let w = 0;
  for (let i = 1; i < pk; i++) if (V[i].v <= AP_REST + 0.5) w = i;
  let th = w + 1, best = -1e9;
  for (let i = w + 2; i < pk - 1; i++) {
    const d2 = V[i + 1].v - 2 * V[i].v + V[i - 1].v;
    if (d2 > best) { best = d2; th = i; }
  }
  let back = pk; while (back < V.length - 1 && V[back].v > AP_REST) back++;      // repolarised through rest
  let rec = mn; while (rec < V.length - 1 && V[rec].v < AP_REST - 1) rec++;      // AHP faded (within 1 mV)
  return {
    restMv: Math.round(V[0].v), peakMv: Math.round(V[pk].v), ahpMv: Math.round(V[mn].v),
    subPeakMv: Math.round(sub), thMv: Math.round(V[th].v),
    thMs: V[th].t, peakMs: V[pk].t, backMs: V[back].t, recMs: V[rec].t, minMs: V[mn].t,
    spikeMs: +(V[back].t - V[th].t).toFixed(2), ahpMs: +(V[rec].t - V[back].t).toFixed(2),
    durationMs: +(V[rec].t - V[th].t).toFixed(2),          // threshold → fully recovered
    windowMs: +(V[V.length - 1].t - V[0].t).toFixed(2), samples: V.length
  };
})();

/* channel gating, tied to the SAME landmarks that shape the curve */
const ap_naOpen = t => Math.min(_seg(t, AP_TTH, AP_TTH + 0.35), 1 - _seg(t, AP_TPK - 0.1, AP_TPK + 0.7));
const ap_naInact = t => Math.min(_seg(t, AP_TPK, AP_TPK + 0.7), 1 - _seg(t, AP_M.backMs, AP_M.recMs));
const ap_kOpen = t => Math.min(_seg(t, AP_TPK, AP_TMIN - 0.8), 1 - _seg(t, AP_TMIN, AP_M.recMs));

function ap_phase(t) {
  if (t < AP_S1) return ["resting — inside sits at " + AP_M.restMv + " mV", MED.dim];
  if (t < AP_S3) return ["weak stimulus → sub-threshold bump → it DIES AWAY (no spike)", MED.dim];
  if (t < AP_TTH) return ["stronger stimulus → climbing toward threshold", MED.post];
  if (t < AP_TPK) return ["THRESHOLD " + AP_M.thMv + " mV → Na⁺ channels open → Na⁺ rushes IN (upstroke)", MED.blocker];
  if (t < AP_TMIN) return ["Na⁺ channels INACTIVATE · K⁺ channels open → K⁺ flows OUT (repolarisation)", MED.post];
  if (t < AP_M.recMs) return ["K⁺ channels close slowly → undershoot (after-hyperpolarisation)", MED.post];
  return ["back at rest — ready to fire again", MED.good];
}

function drawAP(ctx, cv, st) {
  clear(ctx, cv);
  const { tNow = 0, title = "", refract = 0 } = st;
  const x0 = 76, x1 = 590, yTop = 58, yBot = 322, vHi = 60, vLo = -95;
  const TX = t => x0 + (x1 - x0) * (t / AP_TEND);
  const VY = v => yTop + (vHi - v) * (yBot - yTop) / (vHi - vLo);

  _t(ctx, cv.width / 2, 26, title, { size: 17, bold: true, align: "center" });

  /* refractory shading (drawn under the trace) */
  if (refract > 0) {
    ctx.globalAlpha = 0.16 * refract;
    ctx.fillStyle = MED.lean; ctx.fillRect(TX(AP_M.thMs), yTop, TX(AP_M.backMs) - TX(AP_M.thMs), yBot - yTop);
    ctx.fillStyle = MED.post; ctx.fillRect(TX(AP_M.backMs), yTop, TX(AP_M.recMs) - TX(AP_M.backMs), yBot - yTop);
    ctx.globalAlpha = 1;
    _t(ctx, (TX(AP_M.thMs) + TX(AP_M.backMs)) / 2, yTop + 16, "absolute", { align: "center", col: MED.lean, size: 11, bold: true });
    _t(ctx, (TX(AP_M.thMs) + TX(AP_M.backMs)) / 2, yTop + 29, "refractory", { align: "center", col: MED.lean, size: 11, bold: true });
    _t(ctx, (TX(AP_M.backMs) + TX(AP_M.recMs)) / 2, yTop + 16, "relative refractory", { align: "center", col: MED.post, size: 11, bold: true });
  }

  /* axes */
  ctx.strokeStyle = MED.dim; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x0, yTop); ctx.lineTo(x0, yBot); ctx.moveTo(x0, VY(AP_REST)); ctx.lineTo(x1, VY(AP_REST)); ctx.stroke();
  for (const v of [AP_PEAK, 0, AP_TH, AP_REST, AP_AHP]) {
    _t(ctx, x0 - 8, VY(v) + 4, (v > 0 ? "+" : "") + v, { align: "right", col: MED.dim, size: 11 });
    if (v === AP_TH || v === AP_REST) {
      ctx.strokeStyle = v === AP_TH ? "rgba(232,161,60,0.55)" : "rgba(132,150,171,0.45)";
      ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(x0, VY(v)); ctx.lineTo(x1, VY(v)); ctx.stroke(); ctx.setLineDash([]);
    }
  }
  _t(ctx, x0 - 8, VY(AP_TH) - 8, "threshold", { align: "right", col: MED.post, size: 10 });
  ctx.save(); ctx.translate(x0 - 52, (yTop + yBot) / 2); ctx.rotate(-Math.PI / 2);
  _t(ctx, 0, 0, "membrane voltage (mV)", { align: "center", col: MED.dim, size: 12 }); ctx.restore();
  for (let ms = 0; ms <= AP_TEND; ms += 5) {
    ctx.strokeStyle = MED.dim; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(TX(ms), yBot); ctx.lineTo(TX(ms), yBot + 5); ctx.stroke();
    _t(ctx, TX(ms), yBot + 19, String(ms), { align: "center", col: MED.dim, size: 11 });
  }
  _t(ctx, (x0 + x1) / 2, yBot + 36, "time (milliseconds)", { align: "center", col: MED.dim, size: 12 });

  /* stimulus marks */
  for (const [s, lab] of [[AP_S1, "stim"], [AP_S2, "stim"], [AP_S3, "STIM"]]) {
    if (tNow < s - 0.4) continue;
    ctx.strokeStyle = "rgba(159,178,198,0.5)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(TX(s), yBot - 6); ctx.lineTo(TX(s), yBot - 18); ctx.stroke();
    _t(ctx, TX(s), yBot - 22, lab, { align: "center", col: MED.dim, size: 10, bold: lab === "STIM" });
  }

  /* the trace, drawn only up to tNow (it BUILDS) */
  ctx.strokeStyle = MED.good; ctx.lineWidth = 2.6; ctx.beginPath();
  let last = null;
  for (const s of AP_TRACE) { if (s.t > tNow + 1e-9) break; const X = TX(s.t), Y = VY(s.v); last ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); last = s; }
  ctx.stroke();
  if (last) { ctx.fillStyle = MED.post; ctx.beginPath(); ctx.arc(TX(last.t), VY(last.v), 5.5, 0, 7); ctx.fill(); }

  /* landmark labels appear as the curve reaches them */
  if (tNow >= AP_M.peakMs) _t(ctx, TX(AP_M.peakMs) + 8, VY(AP_PEAK) - 6, `peak ${AP_M.peakMv > 0 ? "+" : ""}${AP_M.peakMv} mV`, { col: MED.good, size: 12, bold: true });
  if (tNow >= AP_M.thMs) _t(ctx, TX(AP_M.thMs) - 6, VY(AP_TH) + 20, `${AP_M.thMv} mV`, { align: "right", col: MED.post, size: 11, bold: true });
  if (tNow >= AP_S2 + 0.8) _t(ctx, TX(AP_S2) + 6, VY(AP_M.subPeakMv) - 8, `only ${AP_M.subPeakMv} mV → fails`, { col: MED.dim, size: 11 });
  if (tNow >= AP_M.minMs) _t(ctx, TX(AP_M.minMs) + 6, VY(AP_AHP) + 16, `undershoot ${AP_M.ahpMv} mV`, { col: MED.post, size: 11 });

  /* --- membrane panel: the channels that cause each phase --- */
  const px0 = 618, px1 = 884, mT = 158, mB = 198;
  ctx.fillStyle = "rgba(111,168,220,0.07)"; ctx.fillRect(px0, 74, px1 - px0, mT - 74);
  ctx.fillStyle = "rgba(232,161,60,0.06)"; ctx.fillRect(px0, mB, px1 - px0, 286 - mB);
  ctx.fillStyle = "rgba(95,191,149,0.12)"; ctx.fillRect(px0, mT, px1 - px0, mB - mT);
  ctx.strokeStyle = MED.membrane; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(px0, mT); ctx.lineTo(px1, mT); ctx.moveTo(px0, mB); ctx.lineTo(px1, mB); ctx.stroke();
  _t(ctx, px0 + 4, 70, "outside (Na⁺ high)", { col: MED.dim, size: 11 });
  _t(ctx, px0 + 4, 300, "inside (K⁺ high)", { col: MED.dim, size: 11 });

  const na = ap_naOpen(tNow), naI = ap_naInact(tNow), k = ap_kOpen(tNow);
  const chan = (x, open, col, lab, state, stCol) => {
    const g = _lerp(3, 15, open);
    ctx.fillStyle = open > 0.15 ? "rgba(95,191,149,0.30)" : "rgba(132,150,171,0.22)";
    ctx.strokeStyle = open > 0.15 ? col : MED.dim; ctx.lineWidth = 2;
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(x + s * 26, mT - 6); ctx.lineTo(x + s * g / 2, mT - 6);
      ctx.lineTo(x + s * g / 2, mB + 6); ctx.lineTo(x + s * 26, mB + 6); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    _t(ctx, x, mB + 32, lab, { align: "center", col: MED.dim, size: 11 });
    _t(ctx, x, mB + 48, state, { align: "center", col: stCol, size: 11, bold: true });
  };
  chan(684, na, MED.blocker, "Na⁺ channel", naI > 0.3 ? "INACTIVATED" : (na > 0.3 ? "OPEN" : "closed"), naI > 0.3 ? MED.lean : (na > 0.3 ? MED.good : MED.dim));
  if (naI > 0.3) { ctx.fillStyle = MED.lean; ctx.beginPath(); ctx.arc(684, mB + 12, 7, 0, 7); ctx.fill(); }
  chan(818, k, MED.post, "K⁺ channel", k > 0.3 ? "OPEN" : "closed", k > 0.3 ? MED.good : MED.dim);

  /* ions flowing through the open channels, correct direction */
  const flow = (x, open, col, lab, down) => {
    if (open <= 0.15) return;
    ctx.globalAlpha = open;
    for (let i = 0; i < 4; i++) {
      const f = ((tNow * 1.1 + i / 4) % 1);
      const y = down ? _lerp(106, 258, f) : _lerp(258, 106, f);
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, 6.5, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    _t(ctx, x, down ? 92 : 282, down ? lab + " IN ↓" : lab + " OUT ↑", { align: "center", col, size: 11, bold: true });
  };
  flow(684, na, MED.blocker, "Na⁺", true);
  flow(818, k, MED.post, "K⁺", false);

  const [cap, capCol] = ap_phase(tNow);
  _t(ctx, cv.width / 2, 370, cap, { align: "center", col: capCol, size: 13, bold: true });
}

async function runAP(cv, ctx, opts) {
  const L = opts.lines || [], title = opts.title;
  drawAP(ctx, cv, { tNow: 0, title });
  const legs = [[0, AP_S1 - 0.5, 600], [AP_S1 - 0.5, AP_S3 - 0.4, 2200], [AP_S3 - 0.4, AP_TPK, 1800],
  [AP_TPK, AP_TMIN, 1500], [AP_TMIN, AP_TEND, 2000]];
  for (let i = 0; i < legs.length; i++) {
    if (L[i]) await narrate(L[i]);
    const [a, b, ms] = legs[i];
    await tween(ms, k => drawAP(ctx, cv, { tNow: _lerp(a, b, k), title }));
  }
  if (L[legs.length]) await narrate(L[legs.length]);
  await tween(700, k => drawAP(ctx, cv, { tNow: AP_TEND, title, refract: k }));
  if (L[legs.length + 1]) await narrate(L[legs.length + 1]);
}

/* =====================================================================
   thin ANIMS wrappers — narration built FROM the computed values
   ===================================================================== */
const PUMP_TITLE = "The sodium–potassium pump — 3 out, 2 in, every cycle";
const PUMP_LINES = [
  `This is the sodium-potassium pump, an enzyme called the sodium-potassium ATPase, sitting in the membrane of essentially every cell you own. Below the membrane is the cytosol — the fluid inside the cell. Above it is the extracellular fluid outside. Notice the gradients it maintains: sodium is concentrated outside, potassium inside.`,
  `The cycle starts with the pump open to the inside. ${PUMP_NA} sodium ions bind. Then ATP — adenosine triphosphate, the cell's energy currency — hands the pump a single phosphate group. That phosphate is the whole trick: it changes the pump's shape.`,
  `Phosphorylated, the pump everts — the pocket that faced inward now faces outward. Its grip on sodium loosens, and all ${PUMP_NA} sodium ions are released outside, against their gradient. ${PUMP_K} potassium ions then bind in their place.`,
  `Losing the phosphate snaps the pump back to its inward-facing shape, and the ${PUMP_K} potassium ions are released into the cytosol. One full cycle: ${PUMP_NA} sodium out, ${PUMP_K} potassium in.`,
  `Now count the charge. ${PUMP_NA} positive charges leave, only ${PUMP_K} come back — a net of plus ${PUMP_NET} exported every single cycle. That is what electrogenic means: the pump does not just move ions, it moves charge, so it directly drags the inside of the cell more negative. Watch the tally.`,
  `After ${PUMP_CYCLES} cycles it has exported ${PUMP_CYCLES * PUMP_NA} sodium, imported ${PUMP_CYCLES * PUMP_K} potassium, and moved ${PUMP_CYCLES * PUMP_NET} net positive charges out — a small but real slice of the resting membrane potential, on top of the much larger contribution from the potassium gradient it builds. And it is expensive: running these pumps costs roughly ${PUMP_ATP_LOW} to ${PUMP_ATP_HIGH} percent of a typical cell's entire ATP budget, and considerably more in neurons. Every nerve impulse and every heartbeat is rented from this one machine.`
];
ANIMS.med_nakpump_static = (cv, ctx) => drawNaKPump(ctx, cv, { pos: 0, title: PUMP_TITLE });
ANIMS.med_nakpump = (cv, ctx) => runNaKPump(cv, ctx, { title: PUMP_TITLE, lines: PUMP_LINES });

const AP_TITLE = "A nerve firing — the action potential, built in real time";
const AP_LINES = [
  `This is the voltage across a nerve cell's membrane, in millivolts, plotted against time in milliseconds. At rest the inside sits about ${_mvw(AP_M.restMv)} millivolts relative to the outside. That is the resting membrane potential, and the sodium-potassium pump is what pays for it.`,
  `Two weak stimuli. Each nudges the voltage upward and each one dies away — the bigger of the two only reaches ${_mvw(AP_M.subPeakMv)} millivolts. Nothing propagates. A sub-threshold stimulus does not produce a small action potential; it produces no action potential at all.`,
  `Now a stronger stimulus drives the voltage up to about ${_mvw(AP_M.thMv)} millivolts — threshold. Voltage-gated sodium channels snap open, sodium rushes IN down its gradient, which depolarises the membrane further, which opens still more sodium channels. That runaway loop is the upstroke, and it always ends in the same place: ${_mvw(AP_M.peakMv)} millivolts. All-or-none — the spike has no volume knob.`,
  `At the peak the sodium channels inactivate: they do not merely close, they latch shut and stay shut. Meanwhile the slower voltage-gated potassium channels are finally opening, so potassium now flows OUT, carrying positive charge with it, and the voltage falls.`,
  `Those potassium channels are slow to close, so the membrane sails past rest all the way down to ${_mvw(AP_M.ahpMv)} millivolts. That is the after-hyperpolarisation. Measured off this trace: from threshold back down through rest takes ${AP_M.spikeMs.toFixed(1)} milliseconds, the undershoot takes roughly another ${Math.round(AP_M.ahpMs)} milliseconds to fade, so the whole event — threshold to fully recovered — runs about ${Math.round(AP_M.durationMs)} milliseconds.`,
  `Note what did NOT change: the concentrations. Only a vanishing number of ions actually crossed. The pump quietly restores the books, which is why a neuron can do this again a moment later.`,
  `The shaded band is the refractory period. In the red stretch — while the sodium channels are inactivated — no stimulus of any size can trigger a second spike; in the amber stretch it takes a stronger-than-normal stimulus. That is not a flaw, it is the design. It forces the impulse to travel one way down the axon, because the patch it just left cannot fire again, and it puts a hard ceiling on how fast the neuron can fire.`
];
ANIMS.med_actionpotential_static = (cv, ctx) => drawAP(ctx, cv, { tNow: 0, title: AP_TITLE });
ANIMS.med_actionpotential = (cv, ctx) => runAP(cv, ctx, { title: AP_TITLE, lines: AP_LINES });

/* ===== debug handle: every value the narration speaks, computed from the drawing ===== */
ANIMS._med_pump_debug = {
  naPerCycle: PUMP_NA,
  kPerCycle: PUMP_K,
  netChargePerCycle: PUMP_NET,
  cyclesShown: PUMP_CYCLES,
  naTotalOut: PUMP_CYCLES * PUMP_NA,
  kTotalIn: PUMP_CYCLES * PUMP_K,
  netChargeTotal: PUMP_CYCLES * PUMP_NET,
  atpBudgetPctLow: PUMP_ATP_LOW,

   _t()/_lerp()/clear() helpers, narrate() for the spoken beat, REDUCED-motion
   safe via tween()/sleep(), and both ANIMS.<name>_static + ANIMS.<name>.

   HARD RULE honoured (the lesson the TA + genetics modules taught): every number
   spoken in narration is COMPUTED from the arrays that are actually drawn — see
   ANIMS._med_metabolic_debug at the foot of this block. Retune a constant and the
   narration follows; it cannot be left lying.

   between drugs, people or studies (gastric emptying, food intake, years to
   diagnosis) the narration speaks it as a range or names it as a model. */

/* ---- tiny shared plotting kit (local to this block) ---- */
function _mmPanel(x,y,w,h,x0,x1,y0,y1){
  return {x,y,w,h,x0,x1,y0,y1,
    X:v=>x+(v-x0)/(x1-x0)*w,
    Y:v=>Math.max(y-2,Math.min(y+h+2, y+h-(v-y0)/(y1-y0)*h))};
}
function _mmAxes(ctx,p,o){
  const {yticks=[],xticks=[],fmtY=v=>String(v),fmtX=v=>String(v),
         xlab="",ylab="",grid=true}=o||{};
  ctx.strokeStyle="#3A4C68"; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x,p.y+p.h);
  ctx.lineTo(p.x+p.w,p.y+p.h); ctx.stroke();
  for(const v of yticks){ const y=p.Y(v);
    if(grid){ ctx.strokeStyle="#22314a"; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(p.x,y); ctx.lineTo(p.x+p.w,y); ctx.stroke(); }
    _t(ctx,p.x-7,y+4,fmtY(v),{align:"right",col:"#5A6E8C",size:11}); }
  for(const v of xticks) _t(ctx,p.X(v),p.y+p.h+16,fmtX(v),{align:"center",col:"#5A6E8C",size:11});
  if(xlab) _t(ctx,p.x+p.w,p.y+p.h+32,xlab,{align:"right",col:MED.dim,size:12});
  if(ylab) _t(ctx,p.x-2,p.y-9,ylab,{align:"left",col:MED.dim,size:12});
}
function _mmLine(ctx,p,T,V,upto,col,lw,dash){
  ctx.strokeStyle=col; ctx.lineWidth=lw; if(dash) ctx.setLineDash(dash);
  ctx.beginPath(); let n=0;
  for(let i=0;i<T.length;i++){ if(T[i]>upto) break;
    const X=p.X(T[i]),Y=p.Y(V[i]); n++? ctx.lineTo(X,Y):ctx.moveTo(X,Y); }
  if(n>1) ctx.stroke();
  ctx.setLineDash([]);
  return n;
}
function _mmBand(ctx,p,T,hi,lo,upto,fill){
  const idx=[]; for(let i=0;i<T.length;i++){ if(T[i]>upto) break; idx.push(i); }
  if(idx.length<2) return;
  ctx.fillStyle=fill; ctx.beginPath();
  idx.forEach((i,j)=>{ const X=p.X(T[i]),Y=p.Y(hi[i]); j?ctx.lineTo(X,Y):ctx.moveTo(X,Y); });
  for(let j=idx.length-1;j>=0;j--){ const i=idx[j]; ctx.lineTo(p.X(T[i]),p.Y(lo[i])); }
  ctx.closePath(); ctx.fill();
}
const _mmTrap=(T,V)=>{ let s=0; for(let i=1;i<T.length;i++) s+=(V[i]+V[i-1])/2*(T[i]-T[i-1]); return s; };
const _mmCross=(T,V,thr,rising)=>{            // first t where V crosses thr (linear interp)
  for(let i=1;i<T.length;i++){
    const a=V[i-1],b=V[i];
    if(rising? (a<thr&&b>=thr) : (a>thr&&b<=thr)){
      const f=(thr-a)/(b-a); return T[i-1]+f*(T[i]-T[i-1]); } }
  return null; };

/* ============================================================================
   1) med_incretin — the incretin effect: same glucose, two routes
   ========================================================================== */
const MINCR=(()=>{
  const T=[]; for(let t=0;t<=180;t+=2) T.push(t);
  const Gb=90;                      // fasting glucose, mg/dL
  const Ib=8;                       // fasting insulin, µU/mL
  const gam=(t,tt)=> t<=0?0:(t/tt)*Math.exp(1-t/tt);   // unit-peak gamma-ish pulse
  const A=62, tauG=32;              // glucose excursion: peak +62 mg/dL at 32 min
  const s=0.35, lag=5;              // β-cell response to glucose ALONE (the IV arm)
  const b=47.3, tauI=22;            // extra secretion driven by the gut incretins
  // BOTH arms are given the identical glucose curve by construction — that is the
  // whole point of the isoglycaemic clamp, so we literally share one array.
  const G   = T.map(t=>Gb+A*gam(t,tauG));
  const ivI = T.map(t=>s*A*gam(t-lag,tauG));                 // incremental insulin, IV arm
  const boost=T.map(t=>b*gam(t,tauI));                       // incretin-driven extra
  const orI = T.map((t,i)=>ivI[i]+boost[i]);                 // incremental insulin, oral arm
  const IV  = ivI.map(v=>Ib+v), OR = orI.map(v=>Ib+v);
  const aucIV=_mmTrap(T,ivI), aucOR=_mmTrap(T,orI);          // incremental AUCs
  const effect=100*(aucOR-aucIV)/aucOR;                      // the incretin effect, %
  const ratio=aucOR/aucIV;
  const gPeak=Math.max.apply(null,G);
  const ivPeak=Math.max.apply(null,IV), orPeak=Math.max.apply(null,OR);
  // the two glucose curves are the SAME array — prove it rather than assert it
  const gDiff=Math.max.apply(null,G.map((v,i)=>Math.abs(v-G[i])));
  return {T,G,IV,OR,ivI,orI,Gb,Ib,aucIV,aucOR,effect,ratio,gPeak,ivPeak,orPeak,gDiff,
          tPeak:T[OR.indexOf(orPeak)]};
})();

/* ============================================================================
   2) med_glp1_actions — the four jobs GLP-1 does
   ========================================================================== */
const MGLP=(()=>{
  /* (a) glucose-DEPENDENT insulin release, as a computed relationship.
     Secretion is a sigmoid in prevailing glucose; the drug multiplies it through a
     GATE that is itself a function of glucose — so at low sugar the drug does
     almost nothing. That gate is the whole hypoglycaemia-safety argument. */
  const GG=[]; for(let g=50;g<=250;g+=2) GG.push(g);
  const isr =g=>100/(1+Math.exp(-(g-150)/22));
  const gate=g=>1/(1+Math.exp(-(g-100)/7));
  const AMP=1.6;
  const isrOn=g=>isr(g)*(1+AMP*gate(g));
  const OFF=GG.map(isr), ON=GG.map(isrOn);
  const GLO=70, GHI=180;
  const rLo=isrOn(GLO)/isr(GLO), rHi=isrOn(GHI)/isr(GHI);

  /* (b) glucagon suppression — also glucose-dependent (drawn bar heights) */
  const GLUC={hiOff:100,hiOn:58,loOff:185,loOn:178};
  const supHi=100*(GLUC.hiOff-GLUC.hiOn)/GLUC.hiOff;
  const supLo=100*(GLUC.loOff-GLUC.loOn)/GLUC.loOff;

  /* (c) gastric emptying — % of the meal still in the stomach vs time */
  const ST=[]; for(let t=0;t<=300;t+=2) ST.push(t);
  const emp=(t,tau)=>100*Math.exp(-Math.pow(t/tau,1.4));
  const EOFF=ST.map(t=>emp(t,130)), EON=ST.map(t=>emp(t,208));
  const t50Off=_mmCross(ST,EOFF,50,false), t50On=_mmCross(ST,EON,50,false);

  /* (d) appetite — energy eaten at a free-access meal, drawn as a RANGE band
         because the trial numbers genuinely vary */
  const EAT={off:100,onHi:80,onLo:65};
  const cutLo=100-EAT.onHi, cutHi=100-EAT.onLo;

  return {GG,OFF,ON,GLO,GHI,rLo,rHi,isr,isrOn,GLUC,supHi,supLo,
          ST,EOFF,EON,t50Off,t50On,t50Mult:t50On/t50Off,EAT,cutLo,cutHi};
})();

/* ============================================================================
   3) med_type2_engine — the two-engine failure of type 2 diabetes
   ========================================================================== */
const MT2=(()=>{
  /* A deliberately simple, transparent model of the two engines.
       sensitivity  S(t)  — falls as insulin resistance rises
       demand       1/S   — the insulin needed to hold glucose at baseline
       capacity     Cap(t)— the most the β-cells can still make (falls later)
       secretion    I     = min(demand, capacity)      ← compensation, then failure
       glucose      G     = 90 / (I·S)                 ← the CONSEQUENCE, not a drawing
     Glucose only moves when secretion can no longer meet demand — which is exactly
     the clinical story: years of silence, then a climb. */
  const T=[]; for(let t=0;t<=25;t+=0.25) T.push(Number(t.toFixed(2)));
  const Sraw=t=>0.34+0.66/(1+Math.exp((t-9)/3.2));
  const Fraw=t=>1-0.62/(1+Math.exp(-(t-13)/3.5));
  const CAP0=3.0, GB=90;
  const S  =T.map(t=>Sraw(t)/Sraw(0));
  const CAP=T.map(t=>CAP0*Fraw(t)/Fraw(0));
  const DEM=S.map(s=>1/s);
  const INS=T.map((t,i)=>Math.min(DEM[i],CAP[i]));
  const G  =T.map((t,i)=>GB/(INS[i]*S[i]));
  const RES=S.map(s=>1/s);                       // resistance = 1/sensitivity
  const peakIns=Math.max.apply(null,INS);
  const peakYr =T[INS.indexOf(peakIns)];
  const preYr  =_mmCross(T,G,100,true);          // impaired fasting glucose
  const dxYr   =_mmCross(T,G,126,true);          // diabetes threshold
  const capPct = dxYr==null?null:100*(CAP0*Fraw(dxYr)/Fraw(0))/CAP0;
  const resAtDx= dxYr==null?null:Sraw(0)/Sraw(dxYr);
  const gEnd=G[G.length-1];
  return {T,S,CAP,DEM,INS,G,RES,peakIns,peakYr,preYr,dxYr,capPct,resAtDx,gEnd,
          years:T[T.length-1],capMax:CAP0,GB};
})();

function drawT2Engine(ctx,cv,st){
  const {yr=0,title=""}=st, M=MT2;
  clear(ctx,cv);
  _t(ctx,cv.width/2,26,title,{size:17,bold:true,align:"center"});
  const i=Math.max(0,Math.min(M.T.length-1,Math.round(yr/0.25)));

  /* --- the two dials --- */
  const dial=(x,frac,col,lab1,lab2,read)=>{
    const y0=76,h=214,w=42;
    ctx.strokeStyle="#3A4C68"; ctx.lineWidth=1.4; ctx.strokeRect(x,y0,w,h);
    const f=Math.max(0,Math.min(1,frac));
    ctx.fillStyle=col; ctx.fillRect(x+1,y0+h-(h-2)*f,w-2,(h-2)*f);
    _t(ctx,x+w/2,y0+h+20,lab1,{align:"center",col:MED.dim,size:11});
    _t(ctx,x+w/2,y0+h+34,lab2,{align:"center",col:MED.dim,size:11});
    _t(ctx,x+w/2,y0-10,read,{align:"center",col:col,size:13,bold:true}); };
  const resFrac=(M.RES[i]-1)/(Math.max.apply(null,M.RES)-1);
  dial(58,resFrac,MED.wrong,"insulin","resistance",M.RES[i].toFixed(1)+"×");
  dial(150,M.CAP[i]/M.capMax,MED.good,"β-cell","capacity",
       (100*M.CAP[i]/M.capMax).toFixed(0)+"%");

  /* --- upper panel: insulin demand vs capacity vs what is actually secreted --- */
  const up=_mmPanel(300,64,540,104, 0,M.years, 0,3.4);
  _mmAxes(ctx,up,{yticks:[0,1,2,3],fmtY:v=>v+"×",ylab:"insulin (× normal)",grid:true});
  _mmLine(ctx,up,M.T,M.DEM,yr,"rgba(212,106,98,0.85)",2,[5,4]);
  _mmLine(ctx,up,M.T,M.CAP,yr,MED.good,2);
  _mmLine(ctx,up,M.T,M.INS,yr,MED.post,3);
  if(yr>2){
    const lx=Math.min(up.X(yr)+6,742);                    // never let a label run off-canvas
    _t(ctx,lx,up.Y(M.DEM[i])-6,"insulin NEEDED",{col:MED.lean,size:11});
    _t(ctx,lx,up.Y(M.CAP[i])+14,"β-cell ceiling",{col:MED.good,size:11}); }

  /* --- lower panel: glucose as the CONSEQUENCE --- */
  const lo=_mmPanel(300,208,540,108, 0,M.years, 70,200);
  _mmAxes(ctx,lo,{yticks:[80,100,126,160,200],xticks:[0,5,10,15,20,25],
    ylab:"fasting blood glucose (mg/dL)", xlab:"years"});
  if(M.preYr!=null){
    const w=lo.X(Math.min(yr,M.preYr))-lo.x;
    if(w>0){ ctx.fillStyle="rgba(95,191,149,0.12)"; ctx.fillRect(lo.x,lo.y,w,lo.h); } }
  ctx.strokeStyle="rgba(212,106,98,0.55)"; ctx.lineWidth=1.4; ctx.setLineDash([6,4]);
  ctx.beginPath(); ctx.moveTo(lo.x,lo.Y(126)); ctx.lineTo(lo.x+lo.w,lo.Y(126)); ctx.stroke();
  ctx.setLineDash([]);
  _t(ctx,lo.x+lo.w-4,lo.Y(126)-6,"126 = diabetes",{align:"right",col:MED.wrong,size:11,bold:true});
  _mmLine(ctx,lo,M.T,M.G,yr,MED.post,3);
  if(M.preYr!=null && yr>=M.preYr)
    _t(ctx,lo.X(M.preYr/2),lo.Y(112),"SILENT: normal sugar for "+M.preYr.toFixed(0)+" years",
       {align:"center",col:MED.good,size:12,bold:true});
  if(M.dxYr!=null && yr>=M.dxYr){
    ctx.fillStyle=MED.wrong; ctx.beginPath(); ctx.arc(lo.X(M.dxYr),lo.Y(126),6,0,7); ctx.fill();
    _t(ctx,lo.X(M.dxYr)+10,lo.Y(126)+18,"diagnosed, year "+M.dxYr.toFixed(1),
       {col:MED.wrong,size:12,bold:true}); }

  /* time cursor */
  ctx.strokeStyle="rgba(215,223,234,0.35)"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(up.X(yr),up.y); ctx.lineTo(up.X(yr),up.y+up.h); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(lo.X(yr),lo.y); ctx.lineTo(lo.X(yr),lo.y+lo.h); ctx.stroke();
  _t(ctx,840,up.y-9,"year "+yr.toFixed(0),{align:"right",col:MED.txt,size:12,bold:true});
  _t(ctx,cv.width/2,372,"glucose here is COMPUTED as 90 ÷ (secretion × sensitivity) — it moves only when compensation fails",
     {align:"center",col:MED.dim,size:11});
}

ANIMS.med_type2_engine_static=(cv,ctx)=>drawT2Engine(ctx,cv,

  await tween(2600,k=>S(_lerp(0,12,k)));

  await narrate("Because look at the glucose panel: flat. Normal. For about "+M.preYr.toFixed(0)+" years a fasting blood sugar tells you nothing is wrong, while the pancreas quietly pays the bill by working nearly twice as hard. That silent stretch is the clinically important part — the resistance is already there, and it is already doing damage.");
  await tween(1800,k=>S(_lerp(12,17,k)));
  S(17);
  await narrate("Now the second engine gives way. The green ceiling — what the beta-cells can still produce — drops below what the resistance demands. Compensation breaks. Secretion turns over and starts to FALL, even though the need is higher than ever.");

};

/* ── PHYSIOLOGY visuals, part 2 (operator visual-aid batch, 2026-08-01) ────── */
/* ===== Physiology & Biophysics — pack gap-fill visuals (2026-08-01) ==========
   Fills the three concepts in topics/physiology-biophysics.json that had anim:null
     · membrane-potential  → ANIMS.med_membranepotential
     · oxygen-transport    → ANIMS.med_o2curve
     · homeostasis         → ANIMS.med_homeostasis
   House rules followed: one parameterized draw fn per visual + a thin ANIMS
   wrapper; canvas 900x380; MED palette + _t/_lerp/clear/tween/sleep/narrate.
   HARD RULE: every number spoken in narration is COMPUTED from the data drawn
   (Nernst/GHK, the Hill equation, the difference equation) — nothing hardcoded.
   All computed values are exported on ANIMS._med_physio2_debug at the bottom. */

/* ---------- tiny shared helpers (namespaced _p2* to avoid collisions) ---------- */
const _P2 = {k:"#6FA8DC", na:"#E8A13C", neg:"#D46A62", pos:"#E8A13C",
             curve:"#5FBF95", shifted:"#D46A62", ghost:"#8496AB", hi:"#E8A13C"};
const _p2c01  = v => Math.max(0, Math.min(1, v));
const _p2ease = k => k*k*(3-2*k);
const _p2rand = i => { const x = Math.sin(i*127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function _p2arrow(ctx, ax, ay, bx, by, col, lw, head){
  lw = lw || 2.5; head = head || 9;
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
  const a = Math.atan2(by - ay, bx - ax);
  ctx.beginPath(); ctx.moveTo(bx, by);
  ctx.lineTo(bx - head*Math.cos(a - 0.42), by - head*Math.sin(a - 0.42));
  ctx.lineTo(bx - head*Math.cos(a + 0.42), by - head*Math.sin(a + 0.42));
  ctx.closePath(); ctx.fill();
}
function _p2dot(ctx, x, y, r, col){ ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }

/* ============================================================================
   7) MEMBRANE POTENTIAL — why a cell rests near −70 mV
   Concentrations are the ones actually drawn; E_K comes from Nernst on them,
   the resting voltage from Goldman–Hodgkin–Katz on them + the pump term.
   ========================================================================== */
const _P2MP = {kIn:140, kOut:5, naIn:12, naOut:145, pNaOverPK:0.04, pumpMv:-2.5, slope:61.5};
const _p2nernst = (out, inn) => _P2MP.slope * Math.log10(out / inn);
const _p2ghk = () => _P2MP.slope * Math.log10(
    (_P2MP.kOut + _P2MP.pNaOverPK*_P2MP.naOut) /
    (_P2MP.kIn  + _P2MP.pNaOverPK*_P2MP.naIn));
const _P2_EK    = _p2nernst(_P2MP.kOut,  _P2MP.kIn);    // ≈ −89 mV
const _P2_ENA   = _p2nernst(_P2MP.naOut, _P2MP.naIn);   // ≈ +67 mV
const _P2_GHK   = _p2ghk();                             // ≈ −69 mV (leaky membrane)
const _P2_VREST = _P2_GHK + _P2MP.pumpMv;               // ≈ −71 mV (+ electrogenic pump)

function drawMembranePotential(ctx, cv, st){
  clear(ctx, cv);
  const {p = 0, title = ""} = st;
  const C = _P2MP;
  const leak = _p2c01((p - 0.14) / 0.30);   // K⁺ leaving + charge separation
  const bal  = _p2c01((p - 0.44) / 0.20);   // push/pull arrows balance
  const real = _p2c01((p - 0.70) / 0.30);   // Na⁺ leak + pump → real resting Vm
  const vm   = _P2_EK*_p2ease(leak) + (_P2_VREST - _P2_EK)*_p2ease(real);

  _t(ctx, cv.width/2, 26, title, {size:17, bold:true, align:"center"});

  const mL = 392, mR = 420, top = 62, bot = 262;

  /* --- membrane bilayer --- */
  ctx.fillStyle = "rgba(95,191,149,0.14)"; ctx.fillRect(mL, top, mR - mL, bot - top);
  ctx.strokeStyle = MED.membrane; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(mL, top); ctx.lineTo(mL, bot);
  ctx.moveTo(mR, top); ctx.lineTo(mR, bot);
  ctx.stroke();

  /* --- compartment labels + the concentrations the maths uses --- */
  _t(ctx, 224, 50, "OUTSIDE", {align:"center", col:MED.dim, size:12, bold:true});
  _t(ctx, 600, 50, "INSIDE  (cytosol)", {align:"center", col:MED.dim, size:12, bold:true});
  _t(ctx, 132,  82, `K⁺   ${C.kOut} mM`,  {col:_P2.k,  size:14, bold:true});
  _t(ctx, 132, 104, `Na⁺ ${C.naOut} mM`, {col:_P2.na, size:14, bold:true});
  _t(ctx, 494,  82, `K⁺   ${C.kIn} mM`,  {col:_P2.k,  size:14, bold:true});
  _t(ctx, 494, 104, `Na⁺ ${C.naIn} mM`,  {col:_P2.na, size:14, bold:true});

  /* --- ion clouds (counts track the concentrations, deterministic scatter) --- */
  const cloud = (n, xa, xb, ya, yb, col, seed) => {
    for (let i = 0; i < n; i++)
      _p2dot(ctx, xa + (xb - xa)*_p2rand(seed + i*3.1), ya + (yb - ya)*_p2rand(seed + i*7.7), 5, col);
  };
  cloud(1,  76, 372, 122, 256, _P2.k,  11);   // K⁺ outside  (5 mM)
  cloud(15, 76, 372, 122, 256, _P2.na, 29);   // Na⁺ outside (145 mM)
  cloud(14, 520, 744, 122, 256, _P2.k,  47);  // K⁺ inside   (140 mM)
  cloud(2,  520, 744, 122, 256, _P2.na, 61);  // Na⁺ inside  (12 mM)

  /* --- K⁺ leak channel --- */
  const py = 158, ph = 44;
  ctx.strokeStyle = _P2.k; ctx.lineWidth = 3;
  ctx.strokeRect(mL - 5, py - ph/2, (mR - mL) + 10, ph);
  _t(ctx, 406, py - ph/2 - 10, "K⁺ leak channel", {align:"center", col:_P2.k, size:12, bold:true});

  /* --- K⁺ actually crossing, inside → outside --- */
  for (let i = 0; i < 4; i++){
    const f = _p2c01(leak*4.6 - i*0.9);
    if (f <= 0) continue;
    _p2dot(ctx, _lerp(mR + 52, mL - 52, f), py - 14 + i*9, 5, _P2.k);
  }

  /* --- the charge each departing K⁺ leaves behind --- */
  const nQ = Math.round(leak * 7);
  for (let i = 0; i < nQ; i++){
    const y = 84 + i*21;
    _t(ctx, 426, y, "−", {col:_P2.neg, size:17, bold:true});
    _t(ctx, 388, y, "+",      {col:_P2.pos, size:15, bold:true, align:"right"});
  }

  /* --- the two "real membrane" corrections --- */
  if (real > 0){
    ctx.globalAlpha = real;
    for (let i = 0; i < 2; i++)
      _p2dot(ctx, _lerp(mL - 46, mR + 46, _p2c01(real*1.6 - i*0.5)), 202 + i*10, 5, _P2.na);
    _t(ctx, 436, 206, "small Na⁺ leak IN  (P_Na/P_K = " + C.pNaOverPK + ")",
       {col:_P2.na, size:11.5});
    ctx.fillStyle = "rgba(232,161,60,0.22)"; ctx.fillRect(mL - 8, 222, (mR - mL) + 16, 36);
    ctx.strokeStyle = _P2.na; ctx.lineWidth = 2; ctx.strokeRect(mL - 8, 222, (mR - mL) + 16, 36);
    _t(ctx, 436, 244, `Na⁺/K⁺ pump — 3 out : 2 in  (${C.pumpMv} mV)`, {col:_P2.na, size:11.5});
    ctx.globalAlpha = 1;
  }

  /* --- the two opposing forces on K⁺ --- */
  if (leak > 0.02){
    const full = 100, elec = full * Math.min(1, Math.abs(vm) / Math.abs(_P2_EK));
    _p2arrow(ctx, 406, 296, 406 - full, 296, _P2.k, 3);
    _t(ctx, 300, 292, "chemical push OUT (gradient)", {align:"right", col:_P2.k, size:12});
    _p2arrow(ctx, 406, 322, 406 + elec, 322, _P2.neg, 3);
    _t(ctx, 300, 326, "electrical pull IN (voltage)", {align:"right", col:_P2.neg, size:12});
  }

  /* --- voltmeter --- */
  const vx = 800, vTop = 84, vBot = 300, vHi = 20, vLo = -110;
  const vy = mv => vTop + (vHi - mv) * (vBot - vTop) / (vHi - vLo);
  ctx.strokeStyle = MED.dim; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(vx, vTop); ctx.lineTo(vx, vBot); ctx.stroke();
  for (let mv = 20; mv >= -100; mv -= 20){

    _t(ctx, vx + 6, vy(mv) + 4, `${mv}`, {col:MED.dim, size:10});
  }
  ctx.fillStyle = "rgba(212,106,98,0.55)";
  ctx.fillRect(vx - 20, Math.min(vy(0), vy(vm)), 20, Math.abs(vy(vm) - vy(0)));
  if (leak > 0){
    ctx.strokeStyle = "rgba(111,168,220,0.65)"; ctx.setLineDash([4,4]); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(vx - 44, vy(_P2_EK)); ctx.lineTo(vx + 4, vy(_P2_EK)); ctx.stroke();
    ctx.setLineDash([]);
    _t(ctx, vx - 48, vy(_P2_EK) + 4, `E_K ${_P2_EK.toFixed(0)}`, {align:"right", col:_P2.k, size:11, bold:true});
  }
  ctx.strokeStyle = MED.txt; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(vx - 26, vy(vm)); ctx.lineTo(vx + 4, vy(vm)); ctx.stroke();
  _t(ctx, vx - 10, 66, `Vm = ${vm.toFixed(0)} mV`, {align:"center", col:MED.txt, size:14, bold:true});
  _t(ctx, vx - 10, 318, "membrane voltage", {align:"center", col:MED.dim, size:11});

  /* --- footers --- */
  _t(ctx, 56, 364, "Nernst:  E = 61.5 · log₁₀( [out] / [in] )  mV   at 37 °C",
     {col:MED.dim, size:12});
  const status = real > 0.6
      ? `leaky membrane + pump → rest at ${_P2_VREST.toFixed(0)} mV`
      : (bal > 0.85 ? `push = pull → EQUILIBRIUM at ${_P2_EK.toFixed(0)} mV`
                    : (leak > 0.02 ? "K⁺ leaving — inside going negative" : ""));
  _t(ctx, 884, 364, status,
     {align:"right", col: real > 0.6 ? MED.good : (bal > 0.85 ? _P2.k : MED.dim), size:13, bold:true});
}

/* ============================================================================
   8) HAEMOGLOBIN–OXYGEN DISSOCIATION CURVE (+ the Bohr shift)
   Every point is the Hill equation evaluated live: S = P^n / (P50^n + P^n)
   ========================================================================== */
const _P2O2 = {p50:26.6, hillN:2.7, p50Ex:36.0, pLung:100, pLungLow:60, pTissue:40, pMax:120};
const _p2hill = (P, p50, n) => P <= 0 ? 0 : Math.pow(P, n) / (Math.pow(p50, n) + Math.pow(P, n));

const _P2_SAT_LUNG     = _p2hill(_P2O2.pLung,    _P2O2.p50,   _P2O2.hillN) * 100;
const _P2_SAT_LUNGLOW  = _p2hill(_P2O2.pLungLow, _P2O2.p50,   _P2O2.hillN) * 100;
const _P2_SAT_TISSUE   = _p2hill(_P2O2.pTissue,  _P2O2.p50,   _P2O2.hillN) * 100;
const _P2_SAT_TISSUEEX = _p2hill(_P2O2.pTissue,  _P2O2.p50Ex, _P2O2.hillN) * 100;
const _P2_ROBUST_PTS   = _P2_SAT_LUNG - _P2_SAT_LUNGLOW;
const _P2_EXTRACT_PTS  = _P2_SAT_LUNG - _P2_SAT_TISSUE;
const _P2_BOHR_PTS     = _P2_SAT_TISSUE - _P2_SAT_TISSUEEX;

function drawO2Curve(ctx, cv, st){
  clear(ctx, cv);
  const {shift = 0, hyper = 0, lung = 0, robust = 0, tissue = 0, delta = 0, title = ""} = st;
  const O = _P2O2;
  const x0 = 112, y0 = 316, x1 = 808, y1 = 74;
  const X = P => x0 + (x1 - x0) * P / O.pMax;
  const Y = S => y0 - (y0 - y1) * (S / 100);

  _t(ctx, cv.width/2, 26, title, {size:17, bold:true, align:"center"});

  /* grid + axes */
  ctx.strokeStyle = "rgba(132,150,171,0.22)"; ctx.lineWidth = 1;
  for (let P = 20; P <= O.pMax; P += 20){ ctx.beginPath(); ctx.moveTo(X(P), y0); ctx.lineTo(X(P), y1); ctx.stroke(); }
  for (let S = 25; S <= 100; S += 25){ ctx.beginPath(); ctx.moveTo(x0, Y(S)); ctx.lineTo(x1, Y(S)); ctx.stroke(); }
  ctx.strokeStyle = MED.dim; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y0); ctx.moveTo(x0, y0); ctx.lineTo(x0, y1); ctx.stroke();
  for (let P = 0; P <= O.pMax; P += 20) _t(ctx, X(P), y0 + 18, `${P}`, {align:"center", col:MED.dim, size:11});
  for (let S = 0; S <= 100; S += 25) _t(ctx, x0 - 8, Y(S) + 4, `${S}`, {align:"right", col:MED.dim, size:11});
  _t(ctx, (x0 + x1)/2, y0 + 38, "oxygen partial pressure  PO₂  (mmHg)", {align:"center", col:MED.dim, size:12});
  ctx.save(); ctx.translate(x0 - 44, (y0 + y1)/2); ctx.rotate(-Math.PI/2);
  _t(ctx, 0, 0, "haemoglobin saturation  (%)", {align:"center", col:MED.dim, size:12}); ctx.restore();

  const plot = (p50v, nv, col, lw, dash) => {
    ctx.strokeStyle = col; ctx.lineWidth = lw; if (dash) ctx.setLineDash(dash);
    ctx.beginPath();
    for (let i = 0; i <= 160; i++){
      const P = O.pMax * i / 160, px = X(P), py = Y(_p2hill(P, p50v, nv) * 100);
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.stroke(); ctx.setLineDash([]);
  };

  /* non-cooperative reference (n = 1) — the hyperbola haemoglobin is NOT */
  if (hyper > 0){
    ctx.globalAlpha = hyper * 0.85;
    plot(O.p50, 1, _P2.ghost, 2, [5,5]);
    ctx.globalAlpha = 1;
  }
  /* the Bohr-shifted curve */
  const p50Now = _lerp(O.p50, O.p50Ex, shift);
  if (shift > 0){ ctx.globalAlpha = Math.min(1, shift*1.6); plot(p50Now, O.hillN, _P2.shifted, 3); ctx.globalAlpha = 1; }
  /* the resting curve */
  plot(O.p50, O.hillN, _P2.curve, 3);

  /* lung point — the flat, robust shoulder */
  if (lung > 0){
    ctx.globalAlpha = lung;
    _p2dot(ctx, X(O.pLung), Y(_P2_SAT_LUNG), 7, _P2.hi);
    _t(ctx, X(O.pLung) - 12, Y(_P2_SAT_LUNG) - 12,
       `lungs · PO₂ ${O.pLung} → ${_P2_SAT_LUNG.toFixed(1)}%`,
       {align:"right", col:_P2.hi, size:13, bold:true});
    ctx.globalAlpha = 1;
  }
  if (robust > 0){
    ctx.globalAlpha = robust;
    _p2dot(ctx, X(O.pLungLow), Y(_P2_SAT_LUNGLOW), 6, _P2.hi);
    ctx.strokeStyle = _P2.hi; ctx.lineWidth = 1.5; ctx.setLineDash([3,3]);
    ctx.beginPath();
    ctx.moveTo(X(O.pLungLow), Y(_P2_SAT_LUNGLOW)); ctx.lineTo(X(O.pLung), Y(_P2_SAT_LUNGLOW));
    ctx.lineTo(X(O.pLung), Y(_P2_SAT_LUNG)); ctx.stroke(); ctx.setLineDash([]);
    _t(ctx, X(O.pLungLow) + 8, Y(_P2_SAT_LUNGLOW) + 20,
       `FLAT top: PO₂ ${O.pLung}→${O.pLungLow} costs only ${_P2_ROBUST_PTS.toFixed(1)} points`,
       {col:_P2.hi, size:12});
    ctx.globalAlpha = 1;
  }
  /* resting-tissue point — the steep, generous middle */
  if (tissue > 0){
    ctx.globalAlpha = tissue;
    _p2dot(ctx, X(O.pTissue), Y(_P2_SAT_TISSUE), 7, _P2.curve);
    _t(ctx, X(O.pTissue) + 14, Y(_P2_SAT_TISSUE) + 22,
       `resting tissue · PO₂ ${O.pTissue} → ${_P2_SAT_TISSUE.toFixed(1)}%`,
       {col:_P2.curve, size:13, bold:true});
    ctx.strokeStyle = "rgba(95,191,149,0.45)"; ctx.lineWidth = 1.5; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(X(O.pTissue), y0); ctx.lineTo(X(O.pTissue), Y(_P2_SAT_TISSUE)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }
  /* the Bohr delta, measured at the SAME tissue PO₂ */
  if (delta > 0){
    const yA = Y(_P2_SAT_TISSUE), yB = Y(_p2hill(O.pTissue, p50Now, O.hillN) * 100);
    ctx.globalAlpha = delta;
    _p2dot(ctx, X(O.pTissue), yB, 7, _P2.shifted);
    ctx.strokeStyle = _P2.hi; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(X(O.pTissue), yA); ctx.lineTo(X(O.pTissue), yB);
    ctx.moveTo(X(O.pTissue) - 7, yA); ctx.lineTo(X(O.pTissue) + 7, yA);
    ctx.moveTo(X(O.pTissue) - 7, yB); ctx.lineTo(X(O.pTissue) + 7, yB); ctx.stroke();
    _t(ctx, X(O.pTissue) - 12, (yA + yB)/2 + 5,
       `+${(_P2_SAT_TISSUE - _p2hill(O.pTissue, p50Now, O.hillN)*100).toFixed(1)} points unloaded`,
       {align:"right", col:_P2.hi, size:13, bold:true});
    ctx.globalAlpha = 1;
  }

  /* legend + P50 readout */
  _t(ctx, 118, 366, `■ resting  (P50 ${O.p50} mmHg, Hill n ${O.hillN})`, {col:_P2.curve, size:12});
  if (shift > 0)
    _t(ctx, 400, 366, `■ Bohr-shifted  (P50 ${p50Now.toFixed(1)} mmHg)`, {col:_P2.shifted, size:12});
  if (hyper > 0)
    _t(ctx, 640, 366, "– –  non-cooperative (n = 1)", {col:MED.dim, size:12});
}

async function runO2Curve(cv, ctx, opts){
  const L = opts.lines || [];
  const S = {shift:0, hyper:0, lung:0, robust:0, tissue:0, delta:0, title:opts.title};
  drawO2Curve(ctx, cv, S);
  if (L[0]) await narrate(L[0]);
  await tween(900,  k => drawO2Curve(ctx, cv, {...S, hyper:k}));
  S.hyper = 1;
  if (L[1]) await narrate(L[1]);
  await tween(1000, k => drawO2Curve(ctx, cv, {...S, lung:k, robust:_p2c01(k*1.4 - 0.4)}));
  S.lung = 1; S.robust = 1;
  if (L[2]) await narrate(L[2]);
  await tween(900,  k => drawO2Curve(ctx, cv, {...S, tissue:k}));
  S.tissue = 1;
  if (L[3]) await narrate(L[3]);
  await tween(1600, k => drawO2Curve(ctx, cv, {...S, shift:k}));
  S.shift = 1;
  if (L[4]) await narrate(L[4]);
  await tween(800,  k => drawO2Curve(ctx, cv, {...S, delta:k}));
  if (L[5]) await narrate(L[5]);
}

/* ============================================================================
   9) HOMEOSTASIS — negative feedback, a set point, and why loops oscillate
   Core temperature under a sustained heat load. Three traces, ONE difference
   equation, same disturbance:
       closed : x[t+1] = x[t] + u[t] − a·(x[t] − S) − k·(x[t−d] − S)
       open   : x[t+1] = x[t] + u[t] − a·(x[t] − S)            (loop cut)
       nodelay: closed with d = 0                              (why it rings)
   ========================================================================== */
const _P2HOM = {setPt:37.0, load:0.035, t0:6, N:90, gain:0.12, delay:10, passive:0.030};
function _p2homSim(){
  const {setPt:S, load, t0, N, gain:k, delay:d, passive:a} = _P2HOM;
  const closed = [S], open = [S], nodelay = [S];
  for (let t = 0; t < N; t++){
    const u = t >= t0 ? load : 0;
    closed .push(closed[t]  + u - a*(closed[t]  - S) - k*(closed[Math.max(0, t - d)] - S));
    open   .push(open[t]    + u - a*(open[t]    - S));
    nodelay.push(nodelay[t] + u - a*(nodelay[t] - S) - k*(nodelay[t] - S));
  }
  return {closed, open, nodelay};
}
const _p2turns = arr => {           // how many times the trace changes direction
  let n = 0;
  for (let i = 2; i < arr.length; i++) if ((arr[i-1]-arr[i-2]) * (arr[i]-arr[i-1]) < 0) n++;
  return n;
};
const _P2HOM_SIM   = _p2homSim();
const _P2HOM_CLOSED_DEV = _P2HOM_SIM.closed[_P2HOM.N]  - _P2HOM.setPt;
const _P2HOM_OPEN_DEV   = _P2HOM_SIM.open[_P2HOM.N]    - _P2HOM.setPt;
const _P2HOM_PEAK_DEV   = Math.max(..._P2HOM_SIM.closed) - _P2HOM.setPt;
const _P2HOM_NODELAY_PEAK_DEV = Math.max(..._P2HOM_SIM.nodelay) - _P2HOM.setPt;
const _P2HOM_OVERSHOOT  = _P2HOM_PEAK_DEV - _P2HOM_CLOSED_DEV;
const _P2HOM_TURNS      = _p2turns(_P2HOM_SIM.closed);
const _P2HOM_NODELAY_TURNS = _p2turns(_P2HOM_SIM.nodelay);

function drawHomeostasis(ctx, cv, st){
  clear(ctx, cv);
  const {prog = 0, openOn = 0, closedOn = 0, ghost = 0, active = -1, title = ""} = st;
  const H = _P2HOM, SIM = _P2HOM_SIM;

  _t(ctx, cv.width/2, 24, title, {size:17, bold:true, align:"center"});

  /* ---------- the loop, drawn as a loop ---------- */
  const bw = 138, bh = 54;
  const nodes = [
    {x:118, y:120, l1:"SENSOR",     l2:"thermoreceptors"},
    {x:282, y:120, l1:"COMPARATOR", l2:`hypothalamus · set ${H.setPt.toFixed(1)} °C`},
    {x:282, y:262, l1:"EFFECTORS",  l2:"sweat · skin vasodilation"},
    {x:118, y:262, l1:"CORE TEMP",  l2:"the regulated variable"}
  ];
  nodes.forEach((n, i) => {
    const on = i === active;
    ctx.fillStyle   = on ? "rgba(95,191,149,0.22)" : "rgba(132,150,171,0.10)";
    ctx.strokeStyle = on ? MED.good : MED.dim; ctx.lineWidth = on ? 2.5 : 1.5;
    ctx.fillRect(n.x - bw/2, n.y - bh/2, bw, bh);
    ctx.strokeRect(n.x - bw/2, n.y - bh/2, bw, bh);
    _t(ctx, n.x, n.y - 4, n.l1, {align:"center", col: on ? MED.good : MED.txt, size:13, bold:true});
    _t(ctx, n.x, n.y + 14, n.l2, {align:"center", col:MED.dim, size:10.5});
  });
  const seg = [[3,0],[0,1],[1,2],[2,3]];
  seg.forEach(([a, b], i) => {
    const A = nodes[a], B = nodes[b], on = i === active;
    const col = on ? MED.good : MED.dim;
    if (A.x === B.x){
      const dir = B.y > A.y ? 1 : -1;
      _p2arrow(ctx, A.x, A.y + dir*(bh/2 + 3), B.x, B.y - dir*(bh/2 + 5), col, on ? 3 : 1.8);
    } else {
      const dir = B.x > A.x ? 1 : -1;
      _p2arrow(ctx, A.x + dir*(bw/2 + 3), A.y, B.x - dir*(bw/2 + 5), B.y, col, on ? 3 : 1.8);
    }
  });
  _t(ctx, 200, 300, `⏱ correction lags ${H.delay} min`, {align:"center", col:_P2.hi, size:12, bold:true});
  _t(ctx, 200, 336, "response OPPOSES the change → negative feedback",
     {align:"center", col:MED.dim, size:11.5});

  /* ---------- the traces ---------- */
  const x0 = 400, y0 = 330, x1 = 868, y1 = 84;
  const tMin = 36.6, tMax = Math.max(...SIM.open) + 0.25;
  const X = t => x0 + (x1 - x0) * t / H.N;
  const Y = v => y0 - (y0 - y1) * (v - tMin) / (tMax - tMin);

  ctx.strokeStyle = MED.dim; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y0); ctx.moveTo(x0, y0); ctx.lineTo(x0, y1); ctx.stroke();
  for (let v = 37; v <= tMax; v += 0.5){
    _t(ctx, x0 - 6, Y(v) + 4, v.toFixed(1), {align:"right", col:MED.dim, size:10});
    ctx.strokeStyle = "rgba(132,150,171,0.16)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, Y(v)); ctx.lineTo(x1, Y(v)); ctx.stroke();
  }
  _t(ctx, (x0 + x1)/2, y0 + 20, "minutes in the hot room", {align:"center", col:MED.dim, size:11});
  _t(ctx, x0 - 6, y1 - 10, "°C", {align:"right", col:MED.dim, size:11});

  /* disturbance band */
  ctx.fillStyle = "rgba(232,161,60,0.10)";
  ctx.fillRect(X(H.t0), y1, X(H.N) - X(H.t0), y0 - y1);
  _t(ctx, X(H.t0) + 6, y1 + 14, `heat load +${H.load} °C/min from t = ${H.t0}`,
     {col:_P2.hi, size:10.5});

  /* set point */
  ctx.strokeStyle = "rgba(215,223,234,0.75)"; ctx.lineWidth = 1.5; ctx.setLineDash([6,5]);
  ctx.beginPath(); ctx.moveTo(x0, Y(H.setPt)); ctx.lineTo(x1, Y(H.setPt)); ctx.stroke(); ctx.setLineDash([]);
  _t(ctx, x1 - 2, Y(H.setPt) - 6, `set point ${H.setPt.toFixed(1)} °C`,
     {align:"right", col:MED.txt, size:11, bold:true});

  const n = Math.max(1, Math.round(prog * H.N));
  const trace = (arr, col, lw, dash, alpha) => {
    ctx.globalAlpha = alpha; ctx.strokeStyle = col; ctx.lineWidth = lw; if (dash) ctx.setLineDash(dash);
    ctx.beginPath();
    for (let t = 0; t <= n; t++){ const px = X(t), py = Y(arr[t]); t ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
    ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
  };
  if (ghost    > 0) trace(SIM.nodelay, _P2.ghost,  2,   [5,5], ghost);
  if (openOn   > 0) trace(SIM.open,    _P2.shifted, 2.8, null,  openOn);
  if (closedOn > 0) trace(SIM.closed,  _P2.curve,   3,   null,  closedOn);

  /* end-of-run labels, read straight off the traces */
  if (openOn > 0.9 && prog > 0.98)
    _t(ctx, X(H.N) - 4, Y(SIM.open[H.N]) - 8,
       `loop CUT: +${_P2HOM_OPEN_DEV.toFixed(2)} °C`, {align:"right", col:_P2.shifted, size:12, bold:true});
  if (closedOn > 0.9 && prog > 0.98)
    _t(ctx, X(H.N) - 4, Y(SIM.closed[H.N]) - 10,
       `loop INTACT: +${_P2HOM_CLOSED_DEV.toFixed(2)} °C`, {align:"right", col:_P2.curve, size:12, bold:true});
  if (ghost > 0.9)
    _t(ctx, 404, 366, `– – same loop, zero delay (no ring)`, {col:MED.dim, size:11.5});
}

async function runHomeostasis(cv, ctx, opts){
  const L = opts.lines || [];
  const S = {prog:0, openOn:0, closedOn:0, ghost:0, active:-1, title:opts.title};
  drawHomeostasis(ctx, cv, S);
  if (L[0]) await narrate(L[0]);
  for (let r = 0; r < 8; r++){
    drawHomeostasis(ctx, cv, {...S, active:r % 4});
    await sleep(230);
  }
  drawHomeostasis(ctx, cv, S);
  if (L[1]) await narrate(L[1]);
  await tween(2000, k => drawHomeostasis(ctx, cv, {...S, prog:k, openOn:1, active:-1}));
  S.prog = 1; S.openOn = 1;
  if (L[2]) await narrate(L[2]);
  await tween(2200, k => drawHomeostasis(ctx, cv, {...S, prog:k, closedOn:1, active:Math.floor(k*12) % 4}));
  S.closedOn = 1;
  drawHomeostasis(ctx, cv, S);
  if (L[3]) await narrate(L[3]);
  await tween(1200, k => drawHomeostasis(ctx, cv, {...S, ghost:k}));
  S.ghost = 1;
  if (L[4]) await narrate(L[4]);
}

/* calculus / calc_rules */
(function(){
const cr_f=(x)=>0.4*x*x;        // f(x)=0.4 x^2
const cr_df=(x)=>0.8*x;         // f'(x)=0.8 x  (power rule: 2*0.4 x^(2-1))
const cr_X0=80,cr_X1=820,cr_Y0=330,cr_Y1=70,cr_xmax=4.0,cr_ymax=6.6;
const cr_sx=(x)=>cr_X0+(x/cr_xmax)*(cr_X1-cr_X0);
const cr_sy=(y)=>cr_Y0-(y/cr_ymax)*(cr_Y0-cr_Y1);
function cr_draw(ctx,cv,px){
  clear(ctx,cv);
  ctx.font="14px 'IBM Plex Mono'";
  // grid
  ctx.strokeStyle="#22314a";ctx.lineWidth=1;
  for(let g=0;g<=4;g+=1){ctx.beginPath();ctx.moveTo(cr_sx(g),cr_Y1);ctx.lineTo(cr_sx(g),cr_Y0);ctx.stroke();}
  for(let g=0;g<=6;g+=2){ctx.beginPath();ctx.moveTo(cr_X0,cr_sy(g));ctx.lineTo(cr_X1,cr_sy(g));ctx.stroke();}
  // axes
  ctx.strokeStyle="#3A4C68";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(cr_X0,cr_Y0);ctx.lineTo(cr_X1,cr_Y0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cr_X0,cr_Y1);ctx.lineTo(cr_X0,cr_Y0);ctx.stroke();
  ctx.fillStyle=F.ax;ctx.textAlign="right";ctx.fillText("x",cr_X1-4,cr_Y0-8);
  // curve f(x)=0.4 x^2
  ctx.strokeStyle=F.ax;ctx.lineWidth=2.5;ctx.beginPath();
  for(let x=0;x<=cr_xmax+0.001;x+=0.02){const X=cr_sx(x),Y=cr_sy(cr_f(x));if(x===0)ctx.moveTo(X,Y);else ctx.lineTo(X,Y);}
  ctx.stroke();
  ctx.textAlign="left";ctx.fillStyle=F.ax;ctx.fillText("f(x) = 0.4 x²",cr_sx(2.55),cr_sy(cr_f(2.55))-14);
  // tangent line at px
  const m=cr_df(px),y0=cr_f(px);
  const half=1.35;
  const xa=Math.max(0,px-half),xb=Math.min(cr_xmax,px+half);
  ctx.strokeStyle=F.post;ctx.lineWidth=2.5;ctx.beginPath();
  ctx.moveTo(cr_sx(xa),cr_sy(y0+m*(xa-px)));
  ctx.lineTo(cr_sx(xb),cr_sy(y0+m*(xb-px)));
  ctx.stroke();
  // point on curve
  ctx.fillStyle=F.post;ctx.beginPath();ctx.arc(cr_sx(px),cr_sy(y0),5,0,Math.PI*2);ctx.fill();
  // readouts
  ctx.fillStyle=F.txt;ctx.textAlign="left";
  ctx.fillText("slope = f′(x) = 0.8 x = "+m.toFixed(2),cr_X0+12,cr_Y1+6);
  ctx.fillText("at x = "+px.toFixed(2),cr_X0+12,cr_Y1+26);
  // power-rule reminder
  ctx.fillStyle=F.ok;ctx.textAlign="right";
  ctx.fillText("power rule:  xⁿ → n·xⁿ⁻¹",cr_X1-6,cr_Y1+6);
}
ANIMS.calc_rules_static=(cv,ctx)=>cr_draw(ctx,cv,2.2);

  await tween(2600,k=>cr_draw(ctx,cv,0.4+k*3.4));

/* calculus / calc_techniques */
(function(){
// F(x) = 0.25 x^2  (an antiderivative of f(x) = 0.5 x); slope f(x)=0.5 x is shared across the +C family
const ct_F=(x)=>0.25*x*x;
const ct_slope=(x)=>0.5*x;
const ct_X0=80,ct_X1=820,ct_Y0=330,ct_Y1=70,ct_xmax=4.0,ct_ymax=7.2;
const ct_sx=(x)=>ct_X0+(x/ct_xmax)*(ct_X1-ct_X0);
const ct_sy=(y)=>ct_Y0-(y/ct_ymax)*(ct_Y0-ct_Y1);
const ct_Cs=[0.4,1.8,3.2,4.6];   // members of the +C family
function ct_draw(ctx,cv,shift){
  clear(ctx,cv);
  ctx.font="14px 'IBM Plex Mono'";
  // grid
  ctx.strokeStyle="#22314a";ctx.lineWidth=1;
  for(let g=0;g<=4;g+=1){ctx.beginPath();ctx.moveTo(ct_sx(g),ct_Y1);ctx.lineTo(ct_sx(g),ct_Y0);ctx.stroke();}
  // axes
  ctx.strokeStyle="#3A4C68";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(ct_X0,ct_Y0);ctx.lineTo(ct_X1,ct_Y0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(ct_X0,ct_Y1);ctx.lineTo(ct_X0,ct_Y0);ctx.stroke();
  ctx.fillStyle=F.ax;ctx.textAlign="right";ctx.fillText("x",ct_X1-4,ct_Y0-8);
  // family of parallel curves F(x)+C
  const xt=2.6;                // where we draw the matching tangent ticks
  const m=ct_slope(xt);
  for(let i=0;i<ct_Cs.length;i++){
    const C=ct_Cs[i]+shift;
    const isPrimary=(i===1);
    ctx.strokeStyle=isPrimary?F.post:F.prior;
    ctx.lineWidth=isPrimary?2.6:1.8;
    ctx.beginPath();
    for(let x=0;x<=ct_xmax+0.001;x+=0.02){
      const X=ct_sx(x),Y=ct_sy(ct_F(x)+C);
      if(x===0)ctx.moveTo(X,Y);else ctx.lineTo(X,Y);
    }
    ctx.stroke();
    // matching-slope tick at xt on every member
    const yt=ct_F(xt)+C, half=0.55;
    ctx.strokeStyle=F.ok;ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(ct_sx(xt-half),ct_sy(yt+m*(-half)));
    ctx.lineTo(ct_sx(xt+half),ct_sy(yt+m*(half)));
    ctx.stroke();
  }
  // labels
  ctx.fillStyle=F.txt;ctx.textAlign="left";
  ctx.fillText("F(x) + C   (same shape, shifted up by C)",ct_X0+12,ct_Y1+6);
  ctx.fillStyle=F.ok;
  ctx.fillText("every member: identical slope f(x) = 0.5 x",ct_X0+12,ct_Y1+26);
}
ANIMS.calc_techniques_static=(cv,ctx)=>ct_draw(ctx,cv,0);
ANIMS.calc_techniques=async(cv,ctx)=>{
  ct_draw(ctx,cv,0);

  await tween(2200,k=>ct_draw(ctx,cv,0.9*Math.sin(k*Math.PI*2)));

  await narrate("So reversing a derivative recovers F only up to a plus C — hence the constant of integration.");
};
})();

/* Fourier series / fourier_superpose */
(function(){
  // One odd-harmonic term of the square-wave series: sin((2k-1)x)/(2k-1)
  const fsup_term=(k,x)=>Math.sin((2*k-1)*x)/(2*k-1);
  // Partial sum of the square wave, scaled by 4/pi so it approaches +/-1.
  // n = number of fully-added odd harmonics; frac = weight of the (n+1)th being added.
  const fsup_sum=(x,n,frac)=>{
    let s=0;
    for(let k=1;k<=n;k++)s+=fsup_term(k,x);
    if(frac>0)s+=frac*fsup_term(n+1,x);
    return (4/Math.PI)*s;
  };
  // The target square wave, amplitude +/-1.
  const fsup_target=(x)=>Math.sin(x)>=0?1:-1;
  const fsup_X0=70,fsup_X1=830,fsup_YT=70,fsup_YB=330;
  const fsup_yc=(fsup_YT+fsup_YB)/2, fsup_half=(fsup_YB-fsup_YT)/2;
  const fsup_xmax=2*Math.PI, fsup_ymax=1.45;
  const fsup_sx=x=>fsup_X0+(x/fsup_xmax)*(fsup_X1-fsup_X0);
  const fsup_sy=y=>fsup_yc-(y/fsup_ymax)*fsup_half;
  function fsup_draw(ctx,cv,st){
    clear(ctx,cv);
    ctx.font="14px 'IBM Plex Mono'";
    const n=st.n, frac=st.frac||0;
    // dim grid
    ctx.strokeStyle="#22314a";ctx.lineWidth=1;
    for(let g=0;g<=4;g++){const gx=fsup_sx(g*fsup_xmax/4);ctx.beginPath();ctx.moveTo(gx,fsup_YT);ctx.lineTo(gx,fsup_YB);ctx.stroke();}
    // axes
    ctx.strokeStyle="#3A4C68";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(fsup_X0,fsup_yc);ctx.lineTo(fsup_X1,fsup_yc);ctx.stroke();
    ctx.beginPath();ctx.moveTo(fsup_X0,fsup_YT);ctx.lineTo(fsup_X0,fsup_YB);ctx.stroke();
    // faint target square wave
    ctx.strokeStyle=F.ax;ctx.globalAlpha=0.35;ctx.lineWidth=1.5;ctx.beginPath();

/* Fourier series / fourier_spectrum */
(function(){
  // Three sine components: frequency (cycles over the window) and amplitude.
  const fspec_comp=[{f:1,a:1.0},{f:2,a:0.6},{f:3,a:0.35}];
  const fspec_amax=fspec_comp.reduce((s,c)=>s+c.a,0)+0.15; // headroom for the time axis
  // weight of component i given n complete components + frac of the (n)th newest
  const fspec_w=(i,n,frac)=>{ if(i<n)return 1; if(i===n)return frac; return 0; };
  const fspec_signal=(x,n,frac)=>{
    let s=0;
    for(let i=0;i<fspec_comp.length;i++)s+=fspec_w(i,n,frac)*fspec_comp[i].a*Math.sin(fspec_comp[i].f*x);
    return s;
  };
  // Left panel = time domain
  const fspec_LX0=60,fspec_LX1=430,fspec_YT=80,fspec_YB=320;
  const fspec_lyc=(fspec_YT+fspec_YB)/2, fspec_lhalf=(fspec_YB-fspec_YT)/2;
  const fspec_xmax=2*Math.PI;
  const fspec_lsx=x=>fspec_LX0+(x/fspec_xmax)*(fspec_LX1-fspec_LX0);
  const fspec_lsy=y=>fspec_lyc-(y/fspec_amax)*fspec_lhalf;
  // Right panel = frequency domain (bars)
  const fspec_RX0=510,fspec_RX1=840,fspec_base=fspec_YB;
  const fspec_barMax=fspec_YB-fspec_YT; // pixels for amplitude 1.0
  function fspec_draw(ctx,cv,st){
    clear(ctx,cv);
    ctx.font="14px 'IBM Plex Mono'";
    const n=st.n, frac=st.frac||0;
    // ---- LEFT: time domain ----
    ctx.strokeStyle="#22314a";ctx.lineWidth=1;
    for(let g=0;g<=4;g++){const gx=fspec_lsx(g*fspec_xmax/4);ctx.beginPath();ctx.moveTo(gx,fspec_YT);ctx.lineTo(gx,fspec_YB);ctx.stroke();}
    ctx.strokeStyle="#3A4C68";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(fspec_LX0,fspec_lyc);ctx.lineTo(fspec_LX1,fspec_lyc);ctx.stroke();
    ctx.beginPath();ctx.moveTo(fspec_LX0,fspec_YT);ctx.lineTo(fspec_LX0,fspec_YB);ctx.stroke();
    ctx.strokeStyle=F.post;ctx.lineWidth=2.5;ctx.beginPath();
    for(let x=0;x<=fspec_xmax+1e-6;x+=0.004){
      const px=fspec_lsx(x),py=fspec_lsy(fspec_signal(x,n,frac));
      if(x===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.stroke();
    ctx.fillStyle=F.txt;ctx.textAlign="left";
    ctx.fillText("time →  (the wave)",fspec_LX0,fspec_YT-24);
    // ---- divider ----
    ctx.strokeStyle="#3A4C68";ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(470,fspec_YT-10);ctx.lineTo(470,fspec_YB+10);ctx.stroke();
    // ---- RIGHT: frequency domain ----
    ctx.strokeStyle="#3A4C68";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(fspec_RX0,fspec_base);ctx.lineTo(fspec_RX1,fspec_base);ctx.stroke();
    ctx.beginPath();ctx.moveTo(fspec_RX0,fspec_YT);ctx.lineTo(fspec_RX0,fspec_base);ctx.stroke();
    const bw=46, slot=(fspec_RX1-fspec_RX0)/fspec_comp.length;
    for(let i=0;i<fspec_comp.length;i++){
      const cx=fspec_RX0+slot*(i+0.5);
      const w=fspec_w(i,n,frac);
      const h=w*fspec_comp[i].a*fspec_barMax;
      if(h>0.5){
        ctx.fillStyle=F.ok;
        ctx.fillRect(cx-bw/2,fspec_base-h,bw,h);
      }
      // frequency tick label
      ctx.fillStyle=F.txt;ctx.textAlign="center";
      ctx.fillText("f="+fspec_comp[i].f,cx,fspec_base+20);
    }
    ctx.fillStyle=F.txt;ctx.textAlign="left";
    ctx.fillText("frequency →  (the spectrum)",fspec_RX0,fspec_YT-24);
    ctx.textAlign="left";
  }
  ANIMS.fourier_spectrum_static=(cv,ctx)=>fspec_draw(ctx,cv,{n:fspec_comp.length,frac:0});
  ANIMS.fourier_spectrum=async(cv,ctx)=>{
    fspec_draw(ctx,cv,{n:0,frac:0});
    await narrate("The same signal has two views: the wave over time (left) and its spectrum by frequency (right).");
    await narrate("Raise the first bar: one slow sine of frequency 1 enters the time signal on the left.");
    await tween(1200,k=>fspec_draw(ctx,cv,{n:0,frac:k}));
    await narrate("Add a second, faster frequency — the left wave already looks less regular.");
    await tween(1200,k=>fspec_draw(ctx,cv,{n:1,frac:k}));
    await narrate("Add a third: a messy-looking wave, yet the spectrum is just three clean bars.");
    await tween(1200,k=>fspec_draw(ctx,cv,{n:2,frac:k}));
    await narrate("The spectrum tells you which frequencies are present and how strong — the same signal, a simpler view.");
  };
})();

(function(){
  const pdebc_TL=0.92, pdebc_TR=0.08;        // pinned end temperatures (boundary conditions)
  const pdebc_N=140;                          // number of colored cells along the rod
  const pdebc_X0=120, pdebc_X1=780;           // rod extent in pixels
  const pdebc_YT=170, pdebc_YB=242;           // rod top / bottom in pixels
  const pdebc_clamp=(v)=>v<0?0:(v>1?1:v);
  // steady state fixed by the two ends: a straight line from hot-left to cold-right
  const pdebc_base=(f)=>pdebc_TL+(pdebc_TR-pdebc_TL)*f;
  // initial hot bump in the middle; heat eqn spreads + dims it as tau grows
  const pdebc_bump=(f,tau)=>0.95/Math.sqrt(1+tau*0.9)*Math.exp(-((f-0.5)*(f-0.5))/(0.010*(1+tau)));
  const pdebc_temp=(f,tau)=>pdebc_clamp(pdebc_base(f)+pdebc_bump(f,tau));
  // temperature -> colour: hue 240 (blue, cold) sweeping to 0 (red, hot)
  const pdebc_col=(t)=>"hsl("+(240*(1-pdebc_clamp(t))).toFixed(0)+",70%,50%)";
  function pdebc_draw(ctx,cv,s){
    clear(ctx,cv);
    ctx.font="14px 'IBM Plex Mono'";
    const tau=s.tau;
    const cw=(pdebc_X1-pdebc_X0)/pdebc_N;
    for(let i=0;i<pdebc_N;i++){
      const f=(i+0.5)/pdebc_N;
      ctx.fillStyle=pdebc_col(pdebc_temp(f,tau));
      ctx.fillRect(pdebc_X0+i*cw, pdebc_YT, cw+1, pdebc_YB-pdebc_YT);
    }
    // rod outline
    ctx.strokeStyle="#3A4C68";ctx.lineWidth=2;
    ctx.strokeRect(pdebc_X0,pdebc_YT,pdebc_X1-pdebc_X0,pdebc_YB-pdebc_YT);
    // colour legend words
    ctx.textAlign="center";ctx.fillStyle=F.txt;
    ctx.fillText("a metal rod — colour = temperature",450,150);
    // pinned end markers (boundary conditions)
    ctx.fillStyle=F.post;
    ctx.fillText("hot end",pdebc_X0,pdebc_YB+26);
    ctx.fillText("cold end",pdebc_X1,pdebc_YB+26);
    ctx.fillStyle=F.ax;ctx.font="12px 'IBM Plex Mono'";
    ctx.fillText("pinned (boundary condition)",pdebc_X0,pdebc_YB+44);
    ctx.fillText("pinned (boundary condition)",pdebc_X1,pdebc_YB+44);
    // initial-condition tag on the bump (only while it is still visible)
    if(tau<8){
      ctx.font="12px 'IBM Plex Mono'";ctx.fillStyle=F.ok;
      const arrTop=pdebc_YT-8;
      ctx.strokeStyle=F.ok;ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(450,arrTop-24);ctx.lineTo(450,arrTop);ctx.stroke();
      ctx.fillText("initial condition: hot bump",450,arrTop-30);
    }
    ctx.font="14px 'IBM Plex Mono'";ctx.textAlign="left";
  }
  ANIMS.pde_bc_static=(cv,ctx)=>pdebc_draw(ctx,cv,{tau:0});
  ANIMS.pde_bc=async(cv,ctx)=>{
    pdebc_draw(ctx,cv,{tau:0});
    await narrate("This is a metal rod: colour shows temperature — blue is cold, red is hot.");
    await narrate("The two ends are clamped at fixed temperatures — the boundary conditions, and they never move.");
    await narrate("We also set a starting shape: a hot bump in the middle — the initial condition.");
    await narrate("Now the heat equation takes over — the bump spreads and smooths toward the one steady profile the ends allow.");
    await tween(3400,k=>pdebc_draw(ctx,cv,{tau:k*45}));
    await narrate("The PDE alone allows endless solutions; the boundary and initial conditions pin down the single real one.");
  };
})();

/* pde / pde_modern */
(function(){
  const pdem_BX0=225, pdem_BX1=675;          // diffusion field box (pixels)
  const pdem_BY0=58,  pdem_BY1=322;
  const pdem_CX=(pdem_BX0+pdem_BX1)/2, pdem_CY=(pdem_BY0+pdem_BY1)/2; // source
  const pdem_CS=9;                            // cell size (px)
  const pdem_R0=520;                          // initial spread scale (px^2)
  const pdem_clamp=(v)=>v<0?0:(v>1?1:v);
  // 2D diffusion of a point source: peak dims as 1/(1+tau), width grows with tau
  const pdem_field=(px,py,tau)=>{
    const dx=px-pdem_CX, dy=py-pdem_CY;
    return (1/(1+tau))*Math.exp(-(dx*dx+dy*dy)/(pdem_R0*(1+tau)));
  };
  // intensity -> colour: dark background -> orange -> hot white-yellow
  const pdem_col=(i)=>{
    i=pdem_clamp(i);
    let r,g,b;
    if(i<0.5){const t=i/0.5;r=15+(232-15)*t;g=26+(120-26)*t;b=44+(40-44)*t;}
    else{const t=(i-0.5)/0.5;r=232+(255-232)*t;g=120+(240-120)*t;b=40+(180-40)*t;}
    return "rgb("+(r|0)+","+(g|0)+","+(b|0)+")";
  };
  function pdem_labels(ctx){
    ctx.fillStyle=F.txt;ctx.font="13px 'IBM Plex Mono'";
    ctx.textAlign="center";
    ctx.fillText("weather & climate",450,30);
    ctx.fillText("airflow & aerodynamics",450,360);
    ctx.textAlign="left";
    ctx.fillText("heat & cooling",22,192);
    ctx.textAlign="right";
    ctx.fillText("MRI imaging",878,150);
    ctx.fillText("option pricing (Black–Scholes)",878,238);
    ctx.textAlign="left";
  }
  function pdem_draw(ctx,cv,s){
    clear(ctx,cv);
    const tau=s.tau;
    for(let px=pdem_BX0;px<pdem_BX1;px+=pdem_CS){
      for(let py=pdem_BY0;py<pdem_BY1;py+=pdem_CS){
        const i=pdem_field(px+pdem_CS/2,py+pdem_CS/2,tau);
        if(i<0.02)continue;
        ctx.fillStyle=pdem_col(i);
        ctx.fillRect(px,py,pdem_CS,pdem_CS);
      }
    }
    // field border
    ctx.strokeStyle="#3A4C68";ctx.lineWidth=1.5;
    ctx.strokeRect(pdem_BX0,pdem_BY0,pdem_BX1-pdem_BX0,pdem_BY1-pdem_BY0);
    pdem_labels(ctx);
  }
  ANIMS.pde_modern_static=(cv,ctx)=>pdem_draw(ctx,cv,{tau:0});
  ANIMS.pde_modern=async(cv,ctx)=>{
    pdem_draw(ctx,cv,{tau:0});
    await narrate("Watch a hot spot spread and fade — this is diffusion, the same math as heat flowing through a material.");
    await narrate("A tiny handful of PDEs — heat, wave, and diffusion — describe how things spread, ripple, and settle.");
    await tween(3000,k=>pdem_draw(ctx,cv,{tau:k*18}));
    await narrate("The very same equations forecast the weather, sharpen MRI scans, and shape airflow over a wing.");
    await tween(2400,k=>pdem_draw(ctx,cv,{tau:18+k*24}));
    await narrate("They even price stock options: Black–Scholes is a diffusion equation in disguise.");
    await narrate("Learn these few PDEs and you hold a master key to weather, imaging, engineering, and finance.");
  };
})();

(function(){
const ofld_f=(x,y)=>y*(1-y);                 // logistic slope  y' = y(1-y)
const ofld_X0=70,ofld_X1=830,ofld_Y0=330,ofld_Y1=60;
const ofld_xmax=6,ofld_ymax=1.6;
const ofld_sx=x=>ofld_X0+(x/ofld_xmax)*(ofld_X1-ofld_X0);
const ofld_sy=y=>ofld_Y0-(y/ofld_ymax)*(ofld_Y0-ofld_Y1);
function ofld_field(ctx){
  ctx.strokeStyle="#22314a";ctx.lineWidth=1;
  for(let g=0;g<=6;g++){ctx.beginPath();ctx.moveTo(ofld_sx(g),ofld_Y1);ctx.lineTo(ofld_sx(g),ofld_Y0);ctx.stroke();}
  ctx.strokeStyle="#3A4C68";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(ofld_X0,ofld_Y0);ctx.lineTo(ofld_X1,ofld_Y0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(ofld_X0,ofld_Y1);ctx.lineTo(ofld_X0,ofld_Y0);ctx.stroke();
  ctx.strokeStyle=F.prior;ctx.lineWidth=1.4;
  const half=11;
  for(let ix=0;ix<=11;ix++){
    for(let iy=1;iy<=7;iy++){
      const x=ix*0.5, y=iy*0.2;
      const m=ofld_f(x,y);
      let dpx=(ofld_X1-ofld_X0)/ofld_xmax;
      let dpy=-(ofld_Y0-ofld_Y1)/ofld_ymax*m;
      const L=Math.hypot(dpx,dpy);
      dpx=dpx/L*half; dpy=dpy/L*half;
      const px=ofld_sx(x), py=ofld_sy(y);
      ctx.beginPath();ctx.moveTo(px-dpx,py-dpy);ctx.lineTo(px+dpx,py+dpy);ctx.stroke();
    }
  }
}
function ofld_curve(ctx,xEnd,y0){
  ctx.strokeStyle=F.post;ctx.lineWidth=2.6;ctx.beginPath();

  const dx=0.02;

    const px=ofld_sx(x),py=ofld_sy(y);
    if(first){ctx.moveTo(px,py);first=false;}else ctx.lineTo(px,py);
    lastY=y;
    y+=ofld_f(x,y)*dx;

  ctx.beginPath();ctx.moveTo(ofld_sx(0),ofld_sy(1));ctx.lineTo(ofld_sx(ofld_xmax),ofld_sy(1));ctx.stroke();

(function(){

  clear(ctx,cv);

  ctx.strokeStyle="#22314a";ctx.lineWidth=1;
  for(let g=0;g<=4;g++){ctx.beginPath();ctx.moveTo(osep_sx(g),osep_Y1);ctx.lineTo(osep_sx(g),osep_Y0);ctx.stroke();}
  ctx.strokeStyle="#3A4C68";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(osep_X0,osep_Y0);ctx.lineTo(osep_X1,osep_Y0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(osep_X0,osep_Y1);ctx.lineTo(osep_X0,osep_Y0);ctx.stroke();

  let first=true;
  for(let t=0;t<=tEnd+1e-9;t+=0.02){const px=osep_sx(t),py=osep_sy(osep_yf(t));if(first){ctx.moveTo(px,py);first=false;}else ctx.lineTo(px,py);}

  }

  ctx.fillText("y' = k·y   (k>0)",osep_X0+8,osep_Y1-4);
  ctx.textAlign="right";ctx.fillText("t",osep_X1,osep_Y0+18);
  ctx.save();ctx.translate(osep_X0-16,(osep_Y0+osep_Y1)/2);ctx.rotate(-Math.PI/2);ctx.textAlign="center";ctx.fillStyle=F.txt;ctx.fillText("y",0,0);ctx.restore();
