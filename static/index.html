    const shown=i<s.steps;
    const last=i===osep_steps.length-1;

    ctx.font=(last?"19px":"16px")+" 'IBM Plex Mono'";

  }

  ctx.fillStyle=F.txt;ctx.fillText("separate → integrate → exponentiate",sxs,sys-46);
}
ANIMS.ode_separable_static=(cv,ctx)=>osep_draw(ctx,cv,{tEnd:osep_tmax,steps:3});
ANIMS.ode_separable=async(cv,ctx)=>{

/* differential equations / ode_stability */
(function(){
const ostb_U=(x)=>-Math.cos(x);        // potential landscape
const ostb_Up=(x)=>Math.sin(x);        // dU/dx ;  dynamics x' = -U'(x) = -sin(x)
const ostb_X0=70,ostb_X1=830,ostb_xmin=-2,ostb_xmax=7;
const ostb_Ymid=155,ostb_amp=70,ostb_phaseY=300;
const ostb_sx=x=>ostb_X0+((x-ostb_xmin)/(ostb_xmax-ostb_xmin))*(ostb_X1-ostb_X0);
const ostb_sy=U=>ostb_Ymid - U*ostb_amp;
const ostb_PI=Math.PI, ostb_2PI=2*Math.PI;
function ostb_land(ctx){
  ctx.strokeStyle=F.ax;ctx.lineWidth=2.4;ctx.beginPath();
  let first=true;
  for(let x=ostb_xmin;x<=ostb_xmax+1e-9;x+=0.03){const px=ostb_sx(x),py=ostb_sy(ostb_U(x));if(first){ctx.moveTo(px,py);first=false;}else ctx.lineTo(px,py);}
  ctx.stroke();
}
function ostb_ball(ctx,x){
  const px=ostb_sx(x), py=ostb_sy(ostb_U(x))-9;
  ctx.fillStyle=F.post;ctx.beginPath();ctx.arc(px,py,8,0,7);ctx.fill();
  ctx.strokeStyle="rgba(15,26,44,0.6)";ctx.lineWidth=1.2;ctx.stroke();
}
function ostb_arrow(ctx,px,py,dir,color){
  const len=15;
  ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=1.7;
  ctx.beginPath();ctx.moveTo(px-dir*len/2,py);ctx.lineTo(px+dir*len/2,py);ctx.stroke();
  const hx=px+dir*len/2;
  ctx.beginPath();ctx.moveTo(hx,py);ctx.lineTo(hx-dir*6,py-4);ctx.lineTo(hx-dir*6,py+4);ctx.closePath();ctx.fill();
}
function ostb_phase(ctx){
  ctx.strokeStyle="#3A4C68";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(ostb_sx(ostb_xmin+0.2),ostb_phaseY);ctx.lineTo(ostb_sx(ostb_xmax-0.2),ostb_phaseY);ctx.stroke();
  for(let x=ostb_xmin+0.5;x<=ostb_xmax-0.5;x+=0.7){
    const v=-ostb_Up(x);
    if(Math.abs(v)<0.08) continue;
    ostb_arrow(ctx,ostb_sx(x),ostb_phaseY,Math.sign(v),F.prior);
  }
  [[0,F.ok],[ostb_PI,F.wrong],[ostb_2PI,F.ok]].forEach(([x,c])=>{
    ctx.fillStyle=c;ctx.beginPath();ctx.arc(ostb_sx(x),ostb_phaseY,6,0,7);ctx.fill();
  });
}
function ostb_roll(x0,tTotal){
  let x=x0;const dt=0.02;
  for(let t=0;t<tTotal;t+=dt){x+=-ostb_Up(x)*dt*3;}
  return x;
}
function ostb_draw(ctx,cv,s){
  clear(ctx,cv);
  ctx.font="14px 'IBM Plex Mono'";
  ostb_land(ctx);
  [[0,F.ok],[ostb_PI,F.wrong],[ostb_2PI,F.ok]].forEach(([x,c])=>{
    ctx.fillStyle=c;ctx.beginPath();ctx.arc(ostb_sx(x),ostb_sy(ostb_U(x)),4,0,7);ctx.fill();
  });
  ctx.textAlign="center";
  ctx.fillStyle=F.ok;ctx.fillText("stable",ostb_sx(0),ostb_sy(ostb_U(0))+34);
  ctx.fillStyle=F.wrong;ctx.fillText("unstable",ostb_sx(ostb_PI),ostb_sy(ostb_U(ostb_PI))-14);
  ctx.fillStyle=F.ok;ctx.fillText("stable",ostb_sx(ostb_2PI),ostb_sy(ostb_U(ostb_2PI))+34);
  ostb_phase(ctx);
  if(s.ballA!=null) ostb_ball(ctx,s.ballA);
  if(s.ballB!=null) ostb_ball(ctx,s.ballB);
  ctx.textAlign="left";ctx.fillStyle=F.txt;
  ctx.fillText("potential landscape — a ball rolls downhill:  x' = −U'(x)",ostb_X0+4,38);
  ctx.fillStyle="#8FA0B8";
  ctx.fillText("phase line", ostb_sx(ostb_xmin+0.2), ostb_phaseY-14);
}
ANIMS.ode_stability_static=(cv,ctx)=>ostb_draw(ctx,cv,{ballA:0,ballB:ostb_PI});
ANIMS.ode_stability=async(cv,ctx)=>{
  ostb_draw(ctx,cv,{});
  await narrate("Equilibria are the places where change stops — where the landscape is momentarily flat.");
  await narrate("A valley is a stable equilibrium, a hilltop is unstable; the arrows show which way the state drifts.");
  const vA0=-1.3;
  ostb_draw(ctx,cv,{ballA:vA0});
  await narrate("Nudge a ball near the valley and it rolls back down — small pushes just die out.");
  await tween(1800,k=>ostb_draw(ctx,cv,{ballA:ostb_roll(vA0,k*3.0)}));
  const vB0=ostb_PI+0.15;
  ostb_draw(ctx,cv,{ballA:ostb_roll(vA0,3.0),ballB:vB0});
  await narrate("Perch a ball on the hill and the tiniest nudge sends it rolling away — that is instability.");
  await tween(2000,k=>ostb_draw(ctx,cv,{ballA:ostb_roll(vA0,3.0),ballB:ostb_roll(vB0,k*4.0)}));
  await narrate("Stable equilibria pull you back; unstable ones push you away.");
};
})();

(function(){
// fan of futures spreading from a single origin
const adc_N=9;                       // number of trajectories
const adc_slope=(i)=>(i-(adc_N-1)/2)/((adc_N-1)/2); // -1..1 spread factor
function adc_draw(ctx,cv,s){
  clear(ctx,cv);
  ctx.font="14px 'IBM Plex Mono'";
  const X0=110,X1=800,Y0=340,Y1=40;
  const oy=(Y0+Y1)/2;               // origin vertical (now)
  const sx=t=>X0+t*(X1-X0);
  const sy=v=>oy-v*((Y0-Y1)/2);     // v in -1..1
  const spread=s.spread;            // 0..1 how far the fan has opened
  // vertical "now" line
  ctx.strokeStyle="#3A4C68";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(X0,Y1);ctx.lineTo(X0,Y0);ctx.stroke();
  ctx.fillStyle=F.ax;ctx.textAlign="center";ctx.fillText("now",X0,Y0+24);
  ctx.fillText("possible futures →",(X0+X1)/2,Y0+24);
  // each trajectory: gently curving line to a fanned endpoint
  for(let i=0;i<adc_N;i++){
    const end=adc_slope(i)*0.92*spread;
    ctx.strokeStyle="rgba(124,141,165,0.45)";ctx.lineWidth=1.4;
    ctx.beginPath();
    for(let t=0;t<=1.001;t+=0.02){
      const v=end*Math.pow(t,1.25);   // spreads out as t grows
      const px=sx(t),py=sy(v);
      if(t===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.stroke();
    // endpoint dot
    ctx.fillStyle="rgba(124,141,165,0.6)";
    ctx.beginPath();ctx.arc(sx(1),sy(end),2.5,0,7);ctx.fill();
  }
  // origin marker
  ctx.fillStyle=F.txt;ctx.beginPath();ctx.arc(X0,oy,4,0,7);ctx.fill();
  // ROBUST choice: a band of outcomes that stays "good" (near a payoff zone) across most futures
  if(s.showRobust){
    // payoff zone (good region) shaded
    ctx.fillStyle="rgba(95,191,149,0.10)";
    ctx.fillRect(X0,sy(0.55),X1-X0,sy(-0.55)-sy(0.55));
    ctx.strokeStyle="rgba(95,191,149,0.35)";ctx.setLineDash([4,4]);ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(X0,sy(0.55));ctx.lineTo(X1,sy(0.55));ctx.stroke();
    ctx.beginPath();ctx.moveTo(X0,sy(-0.55));ctx.lineTo(X1,sy(-0.55));ctx.stroke();
    ctx.setLineDash([]);
    // robust path: stays inside the good band regardless of branch
    ctx.strokeStyle=F.ok;ctx.lineWidth=3;ctx.beginPath();
    for(let t=0;t<=1.001;t+=0.02){
      const v=0.18*Math.sin(t*3.3);   // wanders but stays central / inside band
      const px=sx(t),py=sy(v);
      if(t===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.stroke();
    ctx.fillStyle=F.ok;ctx.textAlign="left";
    ctx.fillText("robust — holds up across most futures",sx(1)+6,sy(0.05));
  }
  // FRAGILE choice: optimal on ONE branch, off the good band on the rest
  if(s.showFragile){
    ctx.strokeStyle=F.wrong;ctx.lineWidth=3;ctx.beginPath();
    for(let t=0;t<=1.001;t+=0.02){
      const v=-0.92*Math.pow(t,1.25); // rides one extreme branch
      const px=sx(t),py=sy(v);
      if(t===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.stroke();
    ctx.fillStyle=F.wrong;ctx.textAlign="left";
    ctx.fillText("fragile — wins on only one branch",sx(1)+6,sy(-0.9));
  }
  ctx.textAlign="left";
}
ANIMS.agi_decision_static=(cv,ctx)=>adc_draw(ctx,cv,{spread:1,showRobust:false,showFragile:false});
ANIMS.agi_decision=async(cv,ctx)=>{

  await tween(1800,k=>adc_draw(ctx,cv,{spread:0.02+k*0.98,showRobust:false,showFragile:false}));

(function(){
// three stages laid out horizontally
const atc_MX=160, atc_MY=150, atc_MW=150, atc_MH=70;   // model box
const atc_TX=590, atc_TY=150, atc_TW=150, atc_TH=70;   // tool box
const atc_PathY=185;                                    // out path
const atc_RetY=245;                                     // return path
function atc_box(ctx,x,y,w,h,fill,stroke){
  ctx.fillStyle=fill; ctx.strokeStyle=stroke; ctx.lineWidth=2;
  ctx.fillRect(x,y,w,h); ctx.strokeRect(x,y,w,h);
}
function atc_draw(ctx,cv,s){
  clear(ctx,cv);
  ctx.font="14px 'IBM Plex Mono'";
  ctx.textAlign="center"; ctx.textBaseline="middle";
  // model box
  atc_box(ctx,atc_MX,atc_MY,atc_MW,atc_MH,"#16233b",F.post);
  ctx.fillStyle=F.post; ctx.fillText("model", atc_MX+atc_MW/2, atc_MY+22);
  ctx.fillStyle=F.txt; ctx.font="11px 'IBM Plex Mono'";
  ctx.fillText(s.answered?"answer ready":"needs a fact", atc_MX+atc_MW/2, atc_MY+46);
  ctx.font="14px 'IBM Plex Mono'";
  // tool box
  atc_box(ctx,atc_TX,atc_TY,atc_TW,atc_TH,"#16233b",F.ax);
  ctx.fillStyle=F.txt; ctx.fillText("tool: search", atc_TX+atc_TW/2, atc_TY+22);
  ctx.fillStyle=F.ax; ctx.font="11px 'IBM Plex Mono'";
  ctx.fillText(s.running?"executing…":"idle", atc_TX+atc_TW/2, atc_TY+46);
  ctx.font="14px 'IBM Plex Mono'";
  const rightM=atc_MX+atc_MW, leftT=atc_TX;
  // ---- outbound: structured tool call ----
  ctx.strokeStyle=F.ax; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(rightM,atc_PathY); ctx.lineTo(leftT,atc_PathY); ctx.stroke();
  ctx.fillStyle=F.ax; ctx.beginPath(); ctx.moveTo(leftT,atc_PathY); ctx.lineTo(leftT-9,atc_PathY-5); ctx.lineTo(leftT-9,atc_PathY+5); ctx.closePath(); ctx.fill();
  ctx.fillStyle=F.txt; ctx.font="12px 'IBM Plex Mono'";
  ctx.fillText('{ tool:"search", args:"…" }', (rightM+leftT)/2, atc_PathY-16);
  // ---- inbound: result ----
  ctx.strokeStyle=F.ok; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(leftT,atc_RetY); ctx.lineTo(rightM,atc_RetY); ctx.stroke();
  ctx.fillStyle=F.ok; ctx.beginPath(); ctx.moveTo(rightM,atc_RetY); ctx.lineTo(rightM+9,atc_RetY-5); ctx.lineTo(rightM+9,atc_RetY+5); ctx.closePath(); ctx.fill();
  ctx.fillStyle=F.txt; ctx.font="12px 'IBM Plex Mono'";
  ctx.fillText("result → back to model", (rightM+leftT)/2, atc_RetY+16);
  ctx.font="14px 'IBM Plex Mono'";
  // moving token: out (phase 0..0.5) then back (0.5..1)
  if(s.tok!=null){
    let tx,ty,col;
    if(s.tok<0.5){ const p=s.tok/0.5; tx=rightM+(leftT-rightM)*p; ty=atc_PathY; col=F.ax; }
    else { const p=(s.tok-0.5)/0.5; tx=leftT+(rightM-leftT)*p; ty=atc_RetY; col=F.ok; }
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(tx,ty,6,0,Math.PI*2); ctx.fill();
  }
  // title
  ctx.fillStyle=F.txt; ctx.font="13px 'IBM Plex Mono'";
  ctx.fillText("tool use: the model calls out, a tool runs, the result returns", 450, 60);
  ctx.font="14px 'IBM Plex Mono'";
  ctx.textAlign="left"; ctx.textBaseline="alphabetic";
}
ANIMS.agent_toolcall_static=(cv,ctx)=>atc_draw(ctx,cv,{tok:null,running:false,answered:false});
ANIMS.agent_toolcall=async(cv,ctx)=>{
  atc_draw(ctx,cv,{tok:null,running:false,answered:false});
  await narrate("A language model only predicts text, so on its own it cannot look things up or act.");
  await narrate("Instead it emits a structured tool call — naming a tool and its arguments.");

  await tween(1600,k=>atc_draw(ctx,cv,{tok:0.5+k*0.5,running:true,answered:false}));

};

(function(){
// context window box (left) — bounded, holds CAP slots
const am_CX=90, am_CY=120, am_CW=300, am_SLOT=40, am_CAP=5;
// long-term store (right)
const am_SX=560, am_SY=120, am_SW=280, am_SH=180;
function am_draw(ctx,cv,s){
  clear(ctx,cv);
  ctx.font="14px 'IBM Plex Mono'";
  ctx.textAlign="left"; ctx.textBaseline="middle";
  const boxH=am_CAP*am_SLOT;
  // ---- context window ----
  ctx.strokeStyle=F.ax; ctx.lineWidth=2;
  ctx.strokeRect(am_CX,am_CY,am_CW,boxH);
  ctx.fillStyle=F.txt; ctx.font="13px 'IBM Plex Mono'"; ctx.textAlign="center";
  ctx.fillText("context window (finite)", am_CX+am_CW/2, am_CY-16);
  ctx.font="14px 'IBM Plex Mono'"; ctx.textAlign="left";
  // slot separators
  ctx.strokeStyle="#22314a"; ctx.lineWidth=1;
  for(let i=1;i<am_CAP;i++){ ctx.beginPath(); ctx.moveTo(am_CX,am_CY+i*am_SLOT); ctx.lineTo(am_CX+am_CW,am_CY+i*am_SLOT); ctx.stroke(); }
  // items currently held: array of labels, newest at bottom
  const items=s.items||[];
  const shown=items.slice(-am_CAP);
  for(let i=0;i<shown.length;i++){
    const y=am_CY+boxH-(shown.length-i)*am_SLOT;
    ctx.fillStyle="#16233b"; ctx.fillRect(am_CX+6,y+5,am_CW-12,am_SLOT-10);
    ctx.strokeStyle=F.ax; ctx.lineWidth=1.5; ctx.strokeRect(am_CX+6,y+5,am_CW-12,am_SLOT-10);
    ctx.fillStyle=F.txt; ctx.textAlign="left"; ctx.textBaseline="middle";
    ctx.fillText(shown[i], am_CX+18, y+am_SLOT/2);
  }
  // evicted (overflow) item drifting out the top
  if(s.evict){
    ctx.globalAlpha=Math.max(0,1-s.evictP);
    const ey=am_CY-10 - s.evictP*40;
    ctx.fillStyle="#16233b"; ctx.fillRect(am_CX+6,ey,am_CW-12,am_SLOT-10);
    ctx.strokeStyle=F.wrong; ctx.lineWidth=1.5; ctx.strokeRect(am_CX+6,ey,am_CW-12,am_SLOT-10);
    ctx.fillStyle=F.wrong; ctx.fillText(s.evict+" (evicted)", am_CX+18, ey+(am_SLOT-10)/2);
    ctx.globalAlpha=1;
  }
  // ---- long-term store ----
  ctx.strokeStyle=F.ok; ctx.lineWidth=2; ctx.fillStyle="#122019";
  ctx.fillRect(am_SX,am_SY,am_SW,am_SH); ctx.strokeRect(am_SX,am_SY,am_SW,am_SH);
  ctx.fillStyle=F.txt; ctx.font="13px 'IBM Plex Mono'"; ctx.textAlign="center";
  ctx.fillText("long-term memory store", am_SX+am_SW/2, am_SY-16);
  ctx.font="12px 'IBM Plex Mono'"; ctx.textAlign="left";
  const saved=s.saved||[];
  for(let i=0;i<saved.length;i++){
    const y=am_SY+16+i*26;
    ctx.fillStyle=F.ok; ctx.beginPath(); ctx.arc(am_SX+16,y+6,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=F.txt; ctx.fillText(saved[i], am_SX+30, y+6);
  }
  ctx.font="14px 'IBM Plex Mono'";
  // write arrow (context -> store)
  if(s.write){
    ctx.strokeStyle=F.ok; ctx.lineWidth=2; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(am_CX+am_CW,am_CY+boxH-am_SLOT/2); ctx.lineTo(am_SX,am_SY+30); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=F.ok; ctx.textAlign="center";
    ctx.fillText("write", (am_CX+am_CW+am_SX)/2, (am_CY+boxH+am_SY)/2-24);
  }
  // recall arrow (store -> context)
  if(s.recall){
    ctx.strokeStyle=F.post; ctx.lineWidth=2; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(am_SX,am_SY+am_SH-30); ctx.lineTo(am_CX+am_CW,am_CY+boxH-am_SLOT/2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=F.post; ctx.beginPath();
    ctx.moveTo(am_CX+am_CW,am_CY+boxH-am_SLOT/2); ctx.lineTo(am_CX+am_CW+11,am_CY+boxH-am_SLOT/2-6); ctx.lineTo(am_CX+am_CW+11,am_CY+boxH-am_SLOT/2+6); ctx.closePath(); ctx.fill();
    ctx.textAlign="center";
    ctx.fillText("retrieve when relevant", (am_CX+am_CW+am_SX)/2, (am_CY+boxH+am_SY)/2+30);
  }
  ctx.textAlign="left"; ctx.textBaseline="alphabetic";
}
ANIMS.agent_memory_static=(cv,ctx)=>am_draw(ctx,cv,{items:["turn 1","turn 2","turn 3"],saved:["user prefers metric"]});
ANIMS.agent_memory=async(cv,ctx)=>{
  am_draw(ctx,cv,{items:["turn 1","turn 2"],saved:[]});

  await tween(1400,k=>am_draw(ctx,cv,{items:["turn 2","turn 3","turn 4","turn 5","turn 6"],saved:[],evict:"turn 1",evictP:k}));

  await tween(900,k=>am_draw(ctx,cv,{items:["turn 4","turn 5","turn 6"],saved:["user prefers metric"],write:true}));

  am_draw(ctx,cv,{items:["turn 9","user prefers metric"],saved:["user prefers metric"],recall:true});
};
})();

(function(){
// grid of task runs
const ae_COLS=6, ae_ROWS=3, ae_N=ae_COLS*ae_ROWS;
const ae_GX=90, ae_GY=110, ae_CELL=44, ae_GAP=10;
// deterministic outcome pattern (true = pass). 13 pass / 18 = ~72%
const ae_RES=[true,true,false,true,true,true, true,false,true,true,true,false, true,true,true,false,true,true];
const ae_PASS=ae_RES.filter(Boolean).length;
function ae_draw(ctx,cv,s){
  clear(ctx,cv);
  ctx.font="14px 'IBM Plex Mono'";
  ctx.textAlign="center"; ctx.textBaseline="middle";
  // title
  ctx.fillStyle=F.txt; ctx.font="13px 'IBM Plex Mono'";
  ctx.fillText("task suite: each run passes or fails", ae_GX+ (ae_COLS*(ae_CELL+ae_GAP))/2 -6, 78);
  ctx.font="14px 'IBM Plex Mono'";
  // grid
  const nrev=s.revealed||0;
  for(let i=0;i<ae_N;i++){
    const r=Math.floor(i/ae_COLS), c=i%ae_COLS;
    const x=ae_GX+c*(ae_CELL+ae_GAP), y=ae_GY+r*(ae_CELL+ae_GAP);
    if(i<nrev){
      const ok=ae_RES[i];
      ctx.fillStyle= ok? "rgba(95,191,149,0.28)":"rgba(212,106,98,0.28)";
      ctx.fillRect(x,y,ae_CELL,ae_CELL);
      ctx.strokeStyle= ok? F.ok:F.wrong; ctx.lineWidth=2; ctx.strokeRect(x,y,ae_CELL,ae_CELL);
      ctx.fillStyle= ok? F.ok:F.wrong;
      ctx.fillText(ok? "✓":"✗", x+ae_CELL/2, y+ae_CELL/2+1);
    } else {
      ctx.fillStyle="#16233b"; ctx.fillRect(x,y,ae_CELL,ae_CELL);
      ctx.strokeStyle="#3A4C68"; ctx.lineWidth=1.5; ctx.strokeRect(x,y,ae_CELL,ae_CELL);
    }
  }
  // success-rate bar
  const barX=ae_GX, barY=290, barW=ae_COLS*(ae_CELL+ae_GAP)-ae_GAP, barH=26;
  ctx.strokeStyle=F.ax; ctx.lineWidth=1.5; ctx.strokeRect(barX,barY,barW,barH);
  const passSoFar= s.revealed? ae_RES.slice(0,s.revealed).filter(Boolean).length:0;
  const denom= s.revealed||1;
  const frac= s.revealed? passSoFar/denom : 0;
  ctx.fillStyle="rgba(95,191,149,0.5)"; ctx.fillRect(barX,barY,barW*frac,barH);
  ctx.fillStyle=F.txt; ctx.textAlign="left"; ctx.textBaseline="middle";
  const pct= s.revealed? Math.round(frac*100):0;
  ctx.fillText("success rate: "+pct+"%  ("+passSoFar+"/"+ (s.revealed||0) +")", barX, barY-16);
  // path/trajectory note
  ctx.fillStyle=F.post; ctx.textAlign="left"; ctx.font="12px 'IBM Plex Mono'";
  ctx.fillText("grade the OUTCOME (did it succeed)", 470, ae_GY+20);
  ctx.fillText("and the PATH (did it get there sensibly)", 470, ae_GY+44);
  // small trajectory sketch
  ctx.strokeStyle=F.ax; ctx.lineWidth=2;
  const tx=480, ty=ae_GY+95;
  ctx.beginPath(); ctx.moveTo(tx,ty);
  const pts=[[0,0],[40,-18],[80,6],[130,-10],[180,-30]];
  for(const p of pts) ctx.lineTo(tx+p[0],ty+p[1]);
  ctx.stroke();
  ctx.fillStyle=F.ax;
  for(const p of pts){ ctx.beginPath(); ctx.arc(tx+p[0],ty+p[1],3.5,0,Math.PI*2); ctx.fill(); }
  ctx.fillStyle=F.txt; ctx.fillText("trajectory of steps", tx, ty+34);
  ctx.font="14px 'IBM Plex Mono'";
  ctx.textAlign="left"; ctx.textBaseline="alphabetic";
}
ANIMS.agent_eval_static=(cv,ctx)=>ae_draw(ctx,cv,{revealed:ae_N});
ANIMS.agent_eval=async(cv,ctx)=>{
  ae_draw(ctx,cv,{revealed:0});
  await narrate("You don't judge an agent on one demo — you run it across a whole suite of tasks.");
  for(let i=1;i<=ae_N;i++){
    ae_draw(ctx,cv,{revealed:i});
    await tween(180,()=>{});
  }
  await narrate("Each run resolves to a pass or a fail, and the success rate is the fraction it gets right.");
  await narrate("Here it clears "+ae_PASS+" of "+ae_N+" tasks — a summary score you can track over versions.");

};

(function(){
const ag_AX=70, ag_AY=150, ag_AW=120, ag_AH=64;   // agent box
const ag_GX=390, ag_GTOP=110, ag_GBOT=250;         // gate x + vertical extent
const ag_EX=650, ag_EY=150, ag_EW=150, ag_EH=64;   // execute/env box
const ag_LANE=185;                                  // action lane y
function ag_draw(ctx,cv,s){
  clear(ctx,cv);
  ctx.font="14px 'IBM Plex Mono'";
  ctx.textAlign="center"; ctx.textBaseline="middle";
  // ---- sandbox boundary around gate+execute (what the agent can reach) ----
  ctx.strokeStyle=F.ax; ctx.lineWidth=2; ctx.setLineDash([7,5]);
  ctx.strokeRect(340,70,500,240);
  ctx.setLineDash([]);
  ctx.fillStyle=F.ax; ctx.font="12px 'IBM Plex Mono'"; ctx.textAlign="left";
  ctx.fillText("sandbox boundary — limits what the agent can touch", 348, 88);
  ctx.font="14px 'IBM Plex Mono'"; ctx.textAlign="center";
  // agent box
  ctx.fillStyle="#16233b"; ctx.strokeStyle=F.post; ctx.lineWidth=2;
  ctx.fillRect(ag_AX,ag_AY,ag_AW,ag_AH); ctx.strokeRect(ag_AX,ag_AY,ag_AW,ag_AH);
  ctx.fillStyle=F.post; ctx.fillText("agent", ag_AX+ag_AW/2, ag_AY+22);
  ctx.fillStyle=F.txt; ctx.font="11px 'IBM Plex Mono'"; ctx.fillText("proposes action", ag_AX+ag_AW/2, ag_AY+44);
  ctx.font="14px 'IBM Plex Mono'";
  // lane from agent to gate
  ctx.strokeStyle="#3A4C68"; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(ag_AX+ag_AW,ag_LANE); ctx.lineTo(ag_GX,ag_LANE); ctx.stroke();
  // ---- the gate (policy / checker) ----
  const gc=(ag_GTOP+ag_GBOT)/2;
  ctx.strokeStyle= s.gate==="safe"?F.ok : s.gate==="unsafe"?F.wrong : F.ax;
  ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(ag_GX,ag_GTOP); ctx.lineTo(ag_GX,ag_GBOT); ctx.stroke();
  // gate posts
  ctx.fillStyle=ctx.strokeStyle;
  ctx.beginPath(); ctx.arc(ag_GX,ag_GTOP,5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(ag_GX,ag_GBOT,5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=F.txt; ctx.font="12px 'IBM Plex Mono'";
  ctx.fillText("policy", ag_GX, ag_GTOP-14);
  ctx.fillText("check", ag_GX, ag_GBOT+16);
  ctx.font="14px 'IBM Plex Mono'";
  // lane from gate to execute
  ctx.strokeStyle="#3A4C68"; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(ag_GX,ag_LANE); ctx.lineTo(ag_EX,ag_LANE); ctx.stroke();
  // execute box
  ctx.fillStyle="#16233b"; ctx.strokeStyle=F.ax; ctx.lineWidth=2;
  ctx.fillRect(ag_EX,ag_EY,ag_EW,ag_EH); ctx.strokeRect(ag_EX,ag_EY,ag_EW,ag_EH);
  ctx.fillStyle=F.txt; ctx.fillText("execute", ag_EX+ag_EW/2, ag_EY+22);
  ctx.fillStyle=F.ax; ctx.font="11px 'IBM Plex Mono'"; ctx.fillText("act on the world", ag_EX+ag_EW/2, ag_EY+44);
  ctx.font="14px 'IBM Plex Mono'";
  // ---- moving action token ----
  if(s.tok!=null){
    // travel from agent-right to gate over 0..0.5, then (if safe) gate->execute over 0.5..1
    let tx, blocked=false;
    if(s.tok<=0.5){ tx=(ag_AX+ag_AW)+(ag_GX-(ag_AX+ag_AW))*(s.tok/0.5); }
    else if(s.kind==="safe"){ tx=ag_GX+(ag_EX-ag_GX)*((s.tok-0.5)/0.5); }
    else { tx=ag_GX; blocked=true; }
    const col= s.kind==="safe"?F.ok:F.wrong;
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(tx,ag_LANE,7,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=F.txt; ctx.font="11px 'IBM Plex Mono'";
    ctx.fillText(s.kind==="safe"?"read file":"rm -rf /", tx, ag_LANE-16);
    if(blocked){
      ctx.strokeStyle=F.wrong; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(ag_GX-9,ag_LANE-9); ctx.lineTo(ag_GX+9,ag_LANE+9); ctx.moveTo(ag_GX+9,ag_LANE-9); ctx.lineTo(ag_GX-9,ag_LANE+9); ctx.stroke();
      ctx.fillStyle=F.wrong; ctx.fillText("BLOCKED", ag_GX, ag_LANE+22);
    }
    ctx.font="14px 'IBM Plex Mono'";
  }
  ctx.textAlign="left"; ctx.textBaseline="alphabetic";
}
ANIMS.agent_guardrail_static=(cv,ctx)=>ag_draw(ctx,cv,{tok:null,gate:null});
ANIMS.agent_guardrail=async(cv,ctx)=>{
  ag_draw(ctx,cv,{tok:null,gate:null});
  await narrate("Before any action runs, it passes through a gate that checks it against a policy.");
  await tween(1400,k=>ag_draw(ctx,cv,{tok:k*0.5,kind:"safe",gate:null}));
  ag_draw(ctx,cv,{tok:0.5,kind:"safe",gate:"safe"});
  await narrate("A safe action — like reading a file — clears the check and is allowed to execute.");
  await tween(1400,k=>ag_draw(ctx,cv,{tok:0.5+k*0.5,kind:"safe",gate:"safe"}));
  await narrate("A dangerous action gets stopped at the gate before it can ever run.");
  await tween(1400,k=>ag_draw(ctx,cv,{tok:k*0.5,kind:"unsafe",gate:null}));
  ag_draw(ctx,cv,{tok:0.6,kind:"unsafe",gate:"unsafe"});
  await narrate("And a sandbox boundary limits the blast radius — what the agent can reach at all.");
};
})();

(function(){
const lf_gauss=(u,mu,sig)=>Math.exp(-((u-mu)*(u-mu))/(2*sig*sig));
// three training stages: mean drifts toward "helpful", spread tightens
const lf_stages=[
  {mu:0.50,sig:0.26,col:F.prior,name:"PRETRAIN",sub:"broad raw language"},
  {mu:0.68,sig:0.15,col:F.post ,name:"FINE-TUNE",sub:"narrow to a task"},
  {mu:0.85,sig:0.065,col:F.ok  ,name:"RLHF",sub:"human preference"}

const lf_target=0.85; // the "helpful" output
function lf_arrow(ctx,x0,y0,x1,y1){
  ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();
  const a=Math.atan2(y1-y0,x1-x0),h=6;
  ctx.beginPath();ctx.moveTo(x1,y1);
  ctx.lineTo(x1-h*Math.cos(a-0.5),y1-h*Math.sin(a-0.5));
  ctx.lineTo(x1-h*Math.cos(a+0.5),y1-h*Math.sin(a+0.5));
  ctx.closePath();ctx.fill();
}
function lf_panel(ctx,left,st,alpha){
  const w=200,Yb=300,ampMax=120;
  const sx=u=>left+u*w;
  const amp=Math.min(130,ampMax*(0.15/st.sig))*alpha;
  // baseline
  ctx.strokeStyle="#3A4C68";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(left,Yb);ctx.lineTo(left+w,Yb);ctx.stroke();
  // "helpful" target line
  ctx.strokeStyle="rgba(95,191,149,0.55)";ctx.lineWidth=1;
  ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(sx(lf_target),Yb);ctx.lineTo(sx(lf_target),Yb-135);ctx.stroke();
  ctx.setLineDash([]);
  // distribution curve (filled)
  ctx.fillStyle="rgba(124,141,165,0.10)";
  ctx.beginPath();ctx.moveTo(sx(0),Yb);
  for(let u=0;u<=1.0001;u+=0.02)ctx.lineTo(sx(u),Yb-amp*lf_gauss(u,st.mu,st.sig));
  ctx.lineTo(sx(1),Yb);ctx.closePath();
  const g=ctx.globalAlpha;ctx.globalAlpha=g*alpha;ctx.fill();ctx.globalAlpha=g;
  ctx.strokeStyle=st.col;ctx.lineWidth=2.5;ctx.globalAlpha=g*alpha;
  ctx.beginPath();
  for(let u=0;u<=1.0001;u+=0.02){const px=sx(u),py=Yb-amp*lf_gauss(u,st.mu,st.sig);if(u===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}
  ctx.stroke();ctx.globalAlpha=g;
  // labels
  ctx.fillStyle=F.txt;ctx.textAlign="center";
  ctx.globalAlpha=g*(0.35+0.65*alpha);
  ctx.font="14px 'IBM Plex Mono'";ctx.fillText(st.name,left+w/2,Yb+22);
  ctx.fillStyle=F.ax;ctx.font="11px 'IBM Plex Mono'";ctx.fillText(st.sub,left+w/2,Yb+38);
  ctx.globalAlpha=g;ctx.textAlign="left";
}
function lf_draw(ctx,cv,s){
  clear(ctx,cv);
  ctx.font="14px 'IBM Plex Mono'";
  const lefts=[70,350,630];
  // title strip
  ctx.fillStyle=F.txt;ctx.textAlign="left";ctx.font="13px 'IBM Plex Mono'";
  ctx.fillText("output distribution over answers  →  tightening toward “helpful”",70,44);
  ctx.fillStyle=F.ok;ctx.textAlign="right";ctx.fillText("↓ helpful",826,44);ctx.textAlign="left";
  for(let i=0;i<3;i++){
    const alpha=Math.max(0,Math.min(1,s.t-i));
    if(alpha<=0)continue;
    lf_panel(ctx,lefts[i],lf_stages[i],alpha);
  }
  // arrows between panels (once next stage is starting)
  ctx.fillStyle=F.ax;ctx.strokeStyle=F.ax;ctx.lineWidth=1.5;
  if(s.t>1)lf_arrow(ctx,278,240,342,240);
  if(s.t>2)lf_arrow(ctx,558,240,622,240);
  // preference nudges in the RLHF panel
  if(s.t>2.2){
    const w=200,left=630,Yb=300,sx=u=>left+u*w;
    ctx.strokeStyle=F.ok;ctx.fillStyle=F.ok;ctx.lineWidth=1.5;
    lf_arrow(ctx,sx(0.55),Yb-40,sx(0.78),Yb-40);
    ctx.font="11px 'IBM Plex Mono'";ctx.fillStyle=F.ok;
    ctx.fillText("prefer →",sx(0.42),Yb-46);
  }
}
ANIMS.llm_finetune_static=(cv,ctx)=>lf_draw(ctx,cv,{t:3});
ANIMS.llm_finetune=async(cv,ctx)=>{
  lf_draw(ctx,cv,{t:1});
  await narrate("Pretraining reads a huge amount of text, so the model learns language but answers all over the map.");
  await tween(900,k=>lf_draw(ctx,cv,{t:1+k}));
  await narrate("Fine-tuning trains it on curated examples of a task, narrowing that spread toward useful answers.");
  await tween(900,k=>lf_draw(ctx,cv,{t:2+k}));
  await narrate("RLHF adds human preference: people pick the better reply, and the model is nudged toward it.");
  await narrate("The output distribution keeps tightening onto answers people find helpful and safe.");
};
})();

/* large language model / llm_prompt */
(function(){
// task = give the ANTONYM (opposite). Zero-shot guesses a synonym; few-shot locks the pattern.
const lp_examples=[["hot","cold"],["up","down"],["fast","slow"]];
const lp_query="big";
function lp_roundrect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function lp_draw(ctx,cv,s){
  clear(ctx,cv);
  ctx.font="14px 'IBM Plex Mono'";
  const bx=70,by=70,bw=430,bh=250;
  // prompt box
  ctx.fillStyle="rgba(124,141,165,0.06)";lp_roundrect(ctx,bx,by,bw,bh,10);ctx.fill();
  ctx.strokeStyle="#3A4C68";ctx.lineWidth=1.5;lp_roundrect(ctx,bx,by,bw,bh,10);ctx.stroke();
  ctx.fillStyle=F.ax;ctx.textAlign="left";ctx.font="12px 'IBM Plex Mono'";
  ctx.fillText("PROMPT  (context — read at inference)",bx+16,by+24);
  ctx.fillStyle=F.txt;ctx.font="12px 'IBM Plex Mono'";
  ctx.fillText("give the opposite word:",bx+16,by+50);
  // example lines fade in as s.n grows
  ctx.font="15px 'IBM Plex Mono'";
  for(let i=0;i<lp_examples.length;i++){
    const a=Math.max(0,Math.min(1,s.n-i));
    if(a<=0)continue;
    const g=ctx.globalAlpha;ctx.globalAlpha=g*a;
    ctx.fillStyle=F.ax;
    ctx.fillText(lp_examples[i][0]+"  →  "+lp_examples[i][1],bx+30,by+84+i*30);
    ctx.globalAlpha=g;
  }
  // the new query, always present
  ctx.fillStyle=F.txt;ctx.font="15px 'IBM Plex Mono'";
  ctx.fillText(lp_query+"  →  ___",bx+30,by+84+3*30+8);
  // frozen-weights chip
  ctx.fillStyle=F.ax;ctx.font="12px 'IBM Plex Mono'";
  ctx.fillText("weights: frozen  (nothing is trained)",bx+16,by+bh-16);
  // arrow to output
  ctx.strokeStyle=F.ax;ctx.fillStyle=F.ax;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(bx+bw+8,by+bh/2);ctx.lineTo(bx+bw+62,by+bh/2);ctx.stroke();
  const ax=bx+bw+62,ay=by+bh/2;
  ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(ax-9,ay-5);ctx.lineTo(ax-9,ay+5);ctx.closePath();ctx.fill();
  // output box
  const ox=bx+bw+78,ow=250,oy=by+bh/2-52,oh=104;
  const okmode=s.mode==="hit";
  const col=s.mode==="hit"?F.ok:(s.mode==="zero"?F.wrong:F.ax);
  ctx.fillStyle="rgba(124,141,165,0.06)";lp_roundrect(ctx,ox,oy,ow,oh,10);ctx.fill();
  ctx.strokeStyle=col;ctx.lineWidth=2;lp_roundrect(ctx,ox,oy,ow,oh,10);ctx.stroke();
  ctx.fillStyle=F.ax;ctx.font="12px 'IBM Plex Mono'";ctx.textAlign="left";
  ctx.fillText("MODEL COMPLETION",ox+14,oy+22);
  // pulse when it snaps onto the pattern
  const p=s.pulse||0;
  let outWord="…",mark="";
  if(s.mode==="zero"){outWord="large";mark="✗  (a synonym, not the task)";}
  else if(s.mode==="hit"){outWord="small";mark="✓  (matched the pattern)";}
  ctx.textAlign="left";ctx.fillStyle=col;
  ctx.font=(22+p*8).toFixed(0)+"px 'IBM Plex Mono'";
  ctx.fillText("big → "+outWord,ox+14,oy+60);
  ctx.font="12px 'IBM Plex Mono'";ctx.fillStyle=col;
  ctx.fillText(mark,ox+14,oy+86);
}
ANIMS.llm_prompt_static=(cv,ctx)=>lp_draw(ctx,cv,{n:3,mode:"hit"});
ANIMS.llm_prompt=async(cv,ctx)=>{
  lp_draw(ctx,cv,{n:0,mode:"zero"});
  await narrate("Zero-shot: with no examples, the model guesses a synonym — the wrong task — and answers “large”.");
  await narrate("Now put a few worked examples right in the prompt. This is few-shot, in-context learning.");
  await tween(1600,k=>lp_draw(ctx,cv,{n:k*3,mode:"think"}));
  await narrate("From just those examples the model infers the rule — give the opposite — and snaps onto it.");
  await tween(500,k=>lp_draw(ctx,cv,{n:3,mode:"hit",pulse:Math.sin(k*Math.PI)}));
  lp_draw(ctx,cv,{n:3,mode:"hit"});
  await narrate("It learned the task from the prompt itself — no training, its weights never changed.");
};
})();

/* large language model / llm_failure */
(function(){
// a fluent, confident claim — one part is fabricated (marked false).
const lx_words=[
  {t:"Mount",f:false},{t:"Everest,",f:false},{t:"the",f:false},{t:"tallest",f:false},
  {t:"mountain",f:false},{t:"on",f:false},{t:"Earth",f:false},{t:"at",f:false},
  {t:"29,032",f:false},{t:"feet,",f:false},{t:"was",f:false},{t:"first",f:false},
  {t:"climbed",f:false},{t:"in",f:false},{t:"1953",f:false},{t:"by",f:true},
  {t:"a",f:true},{t:"French",f:true},{t:"team.",f:true}
];
function lx_roundrect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
// lay the sentence out with wrapping; returns per-word boxes
function lx_layout(ctx){
  ctx.font="17px 'IBM Plex Mono'";
  const x0=88,x1=812,top=110,lh=30,sp=ctx.measureText(" ").width;
  let x=x0,y=top,boxes=[];
  for(const w of lx_words){
    const ww=ctx.measureText(w.t).width;
    if(x+ww>x1){x=x0;y+=lh;}
    boxes.push({t:w.t,f:w.f,x:x,y:y,w:ww});
    x+=ww+sp;
  }
  return boxes;
}
function lx_draw(ctx,cv,s){
  clear(ctx,cv);
  ctx.textAlign="left";
  ctx.fillStyle=F.ax;ctx.font="12px 'IBM Plex Mono'";
  ctx.fillText("MODEL OUTPUT  (fluent · confident)",70,60);
  const boxes=lx_layout(ctx);
  const shown=s.words;
  // highlight false span first (behind text)
  if(s.flag){
    ctx.fillStyle="rgba(212,106,98,0.22)";
    for(let i=0;i<boxes.length;i++){if(boxes[i].f&&i<shown){const b=boxes[i];lx_roundrect(ctx,b.x-3,b.y-19,b.w+6,26,5);ctx.fill();}}
  }
  // words stream in
  ctx.font="17px 'IBM Plex Mono'";
  for(let i=0;i<boxes.length&&i<shown;i++){
    const b=boxes[i];
    ctx.fillStyle=(s.flag&&b.f)?F.wrong:F.txt;
    ctx.fillText(b.t,b.x,b.y);
  }
  // ---- grounding / verify panel ----
  if(s.verify>0){
    const g=ctx.globalAlpha;ctx.globalAlpha=g*Math.min(1,s.verify);
    const px=70,py=250,pw=760,ph=96;
    ctx.fillStyle="rgba(95,191,149,0.06)";lx_roundrect(ctx,px,py,pw,ph,10);ctx.fill();
    ctx.strokeStyle=F.ok;ctx.lineWidth=1.5;lx_roundrect(ctx,px,py,pw,ph,10);ctx.stroke();
    ctx.fillStyle=F.ok;ctx.font="12px 'IBM Plex Mono'";ctx.textAlign="left";
    ctx.fillText("GROUNDING / VERIFY  — check each claim against a trusted source",px+16,py+24);
    ctx.fillStyle=F.txt;ctx.font="14px 'IBM Plex Mono'";
    ctx.fillText("source: 1953 — Edmund Hillary & Tenzing Norgay  (British expedition)",px+16,py+52);
    ctx.fillStyle=F.wrong;ctx.font="14px 'IBM Plex Mono'";
    ctx.fillText("✗ “a French team” contradicts the source — flagged as fabricated",px+16,py+78);
    ctx.globalAlpha=g;
    // arrow from the false phrase down to the panel
    if(s.verify>0.5){
      let fb=null;for(const b of boxes)if(b.f){fb=b;break;}
      if(fb){
        ctx.strokeStyle=F.wrong;ctx.fillStyle=F.wrong;ctx.lineWidth=1.5;
        const sx=fb.x+fb.w/2,sy=fb.y+8;
        ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx,py-6);ctx.stroke();
        ctx.beginPath();ctx.moveTo(sx,py-2);ctx.lineTo(sx-5,py-11);ctx.lineTo(sx+5,py-11);ctx.closePath();ctx.fill();
      }
    }
  }
}
ANIMS.llm_failure_static=(cv,ctx)=>lx_draw(ctx,cv,{words:99,flag:true,verify:1});
ANIMS.llm_failure=async(cv,ctx)=>{
  lx_draw(ctx,cv,{words:0,flag:false,verify:0});
  await narrate("Ask a model a question and it writes a smooth, confident sentence, word after word.");
  await tween(2000,k=>lx_draw(ctx,cv,{words:Math.round(k*lx_words.length),flag:false,verify:0}));
  await narrate("But fluent is not the same as true — part of this claim is simply made up, or hallucinated.");

  await tween(900,k=>lx_draw(ctx,cv,{words:99,flag:true,verify:k}));
  await narrate("The source contradicts the invented detail, so verification catches the confident mistake.");
};
})();

(function(){
const bb_X0=190,bb_X1=720,bb_Y=205,bb_H=48;

  // border

  ctx.strokeRect(bb_X0,bb_Y,bb_X1-bb_X0,bb_H);

  ctx.fillText("certainly false",bb_X0,bb_Y+bb_H+46);
  ctx.textAlign="right";

/* ---- frag_bayes_conditional.js ---- */
/* bayesian / bayes_conditional */
(function(){
// joint probabilities (sum to 1):
//   P(A,B)=0.30  P(¬A,B)=0.20  -> P(B)=0.50
//   P(A,¬B)=0.15 P(¬A,¬B)=0.35 -> P(¬B)=0.50
// within B column, A fills fraction P(A|B)=0.30/0.50=0.60
// within ¬B column, A fills fraction P(A|¬B)=0.15/0.50=0.30
const bc_pB=0.50, bc_AgB=0.60, bc_AgNB=0.30;
const bc_X0=320,bc_X1=690,bc_YB=340,bc_YT=80;
const bc_fx=f=>bc_X0+f*(bc_X1-bc_X0);
const bc_fy=h=>bc_YB-h*(bc_YB-bc_YT); // h in 0..1 up from bottom
function bc_col(ctx,x0,x1,aFrac){
  // bottom A region
  ctx.fillStyle="rgba(232,161,60,0.55)"; // F.post-ish for A
  ctx.fillRect(x0,bc_fy(aFrac),x1-x0,bc_YB-bc_fy(aFrac));
  // top ¬A region
  ctx.fillStyle="rgba(124,141,165,0.30)"; // F.ax dim for ¬A
  ctx.fillRect(x0,bc_YT,x1-x0,bc_fy(aFrac)-bc_YT);
}
function bc_draw(ctx,cv,s){
  clear(ctx,cv);
  ctx.font="14px 'IBM Plex Mono'";
  const t=Math.max(0,Math.min(1,s.t||0)); // 0 = joint, 1 = conditioned (B fills width)
  const wB=bc_pB+t*(1-bc_pB);             // B column width fraction
  const splitX=bc_fx(wB);
  // B column (left), A fraction stays 0.60 throughout — the key invariant
  bc_col(ctx,bc_fx(0),splitX,bc_AgB);
  // ¬B column (right) shrinks away as we condition
  if(wB<0.999) bc_col(ctx,splitX,bc_fx(1),bc_AgNB);
  // grid outline of the unit square
  ctx.strokeStyle="#3A4C68";ctx.lineWidth=1.5;
  ctx.strokeRect(bc_fx(0),bc_YT,bc_fx(1)-bc_fx(0),bc_YB-bc_YT);
  // column divider
  ctx.strokeStyle="#22314a";ctx.lineWidth=1;
  if(wB<0.999){ctx.beginPath();ctx.moveTo(splitX,bc_YT);ctx.lineTo(splitX,bc_YB);ctx.stroke();}
  // A/¬A divider inside B column
  ctx.setLineDash([4,4]);ctx.strokeStyle="#7C8DA5";
  ctx.beginPath();ctx.moveTo(bc_fx(0),bc_fy(bc_AgB));ctx.lineTo(splitX,bc_fy(bc_AgB));ctx.stroke();
  ctx.setLineDash([]);
  // highlight B column outline
  if(s.highlight){
    ctx.strokeStyle=F.ok;ctx.lineWidth=2.5;
    ctx.strokeRect(bc_fx(0)+1,bc_YT+1,splitX-bc_fx(0)-2,bc_YB-bc_YT-2);
  }
  // labels
  ctx.fillStyle=F.txt;ctx.textAlign="center";
  ctx.fillText(t>0.5?"B  (renormalized to full square)":"B",(bc_fx(0)+splitX)/2,bc_YB+22);
  if(wB<0.999)ctx.fillText("¬B",(splitX+bc_fx(1))/2,bc_YB+22);
  ctx.save();ctx.translate(bc_X0-22,(bc_YT+bc_YB)/2);ctx.rotate(-Math.PI/2);
  ctx.fillText("A  ·  ¬A  (up the square)",0,0);ctx.restore();
  // region labels
  ctx.fillStyle=F.txt;ctx.textAlign="center";
  const bMid=(bc_fx(0)+splitX)/2;
  ctx.fillText("A ∩ B",bMid,(bc_fy(bc_AgB)+bc_YB)/2+4);
  ctx.fillStyle=F.ax;ctx.fillText("¬A ∩ B",bMid,(bc_YT+bc_fy(bc_AgB))/2+4);
  // readout
  ctx.textAlign="left";ctx.font="15px 'IBM Plex Mono'";
  if(t<0.5){
    ctx.fillStyle=F.txt;
    ctx.fillText("joint  P(A,B)=0.30   P(B)=0.50",bc_X0,60);
  }else{
    ctx.fillStyle=F.post;
    ctx.fillText("P(A | B) = 0.30 / 0.50 = "+bc_AgB.toFixed(2),bc_X0,60);
  }
  ctx.font="14px 'IBM Plex Mono'";
}
ANIMS.bayes_conditional_static=(cv,ctx)=>bc_draw(ctx,cv,{t:0,highlight:true});
ANIMS.bayes_conditional=async(cv,ctx)=>{
  bc_draw(ctx,cv,{t:0,highlight:false});
  await narrate("This unit square holds every outcome; each region's area is its joint probability.");
  await narrate("Column B has area 0.50, split into A∩B = 0.30 (orange) and ¬A∩B = 0.20 (grey).");
  bc_draw(ctx,cv,{t:0,highlight:true});
  await narrate("To find P(A given B), we throw away the ¬B column and look only inside B.");

(function(){
const nl_xs=[170,383,596,800];
const nl_counts=[4,5,4,2];
const nl_labels=["pixels\n(input)","edges","shapes","object\n(output)"];
const nl_cy=185, nl_gap=54;
function nl_nodePos(li,ni){
  const n=nl_counts[li];
  const y0=nl_cy-((n-1)*nl_gap)/2;
  return {x:nl_xs[li],y:y0+ni*nl_gap};
}
function nl_lerpColor(t){ // dim -> lit (orange F.post)
  t=Math.max(0,Math.min(1,t));
  const r=Math.round(52+t*(232-52));
  const g=Math.round(69+t*(161-69));
  const b=Math.round(90+t*(60-90));
  return "rgb("+r+","+g+","+b+")";
}
function nl_draw(ctx,cv,s){
  clear(ctx,cv);
  ctx.font="14px 'IBM Plex Mono'";
  const prog=s.prog||0; // 0..4, a wave sweeping across the layers
  const act=li=>Math.max(0,Math.min(1,prog-li));
  // edges first
  for(let li=0;li<nl_xs.length-1;li++){
    const a=Math.min(act(li),act(li+1));
    for(let i=0;i<nl_counts[li];i++){
      for(let j=0;j<nl_counts[li+1];j++){
        const p=nl_nodePos(li,i),q=nl_nodePos(li+1,j);
        ctx.strokeStyle=a>0.02?("rgba(232,161,60,"+(0.12+0.35*a).toFixed(3)+")"):"rgba(34,49,74,0.9)";
        ctx.lineWidth=a>0.02?1.4:1;
        ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();
      }
    }
  }
  // nodes
  for(let li=0;li<nl_xs.length;li++){
    const a=act(li);
    for(let i=0;i<nl_counts[li];i++){
      const p=nl_nodePos(li,i);
      ctx.beginPath();ctx.arc(p.x,p.y,13,0,Math.PI*2);
      ctx.fillStyle=nl_lerpColor(a);ctx.fill();
      ctx.lineWidth=1.5;ctx.strokeStyle=a>0.5?F.txt:"#3A4C68";ctx.stroke();
    }
  }
  // layer labels (rising abstraction)
  ctx.textAlign="center";
  for(let li=0;li<nl_xs.length;li++){
    const parts=nl_labels[li].split("\n");
    ctx.fillStyle=act(li)>0.5?F.post:F.ax;
    ctx.fillText(parts[0],nl_xs[li],345);
    if(parts[1])ctx.fillText(parts[1],nl_xs[li],362);

  ctx.fillStyle=F.txt;ctx.textAlign="left";
  ctx.fillText("raw input",nl_xs[0]-40,60);
  ctx.textAlign="right";
  ctx.fillText("abstract features →",nl_xs[3]+15,60);
}
ANIMS.nn_layers_static=(cv,ctx)=>nl_draw(ctx,cv,{prog:1});
ANIMS.nn_layers=async(cv,ctx)=>{

(function(){
const nt_E=40, nt_ymax=1.15;
const nt_train=e=>0.92*Math.exp(-e/8)+0.09;                 // steady descent
const nt_val  =e=>0.90*Math.exp(-e/6)+0.17+0.00050*e*e;      // dips then rises (overfit)
// find validation minimum (early-stop epoch) by scanning
let nt_estop=0, nt_vmin=1e9;
for(let e=0;e<=nt_E;e++){const v=nt_val(e);if(v<nt_vmin){nt_vmin=v;nt_estop=e;}}
const nt_X0=90,nt_X1=830,nt_Y0=330,nt_Y1=60;
const nt_sx=e=>nt_X0+(e/nt_E)*(nt_X1-nt_X0);
const nt_sy=y=>nt_Y0-(y/nt_ymax)*(nt_Y0-nt_Y1);
function nt_curve(ctx,fn,color,emax){
  ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.beginPath();
  let first=true;
  for(let e=0;e<=emax+0.001;e+=0.25){
    const px=nt_sx(e),py=nt_sy(fn(e));
    if(first){ctx.moveTo(px,py);first=false;}else ctx.lineTo(px,py);
  }
  ctx.stroke();
}
function nt_draw(ctx,cv,s){
  clear(ctx,cv);
  ctx.font="14px 'IBM Plex Mono'";
  const frac=Math.max(0,Math.min(1,s.frac===undefined?1:s.frac));
  const emax=frac*nt_E;
  const stop=Math.max(0,Math.min(1,s.stop||0));
  // grid
  ctx.strokeStyle="#22314a";ctx.lineWidth=1;
  for(let e=0;e<=nt_E;e+=10){ctx.beginPath();ctx.moveTo(nt_sx(e),nt_Y1);ctx.lineTo(nt_sx(e),nt_Y0);ctx.stroke();}
  for(let y=0;y<=1.0;y+=0.25){ctx.beginPath();ctx.moveTo(nt_X0,nt_sy(y));ctx.lineTo(nt_X1,nt_sy(y));ctx.stroke();}
  // axes
  ctx.strokeStyle="#3A4C68";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(nt_X0,nt_Y0);ctx.lineTo(nt_X1,nt_Y0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(nt_X0,nt_Y1);ctx.lineTo(nt_X0,nt_Y0);ctx.stroke();
  ctx.fillStyle=F.ax;ctx.textAlign="center";
  ctx.fillText("epochs (training passes) →",(nt_X0+nt_X1)/2,nt_Y0+34);
  for(let e=0;e<=nt_E;e+=10)ctx.fillText(String(e),nt_sx(e),nt_Y0+18);
  ctx.save();ctx.translate(nt_X0-46,(nt_Y0+nt_Y1)/2);ctx.rotate(-Math.PI/2);
  ctx.fillText("loss (lower = better)",0,0);ctx.restore();
  ctx.textAlign="right";
  for(let y=0;y<=1.0;y+=0.25)ctx.fillText(y.toFixed(2),nt_X0-8,nt_sy(y)+4);
  // curves
  nt_curve(ctx,nt_train,F.ok,emax);
  nt_curve(ctx,nt_val,F.wrong,emax);
  // early-stop marker (drops in via stop 0..1)
  if(stop>0){
    const ex=nt_sx(nt_estop);
    const ytop=nt_Y1, ybot=nt_Y1+stop*(nt_Y0-nt_Y1);
    ctx.setLineDash([6,5]);ctx.strokeStyle=F.txt;ctx.lineWidth=1.8;
    ctx.beginPath();ctx.moveTo(ex,ytop);ctx.lineTo(ex,ybot);ctx.stroke();
    ctx.setLineDash([]);
    if(stop>0.85){
      const my=nt_sy(nt_val(nt_estop));
      ctx.fillStyle=F.txt;ctx.beginPath();ctx.arc(ex,my,5,0,Math.PI*2);ctx.fill();
      ctx.textAlign="center";
      ctx.fillText("early stop",ex,nt_Y1-8);
      ctx.fillText("(epoch "+nt_estop+")",ex,nt_Y1+8);
    }
  }
  // legend
  ctx.textAlign="left";ctx.font="14px 'IBM Plex Mono'";
  ctx.fillStyle=F.ok;ctx.fillRect(nt_X1-190,nt_Y1-2,16,4);
  ctx.fillStyle=F.txt;ctx.fillText("train loss",nt_X1-168,nt_Y1+4);
  ctx.fillStyle=F.wrong;ctx.fillRect(nt_X1-190,nt_Y1+16,16,4);
  ctx.fillStyle=F.txt;ctx.fillText("validation loss",nt_X1-168,nt_Y1+22);
}
ANIMS.nn_training_static=(cv,ctx)=>nt_draw(ctx,cv,{frac:1,stop:1});
ANIMS.nn_training=async(cv,ctx)=>{
  nt_draw(ctx,cv,{frac:0,stop:0});
  await narrate("As training runs, we track the loss — how wrong the model is — over successive epochs.");
  await narrate("Green is loss on the training data; red is loss on held-out validation data it never learns from.");
  await tween(2200,k=>nt_draw(ctx,cv,{frac:k,stop:0}));
  await narrate("Training loss keeps falling, but validation loss bottoms out and then climbs — the model is overfitting.");
  await tween(900,k=>nt_draw(ctx,cv,{frac:1,stop:k}));
  nt_draw(ctx,cv,{frac:1,stop:1});
  await narrate("So we stop at the validation minimum: that early-stop point gives the best model on unseen data.");
};
})();

(function(){
const tac_X0=70,tac_X1=830,tac_Y0=320,tac_Y1=60;
const tac_N=120;
// price series: rises, dips, then rallies — engineered so fast MA crosses slow once (up)
const tac_price=(i)=>{
  const t=i/tac_N;
  return 50 + 18*t + 9*Math.sin(t*7.5) - 14*Math.exp(-Math.pow((t-0.30)/0.12,2));
};
// simple trailing moving average of window w at index i
const tac_ma=(i,w)=>{
  let s=0,n=0;
  for(let j=i-w+1;j<=i;j++){ if(j>=0){ s+=tac_price(j); n++; } }
  return n? s/n : tac_price(i);
};
const tac_FAST=8, tac_SLOW=24;
// find the index where fast crosses above slow (golden cross)
const tac_cross=(()=>{
  for(let i=tac_SLOW+1;i<tac_N;i++){
    const pf=tac_ma(i-1,tac_FAST)-tac_ma(i-1,tac_SLOW);
    const cf=tac_ma(i,tac_FAST)-tac_ma(i,tac_SLOW);
    if(pf<=0 && cf>0) return i;
  }
  return -1;
})();
function tac_draw(ctx,cv,upto){
  clear(ctx,cv);
  ctx.font="14px 'IBM Plex Mono'";

  // grid
  ctx.strokeStyle="#22314a";ctx.lineWidth=1;
  for(let g=0;g<=4;g++){const yy=tac_Y1+g*(tac_Y0-tac_Y1)/4;ctx.beginPath();ctx.moveTo(tac_X0,yy);ctx.lineTo(tac_X1,yy);ctx.stroke();}

  ctx.beginPath();ctx.moveTo(tac_X0,tac_Y1);ctx.lineTo(tac_X0,tac_Y0);ctx.stroke();
  const drawLine=(fn,col,wid,start)=>{
    ctx.strokeStyle=col;ctx.lineWidth=wid;ctx.beginPath();
    let first=true;
    for(let i=start;i<=upto;i++){
      const px=sx(i),py=sy(fn(i));

    }

  };
  // price (dim), then MAs
  drawLine(i=>tac_price(i),"#5b6b85",1.5,0);
  drawLine(i=>tac_ma(i,tac_SLOW),F.prior,2.5,tac_SLOW-1);
  drawLine(i=>tac_ma(i,tac_FAST),F.post,2.5,tac_FAST-1);
  // mark crossover once revealed
  if(tac_cross>0 && upto>=tac_cross){
    const cx=sx(tac_cross),cy=sy(tac_ma(tac_cross,tac_FAST));
    ctx.strokeStyle=F.ok;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(cx,cy,10,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle=F.ok;ctx.textAlign="center";
    ctx.fillText("golden cross",cx,cy-18);
    ctx.textAlign="left";
  }
  // legend
  ctx.textAlign="left";
  ctx.fillStyle="#5b6b85";ctx.fillText("price",tac_X0+8,tac_Y1+14);
  ctx.fillStyle=F.post;ctx.fillText("fast MA (8)",tac_X0+8,tac_Y1+32);
  ctx.fillStyle=F.prior;ctx.fillText("slow MA (24)",tac_X0+8,tac_Y1+50);
  ctx.fillStyle=F.txt;ctx.textAlign="right";
  ctx.fillText("time →",tac_X1,tac_Y0+22);
  ctx.textAlign="left";
}
ANIMS.ta_crossover_static=(cv,ctx)=>tac_draw(ctx,cv,tac_N-1);
ANIMS.ta_crossover=async(cv,ctx)=>{

})();

(function(){

/* risk measures / qf_risk */
(function(){
// Return distribution: a bell-ish histogram over standardized returns.
// A small skew/fat left tail so VaR vs CVaR read clearly.
const qfr_pdf=(x)=>Math.exp(-0.5*x*x)+0.18*Math.exp(-0.5*Math.pow((x+2.4)/0.9,2));
const qfr_VAR=-1.645;   // 5% quantile line (x-axis, standardized)
const qfr_CVAR=-2.30;   // mean of the tail beyond VaR (deeper than VaR)
// Equity curve for the drawdown inset: rises, peaks, drops to a trough, recovers.
const qfr_eq=(t)=>{ // t in 0..1
  return 1.00 + 0.55*t + 0.14*Math.sin(t*7.0) - 0.42*Math.exp(-Math.pow((t-0.62)/0.13,2));
};
const qfr_PEAK_T=0.47, qfr_TROUGH_T=0.66; // peak-to-trough of the max drawdown

function qfr_draw(ctx,cv,s){
  clear(ctx,cv);
  ctx.font="14px 'IBM Plex Mono'";
  // ---- Main panel: the return distribution (left ~62% of width) ----
  const X0=70,X1=560,Y0=300,Y1=70;
  const xmin=-4.2,xmax=3.4,ymax=1.30;
  const sx=x=>X0+((x-xmin)/(xmax-xmin))*(X1-X0);
  const sy=y=>Y0-(y/ymax)*(Y0-Y1);
  // grid
  ctx.strokeStyle="#22314a";ctx.lineWidth=1;
  for(let g=-4;g<=3;g+=1){ctx.beginPath();ctx.moveTo(sx(g),Y1);ctx.lineTo(sx(g),Y0);ctx.stroke();}
  // axes
  ctx.strokeStyle="#3A4C68";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(X0,Y0);ctx.lineTo(X1,Y0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(X0,Y1);ctx.lineTo(X0,Y0);ctx.stroke();
  // histogram bars
  const bw=0.28;
  for(let x=xmin;x<xmax-0.001;x+=bw){
    const h=qfr_pdf(x+bw/2);
    const inTail = (x+bw/2) <= qfr_VAR;
    // reveal the tail highlight progressively via s.tail (0..1): fills from VaR leftward
    let hl=0;
    if(inTail){
      const depth=(qfr_VAR-(x+bw/2))/(qfr_VAR-xmin); // 0 at VaR .. 1 at far left
      hl = s.tail>=depth?1:0;
    }
    ctx.fillStyle = inTail && hl ? "rgba(212,106,98,0.55)" : "rgba(124,141,165,0.35)";
    ctx.strokeStyle = inTail && hl ? F.wrong : "#3A4C68";
    ctx.lineWidth=1;
    const px=sx(x),pw=sx(x+bw)-sx(x),py=sy(h),ph=Y0-sy(h);
    ctx.fillRect(px,py,pw-1,ph);
    ctx.strokeRect(px,py,pw-1,ph);
  }
  // VaR quantile line
  ctx.strokeStyle=F.post;ctx.lineWidth=2;ctx.setLineDash([6,4]);
  ctx.beginPath();ctx.moveTo(sx(qfr_VAR),Y1);ctx.lineTo(sx(qfr_VAR),Y0);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle=F.post;ctx.textAlign="center";
  ctx.fillText("VaR 5%",sx(qfr_VAR),Y1-8);
  // CVaR line (deeper — average loss beyond VaR)
  ctx.strokeStyle=F.wrong;ctx.lineWidth=2;ctx.setLineDash([2,3]);
  ctx.beginPath();ctx.moveTo(sx(qfr_CVAR),Y1+20);ctx.lineTo(sx(qfr_CVAR),Y0);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle=F.wrong;ctx.fillText("CVaR",sx(qfr_CVAR),Y1+14);
  // axis label
  ctx.fillStyle=F.txt;ctx.textAlign="center";
  ctx.fillText("return  (std. deviations from mean)",(X0+X1)/2,Y0+26);
  ctx.textAlign="left";ctx.fillStyle="#9FB0C4";
  ctx.fillText("loss ←",X0,Y0+26);

  // ---- Inset: equity curve with max drawdown (right ~30%) ----
  const IX0=630,IX1=850,IY0=300,IY1=110;
  const emin=0.9,emax=1.65;
  const isx=t=>IX0+t*(IX1-IX0);
  const isy=v=>IY0-((v-emin)/(emax-emin))*(IY0-IY1);
  ctx.strokeStyle="#3A4C68";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(IX0,IY0);ctx.lineTo(IX1,IY0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(IX0,IY1);ctx.lineTo(IX0,IY0);ctx.stroke();
  ctx.fillStyle=F.txt;ctx.textAlign="center";
  ctx.fillText("equity curve",(IX0+IX1)/2,IY1-14);
  // curve
  ctx.strokeStyle=F.ax;ctx.lineWidth=2.2;ctx.beginPath();
  for(let t=0;t<=1.001;t+=0.01){const px=isx(t),py=isy(qfr_eq(t));if(t===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}
  ctx.stroke();
  // drawdown measure: peak -> trough vertical bracket, revealed via s.dd (0..1)
  if(s.dd>0){
    const pv=qfr_eq(qfr_PEAK_T), tv=qfr_eq(qfr_TROUGH_T);
    const curV = pv + (tv-pv)*s.dd;
    const xdd = isx(qfr_TROUGH_T);
    // peak reference line
    ctx.strokeStyle="#5FBF95";ctx.lineWidth=1;ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(isx(qfr_PEAK_T),isy(pv));ctx.lineTo(xdd,isy(pv));ctx.stroke();
    ctx.setLineDash([]);
    // the drop arrow
    ctx.strokeStyle=F.wrong;ctx.lineWidth=2.2;
    ctx.beginPath();ctx.moveTo(xdd,isy(pv));ctx.lineTo(xdd,isy(curV));ctx.stroke();
    // arrowhead
    ctx.beginPath();ctx.moveTo(xdd,isy(curV));ctx.lineTo(xdd-4,isy(curV)-7);ctx.lineTo(xdd+4,isy(curV)-7);ctx.closePath();
    ctx.fillStyle=F.wrong;ctx.fill();
    const ddPct=((tv-pv)/pv*100)*s.dd;
    ctx.fillStyle=F.wrong;ctx.textAlign="left";
    ctx.fillText("maxDD "+ddPct.toFixed(0)+"%",xdd+8,isy((pv+curV)/2));
  }
  ctx.textAlign="left";
}

ANIMS.qf_risk_static=(cv,ctx)=>qfr_draw(ctx,cv,{tail:1,dd:1});
ANIMS.qf_risk=async(cv,ctx)=>{
  qfr_draw(ctx,cv,{tail:0,dd:0});
  await narrate("Volatility measures how much returns swing around their average — but it treats gains and losses the same.");
  await narrate("Value-at-Risk marks a quantile: with 95% confidence, losses stay above this line.");
  await tween(1400,k=>qfr_draw(ctx,cv,{tail:k,dd:0}));
  await narrate("But VaR is silent about the tail beyond it — CVaR, the average loss once you breach VaR, measures how bad the bad days get.");
  await tween(1600,k=>qfr_draw(ctx,cv,{tail:1,dd:k}));
  await narrate("Drawdown captures a fourth face: the worst peak-to-trough drop your capital actually lived through.");
  await narrate("Each measure hides what another catches — read them together, never one alone.");
};
})();

/* portfolio theory / qf_frontier */
(function(){
// Efficient frontier: risk (x) vs expected return (y), an upward-bending curve.
// y = a + b*sqrt(x - x0)  gives the classic concave hyperbola-like top edge.
const qff_front=(x)=>4.0 + 5.4*Math.sqrt(Math.max(0,(x-6.0)/14.0));
// Two "optimal" (max-Sharpe / tangency) points for base vs perturbed inputs.
// A tiny nudge to expected-return inputs swings the optimum far along the curve.
const qff_OPT_BASE={x:9.5};
const qff_OPT_PERT={x:16.8};

function qff_draw(ctx,cv,s){
  clear(ctx,cv);
  ctx.font="14px 'IBM Plex Mono'";
  const X0=80,X1=680,Y0=310,Y1=60;
  const xmin=6.0,xmax=22.0,ymin=3.0,ymax=10.5;
  const sx=x=>X0+((x-xmin)/(xmax-xmin))*(X1-X0);
  const sy=y=>Y0-((y-ymin)/(ymax-ymin))*(Y0-Y1);
  // grid
  ctx.strokeStyle="#22314a";ctx.lineWidth=1;
  for(let g=8;g<=22;g+=4){ctx.beginPath();ctx.moveTo(sx(g),Y1);ctx.lineTo(sx(g),Y0);ctx.stroke();}
  for(let g=4;g<=10;g+=2){ctx.beginPath();ctx.moveTo(X0,sy(g));ctx.lineTo(X1,sy(g));ctx.stroke();}
  // axes
  ctx.strokeStyle="#3A4C68";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(X0,Y0);ctx.lineTo(X1,Y0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(X0,Y1);ctx.lineTo(X0,Y0);ctx.stroke();
  ctx.fillStyle=F.txt;ctx.textAlign="center";
  ctx.fillText("risk  (annualized volatility, %)",(X0+X1)/2,Y0+28);
  ctx.save();ctx.translate(X0-46,(Y0+Y1)/2);ctx.rotate(-Math.PI/2);
  ctx.fillText("expected return (%)",0,0);ctx.restore();

  // scatter of feasible portfolios (cloud below the frontier) — fixed, illustrative
  ctx.fillStyle="rgba(124,141,165,0.30)";
  const seed=[[10,4.4],[12,5.2],[9,4.0],[14,5.0],[16,6.1],[11,4.9],[13,5.6],[15,5.5],
              [18,6.6],[17,6.0],[19,6.9],[20,6.7],[8.5,3.9],[12.5,5.0],[14.5,5.7],[16.5,6.2]];
  for(const p of seed){ctx.beginPath();ctx.arc(sx(p[0]),sy(p[1]),3,0,7);ctx.fill();}

  // frontier curve, drawn up to s.grow (0..1)
  ctx.strokeStyle=F.ax;ctx.lineWidth=2.6;ctx.beginPath();
  const xend=xmin+ (xmax-xmin)*Math.max(0.02,s.grow);
  let started=false;
  for(let x=xmin;x<=xend+0.001;x+=0.1){
    const px=sx(x),py=sy(qff_front(x));
    if(!started){ctx.moveTo(px,py);started=true;}else ctx.lineTo(px,py);
  }
  ctx.stroke();
  if(s.grow>=0.999){
    ctx.fillStyle=F.ax;ctx.textAlign="left";
    // detected overlap: at x=20.4 this label ran into the "µ inputs" panel on the
    // right. Anchor it further left along the same curve, above the line.
    ctx.fillText("efficient frontier",sx(14.0)+4,sy(qff_front(14.0))-10);
  }

  // optimal point: interpolate base -> perturbed by s.swing (0..1)
  if(s.showOpt){
    const ox=qff_OPT_BASE.x+(qff_OPT_PERT.x-qff_OPT_BASE.x)*s.swing;
    const oy=qff_front(ox);
    // ghost of the base optimum while swinging
    if(s.swing>0){
      ctx.strokeStyle="rgba(232,161,60,0.35)";ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(sx(qff_OPT_BASE.x),sy(qff_front(qff_OPT_BASE.x)),7,0,7);ctx.stroke();
    }
    ctx.fillStyle=F.post;
    ctx.beginPath();ctx.arc(sx(ox),sy(oy),7,0,7);ctx.fill();
    ctx.strokeStyle="#0F1A2C";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(sx(ox),sy(oy),7,0,7);ctx.stroke();
    ctx.fillStyle=F.post;ctx.textAlign="center";
    ctx.fillText('"optimal" portfolio',sx(ox),sy(oy)-14);
  }

  // ---- input panel on the right: expected-return estimates + the nudge ----
  const PX=720, PY=90;
  ctx.fillStyle=F.txt;ctx.textAlign="left";
  ctx.fillText("μ̂ inputs",PX,PY-14);
  const assets=["A","B","C"];
  const base=[6.8,7.4,7.1];
  for(let i=0;i<assets.length;i++){
    const yy=PY+i*30;
    const bump = i===1 ? 0.3*s.swing : 0.0; // nudge only asset B by +0.3%
    ctx.fillStyle="#9FB0C4";
    ctx.fillText(assets[i]+":",PX,yy);
    ctx.fillStyle = bump>0.01 ? F.wrong : F.txt;
    ctx.fillText((base[i]+bump).toFixed(1)+"%",PX+28,yy);
    if(i===1){
      ctx.fillStyle=F.wrong;ctx.font="12px 'IBM Plex Mono'";
      ctx.fillText(s.swing>0.01?"+0.3":"",PX+80,yy);
      ctx.font="14px 'IBM Plex Mono'";
    }
  }
  ctx.textAlign="left";
}

ANIMS.qf_frontier_static=(cv,ctx)=>qff_draw(ctx,cv,{grow:1,showOpt:true,swing:0});
ANIMS.qf_frontier=async(cv,ctx)=>{
  qff_draw(ctx,cv,{grow:0,showOpt:false,swing:0});
  await narrate("Every dot is a possible portfolio; mean-variance optimization traces the best return you can get at each level of risk.");
  await tween(1600,k=>qff_draw(ctx,cv,{grow:k,showOpt:false,swing:0}));
  qff_draw(ctx,cv,{grow:1,showOpt:true,swing:0});
  await narrate("On that efficient frontier, the optimizer picks one 'best' portfolio from your estimated returns.");
  await narrate("Now nudge just one expected-return input by three-tenths of a percent — well inside estimation error.");
  await tween(1600,k=>qff_draw(ctx,cv,{grow:1,showOpt:true,swing:k}));
  await narrate("The 'optimal' answer lurches across the frontier — MVO amplifies tiny input errors, so it maximizes estimation error.");
};
})();

/* honest research / qf_research */
(function(){
// In-sample: a curve tortured to fit noise — climbs beautifully to the split.
// Out-of-sample: the same "edge" continues, but it decays / falls apart.
const qfh_SPLIT=0.60; // holdout boundary as a fraction of the time axis
// deterministic pseudo-noise so the wiggles look like real equity, no Math.random at draw time
const qfh_noise=(t)=>0.30*Math.sin(t*23.0)+0.18*Math.sin(t*57.0+1.3)+0.10*Math.sin(t*97.0+0.7);
// in-sample fitted equity: strong upward climb + the noise it overfits
const qfh_inSample=(t)=>1.00 + 1.35*t + 0.16*qfh_noise(t);
// out-of-sample truth: flat-to-declining once the overfit edge stops working
const qfh_oos=(t)=>{ // t from SPLIT..1
  const v0=qfh_inSample(qfh_SPLIT);
  return v0 - 0.85*(t-qfh_SPLIT) + 0.14*qfh_noise(t+3.0);
};

function qfh_draw(ctx,cv,s){
  clear(ctx,cv);
  ctx.font="14px 'IBM Plex Mono'";
  const X0=80,X1=820,Y0=310,Y1=60;
  const ymin=0.7,ymax=2.6;
  const sx=t=>X0+t*(X1-X0);
  const sy=v=>Y0-((v-ymin)/(ymax-ymin))*(Y0-Y1);
  // grid
  ctx.strokeStyle="#22314a";ctx.lineWidth=1;
  for(let g=0.2;g<=1.0;g+=0.2){ctx.beginPath();ctx.moveTo(sx(g),Y1);ctx.lineTo(sx(g),Y0);ctx.stroke();}
  // shade the holdout region
  ctx.fillStyle="rgba(212,106,98,0.06)";
  ctx.fillRect(sx(qfh_SPLIT),Y1,sx(1)-sx(qfh_SPLIT),Y0-Y1);
  // axes
  ctx.strokeStyle="#3A4C68";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(X0,Y0);ctx.lineTo(X1,Y0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(X0,Y1);ctx.lineTo(X0,Y0);ctx.stroke();
  ctx.fillStyle=F.txt;ctx.textAlign="center";
  ctx.fillText("time",(X0+X1)/2,Y0+26);
  ctx.save();ctx.translate(X0-46,(Y0+Y1)/2);ctx.rotate(-Math.PI/2);
  ctx.fillText("cumulative return",0,0);ctx.restore();

  // split line
  ctx.strokeStyle=F.post;ctx.lineWidth=1.5;ctx.setLineDash([5,4]);
  ctx.beginPath();ctx.moveTo(sx(qfh_SPLIT),Y1);ctx.lineTo(sx(qfh_SPLIT),Y0);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle=F.post;ctx.textAlign="center";
  ctx.fillText("holdout split",sx(qfh_SPLIT),Y1-8);

  // region labels
  ctx.fillStyle="#9FB0C4";ctx.textAlign="center";
  ctx.fillText("in-sample (fitted)",sx(qfh_SPLIT/2),Y1+16);
  if(s.oos>0.02) ctx.fillText("out-of-sample (holdout)",sx((qfh_SPLIT+1)/2),Y1+16);

  // in-sample curve, drawn up to s.fit (0..1) of the in-sample span
  ctx.strokeStyle=F.ok;ctx.lineWidth=2.6;ctx.beginPath();
  const tfit=qfh_SPLIT*Math.max(0.02,s.fit);
  let started=false;
  for(let t=0;t<=tfit+0.0001;t+=0.004){
    const px=sx(t),py=sy(qfh_inSample(t));
    if(!started){ctx.moveTo(px,py);started=true;}else ctx.lineTo(px,py);
  }
  ctx.stroke();

  // out-of-sample curve, revealed by s.oos (0..1) of the holdout span
  if(s.oos>0){
    ctx.strokeStyle=F.wrong;ctx.lineWidth=2.6;ctx.beginPath();
    const tend=qfh_SPLIT+(1-qfh_SPLIT)*s.oos;
    let st2=false;
    for(let t=qfh_SPLIT;t<=tend+0.0001;t+=0.004){
      const px=sx(t),py=sy(qfh_oos(t));
      if(!st2){ctx.moveTo(px,py);st2=true;}else ctx.lineTo(px,py);
    }
    ctx.stroke();
    // dot + label at the OOS frontier
    const tv=qfh_SPLIT+(1-qfh_SPLIT)*s.oos, vv=qfh_oos(tv);
    ctx.fillStyle=F.wrong;ctx.beginPath();ctx.arc(sx(tv),sy(vv),4,0,7);ctx.fill();
  }
  ctx.textAlign="left";
}

ANIMS.qf_research_static=(cv,ctx)=>qfh_draw(ctx,cv,{fit:1,oos:1});
ANIMS.qf_research=async(cv,ctx)=>{
  qfh_draw(ctx,cv,{fit:0,oos:0});
  await narrate("Tune a strategy hard enough on past data and its backtest can be made to climb almost perfectly.");
  await tween(1700,k=>qfh_draw(ctx,cv,{fit:k,oos:0}));

  await narrate("The honest test: hold out data the model never saw, and run it forward past the split line.");
  await tween(1700,k=>qfh_draw(ctx,cv,{fit:1,oos:k}));
  await narrate("Out-of-sample, the 'edge' falls apart — only pre-registered, holdout tests separate skill from curve-fitting.");
};
})();

(function(){
const etr_P0=10000, etr_YRS=30, etr_YMAX=80000;
const etr_lowR=0.0697;   /* 7.00% gross minus 0.03% expense ratio */
const etr_highR=0.0625;  /* 7.00% gross minus 0.75% expense ratio */
const etr_val=(r,y)=>etr_P0*Math.pow(1+r,y);
function etr_draw(ctx,cv,s){
  clear(ctx,cv);
  ctx.font="14px 'IBM Plex Mono'";
  const X0=90,X1=740,Y0=320,Y1=60;
  const sx=x=>X0+(x/etr_YRS)*(X1-X0);
  const sy=y=>Y0-(y/etr_YMAX)*(Y0-Y1);
  /* grid */
  ctx.strokeStyle="#22314a";ctx.lineWidth=1;
  for(let g=0;g<=etr_YRS;g+=10){ctx.beginPath();ctx.moveTo(sx(g),Y1);ctx.lineTo(sx(g),Y0);ctx.stroke();}
  for(let v=0;v<=etr_YMAX;v+=20000){ctx.beginPath();ctx.moveTo(X0,sy(v));ctx.lineTo(X1,sy(v));ctx.stroke();}
  /* axes */
  ctx.strokeStyle="#3A4C68";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(X0,Y0);ctx.lineTo(X1,Y0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(X0,Y1);ctx.lineTo(X0,Y0);ctx.stroke();
  /* axis labels */
  ctx.fillStyle=F.ax;ctx.textAlign="center";
  for(let g=0;g<=etr_YRS;g+=10)ctx.fillText(g+"y",sx(g),Y0+20);
  ctx.textAlign="right";
  for(let v=0;v<=etr_YMAX;v+=20000)ctx.fillText("$"+(v/1000)+"k",X0-8,sy(v)+4);
  ctx.textAlign="left";ctx.fillStyle=F.txt;ctx.fillText("$10k invested, 7% gross return",X0+8,Y1-8);
  const yr=s.year;
  /* shaded gap between the two curves up to yr */
  ctx.fillStyle="rgba(212,106,98,0.18)";
  ctx.beginPath();ctx.moveTo(sx(0),sy(etr_val(etr_lowR,0)));
  for(let x=0;x<=yr+0.001;x+=0.25)ctx.lineTo(sx(x),sy(etr_val(etr_lowR,x)));
  for(let x=yr;x>=-0.001;x-=0.25)ctx.lineTo(sx(x),sy(etr_val(etr_highR,x)));
  ctx.closePath();ctx.fill();
  /* high-fee curve (red = the drag) */
  ctx.strokeStyle=F.wrong;ctx.lineWidth=2.5;ctx.beginPath();
  for(let x=0;x<=yr+0.001;x+=0.1){const px=sx(x),py=sy(etr_val(etr_highR,x));if(x===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}
  ctx.stroke();
  /* low-fee curve (green = the keeper) */
  ctx.strokeStyle=F.ok;ctx.lineWidth=2.5;ctx.beginPath();
  for(let x=0;x<=yr+0.001;x+=0.1){const px=sx(x),py=sy(etr_val(etr_lowR,x));if(x===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}
  ctx.stroke();
  /* end dots + legend */
  const lowE=etr_val(etr_lowR,yr), highE=etr_val(etr_highR,yr);
  ctx.fillStyle=F.ok;ctx.beginPath();ctx.arc(sx(yr),sy(lowE),3.5,0,7);ctx.fill();
  ctx.fillStyle=F.wrong;ctx.beginPath();ctx.arc(sx(yr),sy(highE),3.5,0,7);ctx.fill();
  ctx.textAlign="left";
  ctx.fillStyle=F.ok;ctx.fillText("0.03% fee  $"+lowE.toFixed(0),sx(yr)+8,sy(lowE)-2);
  ctx.fillStyle=F.wrong;ctx.fillText("0.75% fee  $"+highE.toFixed(0),sx(yr)+8,sy(highE)+16);
  /* gap label once the fee gap has opened up */
  if(yr>=6){
    const gap=lowE-highE, my=(sy(lowE)+sy(highE))/2;
    ctx.strokeStyle=F.txt;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(sx(yr),sy(lowE));ctx.lineTo(sx(yr),sy(highE));ctx.stroke();
    ctx.fillStyle=F.txt;ctx.textAlign="right";
    ctx.fillText("gap $"+gap.toFixed(0),sx(yr)-6,my+4);
    ctx.textAlign="left";
  }
}
ANIMS.etf_reading_static=(cv,ctx)=>etr_draw(ctx,cv,{year:etr_YRS});
ANIMS.etf_reading=async(cv,ctx)=>{

(function(){
const ete_asks=[[50.02,120],[50.04,200],[50.06,260],[50.08,180],[50.10,300]];
const ete_bids=[[49.98,140],[49.96,220],[49.94,280],[49.92,160],[49.90,260]];
const ete_BEST_BID=49.98, ete_BEST_ASK=50.02, ete_LIMIT=49.95;
const ete_PMIN=49.865, ete_PMAX=50.135;
const ete_Y0=340, ete_Y1=48, ete_BX=150, ete_BMAX=170, ete_SMAX=300, ete_LANE=560;
const ete_sy=p=>ete_Y0-(p-ete_PMIN)/(ete_PMAX-ete_PMIN)*(ete_Y0-ete_Y1);
function ete_bar(ctx,p,size,color){
  const y=ete_sy(p), w=(size/ete_SMAX)*ete_BMAX, h=9;
  ctx.fillStyle=color;ctx.fillRect(ete_BX,y-h/2,w,h);
  ctx.fillStyle=F.txt;ctx.textAlign="right";ctx.font="13px 'IBM Plex Mono'";
  ctx.fillText(p.toFixed(2),ete_BX-8,y+4);
}
function ete_token(ctx,p,label,color){
  const x=ete_LANE,y=ete_sy(p);
  ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,11,0,7);ctx.fill();
  ctx.fillStyle="#0F1A2C";ctx.font="bold 12px 'IBM Plex Mono'";ctx.textAlign="center";ctx.fillText("$",x,y+4);
  ctx.fillStyle=color;ctx.font="13px 'IBM Plex Mono'";ctx.textAlign="left";ctx.fillText(label,x+18,y+4);
}
function ete_draw(ctx,cv,s){
  clear(ctx,cv);
  ctx.font="14px 'IBM Plex Mono'";
  /* spread band between best bid and best ask */
  const yTop=ete_sy(ete_BEST_ASK), yBot=ete_sy(ete_BEST_BID);
  ctx.fillStyle="rgba(124,141,165,0.14)";ctx.fillRect(ete_BX,yTop,700,yBot-yTop);
  ctx.fillStyle=F.ax;ctx.textAlign="left";ctx.fillText("spread 0.04",ete_LANE+18,(yTop+yBot)/2+4);
  /* depth bars */
  for(const[p,sz]of ete_asks)ete_bar(ctx,p,sz,F.wrong);
  for(const[p,sz]of ete_bids)ete_bar(ctx,p,sz,F.ok);
  /* headings */
  ctx.font="13px 'IBM Plex Mono'";ctx.textAlign="left";
  ctx.fillStyle=F.wrong;ctx.fillText("ASK  (sellers)",ete_BX+ete_BMAX+30,ete_sy(50.10)-2);
  ctx.fillStyle=F.ok;ctx.fillText("BID  (buyers)",ete_BX+ete_BMAX+30,ete_sy(49.90)+4);
  ctx.fillStyle=F.txt;ctx.font="14px 'IBM Plex Mono'";ctx.fillText("Order book — price ladder",ete_BX-40,ete_Y1-16);
  /* limit resting line at 49.95 */
  if(s.limit){
    const ly=ete_sy(ete_LIMIT);
    ctx.strokeStyle=F.ax;ctx.lineWidth=1;ctx.setLineDash([5,4]);
    ctx.beginPath();ctx.moveTo(ete_BX,ly);ctx.lineTo(700,ly);ctx.stroke();ctx.setLineDash([]);
    ete_token(ctx,ete_LIMIT,"LIMIT 49.95 — waiting",F.ax);
  }
  /* market order token */
  if(s.market){
    if(s.mkFilled){
      const fy=ete_sy(ete_BEST_ASK);
      ctx.strokeStyle=F.ok;ctx.lineWidth=2;ctx.beginPath();ctx.arc(ete_LANE,fy,15,0,7);ctx.stroke();
      ete_token(ctx,ete_BEST_ASK,"MARKET — FILLED @ 50.02",F.ok);
    }else{
      ete_token(ctx,s.mp,"MARKET — crossing…",F.post);
    }
  }
}
ANIMS.etf_execution_static=(cv,ctx)=>ete_draw(ctx,cv,{});
ANIMS.etf_execution=async(cv,ctx)=>{
  ete_draw(ctx,cv,{});
  await narrate("This is an order book: buyers bid $49.98, sellers ask $50.02 — the 4-cent spread is the gap between them.");
  await narrate("A market order buys right now by crossing the spread; watch it jump up and fill instantly at the ask.");
  await tween(1600,k=>ete_draw(ctx,cv,{market:true,mp:49.885+k*(ete_BEST_ASK-49.885)}));
  ete_draw(ctx,cv,{market:true,mkFilled:true});
  await narrate("A limit order names your price, say $49.95, and rests below — it fills only if a seller drops to meet it.");
  ete_draw(ctx,cv,{market:true,mkFilled:true,limit:true});
  await narrate("So the trade-off is speed versus price: market pays the spread for a sure fill, limit holds out and might not fill.");
};
})();

(function(){
const pc_names=["Equities","Bonds","Real assets","Cash"];
const pc_w=[55,30,10,5];                 // policy target weights, % — sum = 100
const pc_funds=["VTI · VXUS","BND","VNQ · DBC","T-bills"];
function pc_draw(ctx,cv,s){
  clear(ctx,cv);
  ctx.font="14px 'IBM Plex Mono'";
  const cols=[F.post,F.ax,F.ok,"#C9A24B"];
  const colX0=170,colW=150,Y0=330,Y1=70,H=Y0-Y1;   // 100% == 260px
  const scale=H/100;
  const fill=s.fill;
  // title

  ctx.strokeStyle="#3A4C68";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(colX0-10,Y0);ctx.lineTo(colX0+colW+10,Y0);ctx.stroke();
  // stack from the bottom up: Cash, Real, Bonds, Equities  (indices 3..0)
  let bottom=Y0;
  const centers=[0,0,0,0];
  for(let k=3;k>=0;k--){
    const h=pc_w[k]*scale*fill;
    const top=bottom-h;
    ctx.fillStyle=cols[k];
    ctx.fillRect(colX0,top,colW,h);
    ctx.strokeStyle="#0F1A2C";ctx.lineWidth=1;ctx.strokeRect(colX0,top,colW,h);
    centers[k]=(top+bottom)/2;
    bottom=top;
  }
  // 100% frame
  ctx.strokeStyle="#22314a";ctx.lineWidth=1;
  ctx.strokeRect(colX0,Y1,colW,H);
  ctx.fillStyle=F.ax;ctx.textAlign="right";
  ctx.fillText("100%",colX0-14,Y1+5);
  ctx.fillText("0%",colX0-14,Y0+5);
  // connectors + labels (only once the stack is essentially filled)
  if(s.showLabels&&fill>0.88){
    const lx=colX0+colW,tx=lx+70;
    // detected overlap: the thin slices (Real assets 10%, Cash 5%) are only ~20px
    // apart, so their two-line callouts stacked on each other. Space the LABEL
    // anchors at least 40px going down and let the connector slant to the anchor.
    const ly=[];
    for(let k=0;k<4;k++) ly[k]=k?Math.max(centers[k],ly[k-1]+40):centers[k];
    for(let k=0;k<4;k++){
      const cy=centers[k],ty=ly[k];
      ctx.strokeStyle=cols[k];ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(lx,cy);ctx.lineTo(tx-8,ty);ctx.stroke();
      ctx.textAlign="left";
      ctx.fillStyle=F.txt;
      ctx.fillText(pc_names[k]+"  "+pc_w[k]+"%",tx,ty-3);
      ctx.fillStyle=s.showFunds?cols[k]:F.ax;
      ctx.fillText(s.showFunds?("→ "+pc_funds[k]):"target weight",tx,ty+14);
    }
  }
  ctx.textAlign="left";
}

(function(){
// both curves expressed as a fraction 0..1 of the plot height, over time t in 0..1
const pcm_inf=t=>0.34+0.44*Math.exp(-Math.pow((t-0.5)/0.11,2));
const pcm_com=t=>{
  const base=0.40+0.42*Math.exp(-Math.pow((t-0.5)/0.085,2));   // correlated spike
  const noise=0.055*Math.sin(38*t)+0.034*Math.sin(71*t+1.3)+0.02*Math.sin(113*t+0.4);
  let v=base+noise;
  if(v<0.06)v=0.06; if(v>0.94)v=0.94;
  return v;
};
function pcm_line(ctx,sx,sy,f,p,col,w){
  ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();
  let first=true;
  for(let t=0;t<=p+1e-9;t+=0.004){
    const px=sx(t),py=sy(f(t));
    if(first){ctx.moveTo(px,py);first=false;}else ctx.lineTo(px,py);
  }
  ctx.stroke();
}
function pcm_draw(ctx,cv,s){
  clear(ctx,cv);
  ctx.font="14px 'IBM Plex Mono'";

  ctx.textAlign="center";ctx.fillText("level (indexed)",0,0);ctx.restore();
  const p=s.p;
  pcm_line(ctx,sx,sy,pcm_inf,p,F.wrong,2.5);     // inflation
  pcm_line(ctx,sx,sy,pcm_com,p,F.post,2);        // commodities (choppy)
  // legend
  ctx.textAlign="left";ctx.font="13px 'IBM Plex Mono'";

  }

}

/* portfolios / port_alternatives */
(function(){
const pal_N=121;                 // daily "true value" points
const pal_S=20;                  // reported only every ~20 days (quarterly-ish)
const pal_rand=i=>{const x=Math.sin(i*12.9898)*43758.5453;return 2*(x-Math.floor(x))-1;};
// build the jagged TRUE value path (a fund that is actually volatile)
const pal_path=(function(){
  const a=[];let v=1.0;
  for(let i=0;i<pal_N;i++){v*=(1+0.0016+0.03*pal_rand(i));a.push(v);}
  return a;
})();
const pal_min=Math.min.apply(null,pal_path);
const pal_max=Math.max.apply(null,pal_path);
function pal_draw(ctx,cv,s){
  clear(ctx,cv);
  ctx.font="14px 'IBM Plex Mono'";
  const X0=70,X1=820,Y0=330,Y1=70;
  const pad=(pal_max-pal_min)*0.12;
  const lo=pal_min-pad,hi=pal_max+pad;
  const sx=i=>X0+(i/(pal_N-1))*(X1-X0);
  const sy=v=>Y0-((v-lo)/(hi-lo))*(Y0-Y1);
  // grid + axes
  ctx.strokeStyle="#22314a";ctx.lineWidth=1;
  for(let g=1;g<4;g++){const y=Y1+g*(Y0-Y1)/4;ctx.beginPath();ctx.moveTo(X0,y);ctx.lineTo(X1,y);ctx.stroke();}
  ctx.strokeStyle="#3A4C68";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(X0,Y0);ctx.lineTo(X1,Y0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(X0,Y1);ctx.lineTo(X0,Y0);ctx.stroke();
  ctx.fillStyle=F.ax;ctx.textAlign="left";ctx.fillText("time →",X1-64,Y0+22);
  ctx.save();ctx.translate(X0-46,(Y0+Y1)/2);ctx.rotate(-Math.PI/2);
  ctx.textAlign="center";ctx.fillText("value",0,0);ctx.restore();
  // TRUE jagged path (what daily marks would show)
  const tn=Math.max(1,Math.round(s.trueP*(pal_N-1)));
  ctx.strokeStyle="rgba(124,141,165,0.85)";ctx.lineWidth=1.5;ctx.beginPath();
  for(let i=0;i<=tn;i++){const px=sx(i),py=sy(pal_path[i]);if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}
  ctx.stroke();
  // REPORTED smooth path: sparse valuation marks joined by straight lines
  const marks=[];for(let i=0;i<pal_N;i+=pal_S)marks.push(i);
  if(marks[marks.length-1]!==pal_N-1)marks.push(pal_N-1);
  const rp=s.repP;
  ctx.strokeStyle=F.post;ctx.lineWidth=2.6;ctx.beginPath();
  const lastX=X0+rp*(X1-X0);
  let started=false;
  for(let m=0;m<marks.length;m++){
    const i=marks[m];const px=sx(i);
    if(px>lastX+0.5){
      // interpolate the final visible segment up to lastX
      const pi=marks[m-1];const ppx=sx(pi);
      const frac=(lastX-ppx)/(px-ppx);
      const vy=pal_path[pi]+(pal_path[i]-pal_path[pi])*frac;
      ctx.lineTo(lastX,sy(vy));break;
    }
    const py=sy(pal_path[i]);
    if(!started){ctx.moveTo(px,py);started=true;}else ctx.lineTo(px,py);
  }
  ctx.stroke();
  // valuation dots
  if(s.repP>=0.999){
    ctx.fillStyle=F.post;
    for(let m=0;m<marks.length;m++){const i=marks[m];ctx.beginPath();ctx.arc(sx(i),sy(pal_path[i]),3.2,0,7);ctx.fill();}
  }
  // legend + notes
  ctx.font="13px 'IBM Plex Mono'";ctx.textAlign="left";
  ctx.strokeStyle="rgba(124,141,165,0.85)";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(X0+8,Y1-4);ctx.lineTo(X0+30,Y1-4);ctx.stroke();
  ctx.fillStyle=F.ax;ctx.fillText("true value (daily)",X0+36,Y1-1);
  ctx.strokeStyle=F.post;ctx.lineWidth=2.6;
  ctx.beginPath();ctx.moveTo(X0+240,Y1-4);ctx.lineTo(X0+262,Y1-4);ctx.stroke();
  ctx.fillStyle=F.post;ctx.fillText("private, reported (marked rarely)",X0+268,Y1-1);
  if(s.note){
    ctx.fillStyle=F.txt;ctx.textAlign="right";
    ctx.fillText("smooth ≠ safe · high fees · locked up",X1-6,Y0-10);
  }
