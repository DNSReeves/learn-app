(function(){
function ode_eulerPts(){const h=0.25,N=30;let x=1,y=0;const pts=[[x,y]];for(let i=0;i<N;i++){const nx=x-h*y,ny=y+h*x;x=nx;y=ny;pts.push([x,y]);}return pts;}
function ode_drawEuler(ctx,cv,st){
  clear(ctx,cv);
  const cx=430,cy=190,s=72;
  const X=x=>cx+x*s, Y=y=>cy-y*s;
  ctx.strokeStyle="#22314a";ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(X(-2.6),Y(0));ctx.lineTo(X(2.6),Y(0));ctx.stroke();
  ctx.beginPath();ctx.moveTo(X(0),Y(-1.9));ctx.lineTo(X(0),Y(1.9));ctx.stroke();
  ctx.strokeStyle=F.ok;ctx.setLineDash([5,5]);ctx.lineWidth=2;
  ctx.beginPath();for(let a=0;a<=st.circ*2*Math.PI+1e-9;a+=0.04){const px=X(Math.cos(a)),py=Y(Math.sin(a));a===0?ctx.moveTo(px,py):ctx.lineTo(px,py);}ctx.stroke();ctx.setLineDash([]);
  const pts=ode_eulerPts();
  const n=Math.min(st.steps,pts.length-1);
  if(n>0){
    ctx.strokeStyle=F.post;ctx.lineWidth=2;
    ctx.beginPath();for(let i=0;i<=n;i++){const p=pts[i];i===0?ctx.moveTo(X(p[0]),Y(p[1])):ctx.lineTo(X(p[0]),Y(p[1]));}ctx.stroke();
    for(let i=0;i<=n;i++){const p=pts[i];ctx.fillStyle=F.post;ctx.beginPath();ctx.arc(X(p[0]),Y(p[1]),2.5,0,7);ctx.fill();}
    const hd=pts[n];ctx.fillStyle=F.txt;ctx.beginPath();ctx.arc(X(hd[0]),Y(hd[1]),4,0,7);ctx.fill();
  }
  ctx.fillStyle=F.txt;ctx.beginPath();ctx.arc(X(1),Y(0),3.5,0,7);ctx.fill();
  if(st.tan){
    ctx.strokeStyle=F.wrong;ctx.setLineDash([4,4]);ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(X(1),Y(0));ctx.lineTo(X(1),Y(0.85));ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=F.wrong;ctx.font="14px 'IBM Plex Mono'";ctx.fillText("tangent step exits the circle",X(1)+8,Y(0.6));
  }
  ctx.font="14px 'IBM Plex Mono'";
  ctx.fillStyle=F.ok;ctx.fillText("true orbit  x² + y² = 1  (conserved)",60,38);
  ctx.fillStyle=F.post;ctx.fillText("Euler steps  (h = 0.25)",60,60);
}
ANIMS.ode_eulerdrift_static=(cv,ctx)=>ode_drawEuler(ctx,cv,{circ:1,steps:0});
ANIMS.ode_eulerdrift=async(cv,ctx)=>{
  ode_drawEuler(ctx,cv,{circ:0,steps:0});
  await narrate("The system x′ = −y, y′ = x traces a perfect circle: x² + y² is conserved forever. This is the exact answer we're trying to reproduce.");
  await tween(1000,k=>ode_drawEuler(ctx,cv,{circ:k,steps:0}));
  await narrate("Euler takes the slope at the START of each step and follows that tangent. But a tangent to a circle lies outside it.");
  await tween(800,k=>ode_drawEuler(ctx,cv,{circ:1,steps:Math.floor(k*4),tan:true}));
  await narrate("So every single step gains a little radius — about 3% here — in the same direction. The orbit spirals steadily outward, gaining energy the true system conserves.");
  await tween(1800,k=>ode_drawEuler(ctx,cv,{circ:1,steps:Math.floor(4+k*26)}));
  await narrate("Biased errors compound; they never average away — that's the O(h) drift. RK4 interviews four slopes per step to stay on the circle instead of tangent to it.");
};
})();
/* pdes / pde_transport */
(function(){
const pde_tr_L=64, pde_tr_R=840, pde_tr_base=300, pde_tr_c0=0.15, pde_tr_c1=0.82;
function pde_tr_px(xn){return pde_tr_L+(pde_tr_R-pde_tr_L)*xn;}
function pde_tr_h(shape,xn,c){
  if(shape==='square') return (xn>c-0.05 && xn<c+0.05)?165:0;
  const w=0.05, d=(xn-c)/w; return 175*Math.exp(-d*d);
}
function pde_tr_curve(ctx,shape,c,color,dashed){
  const L=pde_tr_L,R=pde_tr_R,base=pde_tr_base;
  ctx.strokeStyle=color; ctx.lineWidth=dashed?1.2:2.6;
  if(dashed)ctx.setLineDash([5,5]); else ctx.setLineDash([]);
  ctx.beginPath();
  for(let px=L;px<=R;px+=2){const xn=(px-L)/(R-L); const y=base-pde_tr_h(shape,xn,c); if(px===L)ctx.moveTo(px,y); else ctx.lineTo(px,y);}
  ctx.stroke(); ctx.setLineDash([]);
}
function pde_tr_draw(ctx,cv,s){
  clear(ctx,cv); ctx.font="14px 'IBM Plex Mono'";
  const L=pde_tr_L,R=pde_tr_R,base=pde_tr_base;
  ctx.strokeStyle="#3A4C68"; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(L,base); ctx.lineTo(R,base); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(L,base); ctx.lineTo(L,60); ctx.stroke();
  ctx.fillStyle="#5A6E8C";
  ctx.fillText("x",R-12,base+20); ctx.fillText("u(x,t)",L+8,72);
  pde_tr_curve(ctx,s.shape,pde_tr_c0,"#5A6E8C",true);
  pde_tr_curve(ctx,s.shape,s.c,F.post,false);
  ctx.strokeStyle=F.ok; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(430,100); ctx.lineTo(505,100); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(505,100); ctx.lineTo(496,95); ctx.lineTo(496,105); ctx.closePath(); ctx.fillStyle=F.ok; ctx.fill();
  ctx.fillStyle=F.ok; ctx.fillText("speed c",430,90);
}
ANIMS.pde_transport_static=(cv,ctx)=>pde_tr_draw(ctx,cv,{shape:'gauss',c:pde_tr_c0});
ANIMS.pde_transport=async(cv,ctx)=>{
  pde_tr_draw(ctx,cv,{shape:'gauss',c:pde_tr_c0});
  await narrate("The transport equation ∂u/∂t + c·∂u/∂x = 0 is solved by u(x,t)=f(x−ct) — for ANY differentiable shape f.");
  await tween(1600,k=>pde_tr_draw(ctx,cv,{shape:'gauss',c:pde_tr_c0+(pde_tr_c1-pde_tr_c0)*k}));
  await narrate("Whatever the profile, it glides rigidly rightward at speed c — no spreading, no smoothing. (Chain rule: ∂u/∂t=−c·f′ and c·∂u/∂x=c·f′ cancel.)");
  await tween(1500,k=>pde_tr_draw(ctx,cv,{shape:'square',c:pde_tr_c0+(pde_tr_c1-pde_tr_c0)*k}));
  await narrate("A Gaussian, a square pulse, your signature — each slides unchanged. An ODE leaves a constant free; a PDE leaves a whole function free.");
};
})();
/* pdes / pde_modedecay */
(function(){
const pde_md_L=70,pde_md_R=760,pde_md_y0=200,pde_md_A=64,pde_md_lam=0.55;
function pde_md_mode(ctx,n,fac,color){
  ctx.strokeStyle=color; ctx.lineWidth= n===1?2.8:2;
  ctx.beginPath();
  for(let px=pde_md_L;px<=pde_md_R;px+=2){const xn=(px-pde_md_L)/(pde_md_R-pde_md_L); const y=pde_md_y0 - pde_md_A*fac*Math.sin(n*Math.PI*xn); if(px===pde_md_L)ctx.moveTo(px,y);else ctx.lineTo(px,y);}
  ctx.stroke();
}
function pde_md_draw(ctx,cv,s){
  clear(ctx,cv); ctx.font="14px 'IBM Plex Mono'";
  const L=pde_md_L,R=pde_md_R,y0=pde_md_y0;
  ctx.strokeStyle="#22314a"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(L,y0); ctx.lineTo(R,y0); ctx.stroke();
  ctx.strokeStyle="#3A4C68"; ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(L,y0-90);ctx.lineTo(L,y0+90);ctx.stroke();
  ctx.beginPath();ctx.moveTo(R,y0-90);ctx.lineTo(R,y0+90);ctx.stroke();
  ctx.fillStyle="#5A6E8C"; ctx.fillText("x=0",L-6,y0+108); ctx.fillText("x=L",R-18,y0+108);
  const k=s.k;
  const f1=Math.exp(-pde_md_lam*1*k), f2=Math.exp(-pde_md_lam*4*k), f3=Math.exp(-pde_md_lam*9*k);
  pde_md_mode(ctx,3,f3,"#5A6E8C");
  pde_md_mode(ctx,2,f2,F.ax);
  pde_md_mode(ctx,1,f1,F.post);
  ctx.font="13px 'IBM Plex Mono'";
  ctx.fillStyle=F.post; ctx.fillText("n=1  rate ∝ 1   ×"+f1.toFixed(2),610,58);
  ctx.fillStyle=F.ax;   ctx.fillText("n=2  rate ∝ 4   ×"+f2.toFixed(2),610,80);
  ctx.fillStyle="#5A6E8C"; ctx.fillText("n=3  rate ∝ 9   ×"+f3.toFixed(2),610,102);
}
ANIMS.pde_modedecay_static=(cv,ctx)=>pde_md_draw(ctx,cv,{k:0});
ANIMS.pde_modedecay=async(cv,ctx)=>{
  pde_md_draw(ctx,cv,{k:0});
  await narrate("Separation of variables writes the hot rod as a sum of sine modes sin(nπx/L), each with its own clock Tₙ(t)=e^(−α(nπ/L)²t).");
  await tween(2200,k=>pde_md_draw(ctx,cv,{k}));
  await narrate("The decay rate carries n² — mode 3 fades 9× faster than the fundamental, mode 10 a hundred times faster.");
  await narrate("Fine detail dies young; only the smooth n=1 mode lingers. That n² law is exactly why heat forgets its initial shape.");
};
})();
/* pdes / pde_forget */
(function(){
const pde_fg_L=90,pde_fg_R=840,pde_fg_y0=195,pde_fg_amp=95,pde_fg_T=6,pde_fg_lam=0.5,pde_fg_w=2.2;
function pde_fg_px(t){return pde_fg_L+(pde_fg_R-pde_fg_L)*(t/pde_fg_T);}
function pde_fg_draw(ctx,cv,s){
  clear(ctx,cv); ctx.font="14px 'IBM Plex Mono'";
  const y0=pde_fg_y0;
  ctx.strokeStyle="#22314a"; ctx.lineWidth=1;
  [1,0,-1].forEach(v=>{const y=y0-pde_fg_amp*v; ctx.beginPath();ctx.moveTo(pde_fg_L,y);ctx.lineTo(pde_fg_R,y);ctx.stroke();});
  ctx.strokeStyle="#3A4C68"; ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(pde_fg_L,y0-pde_fg_amp-12);ctx.lineTo(pde_fg_L,y0+pde_fg_amp+12);ctx.stroke();
  ctx.fillStyle="#5A6E8C"; ctx.fillText("+1",pde_fg_L-30,y0-pde_fg_amp+5); ctx.fillText("0",pde_fg_L-18,y0+5); ctx.fillText("−1",pde_fg_L-30,y0+pde_fg_amp+5);
  ctx.fillText("time t →",pde_fg_R-70,y0+pde_fg_amp+30);
  const tmax=pde_fg_T*s.k;
  ctx.strokeStyle=F.ok; ctx.lineWidth=2.4; ctx.beginPath(); let st=true;
  for(let t=0;t<=tmax+1e-9;t+=0.03){const y=y0-pde_fg_amp*Math.cos(pde_fg_w*t); const x=pde_fg_px(t); if(st){ctx.moveTo(x,y);st=false;}else ctx.lineTo(x,y);}
  ctx.stroke();
  ctx.strokeStyle=F.post; ctx.lineWidth=2.4; ctx.beginPath(); st=true;
  for(let t=0;t<=tmax+1e-9;t+=0.03){const y=y0-pde_fg_amp*Math.exp(-pde_fg_lam*t); const x=pde_fg_px(t); if(st){ctx.moveTo(x,y);st=false;}else ctx.lineTo(x,y);}
  ctx.stroke();
  if(tmax>0){
    const xe=pde_fg_px(tmax);
    const yh=y0-pde_fg_amp*Math.exp(-pde_fg_lam*tmax);
    const yw=y0-pde_fg_amp*Math.cos(pde_fg_w*tmax);
    ctx.fillStyle=F.post;ctx.beginPath();ctx.arc(xe,yh,4,0,7);ctx.fill();
    ctx.fillStyle=F.ok;ctx.beginPath();ctx.arc(xe,yw,4,0,7);ctx.fill();
  }
  ctx.font="13px 'IBM Plex Mono'";
  ctx.fillStyle=F.post; ctx.fillText("heat:  e^(−λt)  → 0   (forgets)",pde_fg_L+10,y0-pde_fg_amp-18);
  ctx.fillStyle=F.ok;   ctx.fillText("wave:  cos(ωt)  |·|=1  (remembers)",pde_fg_L+380,y0-pde_fg_amp-18);
}
ANIMS.pde_forget_static=(cv,ctx)=>pde_fg_draw(ctx,cv,{k:0});
ANIMS.pde_forget=async(cv,ctx)=>{
  pde_fg_draw(ctx,cv,{k:0});
  await narrate("Take one Fourier mode and watch its amplitude evolve. Heat multiplies it by e^(−λt); the wave multiplies it by cos(ωt).");
  await tween(2400,k=>pde_fg_draw(ctx,cv,{k}));
  await narrate("Heat's amplitude bleeds to zero — irreversibly. Running it backward means multiplying by e^(+λt), blowing up noise: ill-posed.");
  await narrate("The wave's multiplier stays magnitude 1 — energy conserved, and t→−t is still a solution. Heat forgets; the wave remembers.");
};
})();
/* pdes / pde_stability */
(function(){
const pde_st_N=41, pde_st_MAX=16, pde_st_base=285, pde_st_scale=78;
function pde_st_init(){const u=new Array(pde_st_N).fill(0); u[(pde_st_N-1)/2]=1; return u;}
function pde_st_march(r,steps){let u=pde_st_init(); for(let s=0;s<steps;s++){const v=u.slice(); for(let i=1;i<pde_st_N-1;i++){v[i]=u[i]+r*(u[i+1]-2*u[i]+u[i-1]);} v[0]=0;v[pde_st_N-1]=0; u=v;} return u;}
function pde_st_panel(ctx,x0,x1,u,color,title,rlabel){
  const base=pde_st_base;
  ctx.save();
  ctx.beginPath(); ctx.rect(x0-8,52,x1-x0+16,250); ctx.clip();
  ctx.strokeStyle="#22314a"; ctx.lineWidth=1; ctx.beginPath();ctx.moveTo(x0,base);ctx.lineTo(x1,base);ctx.stroke();
  ctx.strokeStyle=color; ctx.lineWidth=2.2; ctx.beginPath();
  for(let i=0;i<pde_st_N;i++){const x=x0+(x1-x0)*i/(pde_st_N-1); const y=base-u[i]*pde_st_scale; if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}
  ctx.stroke();
  ctx.fillStyle=color;
  for(let i=0;i<pde_st_N;i++){const x=x0+(x1-x0)*i/(pde_st_N-1); const y=base-u[i]*pde_st_scale; ctx.beginPath();ctx.arc(x,y,1.8,0,7);ctx.fill();}
  ctx.restore();
  ctx.font="14px 'IBM Plex Mono'"; ctx.fillStyle=color; ctx.fillText(title,x0,42);
  ctx.fillStyle="#5A6E8C"; ctx.font="13px 'IBM Plex Mono'"; ctx.fillText(rlabel,x0,315);
}
function pde_st_draw(ctx,cv,s){
  clear(ctx,cv); ctx.font="14px 'IBM Plex Mono'";
  const steps=Math.round(s.k*pde_st_MAX);
  pde_st_panel(ctx,70,430,pde_st_march(0.40,steps),F.ok,"r = 0.40  ≤ ½   stable","relaxes to a smooth bump");
  pde_st_panel(ctx,500,860,pde_st_march(0.70,steps),F.wrong,"r = 0.70  > ½   UNSTABLE","erupts into growing sawtooth");
  ctx.fillStyle="#5A6E8C"; ctx.font="12px 'IBM Plex Mono'";
  ctx.fillText("step "+steps+" / "+pde_st_MAX,420,338);
}
ANIMS.pde_stability_static=(cv,ctx)=>pde_st_draw(ctx,cv,{k:0});
ANIMS.pde_stability=async(cv,ctx)=>{
  pde_st_draw(ctx,cv,{k:0});
  await narrate("The explicit heat scheme marches a grid: uᵢ,ⱼ₊₁ = uᵢ,ⱼ + r(uᵢ₊₁ − 2uᵢ + uᵢ₋₁), with r = αΔt/Δx². Both panels start from the same spike.");
  await tween(2400,k=>pde_st_draw(ctx,cv,{k}));
  await narrate("Left (r=0.40 ≤ ½): every point relaxes toward its neighbor average — the spike smooths. Right (r=0.70 > ½): each update overshoots, harder each tick.");
  await narrate("Above r=½ the grid erupts into growing sawtooth — not inaccuracy, exponential garbage. Halve Δx and you must quarter Δt.");
};
})();
/* newtonian-physics / phys_orbit */
(function(){
// c06-circular : Newton's cannonball — an orbit is falling and missing
const phys_orb_cx=450, phys_orb_cy=190, phys_orb_Re=120, phys_orb_r0=168, phys_orb_g=0.05;
function phys_orbTraj(v0,maxSteps){
  const g=phys_orb_g, Re=phys_orb_Re, cx=phys_orb_cx, cy=phys_orb_cy;
  let x=cx, y=cy-phys_orb_r0, vx=v0, vy=0, pts=[[x,y]], hit=false;
  for(let i=0;i<maxSteps;i++){
    const dx=x-cx, dy=y-cy, r=Math.hypot(dx,dy);
    if(i>3 && r<Re-1){ hit=true; break; }
    const a=g*Re*Re/(r*r);
    vx+=-a*dx/r; vy+=-a*dy/r; x+=vx; y+=vy;
    pts.push([x,y]);
  }
  return {pts,hit};
}
function phys_orbScene(ctx,cv,st){
  clear(ctx,cv);
  const cx=phys_orb_cx, cy=phys_orb_cy, Re=phys_orb_Re, r0=phys_orb_r0;
  const vc=Math.sqrt(phys_orb_g*Re*Re/r0);
  const specs=[{v:vc*0.60,c:'#5A6E8C',max:320},{v:vc*0.82,c:F.prior,max:520},{v:vc*1.0,c:F.post,max:540}];
  // Earth
  const grd=ctx.createRadialGradient(cx-40,cy-50,15,cx,cy,Re+40);
  grd.addColorStop(0,'#2b4a63'); grd.addColorStop(1,'#12202f');
  ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(cx,cy,Re,0,2*Math.PI); ctx.fill();
  ctx.strokeStyle='#3A4C68'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.fillStyle=F.txt; ctx.font="13px 'IBM Plex Mono'"; ctx.textAlign='center';
  ctx.fillText('Earth', cx, cy+4);
  const rev=st.reveal||[0,0,0];
  for(let s=0;s<specs.length;s++){
    const f=rev[s]; if(f<=0) continue;
    const {pts,hit}=phys_orbTraj(specs[s].v, specs[s].max);
    const n=Math.max(2, Math.floor(pts.length*f));
    ctx.strokeStyle=specs[s].c; ctx.lineWidth=s===2?2.4:1.6;
    ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
    for(let i=1;i<n;i++) ctx.lineTo(pts[i][0],pts[i][1]);
    ctx.stroke();
    const tip=pts[Math.min(n-1,pts.length-1)];
    ctx.fillStyle=specs[s].c; ctx.beginPath(); ctx.arc(tip[0],tip[1],s===2?4.5:3.5,0,2*Math.PI); ctx.fill();
    if(hit && f>=1){ ctx.strokeStyle=specs[s].c; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(tip[0]-5,tip[1]-5); ctx.lineTo(tip[0]+5,tip[1]+5);
      ctx.moveTo(tip[0]+5,tip[1]-5); ctx.lineTo(tip[0]-5,tip[1]+5); ctx.stroke(); }
  }
  // cannon marker at launch
  const px=cx, py=cy-r0;
  ctx.fillStyle=F.txt; ctx.beginPath(); ctx.arc(px,py,4,0,2*Math.PI); ctx.fill();
  ctx.font="12px 'IBM Plex Mono'"; ctx.textAlign='left'; ctx.fillStyle='#5A6E8C';
  ctx.fillText('cannon', px+8, py-6);
  ctx.font="13px 'IBM Plex Mono'";
  if((rev[0]||0)>=1){ ctx.fillStyle='#5A6E8C'; ctx.fillText('slow → falls back to ground', 30, 40); }
  if((rev[1]||0)>=1){ ctx.fillStyle=F.prior; ctx.fillText('faster → lands farther away', 30, 60); }
  if((rev[2]||0)>=1){ ctx.fillStyle=F.post; ctx.fillText('~7.9 km/s → never lands: ORBIT', 30, 80); }
  if(st.insight){ ctx.fillStyle=F.txt; ctx.font="14px 'IBM Plex Mono'";
    ctx.fillText('g at ISS still ~90% — you float because you FALL together', 30, 108); }
}

/* newtonian-physics / phys_impulse */
(function(){
// c05-momentum : impulse = area under F-t. Same delta-p, airbag shrinks the peak
const phys_imp_L=95, phys_imp_R=850, phys_imp_B=330, phys_imp_T=60;
function phys_impX(t){ return phys_imp_L + t*(phys_imp_R-phys_imp_L); }
function phys_impY(Fv,Fmax){ return phys_imp_B - (Fv/Fmax)*(phys_imp_B-phys_imp_T); }
function phys_impPulse(t,t0,T,Fp){ if(t<t0||t>t0+T) return 0; return Fp*Math.sin(Math.PI*(t-t0)/T); }
function phys_impScene(ctx,cv,st){
  clear(ctx,cv);
  const AREA=0.13, t0=0.08, Tn=0.14, Tw=0.70;
  const Fn=AREA*Math.PI/(2*Tn), Fw=AREA*Math.PI/(2*Tw), Fmax=Fn*1.12;
  ctx.strokeStyle='#3A4C68'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(phys_imp_L,phys_imp_T-8); ctx.lineTo(phys_imp_L,phys_imp_B); ctx.lineTo(phys_imp_R,phys_imp_B); ctx.stroke();
  ctx.fillStyle=F.txt; ctx.font="13px 'IBM Plex Mono'"; ctx.textAlign='left';
  ctx.fillText('force', phys_imp_L-30, phys_imp_T-14);
  ctx.textAlign='right'; ctx.fillText('time →', phys_imp_R, phys_imp_B+22);
  function drawPulse(T,Fp,col,fill,rev){
    const steps=90;
    ctx.beginPath(); ctx.moveTo(phys_impX(t0), phys_imp_B);
    for(let i=0;i<=steps;i++){ const t=t0+(T*rev)*(i/steps); ctx.lineTo(phys_impX(t), phys_impY(phys_impPulse(t,t0,T,Fp),Fmax)); }
    ctx.lineTo(phys_impX(t0+T*rev), phys_imp_B); ctx.closePath();
    ctx.fillStyle=fill; ctx.fill();
    ctx.strokeStyle=col; ctx.lineWidth=2; ctx.beginPath();
    for(let i=0;i<=steps;i++){ const t=t0+(T*rev)*(i/steps); const y=phys_impY(phys_impPulse(t,t0,T,Fp),Fmax); if(i===0) ctx.moveTo(phys_impX(t),y); else ctx.lineTo(phys_impX(t),y); }
    ctx.stroke();
  }
  const nRev=st.nRev||0, wRev=st.wRev||0;
  if(nRev>0) drawPulse(Tn,Fn,F.wrong,'rgba(212,106,98,0.22)',nRev);
  if(wRev>0) drawPulse(Tw,Fw,F.ok,'rgba(95,191,149,0.20)',wRev);
  if(st.peakN){ const xp=phys_impX(t0+Tn/2), yp=phys_impY(Fn,Fmax);
    ctx.strokeStyle=F.wrong; ctx.setLineDash([4,4]); ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(xp,yp); ctx.lineTo(xp,phys_imp_B); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=F.wrong; ctx.textAlign='left'; ctx.font="13px 'IBM Plex Mono'"; ctx.fillText('towering peak force', xp+8, yp+6); }
  if(st.peakW){ const xp=phys_impX(t0+Tw/2), yp=phys_impY(Fw,Fmax);
    ctx.strokeStyle=F.ok; ctx.setLineDash([4,4]); ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(xp,yp); ctx.lineTo(xp,phys_imp_B); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=F.ok; ctx.textAlign='center'; ctx.font="13px 'IBM Plex Mono'"; ctx.fillText('~1/5 the peak', xp, yp-8); }
  if(st.eq){ ctx.fillStyle=F.txt; ctx.font="14px 'IBM Plex Mono'"; ctx.textAlign='center';
    ctx.fillText('same shaded area  →  same Δp  =  ∫F dt', (phys_imp_L+phys_imp_R)/2, phys_imp_T-20); }
  ctx.textAlign='left'; ctx.font="12px 'IBM Plex Mono'";
  if(nRev>=1){ ctx.fillStyle=F.wrong; ctx.fillText('no cushion: tiny Δt', phys_impX(t0+Tn)+8, phys_imp_B-16); }
  if(wRev>=1){ ctx.fillStyle=F.ok; ctx.fillText('airbag: ~5× the Δt', phys_impX(t0+Tw)-6, phys_imp_B-16); }
}
ANIMS.phys_impulse_static=(cv,ctx)=>phys_impScene(ctx,cv,{nRev:1,wRev:1,eq:true});
ANIMS.phys_impulse=async(cv,ctx)=>{
  phys_impScene(ctx,cv,{});
  await narrate("A crash must remove all your momentum, so Δp is fixed. The impulse that does it is the area under the force-vs-time curve: ∫F dt = Δp.");
  await tween(1400,k=>phys_impScene(ctx,cv,{nRev:k}));
  await narrate("Hit something rigid and you stop in a few milliseconds. A tiny Δt forced across the same fixed area means a towering peak force — that peak is what injures you.");
  await tween(700,k=>phys_impScene(ctx,cv,{nRev:1,peakN:true}));
  await narrate("The airbag stretches the stopping time about fivefold, spreading the identical area over a much wider Δt.");
  await tween(1700,k=>phys_impScene(ctx,cv,{nRev:1,peakN:true,wRev:k}));
  await narrate("Same Δp, roughly one-fifth the peak force. Crumple zones, helmets, bending your knees on landing — all the very same theorem.");
  phys_impScene(ctx,cv,{nRev:1,wRev:1,peakN:true,peakW:true,eq:true});
};
})();

(function(){
// c04-energy : same height h -> same sqrt(2gh), whatever the path
const phys_bd_yTop=80, phys_bd_yBot=300, phys_bd_vmax=9.9;
function phys_bdPt(kind,s){
  const y=phys_bd_yTop+(phys_bd_yBot-phys_bd_yTop)*s;
  if(kind==='steep'){ return [200+110*s, y]; }
  return [470+250*s+70*Math.sin(s*Math.PI*2), y];
}
function phys_bdTrack(ctx,kind,col){
  ctx.strokeStyle=col; ctx.lineWidth=2.4; ctx.beginPath();
  for(let i=0;i<=60;i++){ const p=phys_bdPt(kind,i/60); if(i===0) ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]); }
  ctx.stroke();
}
function phys_bdScene(ctx,cv,st){
  clear(ctx,cv);
  // height reference lines
  ctx.strokeStyle='#22314a'; ctx.setLineDash([5,5]); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(120,phys_bd_yTop); ctx.lineTo(800,phys_bd_yTop); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(120,phys_bd_yBot); ctx.lineTo(800,phys_bd_yBot); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#5A6E8C'; ctx.font="12px 'IBM Plex Mono'"; ctx.textAlign='left';
  ctx.fillText('start height h  (v = 0)', 124, phys_bd_yTop-8);
  ctx.fillText('bottom', 124, phys_bd_yBot+18);
  // height bracket
  ctx.strokeStyle='#3A4C68'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(140,phys_bd_yTop); ctx.lineTo(140,phys_bd_yBot); ctx.stroke();
  ctx.fillStyle=F.txt; ctx.save(); ctx.translate(128,(phys_bd_yTop+phys_bd_yBot)/2); ctx.rotate(-Math.PI/2); ctx.textAlign='center'; ctx.fillText('h = 5 m', 0, 0); ctx.restore();
  phys_bdTrack(ctx,'steep',F.prior);
  phys_bdTrack(ctx,'wind',F.post);
  ctx.textAlign='center'; ctx.font="12px 'IBM Plex Mono'";
  ctx.fillStyle=F.prior; ctx.fillText('steep', 255, phys_bd_yBot+34);
  ctx.fillStyle=F.post; ctx.fillText('long & winding', 600, phys_bd_yBot+34);
  const sS=st.sS||0, sW=st.sW||0;
  function bead(kind,s,col){
    const p=phys_bdPt(kind,s);
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(p[0],p[1],7,0,2*Math.PI); ctx.fill();
    const v=phys_bd_vmax*Math.sqrt(s);
    ctx.fillStyle=F.txt; ctx.font="13px 'IBM Plex Mono'"; ctx.textAlign='left';
    ctx.fillText(v.toFixed(1)+' m/s', p[0]+12, p[1]+4);
  }
  bead('steep',sS,F.prior);
  bead('wind',sW,F.post);
  if(st.arrived){ ctx.fillStyle=F.ok; ctx.font="15px 'IBM Plex Mono'"; ctx.textAlign='center';
    ctx.fillText('both arrive at √(2gh) = 9.9 m/s', 460, 40); }
  if(st.insight){ ctx.fillStyle=F.txt; ctx.font="13px 'IBM Plex Mono'"; ctx.textAlign='center';
    ctx.fillText('shape sets the TIME; only the height sets the SPEED', 460, 62); }
}
ANIMS.phys_slides_static=(cv,ctx)=>phys_bdScene(ctx,cv,{sS:0,sW:0});
ANIMS.phys_slides=async(cv,ctx)=>{
  phys_bdScene(ctx,cv,{sS:0,sW:0});
  await narrate("Two frictionless slides drop through the same height h — one steep and short, one long and winding. A bead starts from rest on each.");
  await tween(700,k=>phys_bdScene(ctx,cv,{sS:0,sW:0}));
  await narrate("Release them. Different paths, different arrival times — the steep one gets to the bottom first.");
  await tween(2400,k=>{ const sS=Math.min(1,k/0.6), sW=k; phys_bdScene(ctx,cv,{sS,sW}); });
  await narrate("But energy carries no clock. mgh = ½mv² on any frictionless path, so both arrive at exactly √(2gh) = 9.9 m/s — the shape drops out entirely.");
  phys_bdScene(ctx,cv,{sS:1,sW:1,arrived:true});
  await narrate("Forces tell you why and when; energy tells you how fast and how far. Here, only the height h decides the speed.");
  phys_bdScene(ctx,cv,{sS:1,sW:1,arrived:true,insight:true});
};
})();

(function(){
// c01-frames : one drop, two frames -- straight line vs parabola, same a=g
const phys_tr_D=150, phys_tr_hY=120, phys_tr_fY=300;
function phys_trPanel(ctx,ox,frame,st){
  // ground reference grid (shows absolute space)
  ctx.strokeStyle='#22314a'; ctx.lineWidth=1;
  for(let gx=ox+20; gx<=ox+380; gx+=40){ ctx.beginPath(); ctx.moveTo(gx,90); ctx.lineTo(gx,phys_tr_fY+18); ctx.stroke(); }
  ctx.strokeStyle='#3A4C68'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(ox+10,phys_tr_fY+18); ctx.lineTo(ox+390,phys_tr_fY+18); ctx.stroke();
  const k=st.k||0;
  const off = frame==='ground' ? phys_tr_D*k : 0;
  const hx = (frame==='ground' ? ox+55 : ox+185) + off;
  const by = phys_tr_hY + (phys_tr_fY-phys_tr_hY)*k*k;
  // person: hand at top, feet at bottom, body between
  ctx.strokeStyle='#5A6E8C'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(hx,phys_tr_hY); ctx.lineTo(hx,phys_tr_fY); ctx.stroke();
  ctx.fillStyle='#5A6E8C';
  ctx.beginPath(); ctx.arc(hx,phys_tr_hY,4,0,2*Math.PI); ctx.fill();     // hand
  ctx.fillRect(hx-14,phys_tr_fY-2,28,4);                                 // feet
  // ball trace
  if(k>0){ ctx.strokeStyle=frame==='ground'?F.post:F.prior; ctx.lineWidth=2; ctx.beginPath();
    for(let i=0;i<=40;i++){ const s=k*i/40; const ox2=(frame==='ground'?ox+55:ox+185)+(frame==='ground'?phys_tr_D*s:0); const y=phys_tr_hY+(phys_tr_fY-phys_tr_hY)*s*s; if(i===0) ctx.moveTo(ox2,y); else ctx.lineTo(ox2,y); }
    ctx.stroke(); }
  // ball
  ctx.fillStyle=F.txt; ctx.beginPath(); ctx.arc(hx,by,6,0,2*Math.PI); ctx.fill();
  // titles
  ctx.textAlign='center'; ctx.font="14px 'IBM Plex Mono'";
  ctx.fillStyle=frame==='ground'?F.post:F.prior;
  ctx.fillText(frame==='ground'?'Ground frame':'Train frame', ox+200, 50);
  if(st.labels){ ctx.fillStyle=F.txt; ctx.font="12px 'IBM Plex Mono'";
    ctx.fillText(frame==='ground'?'→ parabola':'straight down', ox+200, 70); }
}
function phys_trScene(ctx,cv,st){
  clear(ctx,cv);
  ctx.strokeStyle='#3A4C68'; ctx.lineWidth=1; ctx.setLineDash([3,4]);
  ctx.beginPath(); ctx.moveTo(450,40); ctx.lineTo(450,350); ctx.stroke(); ctx.setLineDash([]);
  phys_trPanel(ctx,40,'ground',st);
  phys_trPanel(ctx,470,'train',st);
  if(st.insight){ ctx.fillStyle=F.ok; ctx.font="14px 'IBM Plex Mono'"; ctx.textAlign='center';
    ctx.fillText('trajectories differ — but both frames measure a = g,  F = mg', 450, 372); }
}
ANIMS.phys_frames_static=(cv,ctx)=>phys_trScene(ctx,cv,{k:0});
ANIMS.phys_frames=async(cv,ctx)=>{
  phys_trScene(ctx,cv,{k:0});

  await tween(600,k=>phys_trScene(ctx,cv,{k:0}));

  await tween(1800,k=>phys_trScene(ctx,cv,{k}));

/* fourier-series / fs_ortho */
(function(){
// ---- Fourier: orthogonality extraction (fs_or_) ----
const fs_or_x0=70, fs_or_x1=830, fs_or_W=760, fs_or_yc=200, fs_or_vs=78;
const fs_or_ox=(x)=>fs_or_x0+(x+Math.PI)/(2*Math.PI)*fs_or_W;
const fs_or_run=(pfn,X)=>{let s=0,a=-Math.PI,N=500,h=(X-a)/N;if(h<=0)return 0;for(let i=0;i<N;i++){const x=a+(i+0.5)*h;s+=pfn(x)*h;}return s;};
function fs_or_draw(ctx,cv,st){
  clear(ctx,cv);
  const pair=st.pair||'match';
  const k=st.k==null?1:st.k;
  const pfn=pair==='match'?(x)=>Math.cos(3*x)*Math.cos(3*x):(x)=>Math.cos(3*x)*Math.cos(5*x);
  const xcut=-Math.PI+k*2*Math.PI;
  const yc=fs_or_yc, vs=fs_or_vs;
  const cutpx=fs_or_ox(xcut);
  // shaded running area (signed)
  for(let px=fs_or_x0;px<=cutpx;px++){
    const x=(px-fs_or_x0)/fs_or_W*2*Math.PI-Math.PI;
    const v=pfn(x);
    ctx.strokeStyle=v>=0?'rgba(95,191,149,0.40)':'rgba(212,106,98,0.40)';
    ctx.beginPath();ctx.moveTo(px,yc);ctx.lineTo(px,yc-v*vs);ctx.stroke();
  }
  // faint factor curves
  ctx.lineWidth=1;
  const facs=pair==='match'?[3]:[3,5];
  facs.forEach((a)=>{
    ctx.strokeStyle='rgba(90,110,140,0.55)';ctx.beginPath();
    for(let px=fs_or_x0;px<=fs_or_x1;px++){const x=(px-fs_or_x0)/fs_or_W*2*Math.PI-Math.PI;const y=yc-Math.cos(a*x)*vs;px===fs_or_x0?ctx.moveTo(px,y):ctx.lineTo(px,y);}
    ctx.stroke();
  });
  // axis + ticks
  ctx.strokeStyle='#3A4C68';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(fs_or_x0,yc);ctx.lineTo(fs_or_x1,yc);ctx.stroke();
  ctx.fillStyle='#5A6E8C';ctx.font="13px 'IBM Plex Mono'";ctx.textAlign='center';
  [[-Math.PI,'−π'],[0,'0'],[Math.PI,'π']].forEach(([xv,lab])=>{const px=fs_or_ox(xv);ctx.strokeStyle='#3A4C68';ctx.beginPath();ctx.moveTo(px,yc-4);ctx.lineTo(px,yc+4);ctx.stroke();ctx.fillText(lab,px,yc+22);});
  // product curve bold
  ctx.strokeStyle=F.post;ctx.lineWidth=2.2;ctx.beginPath();
  for(let px=fs_or_x0;px<=fs_or_x1;px++){const x=(px-fs_or_x0)/fs_or_W*2*Math.PI-Math.PI;const y=yc-pfn(x)*vs;px===fs_or_x0?ctx.moveTo(px,y):ctx.lineTo(px,y);}
  ctx.stroke();
  // sweep line
  ctx.strokeStyle='rgba(215,223,234,0.7)';ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(cutpx,44);ctx.lineTo(cutpx,yc+34);ctx.stroke();ctx.setLineDash([]);
  // labels
  ctx.textAlign='left';ctx.font="14px 'IBM Plex Mono'";ctx.fillStyle=F.post;
  ctx.fillText('product:  '+(pair==='match'?'cos(3x) · cos(3x) = cos²(3x)':'cos(3x) · cos(5x)'),fs_or_x0,28);
  const val=fs_or_run(pfn,xcut);
  const tgt=pair==='match'?'→ π ≈ 3.14':'→ 0';
  ctx.fillStyle=F.txt;ctx.textAlign='right';
  ctx.fillText('∫ running = '+val.toFixed(2)+'   '+tgt,fs_or_x1,28);
  ctx.textAlign='left';ctx.font="12px 'IBM Plex Mono'";
  ctx.fillStyle='rgba(95,191,149,0.9)';ctx.fillText('■ area +',fs_or_x0,360);
  ctx.fillStyle='rgba(212,106,98,0.9)';ctx.fillText('■ area −',fs_or_x0+72,360);
}
ANIMS.fs_ortho_static=(cv,ctx)=>fs_or_draw(ctx,cv,{pair:'match',k:0});
ANIMS.fs_ortho=async(cv,ctx)=>{
  fs_or_draw(ctx,cv,{pair:'match',k:0});
  await narrate("The extraction move: multiply the whole series by ONE basis function, then integrate over a period.");
  await narrate("Match — cos(3x) times itself. cos²(3x) rides above the axis; it rectifies, and the running integral climbs to +π.");
  await tween(1500,k=>fs_or_draw(ctx,cv,{pair:'match',k}));
  await narrate("Mismatch — cos(3x) times cos(5x). Equal green and red area beat against each other; the integral returns to exactly 0.");
  await tween(1500,k=>fs_or_draw(ctx,cv,{pair:'mismatch',k}));
  await narrate("Every term dies except the one that matches. One integral extracts one coefficient — an infinite system solved one at a time.");
};
})();
/* fourier-series / fs_gibbs */
(function(){
// ---- Fourier: Gibbs phenomenon (fs_gb_) ----
const fs_gb_x0=70, fs_gb_x1=830, fs_gb_W=760, fs_gb_yc=190, fs_gb_vs=104;
const fs_gb_lerp=(a,b,t)=>a+(b-a)*t;
const fs_gb_sum=(x,N)=>{let s=0;for(let k=1;k<=N;k+=2)s+=Math.sin(k*x)/k;return s*4/Math.PI;};
const fs_gb_ox=(x)=>fs_gb_x0+(x+Math.PI)/(2*Math.PI)*fs_gb_W;
function fs_gb_draw(ctx,cv,st){
  clear(ctx,cv);
  const N1=st.N1||5,N2=st.N2||5,bl=st.blend==null?0:st.blend,rev=st.reveal==null?1:st.reveal;
  const yc=fs_gb_yc,vs=fs_gb_vs;
  // guide lines: +-1 and +-1.1789
  ctx.setLineDash([5,4]);ctx.lineWidth=1;
  ctx.strokeStyle='rgba(90,110,140,0.55)';
  [1,-1].forEach(v=>{ctx.beginPath();ctx.moveTo(fs_gb_x0,yc-v*vs);ctx.lineTo(fs_gb_x1,yc-v*vs);ctx.stroke();});
  ctx.strokeStyle='rgba(232,161,60,0.7)';
  [1.1789,-1.1789].forEach(v=>{ctx.beginPath();ctx.moveTo(fs_gb_x0,yc-v*vs);ctx.lineTo(fs_gb_x1,yc-v*vs);ctx.stroke();});
  ctx.setLineDash([]);
  // axis
  ctx.strokeStyle='#3A4C68';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(fs_gb_x0,yc);ctx.lineTo(fs_gb_x1,yc);ctx.stroke();
  // square wave reference
  ctx.strokeStyle='rgba(124,141,165,0.85)';ctx.lineWidth=1.5;ctx.setLineDash([2,3]);ctx.beginPath();
  ctx.moveTo(fs_gb_ox(-Math.PI),yc+vs);ctx.lineTo(fs_gb_ox(0),yc+vs);
  ctx.moveTo(fs_gb_ox(0),yc-vs);ctx.lineTo(fs_gb_ox(Math.PI),yc-vs);
  ctx.stroke();ctx.setLineDash([]);
  // partial sum (blended N)
  const Nshow=Math.round(fs_gb_lerp(N1,N2,bl));
  ctx.strokeStyle=F.post;ctx.lineWidth=2.2;ctx.beginPath();
  const xend=-Math.PI+rev*2*Math.PI;let first=true;
  for(let px=fs_gb_x0;px<=fs_gb_ox(xend);px++){
    const x=(px-fs_gb_x0)/fs_gb_W*2*Math.PI-Math.PI;
    const v=fs_gb_lerp(fs_gb_sum(x,N1),fs_gb_sum(x,N2),bl);
    const y=yc-v*vs;
    first?(ctx.moveTo(px,y),first=false):ctx.lineTo(px,y);
  }
  ctx.stroke();
  // labels
  ctx.fillStyle=F.txt;ctx.font="14px 'IBM Plex Mono'";ctx.textAlign='left';
  ctx.fillText('square wave = (4/π)[ sin x + sin3x/3 + sin5x/5 + … ]',fs_gb_x0,30);
  ctx.textAlign='right';ctx.fillStyle=F.post;ctx.fillText('N = '+Nshow+' terms',fs_gb_x1,30);
  ctx.textAlign='left';ctx.fillStyle='rgba(232,161,60,0.95)';ctx.font="12px 'IBM Plex Mono'";
  ctx.fillText('≈1.18  (9% overshoot — never shrinks)',fs_gb_ox(0.12),yc-1.1789*vs-8);
}
ANIMS.fs_gibbs_static=(cv,ctx)=>fs_gb_draw(ctx,cv,{N1:5,N2:5,blend:0});
ANIMS.fs_gibbs=async(cv,ctx)=>{
  fs_gb_draw(ctx,cv,{N1:5,N2:5,blend:0,reveal:0});
  await narrate("Truncate the square-wave series at N terms. Near each jump the partial sum overshoots the true ±1 level.");
  await tween(1100,k=>fs_gb_draw(ctx,cv,{N1:5,N2:5,blend:0,reveal:k}));
  await narrate("Add more terms — 5 → 41. The overshoot spike NARROWS, but its height clings to ≈1.18: about 9% past the jump.");
  await tween(1600,k=>fs_gb_draw(ctx,cv,{N1:5,N2:41,blend:k,reveal:1}));
  await narrate("41 → 201: razor-thin, exact same height. Converges pointwise everywhere, never uniformly — this is the ringing at every sharp edge.");

/* fourier-series / fs_phasor */
(function(){
// ---- Fourier: counter-rotating phasors (fs_ph_) ----
const fs_ph_cx=205, fs_ph_cy=195, fs_ph_R=60;
const fs_ph_wx0=360, fs_ph_wW=500;
const fs_ph_wx=(phi)=>fs_ph_wx0+phi/(2*Math.PI)*fs_ph_wW;
function fs_ph_draw(ctx,cv,st){
  clear(ctx,cv);
  const mode=st.mode||'one';
  const th=(st.k==null?0:st.k)*2*Math.PI;
  const cx=fs_ph_cx,cy=fs_ph_cy,R=fs_ph_R;
  // unit circle + complex axes
  ctx.strokeStyle='#22314a';ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,R,0,2*Math.PI);ctx.stroke();
  ctx.strokeStyle='#3A4C68';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(cx-R-25,cy);ctx.lineTo(cx+2*R+28,cy);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx,cy-R-22);ctx.lineTo(cx,cy+R+22);ctx.stroke();
  ctx.fillStyle='#5A6E8C';ctx.font="12px 'IBM Plex Mono'";ctx.textAlign='center';
  ctx.fillText('Re',cx+2*R+20,cy-6);ctx.fillText('Im',cx+13,cy-R-12);
  const drawVec=(x1,y1,x2,y2,col,w)=>{ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.fillStyle=col;ctx.beginPath();ctx.arc(x2,y2,3.5,0,2*Math.PI);ctx.fill();};
  // phasor A = e^{i theta}
  const ax=cx+R*Math.cos(th), ay=cy-R*Math.sin(th);
  drawVec(cx,cy,ax,ay,F.prior,2);
  ctx.fillStyle=F.prior;ctx.textAlign='left';ctx.font="12px 'IBM Plex Mono'";ctx.fillText('e^{iθ}',ax+6,ay-4);
  if(mode==='both'){
    const bx=cx+R*Math.cos(-th), by=cy-R*Math.sin(-th);
    drawVec(cx,cy,bx,by,'#9AA6B8',2);
    ctx.fillStyle='#9AA6B8';ctx.fillText('e^{−iθ}',bx+6,by+14);
    // imaginary parts cancel
    ctx.setLineDash([3,3]);ctx.strokeStyle='rgba(212,106,98,0.65)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(ax,cy);ctx.stroke();
    ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx,cy);ctx.stroke();ctx.setLineDash([]);
    // sum on real axis = 2 cos theta
    const sumx=cx+2*R*Math.cos(th);
    drawVec(cx,cy,sumx,cy,F.post,3);
    ctx.fillStyle=F.post;ctx.fillText('2cosθ',sumx+6,cy+18);
  } else {
    ctx.setLineDash([3,3]);ctx.strokeStyle='rgba(232,161,60,0.6)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(ax,cy);ctx.stroke();ctx.setLineDash([]);
    drawVec(cx,cy,ax,cy,F.post,3);
  }
  // right waveform panel
  const wyc=cy, sc=mode==='both'?45:88;
  ctx.strokeStyle='#3A4C68';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(fs_ph_wx0,wyc);ctx.lineTo(fs_ph_wx0+fs_ph_wW+12,wyc);ctx.stroke();
  ctx.fillStyle='#5A6E8C';ctx.font="12px 'IBM Plex Mono'";ctx.textAlign='center';ctx.fillText('θ →',fs_ph_wx0+fs_ph_wW+4,wyc-6);
  ctx.strokeStyle=F.post;ctx.lineWidth=2.2;ctx.beginPath();let f2=true;
  for(let phi=0;phi<=th+0.0001;phi+=0.03){
    const v=mode==='both'?2*Math.cos(phi):Math.cos(phi);
    const x=fs_ph_wx(phi), y=wyc-v*sc;
    f2?(ctx.moveTo(x,y),f2=false):ctx.lineTo(x,y);
  }
  ctx.stroke();
  const vNow=mode==='both'?2*Math.cos(th):Math.cos(th);
  ctx.fillStyle=F.post;ctx.beginPath();ctx.arc(fs_ph_wx(th),wyc-vNow*sc,4,0,2*Math.PI);ctx.fill();
  // title
  ctx.fillStyle=F.txt;ctx.font="14px 'IBM Plex Mono'";ctx.textAlign='left';
  ctx.fillText(mode==='both'?'cosθ = ½e^{iθ} + ½e^{−iθ}  (two counter-rotating phasors)':'e^{iθ} : unit phasor spinning counter-clockwise',fs_ph_wx0-4,34);
}
ANIMS.fs_phasor_static=(cv,ctx)=>fs_ph_draw(ctx,cv,{mode:'one',k:0.12});
ANIMS.fs_phasor=async(cv,ctx)=>{
  fs_ph_draw(ctx,cv,{mode:'one',k:0});
  await narrate("e^{iθ} is a unit phasor spinning counter-clockwise. Its shadow on the real axis traces cosθ.");
  await tween(1800,k=>fs_ph_draw(ctx,cv,{mode:'one',k}));
  await narrate("Now add its mirror e^{−iθ}, spinning clockwise. At every instant the two imaginary parts (red) are equal and opposite.");
  await tween(1800,k=>fs_ph_draw(ctx,cv,{mode:'both',k}));
  await narrate("They sum on the real axis: e^{iθ}+e^{−iθ} = 2cosθ. Negative frequency is no backward motion — just the mirror half that keeps a real signal real.");
};
})();
/* fourier-series / fs_transform */
(function(){
// ---- Fourier: series -> transform limit (fs_tr_) ----
const fs_tr_x0=70, fs_tr_x1=830, fs_tr_W=760, fs_tr_yb=330, fs_tr_H=225, fs_tr_wmax=15;
const fs_tr_env=(w)=>Math.exp(-(w/4.5)*(w/4.5));
const fs_tr_ox=(w)=>fs_tr_x0+(w+fs_tr_wmax)/(2*fs_tr_wmax)*fs_tr_W;
function fs_tr_draw(ctx,cv,st){
  clear(ctx,cv);
  const T=st.T||1.7, fill=st.fill==null?0:st.fill;
  const dw=2*Math.PI/T, yb=fs_tr_yb, H=fs_tr_H;
  // baseline axis
  ctx.strokeStyle='#3A4C68';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(fs_tr_x0,yb);ctx.lineTo(fs_tr_x1,yb);ctx.stroke();
  ctx.fillStyle='#5A6E8C';ctx.font="13px 'IBM Plex Mono'";ctx.textAlign='center';
  [[-fs_tr_wmax,'−ω'],[0,'0'],[fs_tr_wmax,'+ω']].forEach(([wv,lab])=>{ctx.fillText(lab,fs_tr_ox(wv),yb+20);});
  ctx.fillText('frequency  ω',(fs_tr_x0+fs_tr_x1)/2,yb+38);
  // filled continuum
  if(fill>0){
    ctx.fillStyle='rgba(232,161,60,'+(0.30*fill)+')';
    ctx.beginPath();ctx.moveTo(fs_tr_ox(-fs_tr_wmax),yb);
    for(let w=-fs_tr_wmax;w<=fs_tr_wmax;w+=0.1){ctx.lineTo(fs_tr_ox(w),yb-fs_tr_env(w)*H);}
    ctx.lineTo(fs_tr_ox(fs_tr_wmax),yb);ctx.closePath();ctx.fill();
  }
  // envelope curve (dashed)
  ctx.strokeStyle='rgba(124,141,165,0.8)';ctx.lineWidth=1.5;ctx.setLineDash([5,4]);ctx.beginPath();
  for(let w=-fs_tr_wmax;w<=fs_tr_wmax;w+=0.1){const x=fs_tr_ox(w),y=yb-fs_tr_env(w)*H;w===-fs_tr_wmax?ctx.moveTo(x,y):ctx.lineTo(x,y);}
  ctx.stroke();ctx.setLineDash([]);
  // discrete stems
  ctx.strokeStyle=F.post;ctx.fillStyle=F.post;ctx.lineWidth=2;
  ctx.globalAlpha=1-0.78*fill;let count=0;
  const nmax=Math.ceil(fs_tr_wmax/dw);
  for(let n=-nmax;n<=nmax;n++){
    const w=n*dw;if(Math.abs(w)>fs_tr_wmax)continue;count++;
    const x=fs_tr_ox(w),y=yb-fs_tr_env(w)*H;
    ctx.beginPath();ctx.moveTo(x,yb);ctx.lineTo(x,y);ctx.stroke();
    ctx.beginPath();ctx.arc(x,y,2.6,0,2*Math.PI);ctx.fill();
  }
  ctx.globalAlpha=1;
  // labels
  ctx.fillStyle=F.txt;ctx.font="14px 'IBM Plex Mono'";ctx.textAlign='left';
  ctx.fillText('spectrum of a pulse repeated every T',fs_tr_x0,30);
  ctx.textAlign='right';ctx.fillStyle=F.post;
  ctx.fillText('T = '+T.toFixed(1)+'   Δω = 2π/T = '+dw.toFixed(2)+'   lines: '+count,fs_tr_x1,30);
}
ANIMS.fs_transform_static=(cv,ctx)=>fs_tr_draw(ctx,cv,{T:1.7,fill:0});
ANIMS.fs_transform=async(cv,ctx)=>{
  fs_tr_draw(ctx,cv,{T:1.7,fill:0});
  await narrate("Treat a one-off pulse as periodic with period T. Its spectrum is a comb of discrete lines, spaced Δω = 2π/T.");
  await narrate("Let T grow. The spacing 2π/T shrinks, so the harmonic lines crowd closer and closer together.");
  await tween(1800,k=>fs_tr_draw(ctx,cv,{T:1.7+k*(9-1.7),fill:0}));
  await narrate("Push T → ∞: the spacing collapses to zero and the lines merge into one continuous curve.");
  await tween(1800,k=>fs_tr_draw(ctx,cv,{T:9+k*(30-9),fill:k}));
  await narrate("That continuum is the Fourier transform F(ω) — the same extraction integral, now asked at every real frequency. Series → transform.");
};
})();

(function(){
const nnN_lerp=(a,b,t)=>a+(b-a)*t;
function nnN_dot(ctx,x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=c;ctx.fill();}
function nnN_draw(ctx,cv,s){

  const in2={x:140,y:250,v:"1",lab:"sender in contacts",w:"−4.0",c:F.wrong};

  ctx.beginPath();ctx.moveTo(sum.x,315);ctx.lineTo(sum.x,sum.y+sum.r);ctx.stroke();
  ctx.beginPath();ctx.moveTo(sum.x+sum.r,sum.y);ctx.lineTo(box.x,box.y+box.h/2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(box.x+box.w,box.y+box.h/2);ctx.lineTo(outN.x-outN.r,outN.y);ctx.stroke();
  ctx.textAlign="center";
  [in1,in2].forEach(n=>{ctx.fillStyle=n.c;ctx.fillText(n.w,(n.x+28+sum.x-sum.r)/2,(n.y+sum.y)/2-10);});
  ctx.fillStyle="#5A6E8C";ctx.fillText("bias −1.0",sum.x,332);
  [in1,in2].forEach(n=>{
    if(charge>0&&charge<1){
      const px=nnN_lerp(n.x+28,sum.x-sum.r,charge),py=nnN_lerp(n.y,sum.y,charge);
      nnN_dot(ctx,px,py,6,n.c);
    }
  });

    nnN_dot(ctx,n.x,n.y,26,"#1b2740");

    ctx.fillStyle=F.txt;ctx.font="16px 'IBM Plex Mono'";ctx.fillText(n.v,n.x,n.y);
    ctx.fillStyle="#5A6E8C";ctx.font="12px 'IBM Plex Mono'";ctx.fillText(n.lab,n.x,n.y+42);
    ctx.font="14px 'IBM Plex Mono'";
  });
  nnN_dot(ctx,sum.x,sum.y,sum.r,"#1b2740");
  ctx.strokeStyle=F.ax;ctx.lineWidth=2;ctx.beginPath();ctx.arc(sum.x,sum.y,sum.r,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle=F.txt;ctx.font="20px 'IBM Plex Mono'";
  ctx.fillText(acc===undefined?"Σ":(acc>0?"+":"")+acc.toFixed(1),sum.x,sum.y);
  ctx.font="12px 'IBM Plex Mono'";ctx.fillStyle="#5A6E8C";ctx.fillText("weighted sum",sum.x,sum.y+sum.r+16);
  ctx.font="14px 'IBM Plex Mono'";
  ctx.strokeStyle=F.ax;ctx.lineWidth=1.5;ctx.strokeRect(box.x,box.y,box.w,box.h);
  const bx0=box.x+14,bx1=box.x+box.w-14,by0=box.y+box.h-16,mid=box.x+box.w*0.5;
  ctx.strokeStyle=F.post;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx0,by0);ctx.lineTo(mid,by0);ctx.lineTo(bx1,box.y+14);ctx.stroke();
  ctx.fillStyle="#5A6E8C";ctx.font="12px 'IBM Plex Mono'";ctx.fillText("ReLU  max(0,x)",box.x+box.w/2,box.y-9);
  if(relu>0){nnN_dot(ctx,nnN_lerp(mid,bx0,0.55),by0,5,F.wrong);}
  ctx.font="14px 'IBM Plex Mono'";
  nnN_dot(ctx,outN.x,outN.y,outN.r,"#1b2740");
  ctx.strokeStyle=(out===0)?F.wrong:F.ax;ctx.lineWidth=2;ctx.beginPath();ctx.arc(outN.x,outN.y,outN.r,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle=F.txt;ctx.font="18px 'IBM Plex Mono'";ctx.fillText(out===undefined?"?":out.toFixed(0),outN.x,outN.y);
  ctx.fillStyle="#5A6E8C";ctx.font="12px 'IBM Plex Mono'";ctx.fillText("output",outN.x,outN.y+38);
  ctx.textAlign="left";ctx.textBaseline="alphabetic";
}
ANIMS.nn_neuron_static=(cv,ctx)=>nnN_draw(ctx,cv,{charge:0});
ANIMS.nn_neuron=async(cv,ctx)=>{
  nnN_draw(ctx,cv,{charge:0});

  await tween(800,k=>nnN_draw(ctx,cv,{charge:0}));

})();

(function(){
const nnL_xe=(p)=>-Math.log(Math.max(p,1e-3));
const nnL_lerp=(a,b,t)=>a+(b-a)*t;
function nnL_dot(ctx,x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=c;ctx.fill();}
function nnL_draw(ctx,cv,s){
  clear(ctx,cv);
  ctx.font="14px 'IBM Plex Mono'";
  const L=95,R=820,T=55,B=315,Lmax=4;
  const px=(p)=>L+(R-L)*p;
  const py=(loss)=>B-(Math.min(loss,Lmax)/Lmax)*(B-T);
  ctx.strokeStyle="#22314a";ctx.lineWidth=1;
  for(let i=0;i<=4;i++){const y=B-(i/4)*(B-T);ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(R,y);ctx.stroke();}
  ctx.strokeStyle="#3A4C68";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(L,T);ctx.lineTo(L,B);ctx.lineTo(R,B);ctx.stroke();
  ctx.fillStyle="#5A6E8C";ctx.textAlign="center";
  ctx.fillText("probability the model gave the TRUE class  →",(L+R)/2,B+32);
  ctx.textAlign="right";ctx.fillText("4+",L-8,T+4);ctx.fillText("0",L-8,B);
  ctx.textAlign="center";ctx.fillText("0",L,B+16);ctx.fillText("1.0",R,B+16);
  ctx.save();ctx.translate(L-52,(T+B)/2);ctx.rotate(-Math.PI/2);ctx.fillStyle="#5A6E8C";ctx.fillText("cross-entropy loss  −log(p)",0,0);ctx.restore();
  const rev=s.k===undefined?1:s.k;
  ctx.strokeStyle=F.ax;ctx.lineWidth=2.5;ctx.beginPath();
  let started=false;
  for(let p=1.0;p>=0.02;p-=0.004){
    if(p<1-rev*0.985)break;
    const x=px(p),y=py(nnL_xe(p));
    if(!started){ctx.moveTo(x,y);started=true;}else ctx.lineTo(x,y);
  }
  ctx.stroke();
  if(s.p!==undefined){
    const mp=s.p,ml=nnL_xe(mp),x=px(mp),y=py(ml);
    ctx.strokeStyle="#3A4C68";ctx.setLineDash([4,4]);ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,B);ctx.lineTo(x,y);ctx.lineTo(L,y);ctx.stroke();ctx.setLineDash([]);
    const col=ml>1.2?F.wrong:F.ok;
    nnL_dot(ctx,x,y,6,col);
    ctx.fillStyle=col;ctx.textAlign=mp>0.5?"right":"left";
    const tx=mp>0.5?x-14:x+14;
    ctx.fillText("p="+mp.toFixed(2)+"   loss="+ml.toFixed(2),tx,y-6);
    ctx.textAlign="center";ctx.fillStyle=col;ctx.font="12px 'IBM Plex Mono'";
    ctx.fillText(ml>1.2?"confident & WRONG":"confident & right",x,B-6);
    ctx.font="14px 'IBM Plex Mono'";
  }
  ctx.textAlign="left";
}
ANIMS.nn_loss_xent_static=(cv,ctx)=>nnL_draw(ctx,cv,{k:1,p:0.9});
ANIMS.nn_loss_xent=async(cv,ctx)=>{
  nnL_draw(ctx,cv,{k:0});
  await narrate("Cross-entropy scores one prediction by the −log of the probability the model assigned to the true class.");
  await tween(1200,k=>nnL_draw(ctx,cv,{k}));
  await narrate("Confident and right — near probability 1 on the truth — costs almost nothing.");
  await tween(800,k=>nnL_draw(ctx,cv,{k:1,p:0.95}));
  await narrate("But be 95% sure of the WRONG class — the truth got just 0.05 — and the penalty explodes toward infinity.");
  await tween(1600,k=>nnL_draw(ctx,cv,{k:1,p:nnL_lerp(0.95,0.05,k)}));
  await narrate("That steep wall is the point: cross-entropy punishes confident mistakes brutally. It trains calibration, not just correctness.");
  await tween(600,k=>nnL_draw(ctx,cv,{k:1,p:0.05}));
};
})();
/* neural-networks / nn_generalization */
(function(){
const nnG_train=(t)=>0.95*Math.exp(-4.5*t)+0.04;
const nnG_val=(t)=>0.90*Math.exp(-5*t)+0.10+0.55*t*t;
function nnG_argmin(){let bt=0,bv=1e9;for(let t=0;t<=1;t+=0.002){const v=nnG_val(t);if(v<bv){bv=v;bt=t;}}return bt;}
function nnG_dot(ctx,x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=c;ctx.fill();}
function nnG_draw(ctx,cv,s){
  clear(ctx,cv);
  ctx.font="14px 'IBM Plex Mono'";
  const L=90,R=830,T=50,B=315;
  const px=(t)=>L+(R-L)*t;
  const py=(v)=>B-(Math.min(v,1.05)/1.05)*(B-T);
  ctx.strokeStyle="#22314a";ctx.lineWidth=1;
  for(let i=0;i<=5;i++){const y=T+(i/5)*(B-T);ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(R,y);ctx.stroke();}
  ctx.strokeStyle="#3A4C68";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(L,T);ctx.lineTo(L,B);ctx.lineTo(R,B);ctx.stroke();
  ctx.fillStyle="#5A6E8C";ctx.textAlign="center";ctx.fillText("training epochs  →",(L+R)/2,B+30);
  ctx.save();ctx.translate(L-46,(T+B)/2);ctx.rotate(-Math.PI/2);ctx.fillText("loss",0,0);ctx.restore();
  const kt=s.kt===undefined?0:s.kt, kv=s.kv===undefined?0:s.kv;
  const curve=(fn,frac,col)=>{
    if(frac<=0)return;
    ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.beginPath();
    let st=false;
    for(let t=0;t<=frac+1e-6;t+=0.004){const x=px(t),y=py(fn(t));if(!st){ctx.moveTo(x,y);st=true;}else ctx.lineTo(x,y);}
    ctx.stroke();
  };
  curve(nnG_train,kt,F.ok);
  curve(nnG_val,kv,F.post);
  if(kt>0){const x=px(kt),y=py(nnG_train(kt));nnG_dot(ctx,x,y,4,F.ok);ctx.fillStyle=F.ok;ctx.textAlign="left";ctx.fillText("training loss",Math.min(x+8,R-110),y+4);}
  if(kv>0){const x=px(kv),y=py(nnG_val(kv));nnG_dot(ctx,x,y,4,F.post);ctx.fillStyle=F.post;ctx.textAlign="left";ctx.fillText("validation loss",Math.min(x+8,R-120),y-6);}
  if(s.showMin){
    const tm=nnG_argmin(),x=px(tm);
    ctx.strokeStyle=F.txt;ctx.setLineDash([5,5]);ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(x,T);ctx.lineTo(x,B);ctx.stroke();ctx.setLineDash([]);
    nnG_dot(ctx,x,py(nnG_val(tm)),6,F.txt);
    ctx.fillStyle=F.txt;ctx.textAlign="center";ctx.fillText("early stop",x,T-6);
    ctx.fillStyle=F.wrong;ctx.textAlign="left";ctx.font="12px 'IBM Plex Mono'";
    ctx.fillText("← learning        memorizing →",x-96,B-8);
    ctx.font="14px 'IBM Plex Mono'";
  }
  ctx.textAlign="left";
}
ANIMS.nn_generalization_static=(cv,ctx)=>nnG_draw(ctx,cv,{kt:0,kv:0});
ANIMS.nn_generalization=async(cv,ctx)=>{
  nnG_draw(ctx,cv,{kt:0,kv:0});
  await narrate("Split the data: train on one part, and track the loss on a held-out validation set the network never learns from.");

(function(){
const _llmTcap=t=>0.35+0.55*(1-Math.exp(-2.7*t));

function _llmDrawGood(ctx,cv,st){
  clear(ctx,cv);
  const L=115,R=820,B=306,Tp=66;
  ctx.strokeStyle="#3A4C68";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(L,Tp);ctx.lineTo(L,B);ctx.lineTo(R,B);ctx.stroke();
  ctx.fillStyle="#5A6E8C";ctx.font="13px 'IBM Plex Mono'";ctx.textAlign="center";
  ctx.fillText("time / successive model releases →",(L+R)/2,B+26);
  ctx.save();ctx.translate(L-30,(Tp+B)/2);ctx.rotate(-Math.PI/2);ctx.textAlign="center";ctx.fillText("score",0,0);ctx.restore();
  const X=t=>L+(R-L)*t;
  const rT=st.rT??0, rB=st.rB??0;
  if(st.gap){
    ctx.fillStyle="rgba(212,106,98,0.16)";
    ctx.beginPath();
    const rr=Math.min(rB,1);
    ctx.moveTo(X(0.5),_llmScoreY(_llmBench(0.5)));
    for(let t=0.5;t<=rr;t+=0.01){ctx.lineTo(X(t),_llmScoreY(_llmBench(t)));}
    for(let t=rr;t>=0.5;t-=0.01){ctx.lineTo(X(t),_llmScoreY(_llmTcap(t)));}
    ctx.closePath();ctx.fill();
  }
  if(st.marker){
    ctx.setLineDash([5,5]);ctx.strokeStyle=F.wrong;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(X(0.5),Tp);ctx.lineTo(X(0.5),B);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=F.wrong;ctx.font="12px 'IBM Plex Mono'";ctx.textAlign="center";

  }
  ctx.strokeStyle=F.ok;ctx.lineWidth=2.5;ctx.beginPath();
  for(let t=0;t<=rT;t+=0.005){const x=X(t),y=_llmScoreY(_llmTcap(t));t===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
  ctx.stroke();
  if(rB>0){
    ctx.strokeStyle=F.post;ctx.lineWidth=2.5;ctx.beginPath();
    for(let t=0;t<=rB;t+=0.005){const x=X(t),y=_llmScoreY(_llmBench(t));t===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
    ctx.stroke();

  ctx.textAlign="left";ctx.font="13px 'IBM Plex Mono'";
  ctx.fillStyle=F.ok;ctx.fillText("— true capability",L+12,Tp+4);

  if(st.note){ctx.fillStyle=F.txt;ctx.font="14px 'IBM Plex Mono'";ctx.textAlign="left";ctx.fillText(st.note,L+12,B+52);}
}

  const totalW=x-bx;const cursorX=bx+s.scan*totalW;
  for(const p of pos){

    ctx.fillStyle=color;ctx.fillText(p.tok.t,p.x,by);

    ctx.fillStyle=F.wrong;ctx.font="20px 'IBM Plex Mono'";ctx.fillText("REPLY BLOCKED",492,224);
    ctx.font="12px 'IBM Plex Mono'";ctx.fillStyle="#5A6E8C";

    ctx.font="14px 'IBM Plex Mono'";
  }

  ctx.strokeStyle=F.txt;ctx.lineWidth=1;

  ctx.strokeStyle="#3A4C68";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x0,yt);ctx.stroke();

  }
  const mb=Math.min(s.k,1);

  if(s.k>0.15){ctx.fillStyle=F.wrong;ctx.fillText("too tight:",X(0.02),Y(_abq(0.14))+40);ctx.fillText("skips checks",X(0.02),Y(_abq(0.14))+58);}

(function(){

  }
  const startX=100,endX=760;
  const lanes=[{y:160,label:"plausible-but-wrong finding",dies:true,dieGate:1},{y:270,label:"real finding",dies:false}];

    ctx.fillStyle=dead?F.wrong:(ln.dies?F.post:F.ok);
    ctx.beginPath();ctx.arc(tx,ln.y,9,0,7);ctx.fill();

    }

(function(){
// ===== agi_scaling_law : scaling-debates =====

function agi_drawScaling(ctx,cv,s){

  ctx.font="12px 'IBM Plex Mono'"; ctx.fillStyle="#5A6E8C"; ctx.textAlign="center";
  for(let i=0;i<=6;i++){const gx=X(i/6);ctx.beginPath();ctx.moveTo(gx,p.T);ctx.lineTo(gx,p.B);ctx.stroke();
    ctx.fillText("10^"+(18+2*i),gx,p.B+16);}
  ctx.strokeStyle="#3A4C68"; ctx.lineWidth=1.5;

  ctx.fillStyle="#5A6E8C";ctx.textAlign="center";ctx.font="12px 'IBM Plex Mono'";

    ctx.stroke();

(function(){
// ===== c03 leveraged-ETF daily-reset volatility decay =====
const _etfLevIdx=[100,110,99];
const _etfLevLev=[100,120,96];
const _etfLevY=(p,T,H)=>T+(124-p)/34*H;
const _etfLevXs=(L,W)=>[L,L+W/2,L+W];
function _etfLevPath(ctx,pts,xs,T,H,prog,color,width){
  ctx.strokeStyle=color; ctx.lineWidth=width; ctx.beginPath();
  const cur=prog*(pts.length-1);
  for(let i=0;i<pts.length;i++){
    if(i>cur){ const seg=cur-(i-1);
      if(seg>0){ const x=xs[i-1]+(xs[i]-xs[i-1])*seg, y=_etfLevY(pts[i-1]+(pts[i]-pts[i-1])*seg,T,H); ctx.lineTo(x,y); }
      break; }
    const x=xs[i], y=_etfLevY(pts[i],T,H); if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.stroke();
}
function _etfLevDraw(ctx,cv,st){
  clear(ctx,cv); ctx.font="14px 'IBM Plex Mono'";
  const L=90,R=160,T=44,B=54,W=cv.width-L-R,H=cv.height-T-B, xs=_etfLevXs(L,W);
  for(let p=90;p<=120;p+=10){ const y=_etfLevY(p,T,H);
    ctx.strokeStyle="#22314a";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(L+W,y);ctx.stroke();
    ctx.fillStyle="#5A6E8C";ctx.textAlign="right";ctx.fillText(p,L-8,y+4); }
  ctx.textAlign="center";ctx.fillStyle="#5A6E8C";
  ["Day 0","Day 1","Day 2"].forEach((d,i)=>ctx.fillText(d,xs[i],T+H+30));
  ctx.textAlign="left";
  ctx.strokeStyle="#3A4C68";ctx.beginPath();ctx.moveTo(L,T);ctx.lineTo(L,T+H);ctx.lineTo(L+W,T+H);ctx.stroke();
  if(st.idx>0) _etfLevPath(ctx,_etfLevIdx,xs,T,H,st.idx,F.prior,2.5);
  if(st.lev>0) _etfLevPath(ctx,_etfLevLev,xs,T,H,st.lev,F.post,2.5);
  if(st.idx>=1){ ctx.fillStyle=F.prior; ctx.textAlign="center"; ctx.fillText("+10%",xs[1],_etfLevY(110,T,H)-10); ctx.textAlign="left";
    const y=_etfLevY(99,T,H); ctx.beginPath();ctx.arc(xs[2],y,4,0,7);ctx.fill(); ctx.fillText("index  99  (−1%)",xs[2]+10,y+4); }
  if(st.lev>=1){ ctx.fillStyle=F.post; ctx.textAlign="center"; ctx.fillText("+20%",xs[1],_etfLevY(120,T,H)-10); ctx.textAlign="left";
    const y=_etfLevY(96,T,H); ctx.beginPath();ctx.arc(xs[2],y,4,0,7);ctx.fill(); ctx.fillText("2× fund  96  (−4%)",xs[2]+10,y+4); }
  if(st.annotate>0){ ctx.globalAlpha=0.3+0.7*st.annotate;
    const y0=_etfLevY(120,T,H);
    ctx.strokeStyle=F.wrong;ctx.lineWidth=1.5;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(xs[1],y0);ctx.lineTo(xs[2],y0);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=F.wrong;ctx.textAlign="center";
    ctx.fillText("−20% of 120 = −24",(xs[1]+xs[2])/2,y0-8);
    ctx.textAlign="left";ctx.globalAlpha=1; }
}

(function(){
// ---- c01-returns: volatility drag ----
const qf_vd_L=90, qf_vd_R=820, qf_vd_T=70, qf_vd_B=320;
const qf_vd_WMAX=1.65;

  clear(ctx,cv);

  ctx.fillText("Volatility drag:  +50% then −50%  ≠  break-even", qf_vd_L-30, 34);
  ctx.font="14px 'IBM Plex Mono'";
  ctx.strokeStyle="#3A4C68"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(qf_vd_L,qf_vd_T-10); ctx.lineTo(qf_vd_L,qf_vd_B); ctx.lineTo(qf_vd_R,qf_vd_B); ctx.stroke();
  const y1=qf_vd_yFor(1.0);

  ctx.beginPath(); ctx.moveTo(qf_vd_L,y1); ctx.lineTo(qf_vd_R,y1); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle="#5A6E8C"; ctx.fillText("start = 1.00", qf_vd_R-110, y1-8);
  ctx.fillText("year 0", qf_vd_X[0]-20, qf_vd_B+20);

  ctx.fillText("year 2", qf_vd_X[2]-20, qf_vd_B+20);

  ctx.lineWidth=2.5;

  const dot=(x,y,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.fill();};
  dot(pts[0][0],pts[0][1],F.ax);

  if(p>=2){ dot(pts[2][0],pts[2][1],F.wrong); ctx.fillStyle=F.wrong; ctx.fillText("×0.5 = 0.75  (−25%)", pts[2][0]-150, pts[2][1]-14); }
  if(gap>0 && p>=2){
    const gy0=qf_vd_yFor(1.0), gy1=qf_vd_yFor(0.75);

    ctx.beginPath(); ctx.moveTo(qf_vd_X[2]+14,gy1); ctx.lineTo(qf_vd_X[2]+40,gy1); ctx.stroke();

    ctx.font="13px 'IBM Plex Mono'"; ctx.fillStyle="#5A6E8C"; ctx.fillText("mean 0% · variance is the tax", 520, 92);

(function(){

function qf_k_draw(ctx,cv,st){
  const uEnd=st.uEnd||0, neg=st.neg||0, marks=st.marks||0;
  clear(ctx,cv);

  ctx.fillText("Kelly growth curve:  g(f) = fμ − f²σ²/2", qf_k_L-35, 32);
  ctx.font="14px 'IBM Plex Mono'";

  ctx.strokeStyle="#3A4C68"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(qf_k_L,qf_k_T); ctx.lineTo(qf_k_L,qf_k_B); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(qf_k_L,y0); ctx.lineTo(qf_k_R,y0); ctx.stroke();

(function(){
// ---- c05-backtesting: max over trials ----
const qf_mt_L=95, qf_mt_R=830, qf_mt_T=60, qf_mt_B=300;
const qf_mt_NMAX=300;
const qf_mt_SMIN=-1.2, qf_mt_SMAX=1.65;
const qf_mt_xFor=(n)=> qf_mt_L + (Math.log(n)/Math.log(qf_mt_NMAX))*(qf_mt_R-qf_mt_L);
const qf_mt_yFor=(s)=> qf_mt_B - ((s-qf_mt_SMIN)/(qf_mt_SMAX-qf_mt_SMIN))*(qf_mt_B-qf_mt_T);
const qf_mt_emax=(n)=> 0.40*Math.sqrt(2*Math.log(Math.max(1.001,n)));  // σ must match the dot dispersion (box()*0.40) so the envelope truly tracks best-of-N
const qf_mt_dots=(()=>{
  let seed=20260726; const rnd=()=>{ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; };
  const box=()=>{ const u=Math.max(1e-6,rnd()), v=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
  const arr=[];
  for(let i=0;i<130;i++){ const n=Math.exp(rnd()*Math.log(qf_mt_NMAX)); const s=box()*0.40; arr.push([n, Math.max(qf_mt_SMIN+0.05,Math.min(qf_mt_SMAX-0.05,s))]); }
  arr.sort((a,b)=>a[0]-b[0]);
  return arr;
})();
function qf_mt_draw(ctx,cv,st){
  const ds=st.dotsShown||0, cu=st.curve||0, thr=st.thr||0;
  clear(ctx,cv);
  ctx.font="15px 'IBM Plex Mono'"; ctx.fillStyle=F.txt;
  ctx.fillText("The reported backtest is the max over trials", qf_mt_L-35, 32);
  ctx.font="14px 'IBM Plex Mono'";
  const yZero=qf_mt_yFor(0);
  ctx.strokeStyle="#3A4C68"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(qf_mt_L,qf_mt_T); ctx.lineTo(qf_mt_L,qf_mt_B); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(qf_mt_L,yZero); ctx.lineTo(qf_mt_R,yZero); ctx.stroke();
  ctx.fillStyle="#5A6E8C";
  ctx.fillText("Sharpe = 0  (true edge: none)", qf_mt_L+8, yZero-8);
  ctx.fillText("trials N →", qf_mt_R-100, qf_mt_B+24);
  [1,10,100,300].forEach(n=>{ const x=qf_mt_xFor(n); ctx.fillStyle="#5A6E8C"; ctx.fillText("N="+n, x-14, qf_mt_B+24); ctx.strokeStyle="#22314a"; ctx.beginPath(); ctx.moveTo(x,qf_mt_B); ctx.lineTo(x,qf_mt_B+4); ctx.stroke(); });
  if(thr>0){ const y1=qf_mt_yFor(1.0); ctx.globalAlpha=thr; ctx.strokeStyle=F.ok; ctx.setLineDash([6,4]); ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(qf_mt_L,y1); ctx.lineTo(qf_mt_R,y1); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle=F.ok; ctx.fillText("Sharpe 1.0 — 'looks like a real edge'", qf_mt_L+8, y1-8); ctx.globalAlpha=1; }
  const cnt=Math.floor(qf_mt_dots.length*ds);
  for(let i=0;i<cnt;i++){ const d=qf_mt_dots[i]; ctx.fillStyle="rgba(124,141,165,0.55)"; ctx.beginPath(); ctx.arc(qf_mt_xFor(d[0]), qf_mt_yFor(d[1]), 2.6, 0, 7); ctx.fill(); }
  if(cu>0){
    const Nf=Math.exp(cu*Math.log(qf_mt_NMAX));
    ctx.strokeStyle=F.post; ctx.lineWidth=2.5; ctx.beginPath(); let started=false;
    for(let n=1;n<=Nf+1e-6;n*=1.06){ const x=qf_mt_xFor(n), y=qf_mt_yFor(qf_mt_emax(n)); if(!started){ctx.moveTo(x,y);started=true;} else ctx.lineTo(x,y); }
    ctx.stroke();
    const x=qf_mt_xFor(Nf), y=qf_mt_yFor(qf_mt_emax(Nf));
    ctx.fillStyle=F.post; ctx.beginPath(); ctx.arc(x,y,5,0,7); ctx.fill();
    ctx.fillText("best of N ≈ √(2 ln N)", Math.min(qf_mt_R-170,x-40), y-12);
  }
}

})();

(function(){
/* etf / etf_openclosed */
var TOP=80, BOT=320, NAV=200;
var LX0=100, LX1=340, RX0=560, RX1=800;
var LCX=(LX0+LX1)/2, RCX=(RX0+RX1)/2;
var AMBER="rgba(232,161,60,0.78)";

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function fillWater(ctx,x0,x1,level,amp,phase,color){
  ctx.save();
  ctx.beginPath();
  ctx.rect(x0,TOP,x1-x0,BOT-TOP);
  ctx.clip();
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(x0,BOT);
  for(var x=x0;x<=x1;x+=3){
    var y=level+Math.sin(x*0.06+phase)*amp;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(x1,BOT);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function tankOutline(ctx,x0,x1){
  ctx.strokeStyle="#3A4C68";
  ctx.lineWidth=2;
  roundRect(ctx,x0-4,TOP-4,(x1-x0)+8,(BOT-TOP)+8,8);
  ctx.stroke();
}

function navLine(ctx,x0,x1){
  ctx.strokeStyle=F.prior;
  ctx.lineWidth=1;
  ctx.setLineDash([6,5]);
  ctx.beginPath();ctx.moveTo(x0-4,NAV);ctx.lineTo(x1+4,NAV);ctx.stroke();
  ctx.setLineDash([]);
}

function drawValve(ctx,cx,open){
  ctx.strokeStyle="#3A4C68";ctx.lineWidth=2;
  ctx.fillStyle=open?F.ok:"#2E3D57";
  roundRect(ctx,cx-16,TOP-16,32,16,3);
  ctx.fill();ctx.stroke();
  if(open){
    ctx.strokeStyle=F.ok;ctx.lineWidth=2;
    for(var i=0;i<2;i++){
      var yy=TOP-22-i*8;
      ctx.beginPath();
      ctx.moveTo(cx-6,yy);ctx.lineTo(cx,yy-6);ctx.lineTo(cx+6,yy);
      ctx.stroke();
    }
  }
}

function drawSeal(ctx,cx){
  ctx.fillStyle="#2E3D57";ctx.strokeStyle="#3A4C68";ctx.lineWidth=2;
  roundRect(ctx,cx-20,TOP-12,40,12,3);ctx.fill();ctx.stroke();
  ctx.strokeStyle=F.wrong;ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(cx,TOP-16,5,Math.PI,0);ctx.stroke();
  ctx.fillStyle=F.wrong;
  roundRect(ctx,cx-6,TOP-16,12,9,2);ctx.fill();
}

function drawScene(ctx,cv,st){
  clear(ctx,cv);

  ctx.textAlign="center";
  ctx.fillStyle=F.txt;
  ctx.font="14px 'IBM Plex Mono'";
  ctx.fillText("OPEN-END vs CLOSED-END — the wrapper decides the price",450,22);

  // ---- LEFT: open-end ----
  tankOutline(ctx,LX0,LX1);
  fillWater(ctx,LX0,LX1,st.left,3,st.phL,AMBER);
  navLine(ctx,LX0,LX1);
  drawValve(ctx,LCX,st.valve);
  ctx.fillStyle=F.prior;ctx.textAlign="right";ctx.font="12px 'IBM Plex Mono'";
  ctx.fillText("NAV",LX0-8,NAV+4);
  ctx.textAlign="center";
  ctx.fillStyle=F.txt;ctx.font="13px 'IBM Plex Mono'";
  ctx.fillText("OPEN-END · ETF",LCX,344);
  ctx.fillStyle=F.ok;ctx.font="12px 'IBM Plex Mono'";
  ctx.fillText("CREATE / REDEEM VALVE",LCX,362);

  // ---- RIGHT: closed-end ----
  tankOutline(ctx,RX0,RX1);
  fillWater(ctx,RX0,RX1,st.right,5,st.phR,AMBER);
  if(st.discount && st.right>NAV){
    ctx.fillStyle="rgba(212,106,98,0.30)";
    ctx.fillRect(RX0,NAV,RX1-RX0,st.right-NAV);
    ctx.strokeStyle=F.wrong;ctx.lineWidth=1;
    ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(RX0,st.right);ctx.lineTo(RX1,st.right);ctx.stroke();
    ctx.setLineDash([]);
  }
  navLine(ctx,RX0,RX1);
  drawSeal(ctx,RCX);
  ctx.fillStyle=F.prior;ctx.textAlign="left";ctx.font="12px 'IBM Plex Mono'";
  ctx.fillText("NAV",RX1+8,NAV+4);
  ctx.textAlign="center";
  ctx.fillStyle=F.txt;ctx.font="13px 'IBM Plex Mono'";
  ctx.fillText("CLOSED-END · CEF",RCX,344);
  ctx.fillStyle=F.wrong;ctx.font="12px 'IBM Plex Mono'";
  ctx.fillText("NO VALVE — SEALED",RCX,362);
  if(st.label && st.discount && st.right>NAV){
    ctx.fillStyle=F.txt;ctx.font="13px 'IBM Plex Mono'";
    ctx.fillText("PERSISTENT DISCOUNT",RCX,NAV+(st.right-NAV)/2+4);
  }
}

(function(){
/* etf / etf_etn */
const PX0=70, PX1=620, PY0=310, PY1=60;
const td=0.62;
const barX=700, barW=46, barTop=70, barBot=310;
const LOW=0.035;
const AX="#3A4C68", GRID="#22314a", MUT="#5A6E8C";

function X(t){ return PX0 + t*(PX1-PX0); }
function Y(v){ return PY0 - v*(PY0-PY1); }
function idx(t){ return 0.15 + 0.72*t; }
function etf(t){ return 0.15 + 0.685*t; }

function axes(ctx){
  ctx.strokeStyle=GRID; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){ let gy=PY1+i*(PY0-PY1)/4; ctx.beginPath(); ctx.moveTo(PX0,gy); ctx.lineTo(PX1,gy); ctx.stroke(); }
  ctx.strokeStyle=AX; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(PX0,PY1); ctx.lineTo(PX0,PY0); ctx.lineTo(PX1,PY0); ctx.stroke();
  ctx.fillStyle=MUT; ctx.font="12px 'IBM Plex Mono'";
  ctx.fillText("price", PX0-2, PY1-10);
  ctx.fillText("time", PX1-34, PY0+22);
}

function series(ctx,fn,tMax,color,w){
  if(tMax<=0) return;
  ctx.strokeStyle=color; ctx.lineWidth=w; ctx.beginPath();
  let n=Math.max(2,Math.floor(tMax*120));
  for(let i=0;i<=n;i++){ let t=tMax*i/n; let px=X(t), py=Y(fn(t)); if(i===0)ctx.moveTo(px,py); else ctx.lineTo(px,py); }
  ctx.stroke();
}

function dot(ctx,x,y,c,r){ ctx.fillStyle=c; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); }

function label(ctx,text,x,y,color,size){
  size=size||14; ctx.font=size+"px 'IBM Plex Mono'"; ctx.fillStyle=color;
  let w=text.length*(size*0.6);
  let cx=Math.min(x, 900-w-6); if(cx<4)cx=4;
  ctx.fillText(text,cx,y); return cx;
}

function solvency(ctx,s){
  ctx.strokeStyle=AX; ctx.lineWidth=1.5;
  ctx.strokeRect(barX,barTop,barW,barBot-barTop);
  let h=(barBot-barTop)*Math.max(0,s);
  let col = s>0.5?F.ok : (s>0.2?F.post:F.wrong);
  ctx.fillStyle=col;
  ctx.fillRect(barX, barBot-h, barW, h);
  label(ctx,"Issuer",   barX-6, barTop-24, F.txt,13);
  label(ctx,"solvency", barX-6, barTop-9,  F.txt,13);
  label(ctx, Math.round(Math.max(0,s)*100)+"%", barX+4, barBot+20, col,13);
}

function render(cv,ctx,st){
  clear(ctx,cv); axes(ctx);
  label(ctx,"ETN = unsecured bank debt", 20, 26, F.txt,14);
  series(ctx,idx,st.p,F.prior,5);
  if(st.collapse<=0){
    series(ctx,idx,st.p,F.post,2.5);
    label(ctx,"ETN tracks Index", X(0.42)-40, Y(idx(0.5))-44, F.post,14);
    label(ctx,"0 tracking error", X(0.42)-40, Y(idx(0.5))-27, F.txt,13);
    label(ctx,"ETN + Index", X(st.p)+6, Y(idx(st.p))-2, F.post,13);
  } else {
    series(ctx,idx,td,F.post,2.5);
    let cv0=idx(td);
    let cvNow=cv0*(1-st.collapse)+LOW*st.collapse;
    ctx.strokeStyle=F.wrong; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(X(td),Y(cv0)); ctx.lineTo(X(td),Y(cvNow)); ctx.stroke();
    let tailEnd=td+st.collapse*(1-td);
    ctx.beginPath(); ctx.moveTo(X(td),Y(cvNow)); ctx.lineTo(X(tailEnd),Y(cvNow)); ctx.stroke();
    label(ctx,"Index (rolls on)", X(1)+6, Y(idx(1))+4, F.prior,13);
    label(ctx,"ETN worthless", X(tailEnd)+8, Y(cvNow)-8, F.wrong,13);
    if(st.flash){ dot(ctx,X(td),Y(cv0),F.wrong,4); label(ctx,"DEFAULT", X(td)+8, 210, F.wrong,15); }
  }
  if(st.etf>0){
    series(ctx,etf,st.etf,F.ok,2.5);
    label(ctx,"ETF: held in trust", X(st.etf)-150, Y(etf(st.etf))+18, F.ok,13);
  }
  solvency(ctx,st.s);
}

ANIMS.etf_etn_static=(cv,ctx)=>{
  clear(ctx,cv); axes(ctx);

};

ANIMS.etf_etn=async(cv,ctx)=>{

};

(function(){
/* etf / etf_cagr */
const PX=80, PW=850, PYt=50, PYb=330;
const vMin=80, vMax=220;
function X(t){ return PX + t*(PW-PX)/10; }
function Y(v){ return PYb - (v-vMin)/(vMax-vMin)*(PYb-PYt); }

const real   =[100,118,108,132,120,145,133,158,150,172,180];
const violent=[100,146, 96,160, 92,176,104,166,122,192,180];

function cagrPts(){ const p=[]; for(let i=0;i<=40;i++){ const t=i/4; p.push({x:X(t), y:Y(100*Math.pow(1.8,t/10))}); } return p; }
function arithPts(){ const p=[]; for(let i=0;i<=40;i++){ const t=i/4; p.push({x:X(t), y:Y(100*Math.pow(1.0742,t))}); } return p; }
function jagPts(arr){ return arr.map((v,i)=>({x:X(i), y:Y(v)})); }

function drawAxes(ctx){
  ctx.save();
  ctx.strokeStyle="#3A4C68"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(PX,PYt); ctx.lineTo(PX,PYb); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(PX,PYb); ctx.lineTo(PW,PYb); ctx.stroke();
  ctx.font="14px 'IBM Plex Mono'";
  const ticks=[100,140,180,220];
  ctx.textAlign="right"; ctx.textBaseline="middle";
  for(const tv of ticks){
    const y=Y(tv);
    ctx.strokeStyle="#22314a";
    ctx.beginPath(); ctx.moveTo(PX,y); ctx.lineTo(PW,y); ctx.stroke();
    ctx.fillStyle="#5A6E8C"; ctx.fillText(String(tv), PX-8, y);
  }
  ctx.textAlign="center"; ctx.textBaseline="top"; ctx.fillStyle="#5A6E8C";
  for(let t=0;t<=10;t+=2){ ctx.fillText(String(t), X(t), PYb+8); }
  ctx.textBaseline="alphabetic"; ctx.textAlign="left";
  ctx.fillText("Portfolio value", PX-10, PYt-16);
  ctx.textAlign="center";
  ctx.fillText("years", (PX+PW)/2, PYb+34);
  ctx.restore();
}

function plotCurve(ctx, pts, k, color, width){
  ctx.save();
  ctx.strokeStyle=color; ctx.lineWidth=width||2; ctx.lineJoin="round"; ctx.lineCap="round";
  ctx.beginPath();
  const total=pts.length-1; const prog=k*total;
  ctx.moveTo(pts[0].x, pts[0].y);
  for(let i=1;i<pts.length;i++){
    if(prog>=i){ ctx.lineTo(pts[i].x, pts[i].y); }
    else {
      const f=prog-(i-1);
      if(f>0){
        ctx.lineTo(pts[i-1].x+(pts[i].x-pts[i-1].x)*f, pts[i-1].y+(pts[i].y-pts[i-1].y)*f);
      }
      break;
    }
  }
  ctx.stroke(); ctx.restore();
}

function shadeDrag(ctx, alpha){
  const c=cagrPts(), a=arithPts();
  ctx.save(); ctx.globalAlpha=alpha; ctx.fillStyle=F.wrong;
  ctx.beginPath();
  ctx.moveTo(a[0].x,a[0].y);
  for(let i=1;i<a.length;i++) ctx.lineTo(a[i].x,a[i].y);
  for(let i=c.length-1;i>=0;i--) ctx.lineTo(c[i].x,c[i].y);
  ctx.closePath(); ctx.fill(); ctx.restore();
}

function dot(ctx, x, y, color){
  ctx.save(); ctx.fillStyle=color; ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2); ctx.fill(); ctx.restore();
}

function label(ctx, text, x, y, color, align){
  ctx.save(); ctx.font="14px 'IBM Plex Mono'"; ctx.fillStyle=color;
  ctx.textAlign=align||"left"; ctx.textBaseline="alphabetic";
  ctx.fillText(text,x,y); ctx.restore();
}

function scene(ctx, cv, st){
  clear(ctx,cv);
  drawAxes(ctx);
  if(st.mode==="compare"){
    if(st.cagrK>0) plotCurve(ctx, cagrPts(), st.cagrK, F.ok, 2.5);
    if(st.violentK>0) plotCurve(ctx, jagPts(violent), st.violentK, F.wrong, 2.2);
    if(st.cagrK>=1) dot(ctx, X(0), Y(100), F.txt);
    if(st.cagrK>=1) dot(ctx, X(10), Y(180), F.txt);
    if(st.labels){
      label(ctx,"smooth ride", X(7)+6, 183, F.ok, "left");
      label(ctx,"violent ride", 700, 100, F.wrong, "left");
      label(ctx,"same endpoint 180", 845, 120, F.txt, "right");
      label(ctx,"same start 100", X(0)-4, Y(100)+18, F.prior, "left");
    }
    return;
  }
  if(st.dragAlpha>0) shadeDrag(ctx, st.dragAlpha);
  if(st.realK>0) plotCurve(ctx, jagPts(real), st.realK, F.post, 2.5);
  if(st.arithK>0) plotCurve(ctx, arithPts(), st.arithK, F.wrong, 2);
  if(st.cagrK>0) plotCurve(ctx, cagrPts(), st.cagrK, F.ok, 2.5);
  if(st.realK>=1){ dot(ctx, X(0), Y(100), F.txt); dot(ctx, X(10), Y(180), F.txt); }
  if(st.labels){
    if(st.realK>=1) label(ctx,"real path", 315, 214, F.post, "left");
    if(st.cagrK>=1) label(ctx,"CAGR 6.0%/yr", 548, 200, F.ok, "left");
    if(st.arithK>=1) label(ctx,"arithmetic mean", 845, 92, F.wrong, "right");
    if(st.dragAlpha>0) label(ctx,"volatility drag", 635, 150, F.wrong, "center");
    if(st.realK>=1) label(ctx,"ends at 180", 845, 120, F.txt, "right");
  }
}

ANIMS.etf_cagr = async (cv, ctx) => {

(function(){
/* etf / etf_irr */
const N=5, baseY=235, scale=0.2, rMax=0.20, BW=26;
const cfA=[{t:0,a:-100},{t:1,a:-100},{t:2,a:-100},{t:3,a:-100},{t:4,a:-100},{t:5,a:650}];
const cfB=[{t:0,a:-260},{t:1,a:-60},{t:2,a:-60},{t:3,a:-60},{t:4,a:-60},{t:5,a:650}];
function xAt(t){return 120+t*136;}
function npv(cfs,r){let s=0;for(const c of cfs)s+=c.a/Math.pow(1+r,c.t);return s;}
function irrOf(cfs){let lo=0,hi=1;for(let i=0;i<64;i++){const m=(lo+hi)/2;if(npv(cfs,m)>0)lo=m;else hi=m;}return (lo+hi)/2;}
function interp(m){return cfA.map((c,i)=>({t:c.t,a:c.a+(cfB[i].a-c.a)*m}));}
const irrA=irrOf(cfA);

function drawGrid(ctx){
  ctx.strokeStyle="#22314a";ctx.lineWidth=1;
  for(let t=0;t<=N;t++){const x=xAt(t);ctx.beginPath();ctx.moveTo(x,105);ctx.lineTo(x,300);ctx.stroke();}
}
function drawAxis(ctx){
  ctx.strokeStyle="#3A4C68";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(100,baseY);ctx.lineTo(824,baseY);ctx.stroke();
  ctx.fillStyle="#5A6E8C";ctx.font="12px 'IBM Plex Mono'";ctx.textAlign="center";
  for(let t=0;t<=N;t++){const x=xAt(t);ctx.strokeStyle="#3A4C68";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,baseY-3);ctx.lineTo(x,baseY+3);ctx.stroke();ctx.fillText(String(t),x,318);}
  ctx.fillText("time (years)",460,336);
}
function drawBars(ctx,st){
  const r=st.r, grow=(st.grow==null?1:st.grow), hi=st.highlight;
  for(const c of st.cfs){
    const x=xAt(c.t);
    const pv=c.a/Math.pow(1+r,c.t);
    const h=Math.abs(pv)*scale*grow;
    if(c.a>=0){ctx.fillStyle=F.ok;ctx.fillRect(x-BW/2,baseY-h,BW,h);}
    else{ctx.fillStyle=(hi&&c.t===0)?F.wrong:F.prior;ctx.fillRect(x-BW/2,baseY,BW,h);}
    ctx.textAlign="center";ctx.font="11px 'IBM Plex Mono'";ctx.fillStyle=F.txt;
    const val=(pv>=0?"+":"")+Math.round(pv);
    if(grow>0.2){ if(c.a>=0) ctx.fillText(val,x,baseY-h-6); else ctx.fillText(val,x,baseY+h+12); }
  }
}
function drawDial(ctx,r){
  const cx=105,cy=118,rad=58;
  ctx.strokeStyle="#3A4C68";ctx.lineWidth=8;ctx.lineCap="round";
  ctx.beginPath();ctx.arc(cx,cy,rad,Math.PI,2*Math.PI);ctx.stroke();
  const rr=Math.min(r,rMax), ang=Math.PI+(rr/rMax)*Math.PI;
  ctx.strokeStyle=F.post;ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+rad*Math.cos(ang),cy+rad*Math.sin(ang));ctx.stroke();
  ctx.fillStyle=F.post;ctx.beginPath();ctx.arc(cx,cy,4,0,2*Math.PI);ctx.fill();
  ctx.fillStyle=F.txt;ctx.font="14px 'IBM Plex Mono'";ctx.textAlign="center";
  ctx.fillText("r = "+(r*100).toFixed(1)+"%",cx,cy+34);
  ctx.fillStyle="#5A6E8C";ctx.font="11px 'IBM Plex Mono'";
  ctx.fillText("discount rate",cx,cy+50);
}
function drawNPV(ctx,cfs,r){
  const val=npv(cfs,r), x0=360,x1=770,xc=(x0+x1)/2, y=70;
  ctx.strokeStyle="#3A4C68";ctx.lineWidth=6;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke();
  ctx.strokeStyle="#5A6E8C";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(xc,y-12);ctx.lineTo(xc,y+12);ctx.stroke();
  ctx.fillStyle="#5A6E8C";ctx.font="11px 'IBM Plex Mono'";ctx.textAlign="center";
  ctx.fillText("0",xc,y+26);
  const off=Math.max(-150,Math.min(150,val))*(200/160), near=Math.abs(val)<2;
  ctx.fillStyle=near?F.ok:F.post;
  ctx.beginPath();ctx.arc(xc+off,y,7,0,2*Math.PI);ctx.fill();
  ctx.textAlign="left";ctx.font="14px 'IBM Plex Mono'";ctx.fillStyle=near?F.ok:F.txt;
  ctx.fillText("NPV = "+(val>=0?"+":"")+val.toFixed(1),x0,y-16);
  ctx.fillStyle="#5A6E8C";ctx.font="11px 'IBM Plex Mono'";
  ctx.fillText("net present value of all cash flows",x0,y-32);
}
function drawIRRlabel(ctx){
  ctx.fillStyle=F.post;ctx.font="14px 'IBM Plex Mono'";ctx.textAlign="left";
  ctx.fillText("that rate is your IRR",150,205);

  ctx.fillText("money-weighted return",150,221);

function render(ctx,cv,st){
  clear(ctx,cv);
  drawGrid(ctx);drawAxis(ctx);drawBars(ctx,st);
  if(st.showDial)drawDial(ctx,st.r);
  if(st.showNPV)drawNPV(ctx,st.cfs,st.r);

}

(function(){
/* etf / etf_twr_mwr */
const X0=70,X1=580,PT=70,PB=250;
const xOf=t=>X0+t*(X1-X0);
const yOf=v=>PB-v*(PB-PT);
const ANCH=[[0,0.55],[0.25,0.82],[0.55,0.20],[0.80,0.58],[1,0.85]];
function vAt(t){
  if(t<=0)return ANCH[0][1];
  if(t>=1)return ANCH[ANCH.length-1][1];
  for(let i=0;i<ANCH.length-1;i++){
    const a=ANCH[i],b=ANCH[i+1];
    if(t>=a[0]&&t<=b[0]){
      const u=(t-a[0])/(b[0]-a[0]);
      const s=u*u*(3-2*u);
      return a[1]+(b[1]-a[1])*s;
    }
  }
  return ANCH[ANCH.length-1][1];
}
const N=160,PTS=[];
for(let i=0;i<N;i++){const t=i/(N-1);PTS.push([xOf(t),yOf(vAt(t))]);}
const BAD_T=0.25,GOOD_T=0.55;
const badPt=[xOf(BAD_T),yOf(vAt(BAD_T))];
const goodPt=[xOf(GOOD_T),yOf(vAt(GOOD_T))];
const RLX=610,RLX2=845,TWRY=160,DOTX=680,GY=110,BY=210;

function drawMarker(ctx,p,color,prog,dir){
  const r=6*Math.min(1,prog*1.3);
  ctx.strokeStyle=color;
  ctx.globalAlpha=0.5;ctx.lineWidth=1;
  const ly=dir<0?p[1]-16:p[1]+18;
  ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(p[0],ly);ctx.stroke();
  ctx.globalAlpha=1;
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(p[0],p[1]-r);ctx.lineTo(p[0]+r,p[1]);
  ctx.lineTo(p[0],p[1]+r);ctx.lineTo(p[0]-r,p[1]);
  ctx.closePath();ctx.fill();
}

function render(ctx,cv,o){
  o=o||{};
  const pathFrac=o.pathFrac==null?1:o.pathFrac;
  const mk=o.markerProg==null?0:o.markerProg;
  const twrDraw=o.twrDraw==null?0:o.twrDraw;
  const mwr=o.mwrProg==null?0:o.mwrProg;

  ctx.textAlign="left";ctx.textBaseline="alphabetic";

  // header

  // grid

  // axes
  ctx.strokeStyle="#3A4C68";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(X0,PT-6);ctx.lineTo(X0,PB+6);ctx.lineTo(X1,PB+6);ctx.stroke();
  ctx.fillStyle="#5A6E8C";ctx.font="12px 'IBM Plex Mono'";
  ctx.fillText("price",X0-4,PT-12);
  ctx.fillText("time →",X1-52,PB+22);

  // fund path (progressive)
  ctx.strokeStyle=F.post;ctx.lineWidth=2.5;
  const upto=Math.max(1,Math.floor(pathFrac*(N-1)));
  ctx.beginPath();ctx.moveTo(PTS[0][0],PTS[0][1]);
  for(let i=1;i<=upto;i++){ctx.lineTo(PTS[i][0],PTS[i][1]);}
  ctx.stroke();
  if(pathFrac>0.55){
    ctx.fillStyle="#5A6E8C";ctx.font="12px 'IBM Plex Mono'";
    ctx.fillText("same fund · same TWR for both",300,64);
  }

  // contribution markers + investor labels
  if(mk>0){
    drawMarker(ctx,badPt,F.wrong,mk,-1);
    drawMarker(ctx,goodPt,F.ok,mk,1);
    ctx.font="13px 'IBM Plex Mono'";
    ctx.globalAlpha=Math.min(1,mk*1.3);
    ctx.fillStyle=F.wrong;ctx.fillText("Bad timer buys peak",210,90);
    ctx.fillStyle=F.ok;ctx.fillText("Good timer buys dip",360,246);
    ctx.globalAlpha=1;
  }

  // returns panel title
  ctx.textAlign="left";ctx.font="13px 'IBM Plex Mono'";ctx.fillStyle="#5A6E8C";
  ctx.fillText("your outcome",RLX,90);

  // TWR reference line
  if(twrDraw>0){
    ctx.strokeStyle=F.post;ctx.lineWidth=2;ctx.setLineDash([6,5]);
    const lx2=RLX+(RLX2-RLX)*Math.min(1,twrDraw);
    ctx.beginPath();ctx.moveTo(RLX,TWRY);ctx.lineTo(lx2,TWRY);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=F.post;ctx.font="12px 'IBM Plex Mono'";ctx.textAlign="right";
    ctx.fillText("TWR = the fund",RLX2,TWRY-6);ctx.textAlign="left";
  }

  // MWR dots diverging
  if(mwr>0){
    const gy=TWRY+(GY-TWRY)*mwr;
    const by=TWRY+(BY-TWRY)*mwr;
    ctx.globalAlpha=0.4;ctx.lineWidth=1;
    ctx.strokeStyle=F.ok;ctx.beginPath();ctx.moveTo(DOTX,TWRY);ctx.lineTo(DOTX,gy);ctx.stroke();
    ctx.strokeStyle=F.wrong;ctx.beginPath();ctx.moveTo(DOTX,TWRY);ctx.lineTo(DOTX,by);ctx.stroke();
    ctx.globalAlpha=1;
    ctx.fillStyle=F.ok;ctx.beginPath();ctx.arc(DOTX,gy,5,0,7);ctx.fill();
    ctx.fillStyle=F.wrong;ctx.beginPath();ctx.arc(DOTX,by,5,0,7);ctx.fill();
    ctx.font="12px 'IBM Plex Mono'";ctx.globalAlpha=Math.min(1,mwr*1.4);
    ctx.fillStyle=F.ok;ctx.fillText("Good MWR ▲",DOTX+12,gy+4);
    ctx.fillStyle=F.wrong;ctx.fillText("Bad MWR ▼",DOTX+12,by+4);
    ctx.globalAlpha=1;
  }

  // takeaway
  if(tk>0){
    ctx.globalAlpha=tk;ctx.font="15px 'IBM Plex Mono'";ctx.textAlign="left";
    ctx.fillStyle=F.post;ctx.fillText("TWR = the fund.",250,352);
    ctx.fillStyle=F.ok;ctx.fillText("MWR = your timing.",430,352);
    ctx.globalAlpha=1;
  }
}

   Five deterministic canvas lessons. Seeded PRNG — every viewer sees the same
   markets, so the narration always matches the pixels. Append-only block. */
(function(){
const W=900,H=380;
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function genPath(seed,n,drift,vol){ // geometric walk, seeded
  const r=rng(seed),out=[100];let x=100;
  for(let i=1;i<n;i++){
    const z=(r()+r()+r()-1.5)*2;          // ~normal-ish
    x=Math.max(20,x*(1+drift+vol*z));out.push(x);
  }
  return out;
}
function sma(a,n){return a.map((_,i)=>i<n-1?null:a.slice(i-n+1,i+1).reduce((s,v)=>s+v,0)/n);}
function ema(a,n){const k=2/(n+1);const out=[a[0]];for(let i=1;i<a.length;i++)out.push(a[i]*k+out[i-1]*(1-k));return out;}
function scaler(arrs,x0,x1,y0,y1){
  const flat=arrs.flat().filter(v=>v!=null);
  const lo=Math.min(...flat),hi=Math.max(...flat),n=Math.max(...arrs.map(a=>a.length));
  return{X:i=>x0+(x1-x0)*i/(n-1),Y:v=>y1-(v-lo)/(hi-lo)*(y1-y0)};
}
function frame(ctx,title){
  clear(ctx,{width:W,height:H});
  ctx.strokeStyle="#3A4C68";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(56,20);ctx.lineTo(56,330);ctx.lineTo(876,330);ctx.stroke();
  ctx.fillStyle=F.txt;ctx.font="15px 'IBM Plex Mono'";ctx.textAlign="left";
  ctx.fillText(title,60,36);
}
function drawSeries(ctx,S,arr,color,frac,w){
  ctx.strokeStyle=color;ctx.lineWidth=w||2;ctx.beginPath();let started=false;
  const upTo=Math.max(2,Math.floor(arr.length*(frac==null?1:frac)));
  for(let i=0;i<upTo;i++){const v=arr[i];if(v==null)continue;
    const x=S.X(i),y=S.Y(v);started?ctx.lineTo(x,y):(ctx.moveTo(x,y),started=true);}
  ctx.stroke();
}
function tag(ctx,S,arr,i,text,color,dy){
  ctx.fillStyle=color;ctx.font="12.5px 'IBM Plex Mono'";
  const tw=((ctx.measureText(text)||{}).width)||text.length*7.2;   // auto-flip to right-align if the label would clip the 900px canvas
  let x=S.X(i)+6, align="left";
  if(x+tw>894){ x=S.X(i)-6; align="right"; }
  ctx.textAlign=align;
  ctx.fillText(text,x,S.Y(arr[i])+(dy||-8));
}
