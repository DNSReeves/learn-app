(function(){
function bayes_dec_bar(ctx,x,w,h,color){ctx.save();ctx.fillStyle=color;ctx.fillRect(x,320-h,w,h);ctx.restore();}
function bayes_dec_draw(ctx,cv,s){clear(ctx,cv);ctx.strokeStyle="#3A4C68";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(120,320);ctx.lineTo(820,320);ctx.stroke();const k=s.k,aProb=0.9,bProb=0.02,aLoss=9/2000,bLoss=1.0,maxH=248;const aH=(aProb*(1-k)+aLoss*k)*maxH,bH=(bProb*(1-k)+bLoss*k)*maxH;const ax=300,bx=560,w=110;bayes_dec_bar(ctx,ax,w,aH,"#7C8DA5");bayes_dec_bar(ctx,bx,w,bH,F.post);ctx.textAlign="center";ctx.font="14px 'IBM Plex Mono'";ctx.fillStyle=F.txt;ctx.fillText("Alarm A",ax+w/2,344);ctx.fillText("Alarm B",bx+w/2,344);ctx.font="13px 'IBM Plex Mono'";const aTop=320-aH,bTop=320-bH;if(k<0.5){ctx.fillStyle="#8CA0BC";ctx.fillText("P = 0.90",ax+w/2,aTop-8);ctx.fillStyle=F.post;ctx.fillText("P = 0.02",bx+w/2,bTop-8);}else{ctx.fillStyle="#8CA0BC";ctx.fillText("$9",ax+w/2,aTop-8);ctx.fillStyle=F.post;ctx.fillText("$2,000",bx+w/2,bTop-8);}ctx.font="16px 'IBM Plex Mono'";ctx.fillStyle=F.txt;ctx.fillText(k<0.5?"ranked by  posterior probability":"ranked by  expected loss = P × cost",470,36);if(s.showCost&&k<0.5){ctx.font="13px 'IBM Plex Mono'";ctx.fillStyle="#5A6E8C";ctx.fillText("trivial fault · costs $10",ax+w/2,72);ctx.fillText("failure · costs $100,000",bx+w/2,72);}}
ANIMS.bayes_decision_static=(cv,ctx)=>bayes_dec_draw(ctx,cv,{k:1,showCost:true});
ANIMS.bayes_decision=async(cv,ctx)=>{bayes_dec_draw(ctx,cv,{k:0,showCost:false});
 await narrate("Two alarms. By posterior probability alone, A screams (90%) and B looks negligible (2%).");
 await tween(600,k=>bayes_dec_draw(ctx,cv,{k:0,showCost:false}));
 await narrate("But a posterior is never a decision. You also need what each outcome costs: A's fault is $10, B's failure is $100,000.");
 await tween(600,k=>bayes_dec_draw(ctx,cv,{k:0,showCost:true}));
 await narrate("Expected loss = probability × cost. A: 0.9×$10 = $9. B: 0.02×$100k = $2,000. The ranking flips.");
 await tween(1400,k=>bayes_dec_draw(ctx,cv,{k:k,showCost:true}));
 await narrate("Investigate B — 220× the expected loss ($2,000 vs $9). Bayes owns the probability; you must supply the payoff. Expected utility is where they meet.");
};
})();

(function(){
/* etf / etf_openclosed */
var TOP=80, BOT=320, NAV=200;
var LX0=100, LX1=340, RX0=560, RX1=800;
var LCX=(LX0+LX1)/2, RCX=(RX0+RX1)/2;
var AMBER="rgba(232,161,60,0.78)";

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function fillWater(ctx,x0,x1,level,amp,phase,color){
  ctx.save();
  ctx.beginPath();
  ctx.rect(x0,TOP,x1-x0,BOT-TOP);
  ctx.clip();
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(x0,BOT);
  for(var x=x0;x<=x1;x+=3){
    var y=level+Math.sin(x*0.06+phase)*amp;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(x1,BOT);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function tankOutline(ctx,x0,x1){
  ctx.strokeStyle="#3A4C68";
  ctx.lineWidth=2;
  roundRect(ctx,x0-4,TOP-4,(x1-x0)+8,(BOT-TOP)+8,8);
  ctx.stroke();
}

function navLine(ctx,x0,x1){
  ctx.strokeStyle=F.prior;
  ctx.lineWidth=1;
  ctx.setLineDash([6,5]);
  ctx.beginPath();ctx.moveTo(x0-4,NAV);ctx.lineTo(x1+4,NAV);ctx.stroke();
  ctx.setLineDash([]);
}

function drawValve(ctx,cx,open){
  ctx.strokeStyle="#3A4C68";ctx.lineWidth=2;
  ctx.fillStyle=open?F.ok:"#2E3D57";
  roundRect(ctx,cx-16,TOP-16,32,16,3);
  ctx.fill();ctx.stroke();
  if(open){
    ctx.strokeStyle=F.ok;ctx.lineWidth=2;
    for(var i=0;i<2;i++){
      var yy=TOP-22-i*8;
      ctx.beginPath();
      ctx.moveTo(cx-6,yy);ctx.lineTo(cx,yy-6);ctx.lineTo(cx+6,yy);
      ctx.stroke();
    }
  }
}

function drawSeal(ctx,cx){
  ctx.fillStyle="#2E3D57";ctx.strokeStyle="#3A4C68";ctx.lineWidth=2;
  roundRect(ctx,cx-20,TOP-12,40,12,3);ctx.fill();ctx.stroke();
  ctx.strokeStyle=F.wrong;ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(cx,TOP-16,5,Math.PI,0);ctx.stroke();
  ctx.fillStyle=F.wrong;
  roundRect(ctx,cx-6,TOP-16,12,9,2);ctx.fill();
}

function drawScene(ctx,cv,st){
  clear(ctx,cv);

  ctx.textAlign="center";
  ctx.fillStyle=F.txt;
  ctx.font="14px 'IBM Plex Mono'";
  ctx.fillText("OPEN-END vs CLOSED-END — the wrapper decides the price",450,22);

  // ---- LEFT: open-end ----
  tankOutline(ctx,LX0,LX1);
  fillWater(ctx,LX0,LX1,st.left,3,st.phL,AMBER);
  navLine(ctx,LX0,LX1);
  drawValve(ctx,LCX,st.valve);
  ctx.fillStyle=F.prior;ctx.textAlign="right";ctx.font="12px 'IBM Plex Mono'";
  ctx.fillText("NAV",LX0-8,NAV+4);
  ctx.textAlign="center";
  ctx.fillStyle=F.txt;ctx.font="13px 'IBM Plex Mono'";
  ctx.fillText("OPEN-END · ETF",LCX,344);
  ctx.fillStyle=F.ok;ctx.font="12px 'IBM Plex Mono'";
  ctx.fillText("CREATE / REDEEM VALVE",LCX,362);

  // ---- RIGHT: closed-end ----
  tankOutline(ctx,RX0,RX1);
  fillWater(ctx,RX0,RX1,st.right,5,st.phR,AMBER);
  if(st.discount && st.right>NAV){
    ctx.fillStyle="rgba(212,106,98,0.30)";
    ctx.fillRect(RX0,NAV,RX1-RX0,st.right-NAV);
    ctx.strokeStyle=F.wrong;ctx.lineWidth=1;
    ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(RX0,st.right);ctx.lineTo(RX1,st.right);ctx.stroke();
    ctx.setLineDash([]);
  }
  navLine(ctx,RX0,RX1);
  drawSeal(ctx,RCX);
  ctx.fillStyle=F.prior;ctx.textAlign="left";ctx.font="12px 'IBM Plex Mono'";
  ctx.fillText("NAV",RX1+8,NAV+4);
  ctx.textAlign="center";
  ctx.fillStyle=F.txt;ctx.font="13px 'IBM Plex Mono'";
  ctx.fillText("CLOSED-END · CEF",RCX,344);
  ctx.fillStyle=F.wrong;ctx.font="12px 'IBM Plex Mono'";
  ctx.fillText("NO VALVE — SEALED",RCX,362);
  if(st.label && st.discount && st.right>NAV){
    ctx.fillStyle=F.txt;ctx.font="13px 'IBM Plex Mono'";
    ctx.fillText("PERSISTENT DISCOUNT",RCX,NAV+(st.right-NAV)/2+4);
  }
}

ANIMS.etf_openclosed=async(cv,ctx)=>{
  var st={left:NAV,right:NAV,phL:0,phR:0,valve:false,discount:false,label:false};
  function frame(){ drawScene(ctx,cv,st); }
  frame();

  await narrate("Two funds can hold the identical basket. The wrapper decides whether the price obeys NAV.");
  await tween(900,function(k){ st.phL=k*6; st.phR=k*6; frame(); });

  await narrate("Demand surges. Buyers bid the price above net asset value in both tanks.");
  await tween(1100,function(k){ st.left=NAV-40*k; st.right=NAV-40*k; st.phL=k*8; st.phR=k*8; frame(); });

  await narrate("Open-end: the create/redeem valve opens. Authorized participants mint shares — arbitrage snaps price back to NAV.");
  st.valve=true; frame();
  await tween(1100,function(k){ st.left=(NAV-40)+40*k; st.phL=8+k*4; frame(); });
  st.valve=false; frame();

  await narrate("Closed-end is sealed. Fixed shares, no valve — sentiment just sloshes the price around.");
  await tween(1400,function(k){ st.right=(NAV-40)+80*k; st.phR=8+k*10; frame(); });

  st.discount=true; st.label=true;
  await narrate("It settles below NAV and stays there: a persistent discount the wrapper can never close.");
  await tween(900,function(k){ st.phR=18+Math.sin(k*6.28)*0.6; frame(); });
  frame();
};

ANIMS.etf_openclosed_static=(cv,ctx)=>{
  var st={left:NAV,right:240,phL:2,phR:3,valve:false,discount:true,label:true};
  drawScene(ctx,cv,st);
};
})();
(function(){
/* etf / etf_etn */
const PX0=70, PX1=620, PY0=310, PY1=60;
const td=0.62;
const barX=700, barW=46, barTop=70, barBot=310;
const LOW=0.035;
const AX="#3A4C68", GRID="#22314a", MUT="#5A6E8C";

function X(t){ return PX0 + t*(PX1-PX0); }
function Y(v){ return PY0 - v*(PY0-PY1); }
function idx(t){ return 0.15 + 0.72*t; }
function etf(t){ return 0.15 + 0.685*t; }

function axes(ctx){
  ctx.strokeStyle=GRID; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){ let gy=PY1+i*(PY0-PY1)/4; ctx.beginPath(); ctx.moveTo(PX0,gy); ctx.lineTo(PX1,gy); ctx.stroke(); }
  ctx.strokeStyle=AX; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(PX0,PY1); ctx.lineTo(PX0,PY0); ctx.lineTo(PX1,PY0); ctx.stroke();
  ctx.fillStyle=MUT; ctx.font="12px 'IBM Plex Mono'";
  ctx.fillText("price", PX0-2, PY1-10);
  ctx.fillText("time", PX1-34, PY0+22);
}

function series(ctx,fn,tMax,color,w){
  if(tMax<=0) return;
  ctx.strokeStyle=color; ctx.lineWidth=w; ctx.beginPath();
  let n=Math.max(2,Math.floor(tMax*120));
  for(let i=0;i<=n;i++){ let t=tMax*i/n; let px=X(t), py=Y(fn(t)); if(i===0)ctx.moveTo(px,py); else ctx.lineTo(px,py); }
  ctx.stroke();
}

function dot(ctx,x,y,c,r){ ctx.fillStyle=c; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); }

function label(ctx,text,x,y,color,size){
  size=size||14; ctx.font=size+"px 'IBM Plex Mono'"; ctx.fillStyle=color;
  let w=text.length*(size*0.6);
  let cx=Math.min(x, 900-w-6); if(cx<4)cx=4;
  ctx.fillText(text,cx,y); return cx;
}

function solvency(ctx,s){
  ctx.strokeStyle=AX; ctx.lineWidth=1.5;
  ctx.strokeRect(barX,barTop,barW,barBot-barTop);
  let h=(barBot-barTop)*Math.max(0,s);
  let col = s>0.5?F.ok : (s>0.2?F.post:F.wrong);
  ctx.fillStyle=col;
  ctx.fillRect(barX, barBot-h, barW, h);
  label(ctx,"Issuer",   barX-6, barTop-24, F.txt,13);
  label(ctx,"solvency", barX-6, barTop-9,  F.txt,13);
  label(ctx, Math.round(Math.max(0,s)*100)+"%", barX+4, barBot+20, col,13);
}

function render(cv,ctx,st){
  clear(ctx,cv); axes(ctx);
  label(ctx,"ETN = unsecured bank debt", 20, 26, F.txt,14);
  series(ctx,idx,st.p,F.prior,5);
  if(st.collapse<=0){
    series(ctx,idx,st.p,F.post,2.5);
    label(ctx,"ETN tracks Index", X(0.42)-40, Y(idx(0.5))-44, F.post,14);
    label(ctx,"0 tracking error", X(0.42)-40, Y(idx(0.5))-27, F.txt,13);
    label(ctx,"ETN + Index", X(st.p)+6, Y(idx(st.p))-2, F.post,13);
  } else {
    series(ctx,idx,td,F.post,2.5);
    let cv0=idx(td);
    let cvNow=cv0*(1-st.collapse)+LOW*st.collapse;
    ctx.strokeStyle=F.wrong; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(X(td),Y(cv0)); ctx.lineTo(X(td),Y(cvNow)); ctx.stroke();
    let tailEnd=td+st.collapse*(1-td);
    ctx.beginPath(); ctx.moveTo(X(td),Y(cvNow)); ctx.lineTo(X(tailEnd),Y(cvNow)); ctx.stroke();
    label(ctx,"Index (rolls on)", X(1)+6, Y(idx(1))+4, F.prior,13);
    label(ctx,"ETN worthless", X(tailEnd)+8, Y(cvNow)-8, F.wrong,13);
    if(st.flash){ dot(ctx,X(td),Y(cv0),F.wrong,4); label(ctx,"DEFAULT", X(td)+8, 210, F.wrong,15); }
  }
  if(st.etf>0){
    series(ctx,etf,st.etf,F.ok,2.5);
    label(ctx,"ETF: held in trust", X(st.etf)-150, Y(etf(st.etf))+18, F.ok,13);
  }
  solvency(ctx,st.s);
}

ANIMS.etf_etn_static=(cv,ctx)=>{
  clear(ctx,cv); axes(ctx);
  label(ctx,"ETN = unsecured bank debt", 20, 26, F.txt,14);
  series(ctx,idx,1,F.prior,5);
  series(ctx,idx,1,F.post,2.5);
  label(ctx,"ETN + Index", X(1)+6, Y(idx(1))-2, F.post,13);
  label(ctx,"ETN tracks Index", X(0.42)-40, Y(idx(0.5))-44, F.post,14);
  label(ctx,"0 tracking error", X(0.42)-40, Y(idx(0.5))-27, F.txt,13);
  solvency(ctx,1);
};

ANIMS.etf_etn=async(cv,ctx)=>{
  let st={p:0,s:1,collapse:0,etf:0,flash:false};
  render(cv,ctx,st);
  await narrate("An ETN isn't a fund — it's a bank's unsecured DEBT note that promises to pay an index.");
  await tween(1400,k=>{ st.p=k; render(cv,ctx,st); });
  await narrate("The appeal: with no holdings to manage, it tracks its index PERFECTLY — zero tracking error.");
  await sleep(300);
  await narrate("But you're an unsecured creditor. Watch the issuer's solvency erode.");
  await tween(1600,k=>{ st.s=1-0.92*k; render(cv,ctx,st); });
  st.flash=true;
  await narrate("Issuer DEFAULTS — the note is only a promise, and the promise is broken.");
  await tween(1500,k=>{ st.collapse=k; render(cv,ctx,st); });
  await narrate("The ETN collapses toward zero while the index rolls on. A real ETF survives — its assets sit in trust.");
  await tween(1400,k=>{ st.etf=k; render(cv,ctx,st); });
  await sleep(400);
};
})();
(function(){
/* etf / etf_cagr */
const PX=80, PW=850, PYt=50, PYb=330;
const vMin=80, vMax=220;
function X(t){ return PX + t*(PW-PX)/10; }
function Y(v){ return PYb - (v-vMin)/(vMax-vMin)*(PYb-PYt); }

const real   =[100,118,108,132,120,145,133,158,150,172,180];
const violent=[100,146, 96,160, 92,176,104,166,122,192,180];

function cagrPts(){ const p=[]; for(let i=0;i<=40;i++){ const t=i/4; p.push({x:X(t), y:Y(100*Math.pow(1.8,t/10))}); } return p; }
function arithPts(){ const p=[]; for(let i=0;i<=40;i++){ const t=i/4; p.push({x:X(t), y:Y(100*Math.pow(1.0742,t))}); } return p; }
function jagPts(arr){ return arr.map((v,i)=>({x:X(i), y:Y(v)})); }

function drawAxes(ctx){
  ctx.save();
  ctx.strokeStyle="#3A4C68"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(PX,PYt); ctx.lineTo(PX,PYb); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(PX,PYb); ctx.lineTo(PW,PYb); ctx.stroke();
  ctx.font="14px 'IBM Plex Mono'";
  const ticks=[100,140,180,220];
  ctx.textAlign="right"; ctx.textBaseline="middle";
  for(const tv of ticks){
    const y=Y(tv);
    ctx.strokeStyle="#22314a";
    ctx.beginPath(); ctx.moveTo(PX,y); ctx.lineTo(PW,y); ctx.stroke();
    ctx.fillStyle="#5A6E8C"; ctx.fillText(String(tv), PX-8, y);
  }
  ctx.textAlign="center"; ctx.textBaseline="top"; ctx.fillStyle="#5A6E8C";
  for(let t=0;t<=10;t+=2){ ctx.fillText(String(t), X(t), PYb+8); }
  ctx.textBaseline="alphabetic"; ctx.textAlign="left";
  ctx.fillText("Portfolio value", PX-10, PYt-16);
  ctx.textAlign="center";
  ctx.fillText("years", (PX+PW)/2, PYb+34);
  ctx.restore();
}

function plotCurve(ctx, pts, k, color, width){
  ctx.save();
  ctx.strokeStyle=color; ctx.lineWidth=width||2; ctx.lineJoin="round"; ctx.lineCap="round";
  ctx.beginPath();
  const total=pts.length-1; const prog=k*total;
  ctx.moveTo(pts[0].x, pts[0].y);
  for(let i=1;i<pts.length;i++){
    if(prog>=i){ ctx.lineTo(pts[i].x, pts[i].y); }
    else {
      const f=prog-(i-1);
      if(f>0){
        ctx.lineTo(pts[i-1].x+(pts[i].x-pts[i-1].x)*f, pts[i-1].y+(pts[i].y-pts[i-1].y)*f);
      }
      break;
    }
  }
  ctx.stroke(); ctx.restore();
}

function shadeDrag(ctx, alpha){
  const c=cagrPts(), a=arithPts();
  ctx.save(); ctx.globalAlpha=alpha; ctx.fillStyle=F.wrong;
  ctx.beginPath();
  ctx.moveTo(a[0].x,a[0].y);
  for(let i=1;i<a.length;i++) ctx.lineTo(a[i].x,a[i].y);
  for(let i=c.length-1;i>=0;i--) ctx.lineTo(c[i].x,c[i].y);
  ctx.closePath(); ctx.fill(); ctx.restore();
}

function dot(ctx, x, y, color){
  ctx.save(); ctx.fillStyle=color; ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2); ctx.fill(); ctx.restore();
}

function label(ctx, text, x, y, color, align){
  ctx.save(); ctx.font="14px 'IBM Plex Mono'"; ctx.fillStyle=color;
  ctx.textAlign=align||"left"; ctx.textBaseline="alphabetic";
  ctx.fillText(text,x,y); ctx.restore();
}

function scene(ctx, cv, st){
  clear(ctx,cv);
  drawAxes(ctx);
  if(st.mode==="compare"){
    if(st.cagrK>0) plotCurve(ctx, cagrPts(), st.cagrK, F.ok, 2.5);
    if(st.violentK>0) plotCurve(ctx, jagPts(violent), st.violentK, F.wrong, 2.2);
    if(st.cagrK>=1) dot(ctx, X(0), Y(100), F.txt);
    if(st.cagrK>=1) dot(ctx, X(10), Y(180), F.txt);
    if(st.labels){
      label(ctx,"smooth ride", X(7)+6, 183, F.ok, "left");
      label(ctx,"violent ride", 700, 100, F.wrong, "left");

(function(){
/* etf / etf_irr */
const N=5, baseY=235, scale=0.2, rMax=0.20, BW=26;
const cfA=[{t:0,a:-100},{t:1,a:-100},{t:2,a:-100},{t:3,a:-100},{t:4,a:-100},{t:5,a:650}];
const cfB=[{t:0,a:-260},{t:1,a:-60},{t:2,a:-60},{t:3,a:-60},{t:4,a:-60},{t:5,a:650}];
function xAt(t){return 120+t*136;}
function npv(cfs,r){let s=0;for(const c of cfs)s+=c.a/Math.pow(1+r,c.t);return s;}
function irrOf(cfs){let lo=0,hi=1;for(let i=0;i<64;i++){const m=(lo+hi)/2;if(npv(cfs,m)>0)lo=m;else hi=m;}return (lo+hi)/2;}
function interp(m){return cfA.map((c,i)=>({t:c.t,a:c.a+(cfB[i].a-c.a)*m}));}
const irrA=irrOf(cfA);

function drawGrid(ctx){
  ctx.strokeStyle="#22314a";ctx.lineWidth=1;
  for(let t=0;t<=N;t++){const x=xAt(t);ctx.beginPath();ctx.moveTo(x,105);ctx.lineTo(x,300);ctx.stroke();}
}
function drawAxis(ctx){
  ctx.strokeStyle="#3A4C68";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(100,baseY);ctx.lineTo(824,baseY);ctx.stroke();
  ctx.fillStyle="#5A6E8C";ctx.font="12px 'IBM Plex Mono'";ctx.textAlign="center";
  for(let t=0;t<=N;t++){const x=xAt(t);ctx.strokeStyle="#3A4C68";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,baseY-3);ctx.lineTo(x,baseY+3);ctx.stroke();ctx.fillText(String(t),x,318);}
  ctx.fillText("time (years)",460,336);
}
function drawBars(ctx,st){
  const r=st.r, grow=(st.grow==null?1:st.grow), hi=st.highlight;
  for(const c of st.cfs){
    const x=xAt(c.t);
    const pv=c.a/Math.pow(1+r,c.t);
    const h=Math.abs(pv)*scale*grow;
    if(c.a>=0){ctx.fillStyle=F.ok;ctx.fillRect(x-BW/2,baseY-h,BW,h);}
    else{ctx.fillStyle=(hi&&c.t===0)?F.wrong:F.prior;ctx.fillRect(x-BW/2,baseY,BW,h);}
    ctx.textAlign="center";ctx.font="11px 'IBM Plex Mono'";ctx.fillStyle=F.txt;
    const val=(pv>=0?"+":"")+Math.round(pv);
    if(grow>0.2){ if(c.a>=0) ctx.fillText(val,x,baseY-h-6); else ctx.fillText(val,x,baseY+h+12); }
  }
}
function drawDial(ctx,r){
  const cx=105,cy=118,rad=58;
  ctx.strokeStyle="#3A4C68";ctx.lineWidth=8;ctx.lineCap="round";
  ctx.beginPath();ctx.arc(cx,cy,rad,Math.PI,2*Math.PI);ctx.stroke();

  ctx.fillStyle=F.txt;ctx.font="14px 'IBM Plex Mono'";ctx.textAlign="center";
  ctx.fillText("r = "+(r*100).toFixed(1)+"%",cx,cy+34);
  ctx.fillStyle="#5A6E8C";ctx.font="11px 'IBM Plex Mono'";
  ctx.fillText("discount rate",cx,cy+50);
}
function drawNPV(ctx,cfs,r){
  const val=npv(cfs,r), x0=360,x1=770,xc=(x0+x1)/2, y=70;
  ctx.strokeStyle="#3A4C68";ctx.lineWidth=6;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke();
  ctx.strokeStyle="#5A6E8C";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(xc,y-12);ctx.lineTo(xc,y+12);ctx.stroke();
  ctx.fillStyle="#5A6E8C";ctx.font="11px 'IBM Plex Mono'";ctx.textAlign="center";
  ctx.fillText("0",xc,y+26);

function drawIRRlabel(ctx){
  ctx.fillStyle=F.post;ctx.font="14px 'IBM Plex Mono'";ctx.textAlign="left";
  ctx.fillText("that rate is your IRR",150,205);

function render(ctx,cv,st){

(function(){

const X0=70,X1=580,PT=70,PB=250;

const ANCH=[[0,0.55],[0.25,0.82],[0.55,0.20],[0.80,0.58],[1,0.85]];
function vAt(t){
  if(t<=0)return ANCH[0][1];
  if(t>=1)return ANCH[ANCH.length-1][1];
  for(let i=0;i<ANCH.length-1;i++){
    const a=ANCH[i],b=ANCH[i+1];
    if(t>=a[0]&&t<=b[0]){
      const u=(t-a[0])/(b[0]-a[0]);
      const s=u*u*(3-2*u);
      return a[1]+(b[1]-a[1])*s;
    }
  }
  return ANCH[ANCH.length-1][1];
}
const N=160,PTS=[];
for(let i=0;i<N;i++){const t=i/(N-1);PTS.push([xOf(t),yOf(vAt(t))]);}

  ctx.globalAlpha=1;
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(p[0],p[1]-r);ctx.lineTo(p[0]+r,p[1]);
  ctx.lineTo(p[0],p[1]+r);ctx.lineTo(p[0]-r,p[1]);
  ctx.closePath();ctx.fill();
}

  }

  // contribution markers + investor labels

  // returns panel title

  }

    ctx.strokeStyle=F.wrong;ctx.beginPath();ctx.moveTo(DOTX,TWRY);ctx.lineTo(DOTX,by);ctx.stroke();

  // takeaway

    ctx.fillStyle=F.ok;ctx.fillText("MWR = your timing.",430,352);
    ctx.globalAlpha=1;
  }
}

   Five deterministic canvas lessons. Seeded PRNG — every viewer sees the same
   markets, so the narration always matches the pixels. Append-only block. */
(function(){
const W=900,H=380;
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function genPath(seed,n,drift,vol){ // geometric walk, seeded
  const r=rng(seed),out=[100];let x=100;
  for(let i=1;i<n;i++){
    const z=(r()+r()+r()-1.5)*2;          // ~normal-ish
    x=Math.max(20,x*(1+drift+vol*z));out.push(x);
  }
  return out;
}
function sma(a,n){return a.map((_,i)=>i<n-1?null:a.slice(i-n+1,i+1).reduce((s,v)=>s+v,0)/n);}
function ema(a,n){const k=2/(n+1);const out=[a[0]];for(let i=1;i<a.length;i++)out.push(a[i]*k+out[i-1]*(1-k));return out;}
function scaler(arrs,x0,x1,y0,y1){
  const flat=arrs.flat().filter(v=>v!=null);
  const lo=Math.min(...flat),hi=Math.max(...flat),n=Math.max(...arrs.map(a=>a.length));
  return{X:i=>x0+(x1-x0)*i/(n-1),Y:v=>y1-(v-lo)/(hi-lo)*(y1-y0)};
}
function frame(ctx,title){
  clear(ctx,{width:W,height:H});
  ctx.strokeStyle="#3A4C68";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(56,20);ctx.lineTo(56,330);ctx.lineTo(876,330);ctx.stroke();
  ctx.fillStyle=F.txt;ctx.font="15px 'IBM Plex Mono'";ctx.textAlign="left";
  ctx.fillText(title,60,36);
}
function drawSeries(ctx,S,arr,color,frac,w){
  ctx.strokeStyle=color;ctx.lineWidth=w||2;ctx.beginPath();let started=false;
  const upTo=Math.max(2,Math.floor(arr.length*(frac==null?1:frac)));
  for(let i=0;i<upTo;i++){const v=arr[i];if(v==null)continue;
    const x=S.X(i),y=S.Y(v);started?ctx.lineTo(x,y):(ctx.moveTo(x,y),started=true);}
  ctx.stroke();
}
function tag(ctx,S,arr,i,text,color,dy){
  ctx.fillStyle=color;ctx.font="12.5px 'IBM Plex Mono'";
  const tw=((ctx.measureText(text)||{}).width)||text.length*7.2;   // auto-flip to right-align if the label would clip the 900px canvas
  let x=S.X(i)+6, align="left";
  if(x+tw>894){ x=S.X(i)-6; align="right"; }
  ctx.textAlign=align;
  ctx.fillText(text,x,S.Y(arr[i])+(dy||-8));
}

/* ---- ta_whipsaw: HOW MONEY IS LOST — fast crossover on a sideways market ----
   Tuned deterministic geometry (harness-verified): market ends +0.3%, the
   crossover trades 10 times and the account ends −21.5%. */
const CHOP=(()=>{const r=rng(1);
  return Array.from({length:238},(_,i)=>100+9*Math.sin(i/7.5)+4*Math.sin(i/2.9)+3*(r()-0.5));})();
const C10=ema(CHOP,10),C30=ema(CHOP,30);
function crossTrades(fast,slow){const t=[];let inPos=false;
  for(let i=1;i<fast.length;i++){
    if(fast[i-1]<=slow[i-1]&&fast[i]>slow[i]&&!inPos){t.push({i,side:"B"});inPos=true;}
    else if(fast[i-1]>=slow[i-1]&&fast[i]<slow[i]&&inPos){t.push({i,side:"S"});inPos=false;}
  }return t;}
const TRADES=crossTrades(C10,C30);
const EQ=(()=>{ // equity of the crossover trader, 25bps round-trip friction each way
  const eq=[100];let inPos=false,ti=0;
  for(let i=1;i<CHOP.length;i++){
    let e=eq[i-1];
    if(inPos)e*=CHOP[i]/CHOP[i-1];
    if(ti<TRADES.length&&TRADES[ti].i===i){e*=0.9975;inPos=TRADES[ti].side==="B";ti++;}
    eq.push(e);
  }return eq;})();

/* ---- ta_discipline: HOW IT IS USED WELL — slow rule + regime filter vs the alternatives ----
   Tuned deterministic market (harness-verified): BH ends 156 at −41% MaxDD;
   naive daily 10/30 ends 156 at −30% with 24 trades (protection bought, the
   whole return edge churned away); disciplined monthly 200d+band ends 172 at
   −21% with 4 trades. */
const MKT=(()=>{const r=rng(102),n=750,out=[100];let x=100;
  for(let i=1;i<n;i++){const inBear=i>n*0.40&&i<n*0.52;
    const d=inBear?-0.0045:0.0014,v=inBear?0.014:0.010;
    const z=(r()+r()+r()-1.5)*2;x=Math.max(20,x*(1+d+v*z));out.push(x);}
  return out;})();
const M200=sma(MKT,200);
function runStrat(px,kind){ // returns equity curve
  const eq=[100];let inPos=true,trades=0;
  const f=kind==="naive"?ema(px,10):null,s=kind==="naive"?ema(px,30):null;
  for(let i=1;i<px.length;i++){
    let e=eq[i-1];
    if(inPos)e*=px[i]/px[i-1];
    let want=inPos;
    if(kind==="naive"){want=f[i]>s[i];}
    if(kind==="disc"){ // monthly check (every 21 bars), 200-day regime line, 1% band
      if(i%21===0&&M200[i]!=null)want=px[i]>M200[i]*0.99?true:(px[i]<M200[i]*0.97?false:want);
    }
    if(want!==inPos){e*=0.9975;trades++;inPos=want;}
    eq.push(e);
  }
  return{eq,trades};
}
function maxdd(a){let peak=a[0],dd=0;for(const v of a){peak=Math.max(peak,v);dd=Math.min(dd,v/peak-1);}return dd;}
const BH={eq:MKT.map(v=>100*v/MKT[0]),trades:0};
const NAI=runStrat(MKT,"naive"),DIS=runStrat(MKT,"disc");

/* ================= Fundamental Analysis module (2026-07-31, fa_*) =================
   Nine deterministic canvas lessons, one per concept. Seeded PRNG where noise is
   used, so every viewer sees the same picture and the narration matches the pixels.
   Append-only block; self-contained helpers. Canvas is 900x380. */
(function(){
const W=900,H=380;
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function scaler(arrs,x0,x1,y0,y1){
  const flat=arrs.flat().filter(v=>v!=null);
  let lo=Math.min(...flat),hi=Math.max(...flat); if(hi===lo)hi=lo+1;
  const n=Math.max(...arrs.map(a=>a.length));
  return{X:i=>x0+(x1-x0)*i/(n-1),Y:v=>y1-(v-lo)/(hi-lo)*(y1-y0),lo,hi,x0,x1,y0,y1};
}
function frame(ctx,title){
  clear(ctx,{width:W,height:H});
  ctx.strokeStyle="#3A4C68";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(56,20);ctx.lineTo(56,330);ctx.lineTo(876,330);ctx.stroke();
  ctx.fillStyle=F.txt;ctx.font="15px 'IBM Plex Mono'";ctx.textAlign="left";ctx.fillText(title,60,36);
}
function line(ctx,S,arr,color,frac,w){
  ctx.strokeStyle=color;ctx.lineWidth=w||2;ctx.beginPath();let started=false;
  const upTo=Math.max(2,Math.floor(arr.length*(frac==null?1:frac)));
  for(let i=0;i<upTo;i++){const v=arr[i];if(v==null)continue;const x=S.X(i),y=S.Y(v);started?ctx.lineTo(x,y):(ctx.moveTo(x,y),started=true);}
  ctx.stroke();
}
function label(ctx,x,y,text,color,align){
  ctx.fillStyle=color;ctx.font="12.5px 'IBM Plex Mono'";
  const tw=((ctx.measureText(text)||{}).width)||text.length*7.2;
  let ax=align||"left", xx=x;
  if(ax==="left" && x+tw>894){ ax="right"; }        // auto-flip if it would clip the canvas
  ctx.textAlign=ax; ctx.fillText(text,xx,y);
}
function dashed(ctx,x0,y0,x1,y1,color){ctx.save();ctx.setLineDash([5,4]);ctx.strokeStyle=color;ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();ctx.restore();}

 {g:20,pe:30,k:"g"},{g:24,pe:38,k:"g"},{g:18,pe:28,k:"g"},{g:27,pe:40,k:"g"},{g:22,pe:34,k:"g"},
 {g:-2,pe:7,k:"trap",tag:"value trap: cheap, shrinking"},{g:12,pe:44,k:"over",tag:"priced for perfection"}];
ANIMS.fa_pe_growth=async(cv,ctx)=>{
  const x0=90,x1=850,y0=50,y1=300, gmin=-5,gmax=30, pmin=0,pmax=48;
  const X=g=>x0+(g-gmin)/(gmax-gmin)*(x1-x0), Y=p=>y1-(p-pmin)/(pmax-pmin)*(y1-y0);
  const axes=()=>{ frame(ctx,"the P/E–growth map: a multiple is a bet on growth");
    ctx.fillStyle=F.txt;ctx.font="12px 'IBM Plex Mono'";ctx.textAlign="center";ctx.fillText("earnings growth →",x1-70,322);
    ctx.save();ctx.translate(70,y0+90);ctx.rotate(-Math.PI/2);ctx.fillText("P/E ratio →",0,0);ctx.restore(); };
  axes();
  await narrate("Every dot is a company. Across: how fast its earnings grow. Up: its price-to-earnings multiple — the dollars you pay per dollar of earnings.");
  await sleep(200);
  // PEG=1 line: pe = g (for g>0)
  await tween(900,k=>{axes();dashed(ctx,X(0),Y(0),X(0+ (30)*k),Y((30)*k),"#8FA1B8");label(ctx,X(26),Y(30)-2,"PEG = 1",F.ax);});
  await narrate("The dashed line is PEG equal to one: P/E matching the growth rate — a rough fair-price rule of thumb. Below it, you're paying less than the growth; above it, more.");
  const plot=(kk)=>{ axes();dashed(ctx,X(0),Y(0),X(30),Y(30),"#8FA1B8");label(ctx,X(26),Y(30)-2,"PEG = 1",F.ax);
    for(let i=0;i<Math.floor(PG.length*kk);i++){const d=PG[i];const col=d.k==="v"?F.ok:d.k==="g"?F.post:F.wrong;
      ctx.fillStyle=col;ctx.beginPath();ctx.arc(X(d.g),Y(d.pe),6,0,7);ctx.fill();
      if(d.tag){ctx.fillStyle=col;ctx.font="11.5px 'IBM Plex Mono'";ctx.textAlign="left";label(ctx,X(d.g)+9,Y(d.pe)+4,d.tag,col);} } };
  await tween(1400,k=>plot(k));
  await narrate("A value cluster sits low-left: cheap multiples, slow growth. A growth cluster sits high-right: rich multiples the market will only pay for real compounding. And two warnings — a stock cheap because it's shrinking, and one priced for perfection well above its growth. The multiple isn't the value; it's the assumption.");
};
ANIMS.fa_pe_growth_static=(cv,ctx)=>{const x0=90,x1=850,y0=50,y1=300,gmin=-5,gmax=30,pmax=48;const X=g=>x0+(g-gmin)/(gmax-gmin)*(x1-x0),Y=p=>y1-(p)/(pmax)*(y1-y0);frame(ctx,"P/E vs. growth — value & growth clusters");dashed(ctx,X(0),Y(0),X(30),Y(30),"#8FA1B8");for(const d of PG){const col=d.k==="v"?F.ok:d.k==="g"?F.post:F.wrong;ctx.fillStyle=col;ctx.beginPath();ctx.arc(X(d.g),Y(d.pe),6,0,7);ctx.fill();}};

/* ---- 4. fa_dcf: future FCF discounted back to a present-value stack ---- */
const DC_FCF=[100,110,121,133,146,161], DC_r=0.10;
const DC_PV=DC_FCF.map((f,i)=>f/Math.pow(1+DC_r,i+1));
const DC_TV=(DC_FCF[5]*1.03/(DC_r-0.03))/Math.pow(1+DC_r,6);   // terminal value, discounted
ANIMS.fa_dcf=async(cv,ctx)=>{
  const y0=90,y1=300, maxv=Math.max(...DC_FCF,DC_TV*0.6), Yv=v=>y1-(v/maxv)*(y1-y0);
  const fx=i=>470+i*62, bw=40;
  const intrinsic=DC_PV.reduce((s,v)=>s+v,0)+DC_TV;
  frame(ctx,"a business is worth its future cash — discounted to today");
  ctx.fillStyle=F.txt;ctx.font="12px 'IBM Plex Mono'";ctx.textAlign="center";ctx.fillText("future free cash flow (yrs 1–6)",620,325);
  await narrate("A business is worth the cash it will hand its owners over its life. Here are six years of projected free cash flow, growing.");
  await tween(900,k=>{frame(ctx,"a business is worth its future cash — discounted to today");ctx.fillStyle=F.txt;ctx.font="12px 'IBM Plex Mono'";ctx.textAlign="center";ctx.fillText("future free cash flow (yrs 1–6)",620,325);for(let i=0;i<DC_FCF.length;i++){const h=(DC_FCF[i]/maxv)*(y1-y0)*k;ctx.fillStyle=F.post;ctx.globalAlpha=.55;ctx.fillRect(fx(i)-bw/2,y1-h,bw,h);ctx.globalAlpha=1;}});
  await narrate("But a dollar in year six is worth less than a dollar today — you'd discount it at your required return, here ten percent. Watch each year shrink to its present value and slide home.");
  const drawAll=(kk)=>{ frame(ctx,"a business is worth its future cash — discounted to today");
    ctx.fillStyle=F.txt;ctx.font="12px 'IBM Plex Mono'";ctx.textAlign="center";ctx.fillText("future free cash flow (yrs 1–6)",620,325);ctx.fillText("intrinsic value",180,325);
    // future bars (faded)
    for(let i=0;i<DC_FCF.length;i++){const h=(DC_FCF[i]/maxv)*(y1-y0);ctx.fillStyle=F.post;ctx.globalAlpha=.25;ctx.fillRect(fx(i)-bw/2,y1-h,bw,h);ctx.globalAlpha=1;}
    // stacked present values on the left, building up
    let stack=0; const sx=180;
    const upTo=Math.floor((DC_PV.length+1)*kk);
    for(let i=0;i<DC_PV.length && i<upTo;i++){const h=(DC_PV[i]/maxv)*(y1-y0);ctx.fillStyle=F.ok;ctx.globalAlpha=.85;ctx.fillRect(sx-30,y1-stack-h,60,h);ctx.globalAlpha=1;stack+=h;}
    if(upTo>DC_PV.length){const h=(DC_TV/maxv)*(y1-y0);ctx.fillStyle="#C77F14";ctx.globalAlpha=.8;ctx.fillRect(sx-30,y1-stack-h,60,h);ctx.globalAlpha=1;stack+=h;label(ctx,sx+36,y1-stack+10,"terminal value",F.post);} };
  await tween(2000,k=>drawAll(k));
  await narrate("Sum the present values, add a terminal value for everything beyond year six — and that stack is intrinsic value. Notice the terminal value dominates: your assumptions about the far future and the discount rate drive the answer. Discounted cash flow is a tool to SEE your assumptions, not a precise oracle.");
};
ANIMS.fa_dcf_static=(cv,ctx)=>{const y0=90,y1=300,maxv=Math.max(...DC_FCF,DC_TV*0.6),fx=i=>470+i*62,bw=40;frame(ctx,"DCF: future cash discounted to intrinsic value");for(let i=0;i<DC_FCF.length;i++){const h=(DC_FCF[i]/maxv)*(y1-y0);ctx.fillStyle=F.post;ctx.globalAlpha=.3;ctx.fillRect(fx(i)-bw/2,y1-h,bw,h);ctx.globalAlpha=1;}let stack=0;for(let i=0;i<DC_PV.length;i++){const h=(DC_PV[i]/maxv)*(y1-y0);ctx.fillStyle=F.ok;ctx.fillRect(150,y1-stack-h,60,h);stack+=h;}const th=(DC_TV/maxv)*(y1-y0);ctx.fillStyle="#C77F14";ctx.fillRect(150,y1-stack-th,60,th);};

/* ---- 5. fa_margin_of_safety: buy below value + mean-revert; vs a value trap ---- */
const MS_V=Array.from({length:200},(_,i)=>100*Math.pow(1.0011,i));
const MS_P=MS_V.map((v,i)=> i<70 ? v*(0.68+0.001*i) : v*Math.min(1,0.74+ (i-70)*0.0037) );  // bought cheap, reverts up to value
const TR_V=Array.from({length:200},(_,i)=>110*Math.pow(0.9945,i));  // intrinsic value DECAYS (dying business)
const TR_P=TR_V.map(v=>v*0.82);  // price cheap vs its own (falling) value — and keeps falling
ANIMS.fa_margin_of_safety=async(cv,ctx)=>{
  const S=scaler([MS_V,MS_P,TR_V],56,876,40,315);
  frame(ctx,"margin of safety — and the trap that mimics it");
  await narrate("Value investing in one picture. The green line is a healthy business's intrinsic value, rising. You buy the orange price low — a wide gap below value.");
  await tween(1300,k=>{frame(ctx,"margin of safety — and the trap that mimics it");line(ctx,S,MS_V,F.ok,k,2.4);});
  await tween(1200,k=>{frame(ctx,"margin of safety — and the trap that mimics it");line(ctx,S,MS_V,F.ok,1,2.4);line(ctx,S,MS_P,F.post,k,2);});
  // shade the margin at the buy point
  const bi=8; ctx.strokeStyle="rgba(95,191,149,.8)";ctx.lineWidth=1.4;dashed(ctx,S.X(bi),S.Y(MS_P[bi]),S.X(bi),S.Y(MS_V[bi]),F.ok);
  label(ctx,S.X(12),(S.Y(MS_P[bi])+S.Y(MS_V[bi]))/2,"margin of safety",F.ok);
  await narrate("That gap is the margin of safety — room to be wrong and still not lose. When the market recognizes the value, price mean-reverts UP to the line. Buy a dollar for seventy cents, collect the thirty.");
  await sleep(300);
  await narrate("But cheap alone is a trap. This red business is ALSO cheap versus its price — except its intrinsic value is DECAYING, a structurally dying company. The multiple was low for a reason; the price just follows value down. A margin of safety needs value that's higher AND durable.");
  await tween(1500,k=>{frame(ctx,"margin of safety — and the trap that mimics it");line(ctx,S,MS_V,F.ok,1,2.4);line(ctx,S,MS_P,F.post,1,2);dashed(ctx,S.X(bi),S.Y(MS_P[bi]),S.X(bi),S.Y(MS_V[bi]),F.ok);label(ctx,S.X(12),(S.Y(MS_P[bi])+S.Y(MS_V[bi]))/2,"margin of safety",F.ok);line(ctx,S,TR_V,F.wrong,k,2.2);label(ctx,S.X(150)+6,S.Y(TR_V[150])-6,"value trap: cheap & decaying",F.wrong);});
};
ANIMS.fa_margin_of_safety_static=(cv,ctx)=>{const S=scaler([MS_V,MS_P,TR_V],56,876,40,315);frame(ctx,"margin of safety vs. the value trap");line(ctx,S,MS_V,F.ok,1,2.4);line(ctx,S,MS_P,F.post,1,2);line(ctx,S,TR_V,F.wrong,1,2.2);};

/* ---- 6. fa_compounding: reinvestment snowball vs payout ---- */
const CO_C=[100],CO_P=[100]; for(let i=1;i<=22;i++){CO_C.push(CO_C[i-1]*1.18); CO_P.push(CO_P[i-1]*1.03);}
ANIMS.fa_compounding=async(cv,ctx)=>{
  const S=scaler([CO_C,CO_P],90,860,40,310);
  frame(ctx,"growth is reinvestment: ROIC × the runway");
  await narrate("Two businesses, same starting value. The grey one pays its earnings out — it inches along at three percent.");
  await tween(1300,k=>{frame(ctx,"growth is reinvestment: ROIC × the runway");line(ctx,S,CO_P,"#5A6E8C",k,2);});
  label(ctx,S.X(21)+6,S.Y(CO_P[21])+4,"pays earnings out",F.ax);
  await narrate("The orange one earns eighteen percent on capital and REINVESTS it — return on invested capital times the reinvestment rate. That's the engine of intrinsic value, and it compounds.");
  await tween(1900,k=>{frame(ctx,"growth is reinvestment: ROIC × the runway");line(ctx,S,CO_P,"#5A6E8C",1,2);label(ctx,S.X(21)+6,S.Y(CO_P[21])+4,"pays earnings out",F.ax);line(ctx,S,CO_C,F.post,k,2.8);});
  label(ctx,S.X(20)+6,S.Y(CO_C[20])-8,"reinvests at 18% ROIC",F.post);
  await narrate("Over two decades the compounder is worth many times the payer. THIS is what growth investors pay up for: a high return reinvested over a long runway. Time is the friend of the wonderful business. The risk — next concept — is overpaying, or the growth failing to show.");
};
ANIMS.fa_compounding_static=(cv,ctx)=>{const S=scaler([CO_C,CO_P],90,860,40,310);frame(ctx,"the reinvestment snowball vs. paying out");line(ctx,S,CO_P,"#5A6E8C",1,2);line(ctx,S,CO_C,F.post,1,2.8);};

/* ---- 7. fa_moat: ROIC persistence vs mean-reversion to WACC ---- */
const MO_W=8;
const MO_MOAT=Array.from({length:180},(_,i)=>18-2*(1-Math.exp(-i/120)));         // stays high ~16-18
const MO_NO=Array.from({length:180},(_,i)=>MO_W+(18-MO_W)*Math.exp(-i/40));       // decays to WACC
ANIMS.fa_moat=async(cv,ctx)=>{
  const S=scaler([[0],[24],MO_MOAT,MO_NO,[MO_W]],56,876,40,315);
  const wy=S.Y(MO_W);
  const base=()=>{ frame(ctx,"the moat is why high returns last");
    ctx.save();ctx.setLineDash([6,4]);ctx.strokeStyle=F.ax;ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(56,wy);ctx.lineTo(876,wy);ctx.stroke();ctx.restore();
    label(ctx,860,wy-6,"cost of capital (WACC) 8%",F.ax,"right"); };
  base();
  await narrate("The dashed line is the cost of capital — the return investors require, eight percent. A business only creates value when its return ON invested capital sits ABOVE it.");
  await sleep(300);
  await narrate("Both companies start earning eighteen percent. But high returns attract competition. Without a defense, that excess is competed away — return on invested capital mean-reverts down to the cost of capital. Economic gravity.");
  await tween(1700,k=>{base();line(ctx,S,MO_NO,F.wrong,k,2.4);});
  label(ctx,S.X(120)+6,S.Y(MO_NO[120])-6,"no moat: reverts to WACC",F.wrong);
  await narrate("A moat — network effects, switching costs, scale, brand — is what RESISTS the gravity. The green company defends its eighteen percent for years. That durable spread above the cost of capital is the whole game, and it's what makes a growth forecast or a DCF terminal value trustworthy.");
  await tween(1700,k=>{base();line(ctx,S,MO_NO,F.wrong,1,2.4);label(ctx,S.X(120)+6,S.Y(MO_NO[120])-6,"no moat: reverts to WACC",F.wrong);line(ctx,S,MO_MOAT,F.ok,k,2.8);});
  label(ctx,S.X(120)+6,S.Y(MO_MOAT[120])-8,"wide moat: ROIC persists",F.ok);
};
ANIMS.fa_moat_static=(cv,ctx)=>{const S=scaler([[0],[24],MO_MOAT,MO_NO,[MO_W]],56,876,40,315);const wy=S.Y(MO_W);frame(ctx,"ROIC persistence: moat vs. mean-reversion");ctx.save();ctx.setLineDash([6,4]);ctx.strokeStyle=F.ax;ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(56,wy);ctx.lineTo(876,wy);ctx.stroke();ctx.restore();line(ctx,S,MO_NO,F.wrong,1,2.4);line(ctx,S,MO_MOAT,F.ok,1,2.8);};

/* ---- 8. fa_value_vs_growth: two equity curves + regime shading ---- */
const VG=(()=>{ // ~30 years, monthly-ish (n=132); regimes flip who leads
  const n=132, val=[100], gro=[100];
  for(let i=1;i<n;i++){ const t=i/n;
    const growLeads = (t>0.30&&t<0.66)||(t>0.86);   // 2010s + late; value leads early + ~2022
    const vg=growLeads? 0.004 : 0.011, gg=growLeads? 0.013 : 0.003;
    val.push(val[i-1]*(1+vg)); gro.push(gro[i-1]*(1+gg));
  } return {val,gro,n}; })();
ANIMS.fa_value_vs_growth=async(cv,ctx)=>{
  const S=scaler([VG.val,VG.gro],56,876,40,315);
  const shade=()=>{ frame(ctx,"value vs. growth: no permanent winner, only regimes");
    const bands=[[0.30,0.66,"growth leads"],[0.86,1.0,"growth"]];
    for(const [a,b] of bands){ ctx.fillStyle="rgba(232,161,60,.09)";ctx.fillRect(S.X((VG.n-1)*a),20,S.X((VG.n-1)*b)-S.X((VG.n-1)*a),300); } };
  shade();
  await narrate("Thirty years, two disciplines. Value: buy cheap relative to worth. Growth: pay for compounding. Watch who leads.");
  await tween(1700,k=>{shade();line(ctx,S,VG.val,F.ok,k,2.4);line(ctx,S,VG.gro,F.post,k,2.4);});
  label(ctx,S.X(VG.n-1)+6,S.Y(VG.val[VG.n-1])+4,"value",F.ok);
  label(ctx,S.X(VG.n-1)+6,S.Y(VG.gro[VG.n-1])+4,"growth",F.post);
  await narrate("Value leads for long stretches, then growth runs away through the low-rate decade — the shaded bands — then value snaps back. Neither wins forever. And notice the mechanism: growth's cash is far in the future, so it's long-duration — cheap money lifts it, rising rates crush it.");
  await sleep(200);
  await narrate("They aren't enemies. Both answer one question — what do you get for the price? A great business bought too dear is a bad investment; a poor one bought cheap enough can be good. Know your lens, and don't overpay in either.");
};
ANIMS.fa_value_vs_growth_static=(cv,ctx)=>{const S=scaler([VG.val,VG.gro],56,876,40,315);frame(ctx,"value vs. growth across regimes");for(const[a,b]of[[0.30,0.66],[0.86,1.0]]){ctx.fillStyle="rgba(232,161,60,.09)";ctx.fillRect(S.X((VG.n-1)*a),20,S.X((VG.n-1)*b)-S.X((VG.n-1)*a),300);}line(ctx,S,VG.val,F.ok,1,2.4);line(ctx,S,VG.gro,F.post,1,2.4);};

/* ---- 9. fa_etf_lens: market earnings yield vs 10y bond yield (the compass) ---- */
const EL=(()=>{ const n=150, ey=[], by=[]; const r=rng(3);
  for(let i=0;i<n;i++){ const t=i/n;
    by.push(Math.max(1.2, 5.2 - 4.0*t + 1.6*Math.sin(t*7) + 0.15*(r()-0.5)));      // bond yield falls then rises
    ey.push(Math.max(3.2, 6.4 - 1.4*t + 1.1*Math.sin(t*5+1) + 0.15*(r()-0.5)));    // earnings yield
  } return {ey,by,n}; })();
ANIMS.fa_etf_lens=async(cv,ctx)=>{
  const S=scaler([EL.ey,EL.by,[0]],56,876,40,315);
  frame(ctx,"the ETF compass: stock earnings yield vs. the bond yield");
  await narrate("You can't run a DCF on five hundred companies. But you can read the whole index's fundamentals. Here's the market's earnings yield — aggregate earnings divided by price.");
  await tween(1400,k=>{frame(ctx,"the ETF compass: stock earnings yield vs. the bond yield");line(ctx,S,EL.ey,F.post,k,2.6);});
  label(ctx,S.X(EL.n-1)+6,S.Y(EL.ey[EL.n-1])+4,"stock earnings yield",F.post);
  await narrate("Against it, the ten-year Treasury yield — what bonds pay for no equity risk.");
  await tween(1400,k=>{frame(ctx,"the ETF compass: stock earnings yield vs. the bond yield");line(ctx,S,EL.ey,F.post,1,2.6);label(ctx,S.X(EL.n-1)+6,S.Y(EL.ey[EL.n-1])+4,"stock earnings yield",F.post);line(ctx,S,EL.by,F.ax,k,2.4);});
  label(ctx,S.X(EL.n-1)+6,S.Y(EL.by[EL.n-1])+4,"10-yr bond yield",F.ax);
  // shade the gap = equity risk premium
  ctx.fillStyle="rgba(95,191,149,.10)"; ctx.beginPath();
  for(let i=0;i<EL.n;i++)ctx.lineTo(S.X(i),S.Y(EL.ey[i])); for(let i=EL.n-1;i>=0;i--)ctx.lineTo(S.X(i),S.Y(EL.by[i])); ctx.fill();
  await narrate("The gap between them is the equity risk premium — roughly, how much extra stocks pay for their risk. Wide gap, stocks look cheap versus bonds; narrow or negative, expensive. It's a compass for EXPECTATIONS, not a market-timing signal. Value and growth ETFs then let you tilt: cheap fundamentals, or fast ones — fundamental analysis, bought by the basket.");
};
ANIMS.fa_etf_lens_static=(cv,ctx)=>{const S=scaler([EL.ey,EL.by,[0]],56,876,40,315);frame(ctx,"ETF compass: earnings yield vs. bond yield");ctx.fillStyle="rgba(95,191,149,.10)";ctx.beginPath();for(let i=0;i<EL.n;i++)ctx.lineTo(S.X(i),S.Y(EL.ey[i]));for(let i=EL.n-1;i>=0;i--)ctx.lineTo(S.X(i),S.Y(EL.by[i]));ctx.fill();line(ctx,S,EL.ey,F.post,1,2.6);line(ctx,S,EL.by,F.ax,1,2.4);};

/* ---- fa_peg: PEG-ratio bars — Peter Lynch's fair-price rule (GARP) ---- */
const PEGS=[{n:"hidden fast-grower",pe:12,g:24},{n:"steady compounder",pe:18,g:22},{n:"fairly-priced grower",pe:20,g:20},{n:"slow stalwart",pe:14,g:7},{n:"hot story stock",pe:45,g:18},{n:"priced for perfection",pe:60,g:25}].map(s=>Object.assign(s,{peg:s.pe/s.g}));
ANIMS.fa_peg=async(cv,ctx)=>{
  const x0=250,xmax=852,pegMax=3,Xp=p=>x0+Math.min(p,pegMax)/pegMax*(xmax-x0),y0=66,rowh=40;
  const base=(upTo)=>{ frame(ctx,"PEG: Peter Lynch's fair-price rule — P/E ÷ growth");
    const x1=Xp(1); dashed(ctx,x1,52,x1,y0+PEGS.length*rowh-8,"#8FA1B8"); label(ctx,x1+5,48,"PEG 1 = fair",F.ax);
    for(let i=0;i<upTo && i<PEGS.length;i++){ const s=PEGS[i],y=y0+i*rowh; const col=s.peg<1?F.ok:s.peg<=1.5?F.post:F.wrong;
      ctx.fillStyle=col;ctx.globalAlpha=.88;ctx.fillRect(x0,y,Xp(s.peg)-x0,22);ctx.globalAlpha=1;
      ctx.fillStyle=F.txt;ctx.font="12px 'IBM Plex Mono'";ctx.textAlign="right";ctx.fillText(s.n,x0-10,y+16);
      ctx.fillStyle=col;label(ctx,Xp(s.peg)+8,y+16,"PEG "+s.peg.toFixed(2)+"  (P/E "+s.pe+" ÷ "+s.g+"%)",col); } };
  base(0);
  await narrate("Peter Lynch's shortcut for a growth stock is the PEG ratio: its price-to-earnings divided by its growth rate. His rule — a fairly-priced grower has a PEG near one, where the P/E equals the growth rate.");
  await tween(1800,k=>base(Math.round(PEGS.length*k)));
  await narrate("Green sits under one: you're paying less than the growth — Lynch's hunting ground, and the hidden fast-grower at half is the classic tenbagger setup. Amber is fair. Red is dear — the hot story and the stock priced for perfection cost two to three times their growth, the good news already in the price.");
  await sleep(200);
  await narrate("Growth at a REASONABLE price: pay for growth, but demand a margin. PEG is a compass, not a verdict — it says nothing about whether the growth will last.");
};
ANIMS.fa_peg_static=(cv,ctx)=>{const x0=250,xmax=852,pegMax=3,Xp=p=>x0+Math.min(p,pegMax)/pegMax*(xmax-x0),y0=66,rowh=40;frame(ctx,"PEG bars — Lynch's fair-price rule");const x1=Xp(1);dashed(ctx,x1,52,x1,y0+PEGS.length*rowh-8,"#8FA1B8");for(let i=0;i<PEGS.length;i++){const s=PEGS[i],y=y0+i*rowh,col=s.peg<1?F.ok:s.peg<=1.5?F.post:F.wrong;ctx.fillStyle=col;ctx.globalAlpha=.88;ctx.fillRect(x0,y,Xp(s.peg)-x0,22);ctx.globalAlpha=1;ctx.fillStyle=F.txt;ctx.font="12px 'IBM Plex Mono'";ctx.textAlign="right";ctx.fillText(s.n,x0-10,y+16);}};
ANIMS._fa_debug={dcfIntrinsic:DC_PV.reduce((s,v)=>s+v,0)+DC_TV, compounderEnd:CO_C[CO_C.length-1], moatEnd:MO_MOAT[MO_MOAT.length-1], noMoatEnd:MO_NO[MO_NO.length-1]};
})();

/* ================= Investment Portfolios module (2026-07-31, pf_*) =================
   Six deterministic canvas lessons. Harness-tuned (pf_tune.js) so every narrated
   number is TRUE of the pixels; ANIMS._pf_debug exposes the computed values.
   Self-contained append-only block — no changes to existing code. */
(function(){
const W=900,H=380;
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const nrmOf=r=>()=>(r()+r()+r()-1.5)*2;
function sdv(a){const m=a.reduce((s,v)=>s+v,0)/a.length;return Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/a.length);}
function mdd(a){let p=a[0],d=0;for(const v of a){p=Math.max(p,v);d=Math.min(d,v/p-1);}return d;}
function scl(arrs,x0,x1,y0,y1){
  const flat=arrs.flat().filter(v=>v!=null);
  const lo=Math.min(...flat),hi=Math.max(...flat),n=Math.max(...arrs.map(a=>a.length));
  return{X:i=>x0+(x1-x0)*i/(n-1),Y:v=>y1-(v-lo)/(hi-lo)*(y1-y0)};
}
function frm(ctx,title){
  clear(ctx,{width:W,height:H});
  ctx.strokeStyle="#3A4C68";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(56,20);ctx.lineTo(56,330);ctx.lineTo(876,330);ctx.stroke();
  ctx.fillStyle=F.txt;ctx.font="15px 'IBM Plex Mono'";ctx.textAlign="left";
  ctx.fillText(title,60,36);
}
function ser(ctx,S,arr,color,frac,w){
  ctx.strokeStyle=color;ctx.lineWidth=w||2;ctx.beginPath();let st=false;
  const upTo=Math.max(2,Math.floor(arr.length*(frac==null?1:frac)));
  for(let i=0;i<upTo;i++){const v=arr[i];if(v==null)continue;
    const x=S.X(i),y=S.Y(v);st?ctx.lineTo(x,y):(ctx.moveTo(x,y),st=true);}
  ctx.stroke();
}
function lgd(ctx,y,c,txt){ctx.fillStyle=c;ctx.font="13px 'IBM Plex Mono'";ctx.textAlign="left";ctx.fillText(txt,64,y);}

/* ---- pf_free_lunch: correlation is the whole game ---- */
function flPaths(rho){
  const r=rng(7),z=nrmOf(r),n=200,ra=[],rb=[];
  for(let i=0;i<n;i++){const z1=z(),z2=rho*z1+Math.sqrt(1-rho*rho)*z();
    ra.push(0.0007+0.012*z1);rb.push(0.0007+0.012*z2);}
  const cum=rr=>{const p=[100];for(const x of rr)p.push(p[p.length-1]*(1+x));return p;};
  const rm=ra.map((v,i)=>(v+rb[i])/2);
  return{A:cum(ra),B:cum(rb),M:cum(rm),ratio:sdv(rm)/((sdv(ra)+sdv(rb))/2)};
}
const FL={hi:flPaths(0.9),mid:flPaths(0.3),lo:flPaths(-0.3)};
ANIMS.pf_free_lunch=async(cv,ctx)=>{
  const draw=(d,label)=>{const S=scl([d.A,d.B,d.M],56,876,40,330);
    frm(ctx,"two assets, one mix — "+label);
    ser(ctx,S,d.A,"#5A6E8C",1,1.4);ser(ctx,S,d.B,"#7C8DA5",1,1.4);ser(ctx,S,d.M,F.ok,1,2.6);
    lgd(ctx,60,F.ok,"50/50 mix — volatility "+Math.round(d.ratio*100)+"% of the average asset's");};
  draw(FL.hi,"correlation +0.9");
  await narrate("Two risky assets and their fifty fifty mix. When the assets move together — correlation point nine — the mix is barely calmer than either alone: ninety-eight percent of their average volatility. Diversification in name only.");
  await sleep(600);
  draw(FL.mid,"correlation +0.3");
  await narrate("Lower the correlation to point three — typical for assets from different classes — and the same mix now carries only eighty-three percent of the volatility. Nothing about the assets changed. Only their relationship did.");
  await sleep(600);
  draw(FL.lo,"correlation −0.3");
  await narrate("At negative correlation the mix smooths dramatically — sixty-four percent. This is the only free lunch in finance: risk partially cancels, return does not. And the fine print: correlations RISE in crises, which is why the later lessons exist.");
};
ANIMS.pf_free_lunch_static=(cv,ctx)=>{
  const d=FL.mid,S=scl([d.A,d.B,d.M],56,876,40,330);
  frm(ctx,"two assets + the 50/50 mix (ρ=0.3)");
  ser(ctx,S,d.A,"#5A6E8C",1,1.4);ser(ctx,S,d.B,"#7C8DA5",1,1.4);ser(ctx,S,d.M,F.ok,1,2.6);
};

/* ---- pf_sequence: same returns, opposite order, withdrawing retiree ---- */
const SEQ_RETS=[22,18,15,12,10,8,-5,-12,-38,25];
function seqRun(order,wd){const eq=[100];let x=100;
  for(const rr of order){x=x*(1+rr/100)-wd;eq.push(Math.max(0,x));if(x<=0)break;}
  return eq;}
const SEQ_BAD=seqRun([...SEQ_RETS].sort((a,b)=>a-b).concat([...SEQ_RETS],[...SEQ_RETS]).slice(0,30),5);
const SEQ_GOOD=seqRun([...SEQ_RETS].sort((a,b)=>b-a).concat([...SEQ_RETS],[...SEQ_RETS]).slice(0,30),5);
ANIMS.pf_sequence=async(cv,ctx)=>{
  const S=scl([SEQ_GOOD,SEQ_BAD,[0]],56,876,40,330);
  const base=(k1,k2)=>{frm(ctx,"the same returns, in opposite order — a retiree withdrawing 5%/yr");
    if(k1)ser(ctx,S,SEQ_GOOD,F.ok,k1,2.2);
    if(k2)ser(ctx,S,SEQ_BAD,F.wrong,k2,2.2);};
  base(0,0);
  await narrate("A retiree withdraws five percent of the starting portfolio every year. Two futures share the IDENTICAL set of annual returns — same average, same total. Only the order differs.");
  await tween(1600,k=>base(k,0));
  lgd(ctx,60,F.ok,"good years first — ends at "+SEQ_GOOD[SEQ_GOOD.length-1].toFixed(0)+" after 30 years");
  await narrate("Good years first: the portfolio compounds ahead of the withdrawals, absorbs the bear market from strength, and ends thirty years later above where it began.");
  await tween(1600,k=>{base(1,k);lgd(ctx,60,F.ok,"good years first — survives 30 years");});
  lgd(ctx,78,F.wrong,"bad years first — RUINED in year "+(SEQ_BAD.length-1));
  await narrate("Bad years first: the same returns, reversed. Withdrawals during the early crash sell depressed assets that never see the recovery — and the portfolio hits ZERO in year "+(SEQ_BAD.length-1)+". Identical returns. Opposite lives. This is sequence risk: for a withdrawing retiree, WHEN returns arrive matters as much as WHAT they average. It is the single risk the growth-duration-convexity design exists to manage.");
};
ANIMS.pf_sequence_static=(cv,ctx)=>{
  const S=scl([SEQ_GOOD,SEQ_BAD,[0]],56,876,40,330);
  frm(ctx,"sequence risk: same returns, opposite order");
  ser(ctx,S,SEQ_GOOD,F.ok,1,2.2);ser(ctx,S,SEQ_BAD,F.wrong,1,2.2);
};

/* ---- pf_three_jobs: growth / duration / convexity through a crash ---- */
const TJ=(()=>{const r=rng(11),z=nrmOf(r),n=320,c0=140,c1=190;
  const g=[100],d=[100],cx=[100];
  for(let i=1;i<n;i++){const inC=i>=c0&&i<c1;
    g.push(g[i-1]*(1+(inC?-0.010:0.0011)+0.010*z()));
    d.push(d[i-1]*(1+(inC?0.0006:0.00022)+0.0016*z()));
    cx.push(cx[i-1]*(1+(inC?0.0068:-0.00028)+0.0028*z()));}
  const port=g.map((_,i)=>100*(0.55*g[i]/g[0]+0.30*d[i]/d[0]+0.15*cx[i]/cx[0]));
  return{g,d,cx,port,c0,c1};})();
ANIMS.pf_three_jobs=async(cv,ctx)=>{
  const S=scl([TJ.g,TJ.d,TJ.cx,TJ.port],56,876,40,330);
  const base=(k1,k2,k3,k4)=>{frm(ctx,"three jobs, one crash");
    if(k1)ser(ctx,S,TJ.g,"#5A6E8C",k1,1.6);
    if(k2)ser(ctx,S,TJ.d,F.post,k2,1.6);
    if(k3)ser(ctx,S,TJ.cx,F.ok,k3,1.6);
    if(k4)ser(ctx,S,TJ.port,"#6fd0ff",k4,2.8);};
  base(0,0,0,0);
  await narrate("A portfolio built by job: fifty-five percent growth, thirty duration, fifteen convexity. Then a real crash arrives in the middle of the window.");
  await tween(1300,k=>base(k,0,0,0));
  lgd(ctx,60,"#5A6E8C","GROWTH — the engine: max drawdown "+Math.round(Math.abs(mdd(TJ.g))*100)+"%");
  await narrate("Growth does what growth does: compounds beautifully, then loses "+Math.round(Math.abs(mdd(TJ.g))*100)+" percent in the crash. Alone, this is the whole portfolio's fate.");
  await tween(1100,k=>{base(1,k,0,0);lgd(ctx,60,"#5A6E8C","GROWTH — max DD "+Math.round(Math.abs(mdd(TJ.g))*100)+"%");});
  lgd(ctx,78,F.post,"DURATION — holds its ground, rises slightly in the flight to safety");
  await narrate("Duration — the bonds defending the spending — barely notices, and firms slightly as money flees to safety.");
  await tween(1100,k=>{base(1,1,k,0);lgd(ctx,60,"#5A6E8C","GROWTH");lgd(ctx,78,F.post,"DURATION");});
  lgd(ctx,96,F.ok,"CONVEXITY — bleeds quietly, then +"+Math.round((TJ.cx[TJ.c1]/TJ.cx[TJ.c0]-1)*100)+"% THROUGH the crash");
  await narrate("And convexity — the brake — bleeds a little through the calm, which is its premium, then pays out "+Math.round((TJ.cx[TJ.c1]/TJ.cx[TJ.c0]-1)*100)+" percent through the crash itself. It is the only line that WANTS the disaster.");
  await tween(1400,k=>{base(1,1,1,k);lgd(ctx,60,"#5A6E8C","GROWTH");lgd(ctx,78,F.post,"DURATION");lgd(ctx,96,F.ok,"CONVEXITY");});
  lgd(ctx,114,"#6fd0ff","THE PORTFOLIO — max DD "+Math.round(Math.abs(mdd(TJ.port))*100)+"% vs growth's "+Math.round(Math.abs(mdd(TJ.g))*100)+"%");
  await narrate("Sum the three jobs and the portfolio's drawdown is "+Math.round(Math.abs(mdd(TJ.port))*100)+" percent — less than half of growth's "+Math.round(Math.abs(mdd(TJ.g))*100)+". Nobody predicted the crash. The SHAPE of the portfolio absorbed it. That is the three-bucket doctrine in one picture: growth compounds, duration defends, convexity reshapes the worst day.");
};
ANIMS.pf_three_jobs_static=(cv,ctx)=>{
  const S=scl([TJ.g,TJ.d,TJ.cx,TJ.port],56,876,40,330);
  frm(ctx,"growth / duration / convexity + the portfolio");
  ser(ctx,S,TJ.g,"#5A6E8C",1,1.6);ser(ctx,S,TJ.d,F.post,1,1.6);
  ser(ctx,S,TJ.cx,F.ok,1,1.6);ser(ctx,S,TJ.port,"#6fd0ff",1,2.8);
};

/* ---- pf_duration: the price-vs-yield curve, duration + convexity ---- */
function bondP(y,c,T){let p=0;for(let t=1;t<=T;t++)p+=c/Math.pow(1+y,t);return p+100/Math.pow(1+y,T);}
const BY0=0.04,BC=3,BT=10,BP0=bondP(BY0,BC,BT);
const BUP=bondP(BY0+0.02,BC,BT),BDN=bondP(BY0-0.02,BC,BT);
ANIMS.pf_duration=async(cv,ctx)=>{
  const ys=[];for(let y=0.005;y<=0.095;y+=0.002)ys.push(y);
  const ps=ys.map(y=>bondP(y,BC,BT));
  const S={X:y=>56+(y-0.005)/0.09*820,Y:p=>330-(p-70)/(135-70)*290};
  const base=(tang)=>{
    frm(ctx,"a 10-year bond: price vs yield — the curve IS the risk");
    ctx.strokeStyle=F.ok;ctx.lineWidth=2.6;ctx.beginPath();
    ys.forEach((y,i)=>i?ctx.lineTo(S.X(y),S.Y(ps[i])):ctx.moveTo(S.X(y),S.Y(ps[i])));ctx.stroke();
    ctx.fillStyle=F.txt;ctx.font="12.5px 'IBM Plex Mono'";ctx.textAlign="center";
    ctx.fillText("yield →",466,352);
    ctx.fillStyle="#6fd0ff";ctx.beginPath();ctx.arc(S.X(BY0),S.Y(BP0),5,0,7);ctx.fill();
    if(tang){ // duration tangent at y0
      const slope=(bondP(BY0+0.001,BC,BT)-bondP(BY0-0.001,BC,BT))/0.002;
      ctx.strokeStyle=F.post;ctx.lineWidth=1.6;ctx.setLineDash([5,4]);ctx.beginPath();
      ctx.moveTo(S.X(BY0-0.03),S.Y(BP0-0.03*slope));ctx.lineTo(S.X(BY0+0.03),S.Y(BP0+0.03*slope));
      ctx.stroke();ctx.setLineDash([]);
    }
  };
  base(false);
  await narrate("Every bond is this curve: its price at every possible yield. Today's position is the dot — a ten-year bond at four percent.");
  base(true);
  await narrate("The slope at the dot is DURATION: roughly eight here, meaning a one-point rate rise costs about eight percent of price. Duration is not jargon — it is literally how steep your hill is.");
  ctx.fillStyle=F.wrong;ctx.font="13px 'IBM Plex Mono'";ctx.textAlign="left";
  ctx.fillText("rates +2pp → "+(BUP-BP0).toFixed(1),S.X(BY0+0.02)+8,S.Y(BUP)+4);
  ctx.fillStyle=F.ok;ctx.fillText("rates −2pp → +"+(BDN-BP0).toFixed(1),S.X(BY0-0.02)-150,S.Y(BDN)+4);
  await narrate("Now look closely at the asymmetry. Rates up two points: the price falls "+Math.abs(BUP-BP0).toFixed(0)+". Rates DOWN two points: it gains "+(BDN-BP0).toFixed(0)+" — more than it lost the other way. That curvature is bond CONVEXITY: the curve bends in the holder's favor, gaining more on rallies than it loses on selloffs. Long bonds have more of both — more slope, more curve. Which is the whole duration bucket in one sentence: powerful medicine, dosed by maturity.");
};
ANIMS.pf_duration_static=(cv,ctx)=>{
  const ys=[];for(let y=0.005;y<=0.095;y+=0.002)ys.push(y);
  const ps=ys.map(y=>bondP(y,BC,BT));
  const S={X:y=>56+(y-0.005)/0.09*820,Y:p=>330-(p-70)/(135-70)*290};
  frm(ctx,"price vs yield: duration = slope, convexity = curvature");
  ctx.strokeStyle=F.ok;ctx.lineWidth=2.6;ctx.beginPath();
  ys.forEach((y,i)=>i?ctx.lineTo(S.X(y),S.Y(ps[i])):ctx.moveTo(S.X(y),S.Y(ps[i])));ctx.stroke();
  ctx.fillStyle="#6fd0ff";ctx.beginPath();ctx.arc(S.X(BY0),S.Y(BP0),5,0,7);ctx.fill();
};

/* ---- pf_crisis_alpha: trend long-short through a crash, honestly ---- */
const CA=(()=>{const r=rng(13),z=nrmOf(r),n=360;
  const eq=[100];
  for(let i=1;i<n;i++){
    let d=(i>=210?0.0016:0.0010),v=0.010;
    if(i>=60&&i<95){d=0.0002;v=0.013;}
    if(i>=150&&i<210){d=-0.0085;v=0.014;}
    eq.push(Math.max(10,eq[i-1]*(1+d+v*z())));}
  const mf=[100];let pos=0;
  for(let i=1;i<n;i++){
    if(i>=8)pos=Math.sign(eq[i-1]/eq[i-8]-1);
    mf.push(mf[i-1]*(1+0.8*pos*(eq[i]/eq[i-1]-1)+0.0001));}
  return{eq,mf,chop0:60,chop1:95,c0:150,c1:210};})();
ANIMS.pf_crisis_alpha=async(cv,ctx)=>{
  const S=scl([CA.eq,CA.mf],56,876,40,330);
  const base=(k1,k2)=>{frm(ctx,"equities vs a trend-follower — same market, opposite crisis");
    if(k1)ser(ctx,S,CA.eq,"#5A6E8C",k1,1.8);
    if(k2)ser(ctx,S,CA.mf,F.ok,k2,2.2);};
  base(0,0);
  await narrate("An equity market: a choppy stretch, a long grind up, then a months-long crash, then recovery. Now run a trend-follower on the same market — long when the trend is up, SHORT when it is down.");
  await tween(1500,k=>base(k,0));
  await tween(1500,k=>base(1,k));
  lgd(ctx,60,F.ok,"trend: −"+Math.round(Math.abs(CA.mf[CA.chop1]/CA.mf[CA.chop0]-1)*100)+"% in the chop (whipsaw) · +"+Math.round((CA.mf[CA.c1]/CA.mf[CA.c0]-1)*100)+"% THROUGH the crash");
  lgd(ctx,78,"#5A6E8C","equities: −"+Math.round(Math.abs(CA.eq[CA.c1]/CA.eq[CA.c0]-1)*100)+"% in the same crash");
  await narrate("Two honest observations. In the trendless chop the trend-follower bleeds "+Math.round(Math.abs(CA.mf[CA.chop1]/CA.mf[CA.chop0]-1)*100)+" percent — whipsaw is the permanent tax on this strategy, and between crises it is boring at best. But through the crash, while equities lose "+Math.round(Math.abs(CA.eq[CA.c1]/CA.eq[CA.c0]-1)*100)+" percent, it flips short and GAINS "+Math.round((CA.mf[CA.c1]/CA.mf[CA.c0]-1)*100)+" percent — because a months-long decline is itself a trend, and this strategy does not care which direction the trend points.");
  await narrate("One caution before the chart oversells it: this window was built crash-heavy to show the mechanism. Across a full century, trend-following's total return is roughly market-like. What you are buying is not extra return — it is WHEN the returns arrive: in the exact months everything else is failing. That is why it lives in the convexity bucket.");
};
ANIMS.pf_crisis_alpha_static=(cv,ctx)=>{
  const S=scl([CA.eq,CA.mf],56,876,40,330);
  frm(ctx,"crisis alpha: trend goes short through the crash");
  ser(ctx,S,CA.eq,"#5A6E8C",1,1.8);ser(ctx,S,CA.mf,F.ok,1,2.2);
};

/* ---- pf_allocation: policy explains the shape ---- */
const AL=(()=>{const r=rng(19),z=nrmOf(r),n=200;
  const pol=[100];const act=[100];
  for(let i=1;i<n;i++){
    const mret=0.0009+0.011*z();
    pol.push(pol[i-1]*(1+mret));
    act.push(act[i-1]*(1+mret+0.004*z()));   // same policy + selection noise
  }
  // R² of active on policy (log returns)
  const lr=a=>a.slice(1).map((v,i)=>Math.log(v/a[i]));
  const x=lr(pol),y=lr(act);
  const mx=x.reduce((s,v)=>s+v,0)/x.length,my=y.reduce((s,v)=>s+v,0)/y.length;
  let sxy=0,sxx=0,syy=0;
  for(let i=0;i<x.length;i++){sxy+=(x[i]-mx)*(y[i]-my);sxx+=(x[i]-mx)**2;syy+=(y[i]-my)**2;}
  return{pol,act,r2:(sxy*sxy)/(sxx*syy)};})();
ANIMS.pf_allocation=async(cv,ctx)=>{
  const S=scl([AL.pol,AL.act],56,876,40,330);
  const base=(k1,k2)=>{frm(ctx,"the policy mix vs the actual fund — who drew this chart?");
    if(k1)ser(ctx,S,AL.pol,F.post,k1,2.6);
    if(k2)ser(ctx,S,AL.act,"#6fd0ff",k2,1.6);};
  base(0,0);
  await narrate("Take a portfolio's POLICY — its asset-class mix, held passively — and plot it.");
  await tween(1400,k=>base(k,0));
  await narrate("Now plot the ACTUAL portfolio: same policy, plus all the stock picking and tactical adjustments layered on top.");
  await tween(1400,k=>base(1,k));
  lgd(ctx,60,F.post,"policy alone");
  lgd(ctx,78,"#6fd0ff","policy + selection/timing — R² = "+(AL.r2*100).toFixed(0)+"%");
  await narrate("The two lines are nearly the same drawing. In this rendering, "+(AL.r2*100).toFixed(0)+" percent of the actual portfolio's movement is explained by the policy alone — which is what Brinson and successors found in real pension data: roughly ninety percent of a portfolio's return VARIABILITY over time traces to the asset-class mix. Note the precise wording — variability, not the return level. The picking decides the wiggle. The allocation decides the life.");
};
ANIMS.pf_allocation_static=(cv,ctx)=>{
  const S=scl([AL.pol,AL.act],56,876,40,330);
  frm(ctx,"policy vs actual — the mix explains ~"+(AL.r2*100).toFixed(0)+"% of the variability");
  ser(ctx,S,AL.pol,F.post,1,2.6);ser(ctx,S,AL.act,"#6fd0ff",1,1.6);
};

// deterministic-math handle (harness/tests assert the narration's numbers)
ANIMS._pf_debug={flRatioHi:FL.hi.ratio,flRatioMid:FL.mid.ratio,flRatioLo:FL.lo.ratio,
  seqBadRuinYear:SEQ_BAD.length-1,seqGoodEnd:SEQ_GOOD[SEQ_GOOD.length-1],

  bondP0:BP0,bondUp2:BUP-BP0,bondDn2:BDN-BP0,
  caMfChop:CA.mf[CA.chop1]/CA.mf[CA.chop0]-1,caMfCrash:CA.mf[CA.c1]/CA.mf[CA.c0]-1,
  caEqCrash:CA.eq[CA.c1]/CA.eq[CA.c0]-1,alR2:AL.r2};
})();


/* ── GENETICS anims (2026-08-01, operator-requested module) ───────────────────
   House rules obeyed here: append-only, canvas 900×380, the F palette, narrate()
   for the spoken line, REDUCED-motion safe via tween()/sleep(). And the lesson the
   TA module taught the hard way — every number spoken is COMPUTED from the data
   that is actually drawn (see ANIMS._gen_debug at the end), never hardcoded prose,
   so a retune can't leave the narration lying. */
const GEN = (()=>{
  /* Punnett: two carriers (Aa × Aa). Counts are derived, not asserted. */
  const punnett = (p1,p2)=>{
    const cells=[]; for(const a of p1) for(const b of p2) cells.push([a,b].sort().join(""));
    const aff=cells.filter(c=>c==="aa").length, car=cells.filter(c=>c==="Aa").length;
    return {cells, aff, car, clear:cells.length-aff-car, n:cells.length};
  };
  /* Polygenic: N loci, each ±small effect, summed over a population. A bell curve
     is the CONSEQUENCE of adding many small independent effects, not an assumption —
     so we actually add them, with a fixed seed for determinism. */
  const lcg=s=>()=>((s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff);
  const polyscores=(nLoci,nPeople,seed)=>{
    const r=lcg(seed), out=[];
    for(let i=0;i<nPeople;i++){ let s=0;
      for(let k=0;k<nLoci;k++) s += (r()<0.5?0:1)+(r()<0.5?0:1);   // two alleles per locus
      out.push(s); }
    return out;
  };
  const hist=(xs)=>{ const h={}; xs.forEach(x=>h[x]=(h[x]||0)+1); return h; };
  const pctile=(xs,p)=>{ const s=xs.slice().sort((a,b)=>a-b); return s[Math.floor(p*(s.length-1))]; };
  /* Bayes on a genetic test — the numbers a real report hides behind "positive". */
  const bayes=(prev,sens,spec,N)=>{
    const dis=Math.round(N*prev), well=N-dis;
    const tp=Math.round(dis*sens), fn=dis-tp;
    const fp=Math.round(well*(1-spec)), tn=well-fp;
    return {N,dis,well,tp,fn,fp,tn,ppv:tp/(tp+fp)};
  };
  const P = punnett(["A","a"],["A","a"]);
  const SCORES = polyscores(20, 4000, 7);
  const H = hist(SCORES);
  const TOPDEC = pctile(SCORES, 0.90);
  /* Scores are DISCRETE, so a cut at the 90th percentile sweeps in everyone tied at
     that value — here that is more than a tenth of the sample. Say the fraction the
     picture actually shows rather than the one we asked for. */
  const TAILN = SCORES.filter(s=>s>=TOPDEC).length;
  const TAILPCT = Math.round(100*TAILN/SCORES.length);
  const MEAN = SCORES.reduce((a,b)=>a+b,0)/SCORES.length;
  /* These mirror the worked example in the concept's own card, deliberately: a student
     who watches the animation and then reads the card must not meet two different sets of
     numbers for the same scenario. Screening = BRCA1 carrier frequency 1/2,000, assay
     sensitivity 99%, per-variant false-positive rate 1/1,000. Diagnostic = same variant,
     prior 10% from family history, confirmed by a second method (specificity 99.99%). */
  const SCREEN = bayes(1/2000, 0.99, 0.999,  100000);
  const DIAG   = bayes(0.10,   0.99, 0.9999, 10000);
  return {P,SCORES,H,TOPDEC,TAILN,TAILPCT,MEAN,SCREEN,DIAG};
})();

function genFrame(ctx,title){
  const cv=ctx.canvas; clear(ctx,cv);
  ctx.fillStyle=F.txt; ctx.font="600 15px system-ui,sans-serif"; ctx.textAlign="left";
  ctx.fillText(title,20,26);
  ctx.strokeStyle="rgba(124,141,165,.25)"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(20,36); ctx.lineTo(880,36); ctx.stroke();
}
function genText(ctx,t,x,y,color,size,align){
  ctx.fillStyle=color||F.txt; ctx.font=(size||13)+"px system-ui,sans-serif";
  ctx.textAlign=align||"left"; ctx.fillText(t,x,y);
}

/* ── 1. central dogma: DNA → mRNA → protein ─────────────────────────────── */
function drawDogma(ctx,cv,{stage=0,title}={}){
  genFrame(ctx,title||"From gene to protein");
  const bases=["A","T","G","C","A","G","T","C","A","T","G","C"], x0=60, dx=46, yTop=100, yBot=140;
  // the double helix, drawn flat: two complementary strands
  const comp={A:"T",T:"A",G:"C",C:"G"};
  bases.forEach((b,i)=>{
    const x=x0+i*dx, unzipped = stage>=1 && i < Math.min(bases.length, Math.round(stage>=1?bases.length:0));
    ctx.strokeStyle="rgba(124,141,165,.5)"; ctx.beginPath();
    ctx.moveTo(x, yTop+8); ctx.lineTo(x, unzipped? yTop+14 : yBot-8); ctx.stroke();
    genText(ctx,b,x,yTop,F.prior,13,"center");
    genText(ctx,comp[b],x,yBot+4,"rgba(124,141,165,.55)",13,"center");
  });
  genText(ctx,"DNA",24,yTop+2,F.txt,12);
  if(stage>=1){                                    // transcription → mRNA (U replaces T)
    const yR=196;
    bases.forEach((b,i)=>{ genText(ctx, b==="T"?"U":b, x0+i*dx, yR, F.post,13,"center"); });
    genText(ctx,"mRNA",20,yR,F.post,12);
    genText(ctx,"transcription — T becomes U",x0,yR-22,"rgba(232,161,60,.75)",11);
  }
  if(stage>=2){                                    // translation → amino acids, 3 bases each
    const yP=272, aa=["Met","Trp","Ser","His"];
    aa.forEach((a,i)=>{
      const x=x0+i*dx*3+dx;
      ctx.fillStyle=F.ok; ctx.beginPath(); ctx.arc(x,yP,15,0,7); ctx.fill();
      genText(ctx,a,x,yP+4,"#0d1117",11,"center");
      if(i) { ctx.strokeStyle=F.ok; ctx.lineWidth=2; ctx.beginPath();
              ctx.moveTo(x-15,yP); ctx.lineTo(x-dx*3+15,yP); ctx.stroke(); }
    });
    genText(ctx,"protein",20,yP+4,F.ok,12);
    genText(ctx,"translation — every 3 bases (a codon) picks 1 amino acid",x0,yP-34,"rgba(95,191,149,.8)",11);
  }
  if(stage>=3){
    genText(ctx,"12 bases ÷ 3 = 4 amino acids — the code is read in triplets, and it is nearly universal across life",
            20,344,F.txt,12);
  }
}
ANIMS.gen_dogma_static=(cv,ctx)=>drawDogma(ctx,cv,{stage:0});
ANIMS.gen_dogma=async(cv,ctx)=>{
  drawDogma(ctx,cv,{stage:0});
  await narrate("A gene is a stretch of DNA — two strands whose letters pair off, A with T and G with C. Nothing about the molecule does anything on its own. It is an instruction, and it has to be read.");
  drawDogma(ctx,cv,{stage:1});
  await narrate("First the strands separate and one is copied into messenger RNA. It is almost the same sequence, with one substitution: where DNA writes T, RNA writes U. This is transcription, and it is where nearly all of the regulation happens — whether a gene is copied at all, and how often.");
  drawDogma(ctx,cv,{stage:2});
  await narrate("Then the message is read three letters at a time. Each triplet — a codon — specifies one amino acid, and the amino acids chain into a protein. Twelve bases here become four amino acids.");
  drawDogma(ctx,cv,{stage:3});
  await narrate("That is the central dogma. But notice what it does not say: it does not say one gene makes one protein. Splicing lets a single gene produce many different proteins, which is how twenty thousand genes build something as complicated as you.");
};

/* ── 2. Mendelian inheritance: the Punnett square, counted not claimed ──── */
function drawPunnett(ctx,cv,{shown=0,title}={}){
  genFrame(ctx,title||"Two carriers — what the odds actually are");
  const x0=300,y0=90,s=76;
  genText(ctx,"parent 1  (Aa — a carrier)",x0+s,72,F.txt,12,"center");
  ctx.save(); ctx.translate(x0-58,y0+s); ctx.rotate(-Math.PI/2);
  genText(ctx,"parent 2  (Aa — a carrier)",0,0,F.txt,12,"center"); ctx.restore();
  ["A","a"].forEach((b,i)=>genText(ctx,b,x0+i*s+s/2,y0-8,F.prior,14,"center"));
  ["A","a"].forEach((b,i)=>genText(ctx,b,x0-16,y0+i*s+s/2+5,F.prior,14,"center"));
  GEN.P.cells.forEach((c,i)=>{
    const cx=x0+(i%2)*s, cy=y0+Math.floor(i/2)*s;
    const on = i < shown;
    const col = c==="aa" ? F.wrong : (c==="Aa" ? F.post : F.ok);
    ctx.fillStyle = on ? col+"33" : "rgba(124,141,165,.07)";
    ctx.fillRect(cx,cy,s-6,s-6);
    ctx.strokeStyle="rgba(124,141,165,.35)"; ctx.strokeRect(cx,cy,s-6,s-6);
    if(on){ genText(ctx,c,cx+(s-6)/2,cy+34,col,17,"center");
            genText(ctx, c==="aa"?"affected":(c==="Aa"?"carrier":"clear"),
                    cx+(s-6)/2,cy+54,col,11,"center"); }
  });
  if(shown>=4){
    const pc=n=>Math.round(100*n/GEN.P.n);
    genText(ctx,"affected  "+GEN.P.aff+"/"+GEN.P.n+" = "+pc(GEN.P.aff)+"%",560,140,F.wrong,13);
    genText(ctx,"carrier   "+GEN.P.car+"/"+GEN.P.n+" = "+pc(GEN.P.car)+"%",560,166,F.post,13);
    genText(ctx,"clear     "+GEN.P.clear+"/"+GEN.P.n+" = "+pc(GEN.P.clear)+"%",560,192,F.ok,13);
    genText(ctx,"Per pregnancy — independently, every time.",560,228,F.txt,12);
    genText(ctx,"Three unaffected children do not 'use up' the risk.",560,248,"rgba(215,223,234,.7)",11);
  }
}
ANIMS.gen_punnett_static=(cv,ctx)=>drawPunnett(ctx,cv,{shown:0});
ANIMS.gen_punnett=async(cv,ctx)=>{
  drawPunnett(ctx,cv,{shown:0});
  await narrate("Both parents carry one working copy of a gene and one broken copy. Neither is ill — one good copy is enough. This is what a recessive carrier is.");
  for(let i=1;i<=4;i++){ drawPunnett(ctx,cv,{shown:i}); await sleep(650); }
  const pc=n=>Math.round(100*n/GEN.P.n);
  await narrate("Each parent passes one copy at random, so there are four equally likely combinations. "+
    pc(GEN.P.aff)+" percent of the time the child inherits both broken copies and is affected. "+
    pc(GEN.P.car)+" percent of the time the child is a carrier like the parents. "+
    pc(GEN.P.clear)+" percent of the time the child inherits neither.");
  await narrate("The trap is the word chance. This resets at every pregnancy. Three healthy children do not use up the twenty-five percent — the fourth pregnancy carries exactly the same odds as the first. Coins have no memory, and neither does meiosis.");
};

/* ── 3. polygenic traits: the bell curve is a RESULT, and the PRS tail ──── */
function drawPoly(ctx,cv,{reveal=0,tail=false,title}={}){
  genFrame(ctx,title||"Why most traits are bell-shaped");
  const ks=Object.keys(GEN.H).map(Number).sort((a,b)=>a-b);
  const maxN=Math.max(...ks.map(k=>GEN.H[k])), x0=70,x1=830,yB=300;
  const sx=k=>x0+(k-ks[0])/(ks[ks.length-1]-ks[0])*(x1-x0);
  ctx.strokeStyle="rgba(124,141,165,.35)"; ctx.beginPath();
  ctx.moveTo(x0-10,yB); ctx.lineTo(x1+10,yB); ctx.stroke();
  const upto = ks[0] + reveal*(ks[ks.length-1]-ks[0]);
  ks.forEach(k=>{
    if(k>upto) return;
    const h=(GEN.H[k]/maxN)*200, x=sx(k), w=(x1-x0)/ks.length*0.8;
    const inTail = tail && k>=GEN.TOPDEC;
    ctx.fillStyle = inTail ? F.wrong : "rgba(124,141,165,.55)";
    ctx.fillRect(x-w/2, yB-h, w, h);
  });
  genText(ctx,"← fewer risk variants",x0,yB+22,"rgba(215,223,234,.6)",11);
  genText(ctx,"more risk variants →",x1,yB+22,"rgba(215,223,234,.6)",11,"right");
  genText(ctx,"20 genes, each contributing a little. 4,000 people.",x0,60,F.txt,12);
  if(tail){
    ctx.strokeStyle=F.wrong; ctx.setLineDash([4,4]); ctx.beginPath();
    ctx.moveTo(sx(GEN.TOPDEC)-6,yB-215); ctx.lineTo(sx(GEN.TOPDEC)-6,yB); ctx.stroke(); ctx.setLineDash([]);
    genText(ctx,"highest-scoring "+GEN.TAILPCT+"% — "+GEN.TAILN+" people",sx(GEN.TOPDEC)+8,yB-200,F.wrong,12);
    genText(ctx,"A polygenic score just says where on this axis you sit.",x0,342,F.txt,12);
  }
}
ANIMS.gen_polygenic_static=(cv,ctx)=>drawPoly(ctx,cv,{reveal:1});
ANIMS.gen_polygenic=async(cv,ctx)=>{
  drawPoly(ctx,cv,{reveal:0});
  await narrate("Height, blood pressure, cholesterol, diabetes risk — none of these is one gene. Here are twenty genes, each nudging a trait by a tiny amount, across four thousand simulated people.");
  await tween(1400,k=>drawPoly(ctx,cv,{reveal:k}));
  await narrate("Nobody imposed a bell curve on this picture. It appeared. Add up many small independent effects and you get this shape every time — that is the whole reason most human traits are distributed the way they are, with almost everyone near the middle.");
  drawPoly(ctx,cv,{reveal:1,tail:true});
  await narrate("A polygenic risk score does one thing: it tells you where on this axis you sit. The "+GEN.TAILN+" people in the highest-scoring "+GEN.TAILPCT+" percent here carry meaningfully more risk variants than average.");
  await narrate("But read that carefully. It is a position in a population, not a diagnosis. Most people in that red tail will never get the disease, and plenty of cases will come from the middle of the curve — which is exactly why these scores are useful for populations and weak for individuals.");
};

/* ── 4. reading a positive test: prior × penetrance, with real counts ───── */
function drawBayesTest(ctx,cv,{which="screen",stage=0,title}={}){
  const B = which==="screen" ? GEN.SCREEN : GEN.DIAG;
  genFrame(ctx,title||"What a positive result actually means");
  const lab = which==="screen" ? "Population screening — no family history, 1 in 2,000 carry it"
                               : "Strong family history — a risk model puts the prior at 10%";
  const sub = which==="screen" ? "99% sensitivity, false positives 1 in 1,000. "
                               : "99% sensitivity, confirmed by a second method (99.99% specificity). ";
  genText(ctx,lab,20,60,F.txt,13);
  genText(ctx,sub+B.N.toLocaleString()+" women tested.",20,80,"rgba(215,223,234,.7)",12);
  if(stage>=1){
    genText(ctx,"truly have the variant",60,124,F.txt,12);
    genText(ctx,B.dis.toLocaleString(),330,124,F.post,14,"right");
    genText(ctx,"do not",60,148,F.txt,12);
    genText(ctx,B.well.toLocaleString(),330,148,"rgba(215,223,234,.7)",14,"right");
  }
  if(stage>=2){
    ctx.strokeStyle="rgba(124,141,165,.25)"; ctx.beginPath();
    ctx.moveTo(20,168); ctx.lineTo(880,168); ctx.stroke();
    genText(ctx,"TRUE positives  (have it, test says yes)",60,196,F.ok,12);
    genText(ctx,B.tp.toLocaleString(),330,196,F.ok,14,"right");
    genText(ctx,"FALSE positives (don't have it, test says yes)",60,220,F.wrong,12);
    genText(ctx,B.fp.toLocaleString(),330,220,F.wrong,14,"right");
  }
  if(stage>=3){
    const ppv=(B.ppv*100);
    ctx.fillStyle="rgba(232,161,60,.10)"; ctx.fillRect(420,180,440,120);
    genText(ctx,"If your result says POSITIVE:",440,210,F.txt,13);
    ctx.fillStyle=F.post; ctx.font="700 34px system-ui,sans-serif"; ctx.textAlign="left";
    ctx.fillText(ppv.toFixed((ppv<10||ppv>99)?1:0)+"%",440,258);
    genText(ctx,"chance you actually carry it",530,256,F.txt,13);
    genText(ctx,B.tp.toLocaleString()+" true ÷ ("+B.tp.toLocaleString()+" + "+B.fp.toLocaleString()+" false)",440,286,"rgba(215,223,234,.75)",12);
  }
}
ANIMS.gen_bayes_test_static=(cv,ctx)=>drawBayesTest(ctx,cv,{which:"screen",stage:0});
ANIMS.gen_bayes_test=async(cv,ctx)=>{
  drawBayesTest(ctx,cv,{which:"screen",stage:0});
  await narrate("A genetic test comes back positive. The obvious question is what that means. The answer depends almost entirely on something the report does not print: how likely you were to carry it before you tested.");
  drawBayesTest(ctx,cv,{which:"screen",stage:1});
  await narrate("Screen a hundred thousand women for a BRCA1 variant that one in two thousand carries. About "+GEN.SCREEN.dis+" of them truly have it. The other "+GEN.SCREEN.well.toLocaleString()+" do not.");
  drawBayesTest(ctx,cv,{which:"screen",stage:2});
  await narrate("The assay is excellent. It correctly flags "+GEN.SCREEN.tp+" of the "+GEN.SCREEN.dis+" real carriers. But even a false-positive rate of one in a thousand, applied to that enormous healthy group, produces "+GEN.SCREEN.fp.toLocaleString()+" more flags — and those women get the same letter.");
  drawBayesTest(ctx,cv,{which:"screen",stage:3});
  const s=(GEN.SCREEN.ppv*100), d=(GEN.DIAG.ppv*100);
  await narrate("So a positive here means about a "+s.toFixed(0)+" percent chance she actually carries it. Two of every three positives are wrong, from an excellent test. Nothing is broken — the false positives are simply drawn from a vastly larger pool.");
  drawBayesTest(ctx,cv,{which:"diag",stage:3});
  await narrate("Now change one thing. Same variant, same letter — but her mother and aunt had breast cancer before fifty, so the prior is ten percent, and the lab confirmed the call by a second method. That positive now means about "+d.toFixed(1)+" percent. The DNA did not change. The prior and the assay did. Which is why who gets tested matters as much as the test itself.");
};
