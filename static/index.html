  };
  const base=()=>{frame(ctx,"EMA vs SMA — same 40-day length, different memory");drawSeries(ctx,S,STEP,"#5A6E8C",1,1.4);weights(1);};
  frame(ctx,"EMA vs SMA — same 40-day length, different memory");drawSeries(ctx,S,STEP,"#5A6E8C",1,1.4);
  await narrate("A clean experiment: price sits flat, then steps up eighteen percent and holds. Watch how two forty-day averages digest the same news.");
  await tween(900,k=>{frame(ctx,"EMA vs SMA — same 40-day length, different memory");drawSeries(ctx,S,STEP,"#5A6E8C",1,1.4);weights(k);});
  await narrate("The simple average weights all forty days equally — then forgets each one off a cliff. The exponential moving average weights the newest day most, with weights decaying by a constant factor: two divided by N plus one.");
  await tween(1500,k=>{base();drawSeries(ctx,S,SE_S,F.ok,k,2.4);});
  await narrate("The simple average takes forty full days to absorb the step.");
  await tween(1500,k=>{base();drawSeries(ctx,S,SE_S,F.ok,1,2.4);drawSeries(ctx,S,SE_E,F.post,k,2.4);});
  await narrate("The exponential average covers most of the same ground in a third of the time — same nominal length, faster response. The cost is symmetry: it reacts faster to noise too. Faster is not better; faster is a choice.");
};
ANIMS.ta_ema_static=(cv,ctx)=>{
  const S=scaler([STEP,[95],[122]],56,620,40,330);
  frame(ctx,"EMA vs SMA — same length, different memory");
  drawSeries(ctx,S,STEP,"#5A6E8C",1,1.4);drawSeries(ctx,S,SE_S,F.ok,1,2.4);drawSeries(ctx,S,SE_E,F.post,1,2.4);
};

/* ---- ta_whipsaw: HOW MONEY IS LOST — fast crossover on a sideways market ----
   Tuned deterministic geometry (harness-verified): market ends +0.3%, the
   crossover trades 10 times and the account ends −21.5%. */
const CHOP=(()=>{const r=rng(1);
  return Array.from({length:238},(_,i)=>100+9*Math.sin(i/7.5)+4*Math.sin(i/2.9)+3*(r()-0.5));})();
const C10=ema(CHOP,10),C30=ema(CHOP,30);
function crossTrades(fast,slow){const t=[];let inPos=false;
  for(let i=1;i<fast.length;i++){
    if(fast[i-1]<=slow[i-1]&&fast[i]>slow[i]&&!inPos){t.push({i,side:"B"});inPos=true;}
    else if(fast[i-1]>=slow[i-1]&&fast[i]<slow[i]&&inPos){t.push({i,side:"S"});inPos=false;}
  }return t;}
const TRADES=crossTrades(C10,C30);
const EQ=(()=>{ // equity of the crossover trader, 25bps round-trip friction each way
  const eq=[100];let inPos=false,ti=0;
  for(let i=1;i<CHOP.length;i++){
    let e=eq[i-1];
    if(inPos)e*=CHOP[i]/CHOP[i-1];
    if(ti<TRADES.length&&TRADES[ti].i===i){e*=0.9975;inPos=TRADES[ti].side==="B";ti++;}
    eq.push(e);
  }return eq;})();
ANIMS.ta_whipsaw=async(cv,ctx)=>{
  const S=scaler([CHOP],56,876,40,200);
  const SE=scaler([EQ,[88]],56,876,225,325);
  const base=(k1,k2,k3)=>{
    frame(ctx,"how money is lost: a fast crossover system in a sideways market");
    drawSeries(ctx,S,CHOP,"#5A6E8C",1,1.3);
    if(k1)drawSeries(ctx,S,C10,F.post,k1,1.8),drawSeries(ctx,S,C30,F.ok,k1,1.8);
    if(k2)for(const t of TRADES.slice(0,Math.floor(TRADES.length*k2))){
      ctx.fillStyle=t.side==="B"?F.ok:F.wrong;ctx.font="13px 'IBM Plex Mono'";ctx.textAlign="center";
      ctx.fillText(t.side==="B"?"▲":"▼",S.X(t.i),S.Y(CHOP[t.i])+(t.side==="B"?16:-10));}
    if(k3){ctx.fillStyle="#8FA1B8";ctx.font="12.5px 'IBM Plex Mono'";ctx.textAlign="left";
      ctx.fillText("the trader's account (after 25bps per trade)",60,240);
      drawSeries(ctx,SE,EQ,F.wrong,k3,2.2);}
  };
  base(0,0,0);
  await narrate("A market going nowhere: two hundred fifty days of pure chop, ending where it began. Now hand it to a popular system — buy when the fast average crosses above the slow, sell when it crosses below.");
  await tween(1200,k=>base(k,0,0));
  await narrate("Every triangle is a trade the crossover demanded.");
  await tween(1800,k=>base(1,k,0));
  ctx.fillStyle=F.txt;ctx.font="14px 'IBM Plex Mono'";ctx.textAlign="right";
  ctx.fillText(TRADES.length+" trades — price went NOWHERE",872,56);
  await narrate(TRADES.length+" trades in a year, each one paying spread, commission drag and, in a taxable account, short term capital gains. The price ended flat. Watch the account.");
  await tween(2000,k=>{base(1,1,k);ctx.fillStyle=F.txt;ctx.font="14px 'IBM Plex Mono'";ctx.textAlign="right";ctx.fillText(TRADES.length+" trades — price went NOWHERE",872,56);});
  ctx.fillStyle=F.wrong;ctx.font="14px 'IBM Plex Mono'";ctx.textAlign="right";
  ctx.fillText("account: "+(EQ[EQ.length-1]-100).toFixed(1)+"% · market: 0%",872,320);
  await narrate("Down "+Math.abs(EQ[EQ.length-1]-100).toFixed(0)+" percent while the market lost nothing. Every whipsaw was the system working exactly as designed — in the wrong regime. This is the base rate of naive technical trading: the signal was real, the discipline about WHEN to use it was missing. Our own ninety-nine-year study measured the same tax: a fast trend rule traded sixty-nine round trips and fifty percent annual turnover for its protection.");
};
ANIMS.ta_whipsaw_static=(cv,ctx)=>{
  const S=scaler([CHOP],56,876,40,200);
  const SE=scaler([EQ,[88]],56,876,225,325);
  frame(ctx,"fast crossovers in chop: "+TRADES.length+" trades, market flat, account down");
  drawSeries(ctx,S,CHOP,"#5A6E8C",1,1.3);drawSeries(ctx,S,C10,F.post,1,1.8);drawSeries(ctx,S,C30,F.ok,1,1.8);
  for(const t of TRADES){ctx.fillStyle=t.side==="B"?F.ok:F.wrong;ctx.font="13px 'IBM Plex Mono'";ctx.textAlign="center";ctx.fillText(t.side==="B"?"▲":"▼",S.X(t.i),S.Y(CHOP[t.i])+(t.side==="B"?16:-10));}
  drawSeries(ctx,SE,EQ,F.wrong,1,2.2);
};

/* ---- ta_discipline: HOW IT IS USED WELL — slow rule + regime filter vs the alternatives ----
   Tuned deterministic market (harness-verified): BH ends 156 at −41% MaxDD;
   naive daily 10/30 ends 156 at −30% with 24 trades (protection bought, the
   whole return edge churned away); disciplined monthly 200d+band ends 172 at
   −21% with 4 trades. */
const MKT=(()=>{const r=rng(102),n=750,out=[100];let x=100;
  for(let i=1;i<n;i++){const inBear=i>n*0.40&&i<n*0.52;
    const d=inBear?-0.0045:0.0014,v=inBear?0.014:0.010;
    const z=(r()+r()+r()-1.5)*2;x=Math.max(20,x*(1+d+v*z));out.push(x);}
  return out;})();
const M200=sma(MKT,200);
function runStrat(px,kind){ // returns equity curve
  const eq=[100];let inPos=true,trades=0;
  const f=kind==="naive"?ema(px,10):null,s=kind==="naive"?ema(px,30):null;
  for(let i=1;i<px.length;i++){
    let e=eq[i-1];
    if(inPos)e*=px[i]/px[i-1];
    let want=inPos;
    if(kind==="naive"){want=f[i]>s[i];}
    if(kind==="disc"){ // monthly check (every 21 bars), 200-day regime line, 1% band
      if(i%21===0&&M200[i]!=null)want=px[i]>M200[i]*0.99?true:(px[i]<M200[i]*0.97?false:want);
    }
    if(want!==inPos){e*=0.9975;trades++;inPos=want;}
    eq.push(e);
  }
  return{eq,trades};
}
function maxdd(a){let peak=a[0],dd=0;for(const v of a){peak=Math.max(peak,v);dd=Math.min(dd,v/peak-1);}return dd;}
const BH={eq:MKT.map(v=>100*v/MKT[0]),trades:0};
const NAI=runStrat(MKT,"naive"),DIS=runStrat(MKT,"disc");
ANIMS.ta_discipline=async(cv,ctx)=>{
  const all=[BH.eq,NAI.eq,DIS.eq];
  const S=scaler(all,56,876,40,330);
  const leg=(y,c,txt)=>{ctx.fillStyle=c;ctx.font="13px 'IBM Plex Mono'";ctx.textAlign="left";ctx.fillText(txt,64,y);};
  const base=(k1,k2,k3)=>{
    frame(ctx,"the same market, three temperaments");
    if(k1)drawSeries(ctx,S,BH.eq,"#5A6E8C",k1,1.8);
    if(k2)drawSeries(ctx,S,NAI.eq,F.wrong,k2,1.8);
    if(k3)drawSeries(ctx,S,DIS.eq,F.ok,k3,2.4);
  };
  base(0,0,0);
  await narrate("About three years of price: a genuine uptrend with a real bear market buried in the middle. Three investors, one market.");
  await tween(1400,k=>base(k,0,0));
  leg(60,"#5A6E8C","buy & hold — rides the full drawdown: "+(maxdd(BH.eq)*100).toFixed(0)+"%");
  await narrate("Buy and hold earns the trend and eats the entire bear: a "+Math.abs(maxdd(BH.eq)*100).toFixed(0)+" percent drawdown, held all the way down.");
  await tween(1400,k=>{base(1,k,0);leg(60,"#5A6E8C","buy & hold — max drawdown "+(maxdd(BH.eq)*100).toFixed(0)+"%");});
  leg(78,F.wrong,"naive daily crossover — "+NAI.trades+" trades, edge churned away");
  await narrate("The naive daily crossover trader trades "+NAI.trades+" times. The rule genuinely cuts the bear — drawdown "+Math.abs(maxdd(NAI.eq)*100).toFixed(0)+" percent instead of "+Math.abs(maxdd(BH.eq)*100).toFixed(0)+" — but look where the account ENDS: dead even with buy and hold. Twenty-four whipsaws and their costs churned away every dollar the protection earned.");
  await tween(1600,k=>{base(1,1,k);leg(60,"#5A6E8C","buy & hold — max drawdown "+(maxdd(BH.eq)*100).toFixed(0)+"%");leg(78,F.wrong,"naive daily crossover — "+NAI.trades+" trades");});
  leg(96,F.ok,"disciplined: monthly check · 200-day line · band — "+DIS.trades+" trades, max DD "+(maxdd(DIS.eq)*100).toFixed(0)+"%");
  await narrate("The disciplined rule checks once a month against the two-hundred-day line, with a band so borderline readings don't churn. "+DIS.trades+" trades total. It gives up a little of the top and sidesteps the heart of the bear: max drawdown "+Math.abs(maxdd(DIS.eq)*100).toFixed(0)+" percent versus "+Math.abs(maxdd(BH.eq)*100).toFixed(0)+".");
  await narrate("Same tools, opposite outcomes. The edge was never the indicator — it was the cadence, the confirmation band, and committing to the rule before the market tested it. Slow, boring, and pre-registered beats fast, clever, and improvised.");
};
ANIMS.ta_discipline_static=(cv,ctx)=>{
  const all=[BH.eq,NAI.eq,DIS.eq];
  const S=scaler(all,56,876,40,330);
  frame(ctx,"buy&hold vs naive crossover vs disciplined trend");
  drawSeries(ctx,S,BH.eq,"#5A6E8C",1,1.8);drawSeries(ctx,S,NAI.eq,F.wrong,1,1.8);drawSeries(ctx,S,DIS.eq,F.ok,1,2.4);
};
// deterministic-math handle (harness/tests assert the narration's numbers)
ANIMS._ta_debug={whipsawTrades:TRADES.length,whipsawEq:EQ[EQ.length-1],
  naiTrades:NAI.trades,discTrades:DIS.trades,
  ddBH:maxdd(BH.eq),ddNai:maxdd(NAI.eq),ddDisc:maxdd(DIS.eq),
  bhEnd:BH.eq[BH.eq.length-1],naiEnd:NAI.eq[NAI.eq.length-1],discEnd:DIS.eq[DIS.eq.length-1]};
})();
