<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learn</title>
<meta name="theme-color" content="#16243A">
<meta name="description" content="Adaptive concept mastery — spaced review, checkpoints, offline review of what you've mastered.">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Learn">
<script>
/* Service worker REMOVED 2026-07-30 (operator: "rip it out entirely"). The PWA
   offline cache caused recurring iOS Safari staleness that outweighed its benefit;
   the app now always loads fresh from the server. On every load we proactively
   unregister any SW a device still has and drop all its caches — belt-and-suspenders
   with the self-destruct /sw.js — so a previously-cached worker cannot linger. */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
}
if (window.caches && caches.keys) {
  caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ECEFF3; --panel:#FFFFFF; --ink:#16243A; --dim:#5B6B80;
  --prior:#7C8DA5; --post:#E8A13C; --post-deep:#C77F14; --wrong:#B3423A;
  --ok:#2E7D5B; --line:#C9D2DE; --lock:#AEB9C7;
  --r:10px; --shadow:0 1px 2px rgba(22,36,58,.08),0 8px 24px rgba(22,36,58,.07);
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.6 "IBM Plex Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"IBM Plex Serif",serif;line-height:1.25;font-weight:600}
.mono{font-family:"IBM Plex Mono",monospace}
a{color:var(--post-deep)}
button{font:inherit;cursor:pointer;border:0;border-radius:8px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--post-deep);outline-offset:2px}
.btn{background:var(--ink);color:#fff;padding:10px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.warm{background:var(--post);color:var(--ink)}
/* AFTER the variants on purpose. `.btn:disabled` and `.btn.ghost` have EQUAL
   specificity (0,2,0), so whichever is written last wins — with the disabled rule
   first, a disabled ghost button kept its enabled appearance and the only cue left
   was `cursor:default`, which does not exist on a touch device. Opacity + the lock
   colour are stated on the variants too, so the cue survives regardless of class. */
.btn:disabled,.btn.ghost:disabled,.btn.warm:disabled{
  background:var(--lock);color:#fff;border-color:var(--lock);opacity:.55;cursor:default}
input{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;width:100%;background:#fff;color:var(--ink)}

/* ---------- shell ---------- */
#top{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1.5px solid var(--line)}
#top .wordmark{font-family:"IBM Plex Serif",serif;font-weight:600;font-size:20px;letter-spacing:.2px}
#top .wordmark em{font-style:normal;color:var(--post-deep)}
#top .spacer{flex:1}
#top .who{color:var(--dim);font-size:14px}
main{max-width:1060px;margin:0 auto;padding:26px 20px 80px}

/* ---------- auth ---------- */
.auth{max-width:380px;margin:9vh auto 0;background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:30px}
.auth h1{font-size:30px;margin-bottom:4px}
.auth p{color:var(--dim);margin-bottom:20px;font-size:15px}
.auth form>*{margin-bottom:12px}
.auth .err{color:var(--wrong);font-size:14px;min-height:20px}
.auth .swap{background:none;color:var(--dim);text-decoration:underline;padding:4px 0}

/* ---------- dashboard ---------- */
.dash h1{font-size:34px;margin-bottom:2px}
.dash .sub{color:var(--dim);margin-bottom:26px}
.tcard{display:block;width:100%;text-align:left;background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 24px;margin-bottom:16px;color:var(--ink);border:1.5px solid transparent}
.cat-head{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);margin:30px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:8px;
  /* CATEGORY COLLAPSE (2026-08-01): the header is now a real <button> so it is
     keyboard-reachable and screen-reader-announced; these reset the UA button look. */
  width:100%;background:none;border-top:0;border-left:0;border-right:0;text-align:left;font-family:inherit;cursor:pointer}
.cat:first-child .cat-head{margin-top:6px}
.cat-head:hover{color:var(--fg)}
.cat-head:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.cat-count{font-weight:600;font-size:11px;color:var(--lock)}
.cat-chev{display:inline-block;width:10px;font-size:10px;transition:transform .15s ease;color:var(--lock)}
@media (prefers-reduced-motion: reduce){.cat-chev{transition:none}}
/* the due-review roll-up: the ONE signal that must survive collapsing, or a student
   with reviews due sees a tidy list and misses them. */
.cat-due{margin-left:auto;font-weight:700;font-size:11px;color:var(--due,#d9a441);text-transform:none;letter-spacing:0}
/* Expanded (default) shows every body. Collapsed hides all but the categories the
   student opened — clicking a header toggles just that one. */
.cats[data-mode="collapsed"] .cat:not([data-open="1"]) .cat-body{display:none}
.cats[data-mode="collapsed"] .cat:not([data-open="1"]) .cat-chev{transform:rotate(-90deg)}
.cats[data-mode="collapsed"] .cat-head{margin-top:14px}
.catbar{display:flex;justify-content:flex-end;gap:8px;margin:2px 0 -8px}
.catbar button[disabled]{opacity:.45;cursor:default;pointer-events:none}
.catbar button{background:none;border:1px solid var(--line);color:var(--dim);font:inherit;font-size:12px;
  padding:4px 10px;border-radius:7px;cursor:pointer}
.catbar button:hover{color:var(--fg);border-color:var(--lock)}
.tcard:hover{border-color:var(--post)}
.tcard h2{font-size:27px;font-weight:800}
.tcard .tag{color:var(--dim);font-size:15px;margin:2px 0 14px}
.meterline{display:flex;align-items:center;gap:12px}
.meterline .bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meterline .bar i{display:block;height:100%;background:var(--post);border-radius:4px}
.meterline .num{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--dim);white-space:nowrap}
.due-pill{background:var(--post);color:var(--ink);font-size:12.5px;font-weight:600;border-radius:99px;padding:2px 10px;margin-left:8px}

/* ---------- topic: ladder + stage ---------- */
.topic{display:grid;grid-template-columns:280px 1fr;gap:24px}
.ladder{align-self:start;background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.rung{display:flex;gap:10px;width:100%;text-align:left;background:none;padding:10px;border-radius:8px;align-items:flex-start;color:var(--ink)}
.rung:hover:not(:disabled){background:var(--paper)}
.rung:disabled{color:var(--lock);cursor:default}
.rung.active{background:var(--paper);box-shadow:inset 3px 0 0 var(--post)}
.rung .dot{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-size:12px;margin-top:2px;background:#fff}
.rung.done .dot{background:var(--post);border-color:var(--post);color:var(--ink);font-weight:600}
.rung.relearn .dot{border-color:#d97706;color:#d97706;font-weight:600}
.rung .rt{font-size:14.5px;line-height:1.35;font-weight:500}
.rung .rp{font-size:12px;color:var(--dim);font-family:"IBM Plex Mono",monospace}
.rung .flag{font-size:11.5px;color:var(--post-deep);font-weight:600}

/* ---------- posterior strip (signature) ---------- */
.strip{background:var(--ink);color:#fff;border-radius:var(--r);padding:16px 20px;margin-bottom:18px}
.strip .lab{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#B9C4D4;display:flex;justify-content:space-between}
.strip .lab .mono{color:var(--post)}
.strip .track{position:relative;height:16px;background:#2A3A54;border-radius:8px;margin:10px 0 6px;overflow:visible}
.strip .fill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--prior),var(--post));border-radius:8px;transition:width .9s cubic-bezier(.22,.9,.3,1)}
.strip .gate{position:absolute;top:-5px;bottom:-5px;width:2px;background:#fff9;border-radius:1px}
.strip .gate::after{content:"gate";position:absolute;top:-16px;left:-12px;font-size:10px;color:#B9C4D4;font-family:"IBM Plex Mono",monospace}
.strip .foot{display:flex;justify-content:space-between;font-size:12.5px;color:#B9C4D4}
.pips{display:inline-flex;gap:5px;vertical-align:middle}
.pips i{width:9px;height:9px;border-radius:50%;background:#2A3A54;display:inline-block}
.pips i.on{background:var(--post)}

/* ---------- concept stage ---------- */
.stage{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:26px 30px}
.stage .kicker{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.stage h2{font-size:27px;margin:2px 0 18px}
.card-body{font-size:16.5px}
.card-body h3{font-size:19px;margin:14px 0 6px}
.card-body p{margin:0 0 12px}
.card-body ul{margin:0 0 12px 22px}
.card-body li{margin-bottom:4px}
.card-body strong{font-weight:600}
.card-body .big{font-family:"IBM Plex Serif",serif;font-size:21px;text-align:center;background:var(--paper);border-radius:8px;padding:12px;margin:14px 0}
.pager{display:flex;align-items:center;gap:14px;margin-top:22px;padding-top:16px;border-top:1.5px solid var(--line)}
.pager .crumbs{display:flex;gap:6px}
.pager .crumbs i{width:26px;height:5px;border-radius:3px;background:var(--line)}
.pager .crumbs i.on{background:var(--post)}
.pager .spacer{flex:1}

/* ---------- checkpoint ---------- */
.qprompt{font-size:17.5px;font-weight:500;margin-bottom:14px}
.opt{display:block;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:9px;color:var(--ink);font-size:15.5px}
.opt:hover:not(:disabled){border-color:var(--prior)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:#E7F2ED}
.opt.wrongpick{border-color:var(--wrong);background:#F7E9E8}
.fb{border-left:3px solid var(--prior);padding:10px 14px;margin:12px 0;background:var(--paper);border-radius:0 8px 8px 0;font-size:15.5px}
.fb.good{border-color:var(--ok)}
.fb.bad{border-color:var(--wrong)}
.delta{font-family:"IBM Plex Mono",monospace;font-size:13.5px;color:var(--dim);margin-bottom:10px}
.delta b{color:var(--post-deep)}
.mastered-banner{background:linear-gradient(100deg,var(--post),#F3C67A);border-radius:8px;padding:14px 18px;font-weight:600;margin:12px 0}

/* ---------- animation player ---------- */
.player{background:var(--ink);border-radius:var(--r);padding:14px;margin:16px 0}
.player canvas{width:100%;border-radius:6px;display:block;background:#0F1A2C}
.player .bar2{display:flex;align-items:center;gap:10px;margin-top:10px}
.player .bar2 .cap{color:#D7DFEA;font-size:14px;flex:1;line-height:1.45;min-height:40px}
.player button{background:#2A3A54;color:#fff;padding:8px 14px;font-weight:600}
.player button[aria-pressed="true"]{background:var(--post);color:var(--ink)}

/* ---------- resources ---------- */
.res{margin-top:20px;border-top:1.5px solid var(--line);padding-top:14px}
.res h3{font-size:16px;margin-bottom:10px}
.res .item{display:flex;gap:10px;margin-bottom:10px;font-size:14.5px}
.res .badge{flex:none;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1.5px solid var(--line);border-radius:5px;padding:1px 7px;height:fit-content;margin-top:2px;color:var(--dim)}
.res .note{color:var(--dim)}

.notice{background:var(--panel);border-left:3px solid var(--post);border-radius:0 8px 8px 0;box-shadow:var(--shadow);padding:12px 16px;margin-bottom:14px;font-size:15px}

@media (max-width:820px){
  .topic{grid-template-columns:1fr}
  .ladder{display:flex;overflow-x:auto;gap:4px;padding:10px}
  .rung{flex:none;width:200px}
  .stage{padding:20px 18px}
}
@media (prefers-reduced-motion:reduce){
  .strip .fill{transition:none}
}

/* ---------- completion + certificate (2026-08-04) ---------- */
.celebrate{text-align:center;padding:44px 24px}
.celebrate h1{font-size:34px;margin-bottom:6px}
.celebrate .sub{color:var(--dim);max-width:52ch;margin:0 auto 22px}
.celebrate .laurel{font-size:52px;line-height:1;margin-bottom:14px}
.cstats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 auto 26px;max-width:640px}
.cstat{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 18px;min-width:120px}
.cstat b{display:block;font-family:"IBM Plex Mono",monospace;font-size:22px;color:var(--post-deep)}
.cstat span{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.namebox{max-width:420px;margin:0 auto 22px;text-align:left}
.namebox label{display:block;font-size:13px;color:var(--dim);margin-bottom:6px}

/* The certificate. Landscape, engraved double rule, drawn seal — no images, so
   it prints identically offline and survives any asset host going away. */
.certwrap{padding:24px 16px 60px;display:flex;flex-direction:column;align-items:center;gap:18px}
.cert{
  width:min(100%,1000px);aspect-ratio:1.4142/1;   /* A4 landscape */
  background:
    radial-gradient(circle at 12% 14%, rgba(232,161,60,.07), transparent 42%),
    radial-gradient(circle at 88% 86%, rgba(232,161,60,.07), transparent 42%),
    #FCFBF7;
  color:#16243A;position:relative;padding:5.2% 6.4%;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  box-shadow:0 2px 6px rgba(22,36,58,.10),0 22px 60px rgba(22,36,58,.14);
  border:1px solid #D9C79A;
}
.cert::before,.cert::after{content:"";position:absolute;pointer-events:none}
.cert::before{inset:14px;border:2.5px solid #C9A227}          /* outer engraved rule */
.cert::after{inset:22px;border:1px solid #D9C79A}             /* inner hairline */
.cert .corner{position:absolute;width:34px;height:34px;border:0 solid #C9A227;opacity:.9}
.cert .corner.tl{top:24px;left:24px;border-top-width:3px;border-left-width:3px}
.cert .corner.tr{top:24px;right:24px;border-top-width:3px;border-right-width:3px}
.cert .corner.bl{bottom:24px;left:24px;border-bottom-width:3px;border-left-width:3px}
.cert .corner.br{bottom:24px;right:24px;border-bottom-width:3px;border-right-width:3px}
.cert .issuer{font-family:"IBM Plex Serif",serif;font-size:clamp(13px,1.5vw,17px);
  letter-spacing:.34em;text-transform:uppercase;color:#8A6D1F;margin-bottom:2px}
.cert .rule{width:56px;height:2px;background:#C9A227;margin:10px auto 14px}
.cert .kicker{font-family:"IBM Plex Serif",serif;font-style:italic;
  font-size:clamp(13px,1.6vw,18px);color:#5B6B80}
.cert .who{font-family:"IBM Plex Serif",serif;font-weight:600;
  font-size:clamp(26px,4.6vw,52px);line-height:1.12;margin:6px 0 4px;
  border-bottom:1.5px solid #D9C79A;padding:0 .4em .12em}
.cert .what{font-family:"IBM Plex Serif",serif;font-size:clamp(16px,2.3vw,27px);
  font-weight:600;margin:14px 0 2px;max-width:22ch}
.cert .tag{color:#5B6B80;font-size:clamp(11px,1.35vw,15px);max-width:46ch}
.cert .standard{margin-top:auto;font-size:clamp(10px,1.15vw,13px);color:#5B6B80;
  max-width:60ch;line-height:1.5}
.cert .standard b{color:#16243A}
.cert .feet{width:100%;display:flex;align-items:flex-end;justify-content:space-between;
  gap:16px;margin-top:14px}
.cert .sig{flex:1;text-align:center}
.cert .sigline{border-top:1.2px solid #16243A;margin:0 auto 5px;width:min(100%,230px)}
.cert .signame{font-family:"IBM Plex Serif",serif;font-size:clamp(11px,1.3vw,15px);font-weight:600}
.cert .sigrole{font-size:clamp(9px,1.05vw,11px);color:#5B6B80;text-transform:uppercase;letter-spacing:.08em}
.cert .seal{flex:0 0 auto;width:clamp(74px,10vw,116px);opacity:.95}
.cert .vcode{position:absolute;bottom:30px;left:0;right:0;font-family:"IBM Plex Mono",monospace;
  font-size:clamp(8px,.95vw,10px);color:#8A6D1F;letter-spacing:.1em}
.certactions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.certnote{color:var(--dim);font-size:13px;max-width:56ch;text-align:center}

/* Print: the certificate alone, edge to edge, colors intact. */
@media print{
  @page{size:A4 landscape;margin:8mm}
  #top,#ladder,.certactions,.certnote,#toast{display:none !important}
  body{background:#fff}
  .certwrap{padding:0;display:block}
  .cert{width:100%;max-width:none;aspect-ratio:auto;height:calc(100vh - 16mm);
    box-shadow:none;border:1px solid #C9A227;break-inside:avoid;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header id="top">
  <span class="wordmark">Learn<em>.</em></span>
  <span class="spacer"></span>
  <span class="who" id="who"></span>
  <button class="btn ghost" id="signout" hidden>Sign out</button>
</header>
<main id="main"></main>

<script>
/* ================= tiny infrastructure ================= */
const $ = s => document.querySelector(s);
const main = $("#main");
let TOKEN = sessionStorage.getItem("learn_token") || "";   // Phase A: sessionStorage, not localStorage — each app launch = login (shared-device safe)
let ROLE = sessionStorage.getItem("learn_role") || "learner";   // P5.20 author-UI gate (server 403 is the real gate)
const api = async (path, opts={}) => {
  const r = await fetch("/api"+path, {...opts,
    headers:{"Content-Type":"application/json", Authorization:"Bearer "+TOKEN, ...(opts.headers||{})},
    body: opts.body ? JSON.stringify(opts.body) : undefined});
  if (r.status===401 && path!=="/login" && path!=="/register"){ signout(); throw new Error("signin"); }
  const data = await r.json().catch(()=>({}));
  if (!r.ok){ const e=new Error(data.detail || "Request failed"); e.status=r.status; throw e; }
  return data;
};
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));   /* null-safe: a missing field (e.g. resource note) must never throw + abort a render */
/* Transient status line (2026-08-04, added with certificates): a failure the
   learner should see but that must not replace the screen they are on. */
let _toastT=null;
function toast(msg, ms=3600){
  let el=$("#toast");
  if(!el){ el=document.createElement("div"); el.id="toast"; document.body.appendChild(el);
           el.style.cssText="position:fixed;left:50%;bottom:22px;transform:translateX(-50%);"+
             "background:#16243A;color:#fff;padding:10px 16px;border-radius:8px;z-index:60;"+
             "box-shadow:0 8px 24px rgba(22,36,58,.28);max-width:min(90vw,460px);font-size:14px"; }
  el.textContent=msg; el.style.display="block";
  clearTimeout(_toastT); _toastT=setTimeout(()=>{ el.style.display="none"; }, ms);
}
/* minimal markdown: ## big line, ### h3, **bold**, - lists, blank-line paragraphs */
function md(src){
  const blocks = src.split(/\n\n+/).map(b=>{
    b=b.trim();
    /* FE-9: fenced code block ```…``` (single block, no internal blank line) */
    if (b.startsWith("```")) return `<pre class="mono" style="background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;overflow-x:auto;font-size:12.5px;line-height:1.45;margin:0 0 12px"><code>${esc(b.replace(/^```[^\n]*\n?/,"").replace(/\n?```\s*$/,""))}</code></pre>`;
    if (b.startsWith("## ")) return `<div class="big">${inline(b.slice(3))}</div>`;
    if (b.startsWith("### ")) return `<h3>${inline(b.slice(4))}</h3>`;
    if (/^(\d+\.|-)\s/m.test(b)){
      const items=b.split("\n").map(l=>`<li>${inline(l.replace(/^(\d+\.|-)\s*/,""))}</li>`).join("");
      return b.match(/^\d+\./)?`<ol style="margin:0 0 12px 22px">${items}</ol>`:`<ul>${items}</ul>`;
    }
    return `<p>${inline(b).replace(/\n/g,"<br>")}</p>`;
  });
  return blocks.join("");
  /* Backslash escapes (2026-08-05, operator: "some cards in the investment area show
     a slash before the $"). This renderer never handled them, so an authored \\$50.10
     printed its backslash, and genetics' star alleles printed CYP2C9\\*2 instead of
     CYP2C9*2. Escapes are lifted out BEFORE emphasis and put back after, because the
     packs legitimately wrap an escaped star in italics — *CYP2C9\\*2* must come out as
     an italic CYP2C9*2, which a naive strip-the-backslash pass would turn into a
     mangled emphasis run.

     The escapable set deliberately excludes & < > " : esc() has already turned those
     into entities, so a restored literal could otherwise re-introduce raw HTML. */
  function inline(t){
    const lit=[];
    let s=esc(t).replace(/\\([\\`*_{}\[\]()#+\-.!$~|])/g,(_,c)=>`\u0000${lit.push(c)-1}\u0000`);
    s=s.replace(/`([^`]+)`/g,'<code class="mono" style="background:var(--line);padding:1px 5px;border-radius:4px;font-size:.9em">$1</code>')
       .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
       .replace(/\*(.+?)\*/g,"<em>$1</em>");
    return s.replace(/\u0000(\d+)\u0000/g,(_,i)=>lit[+i]);
  }   /* FE-9: inline `code` */
}

/* Phase A: idle auto-sign-out (~60 min) — a shared device shouldn't stay logged in. Any

let _idleTimer=null;

/* ================= history routing (2026-08-05) =================
   THE BUG: this app had NO history management at all — no pushState, no
   popstate, no hashchange, nothing. (The one `history.push(...)` in the
   checkpoint is a local answer-log array, not the History API.) So the browser
   / iPad Back button could only do one thing: leave the app. It then LOOKED
   like Back worked in some modules and not others, because the server-side
   RESUME would sometimes drop you back at your last concept on reload and
   sometimes at the dashboard.

   THE FIX, without rewriting 40 call sites: the view functions themselves
   record where they are. Every existing caller — in-app Back buttons, ladder
   rungs, "Continue", the resume path — keeps working untouched, and each one
   now leaves a history entry behind it. Back then walks:

       card N → card N-1 → concept → topic → all topics

   Function declarations hoist, so these wrappers are installed before the
   boot-time route() call below even runs.

   Deep links and reloads land where you were, which is the same mechanism. */
let _replaying = false;                 // true while re-rendering FROM history

function _hashFor(view, a, b, c){
  switch(view){
    case "topics":  return "#/topics";
    case "topic":   return `#/t/${a}`;
    case "card":    return `#/t/${a}/c/${b}/${c}`;
    case "check":   return `#/t/${a}/c/${b}/check`;
    case "review":  return `#/t/${a}/review`;
    case "cert":    return `#/t/${a}/cert`;
    default:        return "#/topics";
  }
}
function _mark(hash){
  // Never write history while replaying it, and never stack a duplicate entry —
  // a duplicate is what makes one Back press look like it did nothing.
  if(_replaying || !TOKEN || location.hash === hash) return;
  try{ history.pushState({h:hash}, "", location.pathname + location.search + hash); }
  catch(_){ /* routing is a convenience; never let it break a lesson */ }
}
function parseHash(h){
  const m = (h || location.hash || "").replace(/^#\/?/, "").split("/").filter(Boolean);
  if(!m.length) return null;
  if(m[0] === "topics") return {view:"topics"};
  if(m[0] === "t" && m[1]){
    const tid = decodeURIComponent(m[1]);
    if(m[2] === "review") return {view:"review", tid};
    if(m[2] === "cert")   return {view:"cert", tid};
    if(m[2] === "c" && m[3]){
      const cid = decodeURIComponent(m[3]);
      if(m[4] === "check") return {view:"check", tid, cid};
      return {view:"card", tid, cid, card: Math.max(0, parseInt(m[4] || "0", 10) || 0)};
    }
    return {view:"topic", tid};
  }
  return null;
}
async function renderFromHash(h){
  const r = parseHash(h);
  if(!r) return false;
  _replaying = true;                    // suppress re-pushing what we are replaying
  try{
    if(r.view === "topics")      await viewDash();
    else if(r.view === "topic")  await viewTopic(r.tid);
    else if(r.view === "review") await viewReview(r.tid);
    else if(r.view === "cert")   await viewCertificate(r.tid);
    else if(r.view === "card" || r.view === "check"){
      await viewTopic(r.tid, r.cid);    // rebuild the ladder around this concept
      await viewConcept(r.tid, r.cid);
      if(r.view === "check") startCheckpoint(r.tid);
      else if(r.card > 0 && C && C.cards && r.card < C.cards.length){
        cardIx = r.card; renderCard(r.tid);   // land on the exact card, not card 1
      }
    }
  }catch(e){
    _replaying = false;
    try{ await viewDash(); }catch(_){}  // a stale/deleted deep link must not strand you
    return true;
  }finally{ _replaying = false; }
  return true;
}

/* Wrap the renderers so every navigation records itself, whoever triggered it. */
const _oViewDash = viewDash, _oViewTopic = viewTopic, _oRenderCard = renderCard,
      _oStartCheckpoint = startCheckpoint, _oViewReview = viewReview,
      _oViewCertificate = viewCertificate;
viewDash = async function(){ _mark(_hashFor("topics")); return _oViewDash.apply(this, arguments); };
viewTopic = async function(tid){ _mark(_hashFor("topic", tid)); return _oViewTopic.apply(this, arguments); };
/* viewConcept deliberately does NOT mark: it calls renderCard immediately, and
   two entries for one navigation is exactly the "Back did nothing" complaint.
   renderCard owns the concept route, card index included. */
renderCard = function(tid){ try{ if(C) _mark(_hashFor("card", tid, C.id, cardIx)); }catch(_){}
                            return _oRenderCard.apply(this, arguments); };
startCheckpoint = function(tid){ try{ if(C) _mark(_hashFor("check", tid, C.id)); }catch(_){}
                                 return _oStartCheckpoint.apply(this, arguments); };
viewReview = async function(tid){ _mark(_hashFor("review", tid)); return _oViewReview.apply(this, arguments); };
viewCertificate = async function(tid){ _mark(_hashFor("cert", tid)); return _oViewCertificate.apply(this, arguments); };

/* Step 2 of self-registration: the emailed 6-digit code. The account does not
   exist yet — it is created server-side only when this verifies. Credentials
   live in `ctx` (memory only, never storage) so Resend can re-send without
   asking the user to retype a password. */
function viewVerify(ctx){
  const ttlMs = 15*60*1000, deadline = Date.now()+ttlMs;
  main.innerHTML = `
  <div class="auth">
    <h1>Check your email</h1>
    <p>Enter the 6-digit code we sent to <strong>${esc(maskEmail(ctx.email))}</strong>.
       It expires in <span id="ttl" class="mono">15:00</span>.</p>
    <form id="vf">
      <input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}"
             maxlength="6" placeholder="123456" required
             style="letter-spacing:.5em;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:22px">
      <div class="err" id="err"></div>
      <button class="btn" style="width:100%" id="vgo">Verify and sign in</button>
    </form>
    <div class="sub" style="color:var(--dim);font-size:14px;margin-top:6px">
      No code? Check spam, then <button type="button" class="swap" id="resend" style="display:inline">resend it</button>.
    </div>
    <button class="swap" id="auth-back">← use a different address</button>
  </div>`;
  const code=$("#code"), err=$("#err"), ttl=$("#ttl"), resend=$("#resend");
  code.focus();
  code.addEventListener("input",()=>{ code.value=code.value.replace(/\D/g,"").slice(0,6); });

  /* live TTL; self-cancels once this view is off the DOM (no global timer state) */
  const tick=setInterval(()=>{
    if(!document.body.contains(ttl)){ clearInterval(tick); return; }
    const left=Math.max(0,deadline-Date.now());
    const m=Math.floor(left/60000), s=Math.floor(left%60000/1000);
    ttl.textContent=`${m}:${String(s).padStart(2,"0")}`;
    if(!left){ ttl.textContent="0:00"; err.textContent="That code has expired — resend to get a new one."; }
  },1000);

  $("#auth-back").onclick=()=>{ clearInterval(tick); viewAuth("register"); };

  /* Resend honors the server throttle (3 starts/hour per address) — the reply
     is the same neutral body either way, so we can't report "sent" vs
     "throttled"; a local 60s cooldown keeps people from burning the budget. */
  resend.onclick=async()=>{
    resend.disabled=true; err.textContent="";
    try{
      await api("/register/start",{method:"POST",body:ctx});
      err.style.color="var(--dim)";
      err.textContent="If your address can receive mail, a new code is on its way.";
    }catch(e){ err.style.color="var(--wrong)"; err.textContent=e.message; }
    let cd=60; const label=()=>resend.textContent=cd?`resend in ${cd}s`:"resend it";
    label(); const cdt=setInterval(()=>{ cd--; label();
      if(cd<=0){ clearInterval(cdt); resend.disabled=false; } },1000);
  };

  $("#vf").onsubmit=async e=>{
    e.preventDefault();
    const btn=$("#vgo"); btn.disabled=true; err.style.color="var(--wrong)"; err.textContent="";
    try{
      const d=await api("/register/verify",{method:"POST",
        body:{email:ctx.email, token:code.value.trim()}});
      clearInterval(tick); acceptSession(d);
    }catch(ex){ err.textContent=ex.message; btn.disabled=false; code.select(); }
  };
}

/* CATEGORY VIEW (operator, 2026-08-01) — collapsed/expanded toggle for the topic list.
   Persisted in localStorage keyed BY USER: the device is shared (Phase A), so David and
   Kate each keep their own view rather than fighting over one setting. The token stays in
   sessionStorage as before — this is a display preference, not an identity. */
const catKey = u => `learn_cats:${u || "anon"}`;
function catPrefs(user){
  try{ const p=JSON.parse(localStorage.getItem(catKey(user))||"{}");
       return {mode:p.mode==="collapsed"?"collapsed":"expanded", open:Array.isArray(p.open)?p.open:[]}; }
  catch(_){ return {mode:"expanded", open:[]}; }        // corrupt value → the old behavior
}
function saveCatPrefs(user, p){
  try{ localStorage.setItem(catKey(user), JSON.stringify(p)); }catch(_){ /* private mode / full */ }
}
function wireCategoryView(user){
  const wrap=$("#cats"), btn=$("#cat-toggle");
  if(!wrap||!btn) return;
  const p=catPrefs(user);
  const paint=()=>{
    wrap.dataset.mode=p.mode;
    const collapsed=p.mode==="collapsed";
    btn.textContent = collapsed ? "⊞ Expand all" : "⊟ Collapse to categories";
    btn.setAttribute("aria-pressed", String(collapsed));
    wrap.querySelectorAll(".cat").forEach(sec=>{
      const open = !collapsed || p.open.includes(sec.dataset.cat);
      sec.dataset.open = open ? "1" : "0";
      // In expanded mode nothing is collapsible, so the header claims no toggle state.
      const h=sec.querySelector(".cat-head");
      if(h) h.setAttribute("aria-expanded", String(open));
    });
    saveCatPrefs(user, p);
  };
  btn.onclick=()=>{
    p.mode = p.mode==="collapsed" ? "expanded" : "collapsed";
    if(p.mode==="collapsed") p.open=[];      // collapsing means collapsing — start clean
    paint();
  };
  wrap.querySelectorAll(".cat").forEach(sec=>{
    const h=sec.querySelector(".cat-head"); if(!h) return;
    h.onclick=()=>{
      // A header click in EXPANDED view collapses everything else and opens this one —
      // the operator's "when the outer/upper most button is clicked it does the same
      // collapsed view with expanded toggle": one click from anywhere gets you the
      // short list with your section open.
      if(p.mode!=="collapsed"){ p.mode="collapsed"; p.open=[sec.dataset.cat]; paint(); return; }
      const i=p.open.indexOf(sec.dataset.cat);
      i<0 ? p.open.push(sec.dataset.cat) : p.open.splice(i,1);
      paint();
    };
  });
  paint();
}

      <button class="tcard" data-t="${t.id}">
        <h2>${esc(t.title)}${t.review_due?`<span class="due-pill">${t.review_due} review${t.review_due>1?"s":""} due</span>`:""}</h2>
        <div class="tag">${esc(t.tagline)}${t.prereqs&&t.prereqs.length?` <span class="mono" style="font-size:12px">· builds on ${t.prereqs.map(esc).join(", ")}</span>`:""}</div>
        <div class="meterline">
          <div class="bar"><i style="width:${100*t.mastered/t.concepts}%"></i></div>
          <span class="num">${t.mastered}/${t.concepts} mastered</span>
        </div>
      </button>`;
      /* CATEGORY COLLAPSE (operator, 2026-08-01): "as more and more topics are added
         students will find it easier to navigate with less scrolling". A global toggle
         switches between EXPANDED (every card visible — how it has always looked) and
         COLLAPSED (category headers only); in collapsed view clicking a header opens
         just that category. Both the mode and which categories are open persist per
         USER (shared device — David and Kate keep their own view). Every card is always
         RENDERED and only CSS-hidden, so toggling is instant with no refetch and the
         existing .tcard click wiring below is untouched. */
      /* RESUME (operator, 2026-08-03): jump back to the last concept the server saw
         this user open — cross-device, validated server-side. DISABLED (with an
         honest title) until the student has started something: d.resume is null. */
      /* REVIEW SESSION (2026-08-04): the FSRS queue finally has a door. Disabled
         with an honest title when nothing is due — same contract as Resume. */
      const dueAll=d.topics.reduce((n,t)=>n+(t.review_due||0),0);
      const bar=`<div class="catbar"><button id="cat-toggle" type="button"></button>
        <button class="btn" id="review-btn" type="button" ${dueAll?"":"disabled"}
          title="${dueAll?`Review ${dueAll} concept${dueAll>1?"s":""} due across all topics`:"Nothing is due for review yet"}"
          style="margin-left:auto">🔁 Review${dueAll?` — ${dueAll} due`:""}</button>
        <button class="btn" id="resume-btn" type="button" ${d.resume?"":"disabled"}
          title="${d.resume?`Continue ${esc(d.resume.topic_title)} — ${esc(d.resume.concept_title)}`:"Nothing started yet — pick a topic to begin"}"
          >▶ Resume${d.resume?` — ${esc(d.resume.concept_title)}`:""}</button></div>`;
      return bar + `<div class="cats" id="cats">` + cats.map(cat=>{
        const due=g[cat].reduce((n,t)=>n+(t.review_due||0),0);
        return `<section class="cat" data-cat="${esc(cat)}">
          <button class="cat-head" type="button" aria-expanded="true">
            <span class="cat-chev" aria-hidden="true">▾</span>${esc(cat)}
            <span class="cat-count">${g[cat].length}</span>
            ${due?`<span class="cat-due">${due} review${due>1?"s":""} due</span>`:""}
          </button>
          <div class="cat-body">${g[cat].map(tcard).join("")}</div>
        </section>`;
      }).join("") + `</div>`;
    })()}
    <p class="sub" style="margin-top:18px;font-size:13px">
      <a href="#" id="an-open">📈 my analytics</a> ·
      <a href="#" id="prog-export">⬇ export progress</a> ·
      <a href="#" id="prog-import">⬆ import progress</a>${ROLE==="author"?` ·
      <a href="#" id="author-open">✍️ author a pack</a>`:""}
      <input type="file" id="prog-file" accept=".json,application/json" hidden>
      <span id="prog-msg" class="mono" style="margin-left:8px"></span></p>
  </div>`;
  wireCategoryView(d.user);
  main.querySelectorAll(".tcard").forEach(b=>b.onclick=()=>viewTopic(b.dataset.t));
  { const rb=$("#resume-btn"); if(rb && d.resume) rb.onclick=()=>viewTopic(d.resume.tid, d.resume.cid); }
  { const vb=$("#review-btn"); if(vb && !vb.disabled) vb.onclick=()=>viewReview(null); }
  { const ao=$("#author-open"); if(ao) ao.onclick=e=>{e.preventDefault(); viewAuthor();}; }
  /* P4.16: move progress between deployments. Export = download the JSON; import =
     server-side MERGE that never regresses local progress (stronger evidence wins). */
  /* P4.13: per-user analytics — sparse-data cases SAY so instead of charting noise. */
  $("#an-open").onclick = async e=>{ e.preventDefault();
    const a = await api("/analytics");
    const ttm = a.time_to_mastery.length
      ? `<table class="mono" style="font-size:13px;border-spacing:10px 2px">
         <tr><th align="left">concept</th><th>hours→mastery</th><th>attempts</th></tr>
         ${a.time_to_mastery.map(r=>`<tr><td>${esc(r.topic_id)}/${esc(r.concept_id)}</td><td align="center">${r.hours}</td><td align="center">${r.attempts}</td></tr>`).join("")}</table>`
      : `<p class="sub">nothing mastered yet.</p>`;
    const ret = a.retention.length
      ? `<table class="mono" style="font-size:13px;border-spacing:10px 2px">
         <tr><th>interval</th><th>reviews</th><th>recall</th></tr>
         ${a.retention.map(r=>`<tr><td align="center">${r.bucket}</td><td align="center">${r.n}</td><td align="center">${(100*r.recall).toFixed(0)}%</td></tr>`).join("")}</table>`
      : `<p class="sub">no spaced reviews yet.</p>`;
    const wk = a.weakest.length
      ? `<ul style="font-size:13px">${a.weakest.map(r=>`<li class="mono">${esc(r.topic_id)}/${esc(r.concept_id)} — P(known) ${r.p} (${r.correct}/${r.attempts})</li>`).join("")}</ul>`
      : `<p class="sub">no struggling concepts — nice.</p>`;
    main.innerHTML = `<div class="dash"><h1>My analytics</h1>
      ${a.retention_note?`<p class="sub">⚠ ${esc(a.retention_note)}</p>`:""}
      <h2>Time to mastery</h2>${ttm}
      <h2>Retention by review interval</h2>${ret}
      <h2>Weakest open concepts</h2>${wk}
      <p><button class="btn" id="an-back">← back</button></p></div>`;
    $("#an-back").onclick=viewDash; };
  $("#prog-export").onclick = async e=>{ e.preventDefault();
    const j = await api("/progress/export");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(j,null,1)], {type:"application/json"}));
    a.download = `learn-progress-${j.username}-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(a.href); };
  $("#prog-import").onclick = e=>{ e.preventDefault(); $("#prog-file").click(); };
  $("#prog-file").onchange = async ()=>{
    const f = $("#prog-file").files[0]; if(!f) return;
    try{

      const r = await api("/progress/import", {method:"POST", body});   /* FE-1: api() stringifies — don't double-encode */
      $("#prog-msg").textContent = `imported ${r.imported}, kept-local ${r.skipped}`;
      setTimeout(viewDash, 1400);
    }catch(err){ $("#prog-msg").textContent = "import failed: "+(err.message||err); } };
}

let T=null; // current topic payload
const SESH={moves:{},mastered:[]};   // P4.14: this visit's posterior moves
async function viewTopic(tid, focus){
  T = await api("/topic/"+tid);
  if(!(T.concepts && T.concepts.length)){ main.innerHTML=`<div class="topic"><p class="sub">This topic has no concepts yet.</p></div>`; return; }   /* FE-7 */
  /* LOOP FIX (2026-08-04, operator: "the ETF module gets stuck in a loop at
     Performance chasing and the behavior gap"). The old fallback for "no
     unmastered concept left" was T.concepts[last] — so a FINISHED course
     re-opened its final concept at card 1 every time, and "Next concept" from
     that concept's checkpoint came straight back here: cards → checkpoint →
     Next concept → the same cards. A completed course now lands on its
     completion stage; the ladder still opens any concept for review. */
  const allDone = T.concepts.every(c=>c.mastered);
  const nextOpen = T.concepts.find(c=>c.unlocked && !c.mastered);
  const cur = focus || (nextOpen || T.concepts[T.concepts.length-1]).id;
  main.innerHTML = `<div class="topic">
    <nav class="ladder" id="ladder"></nav>
    <div id="stage"></div>
  </div>`;
  renderLadder(focus || (allDone ? null : cur));
  if (T.needs_placement && !focus){ viewPlacement(tid); return; }
  if (allDone && !focus){ viewTopicComplete(tid); return; }
  viewConcept(tid, cur);
}

/* The resting state of a finished course: what you earned, what's due, and the
   way back to the certificate — never a re-entry into the last concept. */
async function viewTopicComplete(tid){
  const due = T.concepts.filter(c=>c.review_due).length;
  $("#stage").innerHTML = `
  <section class="stage celebrate">
    <div class="laurel">🎓</div>
    <h1>Course complete</h1>
    <p class="sub">All <b>${T.concepts.length}</b> concepts in <b>${esc(T.title||"this course")}</b>
      are mastered. ${due
        ? `<b>${due}</b> ${due===1?"concept is":"concepts are"} due for spaced review — that is where retention is actually won.`
        : `Nothing is due for review right now; open any concept from the ladder whenever you want a refresher.`}</p>
    <div class="certactions">
      <button class="btn ghost" id="tc-topics">All topics</button>
      ${due?`<button class="btn" id="tc-review">🔁 Review ${due} due</button>`:""}
      <button class="btn warm" id="tc-cert">🎓 View certificate</button>
    </div>
  </section>`;
  $("#tc-topics").onclick=()=>{stopCardAudio(); viewDash();};
  const tr=$("#tc-review"); if(tr) tr.onclick=()=>viewReview(tid);

}
function renderLadder(curId){
  $("#ladder").innerHTML =
    `<button class="rung" id="back"><span class="dot">←</span><span><span class="rt">All topics</span></span></button>` +
    T.concepts.map((c,i)=>`
    <button class="rung ${c.mastered?"done":""} ${c.relearn?"relearn":""} ${c.id===curId?"active":""}" data-c="${c.id}" ${c.unlocked?"":"disabled"}>
      <span class="dot">${c.mastered?"✓":(c.relearn?"↻":i+1)}</span>
      <span>
        <span class="rt">${esc(c.title)}</span><br>
        <span class="rp">P(known) ${c.p_mastery.toFixed(2)}</span>
        ${c.review_due?'<br><span class="flag">review due</span>':""}
        ${!c.unlocked?'<br><span class="rp">locked</span>':""}
      </span>
    </button>`).join("") +
    /* Certificate rung (2026-08-04): a certificate you can only see once is a
       screenshot, not a record — once the course is complete it stays one click
       away from the ladder, forever. */
    /* Review rung (2026-08-04): the due queue is reachable from inside the
       course too, not only the dashboard — that is where a student notices a
       "review due" flag on a rung. */
    ((T.concepts.filter(c=>c.review_due).length)
      ? `<button class="rung" id="review-rung"><span class="dot">🔁</span>
           <span><span class="rt">Review</span><br>
           <span class="rp">${T.concepts.filter(c=>c.review_due).length} due now</span></span></button>`
      : "") +
    (T.concepts.every(c=>c.mastered)
      ? `<button class="rung done" id="cert-rung"><span class="dot">🎓</span>
           <span><span class="rt">Certificate</span><br>
           <span class="rp">course complete</span></span></button>`
      : "");
  const rr2=$("#review-rung"); if(rr2) rr2.onclick=()=>{stopCardAudio(); viewReview(T.id);};
  const cr=$("#cert-rung"); if(cr) cr.onclick=()=>{stopCardAudio(); viewCertificate(T.id);};
  $("#back").onclick=()=>{stopCardAudio(); viewDash();};
  $("#ladder").querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{
    stopCardAudio();
    renderLadder(b.dataset.c); viewConcept(T.id,b.dataset.c);
  });
}

/* ---------- spaced review session (2026-08-04) ----------
   The FSRS scheduler has always run; nothing in the UI ever opened its queue, so
   "due for review" was a badge with no door behind it. A session serves ONE
   retrieval per due concept (most overdue first), posts each answer through the
   normal answer route — so the same FSRS reschedule and relearn-demotion logic
   applies — and ends with an honest ledger of what held and what slipped. */
let RV = null;   /* {queue, i, scope, tid, right, wrong, demoted[], moves[]} */

async function viewReview(tid){
  let d;
  try{ d = await api(tid ? `/topic/${tid}/review` : "/review"); }
  catch(e){ toast(e.message||"Couldn't load the review queue"); return viewDash(); }
  RV = {queue:d.queue, i:0, scope:d.scope, tid, right:0, wrong:0, demoted:[], moves:[]};
  if(!d.queue.length){
    main.innerHTML = `<div class="dash"><h1>Nothing due</h1>
      <p class="sub">No concepts in <b>${esc(d.scope)}</b> have come due for review yet.
        Spacing is the point — they'll surface here as their intervals expire.</p>
      <div class="certactions" style="justify-content:flex-start">
        <button class="btn" id="rv-back">Back to topics</button></div></div>`;
    $("#rv-back").onclick=()=>viewDash();
    return;
  }
  main.innerHTML = `<div class="dash" style="max-width:760px">
    <div id="rv-head"></div><div id="rv-stage"></div></div>`;
  renderReviewQ();
}

function renderReviewQ(){
  const it = RV.queue[RV.i];
  if(!it) return renderReviewDone();
  const q = it.question, isFree = q.type === "free";
  const t0 = Date.now();
  $("#rv-head").innerHTML = `
    <div class="kicker">Spaced review · ${esc(RV.scope)} — ${RV.i+1} of ${RV.queue.length}</div>
    <div class="meterline" style="margin:6px 0 14px">
      <div class="bar"><i style="width:${100*(RV.i)/RV.queue.length}%"></i></div>
      <span class="num">${RV.right}✓ ${RV.wrong}✗</span>
    </div>`;
  $("#rv-stage").innerHTML = `
  <section class="stage">
    <div class="kicker">${esc(it.topic_title)} · ${esc(it.concept_title)}
      ${it.overdue_days>=1?`<span class="flag">${Math.round(it.overdue_days)}d overdue</span>`:""}</div>
    <p class="qprompt">${esc(q.prompt)}</p>
    ${isFree
      ? `<div><textarea id="rv-free" rows="3" style="width:100%;max-width:640px" placeholder="your answer…"></textarea>
         <div style="margin-top:8px"><button class="btn" id="rv-go">Submit</button></div></div>`
      : `<div id="rv-opts">${q.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>`}
    <div id="rv-after"></div>
  </section>`;

  const send = async (payload, pickBtn) => {
    let r;
    try{
      r = await api(`/topic/${it.topic_id}/concept/${it.concept_id}/answer`,
                    {method:"POST", body:{...payload, latency_ms:Date.now()-t0}});
    }catch(e){ toast(e.message||"Couldn't record that answer"); return; }
    if(r.ungraded){
      $("#rv-after").innerHTML = `<div class="fb">${esc(r.feedback)}</div>
        <div class="fb good"><b>Model answer:</b> ${esc(r.model_answer||"")}</div>
        <div class="pager"><span class="spacer"></span>
          <button class="btn" id="rv-next">Next</button></div>`;
      $("#rv-next").onclick=()=>{RV.i++; renderReviewQ();};
      return;   /* ungraded never counts either way — mastery is untouched */
    }
    r.correct ? RV.right++ : RV.wrong++;
    RV.moves.push({concept:it.concept_title, from:r.p_before, to:r.p_after});
    if(r.demoted) RV.demoted.push(it.concept_title);
    if(pickBtn) pickBtn.classList.add(r.correct?"right":"wrongpick");
    $("#rv-opts")&&$("#rv-opts").querySelectorAll(".opt").forEach(b=>b.disabled=true);
    const dir = r.p_after>=r.p_before ? "↑" : "↓";
    $("#rv-after").innerHTML = `
      <div class="delta mono">posterior ${r.p_before.toFixed(3)} → <b>${r.p_after.toFixed(3)}</b> ${dir}</div>
      <div class="fb ${r.correct?"good":"bad"}">${esc(r.feedback)}</div>
      ${r.demoted?`<div class="mastered-banner">This one slipped below the retention floor — it goes back into the ladder for relearning, and its cards are served again.</div>`:""}
      <div class="pager">
        <button class="btn ghost" id="rv-open">Open the concept</button>
        <span class="spacer"></span>
        <button class="btn ${RV.i+1<RV.queue.length?"":"warm"}" id="rv-next">
          ${RV.i+1<RV.queue.length?"Next":"Finish review"}</button>
      </div>`;
    $("#rv-next").onclick=()=>{RV.i++; renderReviewQ();};
    $("#rv-open").onclick=()=>viewTopic(it.topic_id, it.concept_id);
  };

  if(isFree){
    $("#rv-go").onclick=()=>{
      const txt=($("#rv-free").value||"").trim(); if(!txt) return;
      $("#rv-go").disabled=true; $("#rv-go").textContent="Grading…";
      send({question_id:q.id, text:txt});
    };
  }else{
    $("#rv-opts").querySelectorAll(".opt").forEach(b=>{

async function placementStep(tid, history){

/* ---------- posterior strip ---------- */
function stripHTML(p,streak,mastered){
  return `<div class="strip" id="strip">
    <div class="lab"><span>Your mastery posterior — a live Bayes update</span>
      <span class="mono" id="pnum">P(known) = ${p.toFixed(3)}</span></div>
    <div class="track">
      <div class="fill" id="pfill" style="width:${100*p}%"></div>

    </div>
    <div class="foot">
      <span>every answer moves this — correct raises it, a slip lowers it</span>
      <span>streak <span class="pips" id="pips">${pipHTML(streak)}</span> ${mastered?'· <b style="color:var(--post)">mastered</b>':""}</span>
    </div>
  </div>`;
}
const pipHTML = s => [0,1,2].map(i=>`<i class="${i<Math.min(s,3)?"on":""}"></i>`).join("");
function stripSet(p,streak){
  $("#pfill").style.width=(100*p)+"%";
  $("#pnum").textContent="P(known) = "+p.toFixed(3);
  $("#pips").innerHTML=pipHTML(streak);
}

/* ---------- concept: cards -> checkpoint ---------- */
let C=null, cardIx=0;
async function viewConcept(tid,cid){
  let d;
  try{ d = await api(`/topic/${tid}/concept/${cid}`); }
  catch(e){ $("#stage").innerHTML=`<div class="stage"><p>${esc(e.message)}</p></div>`; return; }
  C=d; cardIx=0;
  renderCard(tid);
}
function renderCard(tid){
  if(TTS_PRERENDERED) loadAudioManifest();   // preload for synchronous play (only when pre-rendered audio is on)
  const card=C.cards[cardIx], last=cardIx===C.cards.length-1;
  $("#stage").innerHTML = stripHTML(C.p_mastery,C.streak,C.mastered) + `
  <section class="stage">
    <div class="kicker">Concept · ${esc(C.title)} — chunk ${cardIx+1} of ${C.cards.length}</div>
    <h2>${esc(card.h)}</h2>
    <button class="btn ghost" id="cardplay" style="font-size:.82em;padding:3px 10px;margin:0 0 8px" title="Listen to this chunk">🔊 Listen</button>
    <div class="card-body">${md(card.md)}</div>
    ${last && C.anim ? animHTML() : ""}
    <div class="pager">
      <button class="btn ghost" id="prev">${cardIx===0?"← All topics":"Back"}</button>
      <div class="crumbs">${C.cards.map((_,i)=>`<i class="${i<=cardIx?"on":""}"></i>`).join("")}</div>
      <span class="spacer"></span>
      <button class="btn ${last?"warm":""}" id="next">${last?"Start checkpoint":"Continue"}</button>
    </div>
    ${last ? resHTML() : ""}
  </section>`;
  if (last && C.anim) mountAnim(C.anim);
  const cp=$("#cardplay"); if(cp) cp.onclick=()=>playCard(tid);
  /* BACK ON THE FIRST CARD (operator report, 2026-08-05: "the back button does not
     work" on card 1 of "Sugar in, insulin out"). It was rendered `disabled`, which is
     defensible — there IS no previous card — except that `.btn.ghost` overrides
     `.btn:disabled` at equal specificity, so it kept the ENABLED look and the only
     remaining cue was `cursor:default`, which an iPad does not have. A button that
     looks live and does nothing reads as broken, and it is on the first card of every
     concept — which is why it showed up "in some modules" and not others.
     It now leaves the concept instead. Destination is the topic list rather than
     viewTopic(tid), deliberately: viewTopic auto-opens the next unmastered concept,
     which for a single-concept-in-progress topic is THIS one — so "back" would have
     landed you exactly where you started. */
  $("#prev").onclick=()=>{stopCardAudio(); if(cardIx===0){ viewDash(); return; } cardIx--; renderCard(tid);};
  $("#next").onclick=()=>{stopCardAudio(); last ? startCheckpoint(tid) : (cardIx++, renderCard(tid));};
}
/* --- P3.12 per-card audio: Remote's pre-rendered m4a → speechSynthesis fallback.
   Manifest (static/audio/manifest.json) keyed {topic_id:{concept_id:[url per card idx]}};
   absence of a file just means we narrate with the browser voice instead. --- */
let _cardAudio=null, _audioManifest;
async function loadAudioManifest(){
  if(_audioManifest!==undefined) return _audioManifest;
  try{ const r=await fetch("/static/audio/manifest.json",{cache:"no-cache"});
       _audioManifest = r.ok ? await r.json() : null; }
  catch{ _audioManifest=null; }
  return _audioManifest;
}
function audioUrlForCard(tid, ix){
  const m=_audioManifest; if(!m||!C) return null;
  const pack = m[String(tid)] || m[C.pack] || null;                 // topic → (concept-id fallbacks) → urls
  const arr  = pack && (pack[String(C.id)] || pack[C.concept]);
  return Array.isArray(arr) ? (arr[ix]||null) : null;
}
function stopCardAudio(){
  cancelVoice();
  if(_cardAudio){ _cardAudio.pause(); _cardAudio=null; }
  const b=$("#cardplay"); if(b) b.textContent="🔊 Listen";
}
function cardPlainText(card){
  const d=document.createElement("div"); d.innerHTML=md(card.md||"");
  return (card.h?card.h+". ":"") + (d.textContent||"").replace(/\s+/g," ").trim();
}
/* MUST stay synchronous: Safari only allows audio.play()/speechSynthesis.speak()
   inside the user gesture. An `await` before playback drops the gesture and Safari
   silently blocks BOTH paths → dead silence. The manifest is preloaded in renderCard
   so it's already in hand here; if it somehow isn't, we narrate now (still in-gesture)
   and warm it for next time. */
/* Pre-rendered m4a is DISABLED (2026-07-30). tts_render.py ran macOS `say` from a
   headless Background/SSH session, which synthesizes NO audio — all 330 files are empty
   (0.005s / 12 audio bytes); `say` needs a GUI Aqua session. Until a valid re-render
   exists, Listen uses the browser's built-in speechSynthesis (the SAME iOS/macOS system
   voices, client-side). Flip TTS_PRERENDERED back to true once static/audio holds real
   audio and the m4a path (kept below, dormant) takes over automatically. */
const TTS_PRERENDERED = true;   // Kokoro-rendered audio in the manifest (PROTOTYPE: only fundamental-analysis/price-vs-value has files; every other concept resolves to null → browser-voice fallback)
let _ttsVoice;
function pickVoice(){
  if(_ttsVoice!==undefined) return _ttsVoice;
  let vs=[]; try{ vs=speechSynthesis.getVoices()||[]; }catch(_){}
  if(!vs.length) return undefined;   // not ready yet — default voice this time, cache next
  _ttsVoice =
    vs.find(v=>/en[-_]US/i.test(v.lang) && /samantha|siri|enhanced|premium/i.test(v.name)) ||
    vs.find(v=>/en[-_]US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
  return _ttsVoice;
}
try{ if("speechSynthesis" in window) speechSynthesis.onvoiceschanged=()=>{ _ttsVoice=undefined; pickVoice(); }; }catch(_){}
function playCard(tid){
  const btn=$("#cardplay");
  if((_cardAudio && !_cardAudio.paused) || voiceBusy()){ stopCardAudio(); return; }  // toggle off
  const speak=()=>{
    if(!("speechSynthesis" in window)){ if(btn) btn.textContent="🔇 No voice"; return; }
    cancelVoice();
    if(btn) btn.textContent="⏸ Pause";
    speakPaced(cardPlainText(C.cards[cardIx]), {rate:1.0}).then(()=>{ if(btn) btn.textContent="🔊 Listen"; });   // in-gesture (Safari); paced at punctuation
  };
  const url = (TTS_PRERENDERED && _audioManifest) ? audioUrlForCard(tid, cardIx) : null;
  if(url){
    _cardAudio=new Audio(url);
    _cardAudio.onended=()=>{ _cardAudio=null; if(btn) btn.textContent="🔊 Listen"; };
    _cardAudio.onerror=()=>{ _cardAudio=null; speak(); };            // empty/decode → narrate instead
    if(btn) btn.textContent="⏸ Pause";
    _cardAudio.play().catch(()=>{ _cardAudio=null; speak(); });      // called in-gesture
    return;
  }
  speak();
}
function resHTML(){
  if (!C.resources.length) return "";
  return `<div class="res"><h3>Vetted resources for this concept</h3>
    ${C.resources.map(r=>`<div class="item">
      <span class="badge">${esc(r.type)}</span>
      <span><a href="${/^https?:\/\//i.test(r.url)?esc(r.url):"#"}" target="_blank" rel="noopener">${esc(r.label)}</a>${r.note?`<br><span class="note">${esc(r.note)}</span>`:""}</span></div>`).join("")}</div>`;
}

let qIx=0;
function startCheckpoint(tid){ qIx=0; renderQuestion(tid); }
function renderQuestion(tid){
  if(!(C.questions && C.questions.length)){   /* FE-5: no-questions guard (don't crash the checkpoint) */
    $("#stage").innerHTML=`<section class="stage"><div class="kicker">Checkpoint · ${esc(C.title)}</div><p class="sub">No questions authored for this concept yet.</p><div class="pager"><button class="btn" id="noq-back">Back to topic</button></div></section>`;
    const nb=$("#noq-back"); if(nb) nb.onclick=()=>viewTopic(tid); return;
  }
  const q=C.questions[qIx % C.questions.length];
  const t0=Date.now();
  /* P2.9: free-response questions render a textarea instead of options; numeric/regex
     kinds grade locally on the server (no AI call), rubric kinds via the AI grader.
     An UNGRADED verdict (AI down) shows the model answer and leaves mastery untouched. */
  const isFree = q.type === "free";
  $("#stage").innerHTML = stripHTML(C.p_mastery,C.streak,C.mastered) + `
  <section class="stage">
    <div class="kicker">Checkpoint · ${esc(C.title)}</div>
    <p class="qprompt">${esc(q.prompt)}</p>
    ${isFree
      ? `<div><textarea id="free-in" rows="3" style="width:100%;max-width:640px" placeholder="your answer…"></textarea>
         <div style="margin-top:8px"><button class="btn" id="free-go">Submit</button></div></div>`
      : `<div id="opts">${q.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>`}
    <div id="after"></div>
  </section>`;
  const finish=(r,pickBtn)=>{
    /* P4.14 session ledger: first p_before is kept, last p_after wins; mastery noted. */
    if(!r.ungraded){
      const key=tid+"/"+C.id;
      SESH.moves[key] = SESH.moves[key] || {title:C.title, from:r.p_before};
      SESH.moves[key].to = r.p_after;
      if(r.newly_mastered) SESH.mastered.push(C.title);
    }
    if(r.ungraded){
      /* FE-3: ungraded (AI grader down) never advances mastery — so it MUST still offer an
         exit, else a mastered/free-response concept loops with the posterior frozen. */
      $("#after").innerHTML = `
        <div class="fb">${esc(r.feedback)}</div>
        <div class="fb good"><b>Model answer:</b> ${esc(r.model_answer||"")}</div>
        <div class="pager">
          <button class="btn ghost" id="ug-back">Back to ladder</button>
          <span class="spacer"></span>
          ${C.mastered?`<button class="btn warm" id="go-next">Next concept</button>`:""}
          <button class="btn" id="go-on">Next question</button></div>`;
      const ub=$("#ug-back"); if(ub) ub.onclick=()=>viewTopic(tid);
      const un=$("#go-next"); if(un) un.onclick=()=>viewTopic(tid);
      $("#go-on").onclick=()=>{qIx++; renderQuestion(tid);};
      return;
    }
    C.p_mastery=r.p_after; C.streak=r.streak; C.mastered=r.mastered;
    if(pickBtn) pickBtn.classList.add(r.correct?"right":"wrongpick");
    stripSet(r.p_after,r.streak);
    const dir=r.p_after>=r.p_before?"↑":"↓";
    $("#after").innerHTML = `
      <div class="delta mono">posterior ${r.p_before.toFixed(3)} → <b>${r.p_after.toFixed(3)}</b> ${dir}</div>
      <div class="fb ${r.correct?"good":"bad"}">${esc(r.feedback)}</div>
      ${r.topic_complete && r.newly_mastered
        ? `<div class="mastered-banner">🎓 <b>That was the last one — the course is complete.</b> Every concept in this topic has cleared the gate.</div>`
        : (r.topic_complete
        ? `<div class="mastered-banner">🎓 Course complete ✓ — this was a review; your certificate is one click away.</div>`
        : (r.newly_mastered
        ? `<div class="mastered-banner">Mastered — the gate is open. The next concept is unlocked, and this one enters spaced review tomorrow.</div>`
        : (r.mastered ? `<div class="mastered-banner">Already mastered ✓ — keep reviewing, or move on.</div>` : "")))}
      <div class="pager">
        ${!r.correct?`<button class="btn ghost" id="reread">Re-read the cards</button>
                      <button class="btn ghost" id="helpme">Explain it differently</button>
                      <button class="btn ghost" id="xpractice" title="AI-generated extra reps — doesn't count toward mastery">🔄 Extra practice</button>`:""}
        <span class="spacer"></span>
        ${r.topic_complete
          ? `<button class="btn ghost" id="go-on">Keep practicing</button>
             <button class="btn warm" id="go-cert">🎓 Claim your certificate</button>`
          : (r.mastered
          ? `<button class="btn ghost" id="go-on">Next question</button>
             <button class="btn warm" id="go-next">Next concept</button>`
          : `<button class="btn" id="go-on">${r.correct?"Next question":"Try another"}</button>`)}
      </div>
      <div id="aihelp"></div>`;
    const gc=$("#go-cert"); if(gc) gc.onclick=()=>viewCelebration(tid, T && T.title);
    const on=$("#go-on"); if(on) on.onclick=()=>{qIx++; renderQuestion(tid);};
    const gn=$("#go-next"); if(gn) gn.onclick=()=>viewTopic(tid);
    const rr=$("#reread"); if(rr) rr.onclick=()=>{cardIx=0; renderCard(tid);};
    const xp=$("#xpractice"); if(xp) xp.onclick=()=>startPractice(tid, C.id, C.title);
    const hm=$("#helpme"); if(hm) hm.onclick=async()=>{
      hm.disabled=true; hm.textContent="Thinking…";
      try{
        const h=await api(`/topic/${tid}/concept/${C.id}/help`,{method:"POST",body:{question_id:q.id}});
        $("#aihelp").innerHTML=`<div class="fb">${esc(h.text)}${h.source==="ai"?' <span class="mono" style="font-size:11px;color:var(--dim)">— AI tutor</span>':""}</div>`;
      }catch(e){ $("#aihelp").innerHTML=`<div class="fb bad">Couldn't fetch an explanation — ${esc(e.message||"try again")}.</div>`; }
      finally{ hm.disabled=false; hm.textContent="Explain it differently"; }   /* FE-6: restore on failure */
    };
  };
  if(isFree){
    $("#free-go").onclick=async()=>{
      const txt=($("#free-in").value||"").trim(); if(!txt) return;
      const myC=C;   // guard: ignore the result if the learner navigates away mid-grade
      $("#free-go").disabled=true; $("#free-go").textContent="Grading…";
      try{
        const r=await api(`/topic/${tid}/concept/${myC.id}/answer`,{method:"POST",
          body:{question_id:q.id, text:txt, latency_ms:Date.now()-t0}});
        if(C!==myC) return;
        finish(r,null);
      }catch(err){
        $("#free-go").disabled=false; $("#free-go").textContent="Submit";
        $("#after").innerHTML=`<div class="fb bad">Couldn't submit — ${esc(err.message||"try again")}.</div>`;
      }
    };
    return;
  }
  document.querySelectorAll(".opt").forEach(b=>b.onclick=async()=>{
    document.querySelectorAll(".opt").forEach(x=>x.disabled=true);
    const i=+b.dataset.i, myC=C;
    try{
      const r=await api(`/topic/${tid}/concept/${myC.id}/answer`,{method:"POST",
        body:{question_id:q.id, choice:i, latency_ms:Date.now()-t0}});
      if(C!==myC) return;   // navigated away mid-answer — don't stamp onto the new concept
      finish(r,b);
    }catch(err){
      document.querySelectorAll(".opt").forEach(x=>x.disabled=false);
      $("#after").innerHTML=`<div class="fb bad">Couldn't submit — ${esc(err.message||"try again")}. Tap your answer to retry.</div>`;
    }
  });
}

/* P3.11 (iss_b98c7ee2): AI-generated EXTRA PRACTICE — formative only, never moves mastery.
   Consumes Remote's POST /topic/{tid}/concept/{cid}/practice (+ /answer). Answer keys stay
   server-side; a restart honestly expires the set. */
let _pracQ=[], _pracIx=0, _pracCtx=null;
async function startPractice(tid,cid,title){
  _pracCtx={tid,cid,title};
  $("#stage").innerHTML=`<section class="stage"><div class="kicker">Extra practice · ${esc(title)}</div>
    <p class="sub">Generating a few extra questions…</p></section>`;
  let d;
  try{ d=await api(`/topic/${tid}/concept/${cid}/practice`,{method:"POST"}); }
  catch(e){ d={available:false,text:"Couldn't reach practice — try again in a moment."}; }
  if(!d || !d.available){
    $("#stage").innerHTML=`<section class="stage"><div class="kicker">Extra practice · ${esc(title)}</div>
      <div class="fb">${esc((d&&d.text)||"Extra practice isn't available right now — the authored checkpoint is the gate either way.")}</div>
      <div class="pager"><span class="spacer"></span><button class="btn" id="prac-back">Back to the checkpoint</button></div></section>`;
    $("#prac-back").onclick=()=>renderQuestion(tid);
    return;
  }
  _pracQ=d.questions||[]; _pracIx=0;
  if(!_pracQ.length){ renderQuestion(tid); return; }
  renderPractice();
}
function renderPractice(){
  const {tid,cid,title}=_pracCtx, q=_pracQ[_pracIx], t0=Date.now();
  $("#stage").innerHTML=`<section class="stage">
    <div class="kicker">Extra practice · ${esc(title)}</div>
    <div class="fb" style="background:rgba(224,184,74,.12);color:var(--warm,#e0b84a);border:1px solid rgba(224,184,74,.35)">
      🔄 Extra practice — <b>doesn't count toward mastery</b> · question ${_pracIx+1} of ${_pracQ.length}</div>
    <p class="qprompt">${esc(q.prompt)}</p>
    <div id="pracopts">${q.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>
    <div id="pracafter"></div></section>`;
  document.querySelectorAll("#pracopts .opt").forEach(b=>b.onclick=async()=>{
    document.querySelectorAll("#pracopts .opt").forEach(x=>x.disabled=true);
    let r;
    try{ r=await api(`/topic/${tid}/concept/${cid}/practice/answer`,{method:"POST",
           body:{question_id:q.id, choice:+b.dataset.i, latency_ms:Date.now()-t0}}); }
    catch(e){ r={expired:true,text:"Couldn't submit — generate a fresh set."}; }
    if(r && r.expired){
      $("#pracafter").innerHTML=`<div class="fb">${esc(r.text)}</div>
        <div class="pager"><span class="spacer"></span><button class="btn" id="prac-regen">New practice set</button></div>`;
      $("#prac-regen").onclick=()=>startPractice(tid,cid,title);
      return;
    }
    b.classList.add(r.correct?"right":"wrongpick");
    const last=_pracIx>=_pracQ.length-1;
    $("#pracafter").innerHTML=`
      <div class="fb ${r.correct?"good":"bad"}">${esc(r.feedback)}</div>
      <div class="pager"><span class="spacer"></span>
        ${last?`<button class="btn" id="prac-done">Back to the checkpoint</button>`
              :`<button class="btn" id="prac-next">Next practice question</button>`}</div>`;

/* Voice pacing (2026-07-31): speechSynthesis ignores SSML and runs clauses together, which
   sounds robotic. Split narration at paragraph / sentence / dash / comma boundaries and speak
   the pieces in sequence with a punctuation-scaled gap between them. */
let _paceTimer=null;
function cancelVoice(){ try{speechSynthesis.cancel();}catch(_){} clearTimeout(_paceTimer); _paceTimer=null;
  try{ if(typeof _animCancel==="function") _animCancel(); }catch(_){} }   // ANIM-TTS: also stop the Kokoro element
function voiceBusy(){ return (("speechSynthesis" in window) && speechSynthesis.speaking) || !!_paceTimer; }
function speakPaced(text, opts){
  opts=opts||{};
  return new Promise(resolve=>{
    if(!("speechSynthesis" in window)){ resolve(); return; }
    const raw=String(text).split(/(\n\n+|[.!?]+|[,;:]|—|\s[-–]\s)/);
    const segs=[];
    for(let i=0;i<raw.length;i+=2){
      let chunk=(raw[i]||"").trim(); const d=raw[i+1]||"";
      if(!chunk){ if(segs.length && /\n\n/.test(d)) segs[segs.length-1].pause=Math.max(segs[segs.length-1].pause,430); continue; }   // carry a paragraph gap onto the prior sentence
      let pause=110;
      if(/\n\n/.test(d)) pause=430;                                  // paragraph
      else if(/[.!?]/.test(d)){ pause=290; chunk+=d.trim(); }        // sentence — keep . ! ? for intonation
      else if(/—|\s[-–]\s/.test(d)) pause=210;                       // dash
      else if(/[,;:]/.test(d)){ pause=150; chunk+=d.trim(); }        // comma / clause
      segs.push({t:chunk, pause});
    }
    if(!segs.length){ resolve(); return; }
    const v=opts.voice||(typeof pickVoice==="function"?pickVoice():null);
    let i=0;
    (function next(){
      if(i>=segs.length){ _paceTimer=null; resolve(); return; }
      const s=segs[i++];
      const u=new SpeechSynthesisUtterance(s.t); u.rate=opts.rate||1.0; if(v) u.voice=v;
      u.onend=()=>{ _paceTimer=setTimeout(next, s.pause); };
      u.onerror=()=>{ _paceTimer=setTimeout(next, s.pause); };
      try{ speechSynthesis.speak(u); }catch(_){ _paceTimer=null; resolve(); }
    })();
  });
}
/* ANIM-TTS (2026-07-31): anim narration goes through the shared Kokoro engine (the same
   natural voice as card audio) via POST /api/anim_tts — dynamic lines can't be pre-rendered,
   they interpolate numbers from the running scene. One shared <audio> element, unlocked
   in-gesture on the Play click (Safari), object-URLs cached per text so a replay is instant.
   ANY failure (engine down, 503, timeout, decode) falls back to the paced browser voice —
   the anim must never lose narration because a service is down. */
let _animAudio=null; const _animTTSUrls=new Map(); let _animCancel=null;
function unlockAnimAudio(){                       // MUST be called synchronously in-gesture
  if(!_animAudio){ _animAudio=new Audio(); _animAudio.playsInline=true; _animAudio.preload="auto"; }
  try{ _animAudio.muted=true; const p=_animAudio.play(); if(p&&p.catch) p.catch(()=>{});
       _animAudio.pause(); _animAudio.muted=false; }catch(_){}
}
async function _animTTSFetch(text){
  if(_animTTSUrls.has(text)) return _animTTSUrls.get(text);
  const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(), 12000);
  try{
    const r=await fetch("/api/anim_tts",{method:"POST", signal:ctl.signal,
      headers:{"Content-Type":"application/json", Authorization:"Bearer "+TOKEN},
      body:JSON.stringify({text})});
    if(!r.ok) return null;
    const url=URL.createObjectURL(await r.blob());
    _animTTSUrls.set(text,url); return url;
  }catch(_){ return null; }finally{ clearTimeout(tm); }
}
function _animPlay(url){
  return new Promise(res=>{
    if(!_animAudio){ res(false); return; }
    let done=false; const fin=ok=>{ if(done) return; done=true; _animCancel=null; cleanup(); res(ok); };
    const onEnd=()=>fin(true), onErr=()=>fin(false);
    const cleanup=()=>{ _animAudio.removeEventListener("ended",onEnd); _animAudio.removeEventListener("error",onErr); };
    _animAudio.addEventListener("ended",onEnd); _animAudio.addEventListener("error",onErr);
    _animCancel=()=>{ try{_animAudio.pause();}catch(_){} fin(true); };  // cancelled = spoken enough — don't double-speak via fallback
    _animAudio.src=url;
    const p=_animAudio.play();
    if(p&&p.catch) p.catch(()=>fin(false));                            // blocked (not unlocked) → fallback
  });
}
async function narrate(text){
  $("#a-cap").textContent=text;
  if (!AUDIO_ON){ await new Promise(r=>setTimeout(r, Math.max(2200, text.length*55))); return; }
  const url=await _animTTSFetch(text);
  if(url && await _animPlay(url)) return;                              // the natural voice spoke
  if("speechSynthesis" in window){ await speakPaced(text, {rate:1.0}); return; }
  await new Promise(r=>setTimeout(r, Math.max(2200, text.length*55)));
}
function mountAnim(kind){
  const cv=$("#cv"), ctx=cv.getContext("2d");

    cancelVoice();

  };

}

const MED = {fat:"#E8A13C", lean:"#D46A62", muscle:"#C85A52", actin:"#9FB2C6",

function _t(ctx,x,y,s,{size=14,col=MED.txt,align="left",bold=false}={}){

const _lerp=(a,b,k)=>a+(b-a)*k;

/* --- 1) BODY COMPOSITION: how much of lost weight is fat vs lean/muscle --- */
function drawBodyComp(ctx,cv,st){

  ctx.beginPath(); ctx.moveTo(W2X(-3.5),W2Y(0)); ctx.lineTo(W2X(3.5),W2Y(0));
  ctx.moveTo(W2X(0),W2Y(-3)); ctx.lineTo(W2X(0),W2Y(3)); ctx.stroke();

function opField(ctx,cv,p,k=1){ const A=p.A;
  for(let x=-3;x<=3;x+=0.75) for(let y=-2.5;y<=2.5;y+=0.75){
    const vx=A[0][0]*x+A[0][1]*y, vy=A[1][0]*x+A[1][1]*y;
    const n=Math.hypot(vx,vy)||1, L=0.28*Math.min(1,n)*k;
    const x2=x+vx/n*L, y2=y+vy/n*L;
    ctx.strokeStyle="rgba(124,141,165,0.55)"; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(W2X(x),W2Y(y)); ctx.lineTo(W2X(x2),W2Y(y2)); ctx.stroke();

  const f=(x,y)=>[A[0][0]*x+A[0][1]*y, A[1][0]*x+A[1][1]*y];
  for(let i=0;i<steps;i++){ const k1=f(x,y), k2=f(x+dt/2*k1[0],y+dt/2*k1[1]),
    k3=f(x+dt/2*k2[0],y+dt/2*k2[1]), k4=f(x+dt*k3[0],y+dt*k3[1]);
    x+=dt/6*(k1[0]+2*k2[0]+2*k3[0]+k4[0]); y+=dt/6*(k1[1]+2*k2[1]+2*k3[1]+k4[1]);

    ctx.moveTo(W2X(pts[0][0]),W2Y(pts[0][1]));
    for(let i=1;i<n;i++) ctx.lineTo(W2X(pts[i][0]),W2Y(pts[i][1])); ctx.stroke();
    const h=pts[n-1]; ctx.fillStyle=p.color||F.post;
