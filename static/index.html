/* ═════════════════════════════════════════════════════════════════════════════
   5) gen_crispr  →  concept "crispr-mechanism"
   Guide finds its match, the PAM licenses the cut, Cas9 breaks both strands —
   and then the CELL decides: NHEJ (indels, knockout) or HDR (precise, S/G2).
   Then the point of base and prime editing: rewrite letters with NO break.
   ═════════════════════════════════════════════════════════════════════════════ */
const CR = (() => {
  const SPACER = "GTCACCTTGATCACTATACC";            // 20-nt protospacer, contains no GG
  const PAM    = "AGG";                             // the licensing 5'-NGG-3'
  const FLANK  = "CTCGGCATCAT";                     // carries one decoy NGG
  const SEQ = SPACER + PAM + FLANK;
  const COMP = { A: "T", T: "A", G: "C", C: "G" };
  const comp = SEQ.split("").map(b => COMP[b]).join("");

  const pams = [];                                  // every NGG in the drawn sequence
  for (let i = 0; i + 2 < SEQ.length; i++) if (SEQ[i + 1] === "G" && SEQ[i + 2] === "G") pams.push(i);
  const pamReal = SPACER.length;                    // the one adjacent to the protospacer
  const pamDecoy = pams.find(p => p !== pamReal);
  const cutIdx = pamReal - 3;                       // blunt DSB ~3 bp upstream of the PAM

  /* what NHEJ versus a clean in-frame deletion does to the reading frame */
  const orfLen = Math.floor(SEQ.length / 3) * 3;
  const codons = s => { const o = []; for (let i = 0; i + 3 <= s.length; i += 3) o.push(s.slice(i, i + 3)); return o; };
  const origC = codons(SEQ.slice(0, orfLen));
  const fsC   = codons(SEQ.slice(0, cutIdx) + SEQ.slice(cutIdx + 1, orfLen));       // 1-nt deletion
  const ifC   = codons(SEQ.slice(0, cutIdx - 2) + SEQ.slice(cutIdx + 1, orfLen));   // 3-nt deletion
  const suffix = (a, b) => { let n = 0; while (n < a.length && n < b.length && a[a.length - 1 - n] === b[b.length - 1 - n]) n++; return n; };
  const prefix = (a, b) => { let n = 0; while (n < a.length && n < b.length && a[n] === b[n]) n++; return n; };
  const fsPre = prefix(origC, fsC), fsKeep = suffix(origC, fsC);
  const ifPre = prefix(origC, ifC), ifKeep = suffix(origC, ifC);
  const fsNovel = fsC.length - fsPre - fsKeep;

  /* base-editing activity window: protospacer positions 4–8, PAM-distal end = 1 */
  const W0 = 3, W1 = 7;                                        // 0-indexed, inclusive
  const win = SEQ.slice(W0, W1 + 1);
  const winC = win.split("").filter(b => b === "C").length;

  return { SEQ, comp, SPACER, PAM, FLANK, pams, pamReal, pamDecoy, cutIdx,
           guideLen: SPACER.length, seqLen: SEQ.length, orfCodons: origC.length,
           fsCodons: fsC.length, fsPre, fsKeep, fsNovel,
           ifCodons: ifC.length, ifKeep, W0, W1, win, winC,
           edited: SEQ.split("").map((b, i) => (i >= W0 && i <= W1 && b === "C") ? "T" : b).join("") };
})();

const CR_X0 = 78, CR_DX = 22, CR_YT = 122, CR_YB = 160;
function crLetterX(i) { return CR_X0 + i * CR_DX; }

function drawCrispr(ctx, cv, { stage = 0, scan = 0, cut = 0, title } = {}) {
  genFrame(ctx, title || "CRISPR — the cut is the easy part");
  const gap = cut * 13, showEdit = stage >= 6;
  const src = showEdit ? CR.edited : CR.SEQ;

  /* PAM interrogation highlights */
  if (stage >= 1) CR.pams.forEach(p => {
    const real = p === CR.pamReal, live = stage >= 2 ? real : (scan * CR.SEQ.length >= p);
    ctx.fillStyle = real ? "rgba(95,191,149,.18)" : "rgba(212,106,98,.14)";
    if (live || stage < 2) ctx.fillRect(crLetterX(p) - 10, CR_YT - 18, CR_DX * 3, (CR_YB - CR_YT) + 30);
    if (live) genText(ctx, real ? "PAM ✓" : "PAM, but no guide match", crLetterX(p) - 10, CR_YT - 24,
                      real ? F.ok : F.wrong, 10);
  });

  /* the duplex */
  for (let i = 0; i < src.length; i++) {
    const shift = (cut > 0 && i >= CR.cutIdx) ? gap : (cut > 0 ? -gap : 0);
    const x = crLetterX(i) + shift;
    const inWin = stage >= 6 && i >= CR.W0 && i <= CR.W1;
    const changed = showEdit && src[i] !== CR.SEQ[i];
    ctx.strokeStyle = "rgba(124,141,165,.35)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, CR_YT + 6); ctx.lineTo(x, CR_YB - 10); ctx.stroke();
    genText(ctx, src[i], x, CR_YT, changed ? F.ok : (inWin ? F.post : F.prior), 13, "center");
    genText(ctx, CR.comp[i], x, CR_YB + 4, "rgba(124,141,165,.5)", 13, "center");
  }
  genText(ctx, "5′", 44, CR_YT + 2, "rgba(215,223,234,.55)", 11);
  genText(ctx, "3′", 44, CR_YB + 4, "rgba(215,223,234,.55)", 11);

  /* the guide */
  if (stage >= 1 && stage < 5) {
    const gx = crLetterX(0) - 10, gw = CR.guideLen * CR_DX;
    ctx.strokeStyle = F.post; ctx.lineWidth = 1.6; ctx.strokeRect(gx, 84, gw, 18);
    genText(ctx, CR.guideLen + "-nt guide RNA spacer — base-pairs with the target strand", gx + 6, 98, F.post, 11);
  }
  if (stage === 1) genText(ctx, "Cas9 collides with DNA and interrogates PAM sites FIRST — only then does it unwind and test the guide.", 18, 62, F.txt, 12);
  if (stage === 0) genText(ctx, "5′-NGG-3′ is the PAM — protospacer adjacent motif. No PAM, no cut.", 18, 62, F.txt, 12);

  /* the double-strand break */
  if (cut > 0) {
    const x = crLetterX(CR.cutIdx) - CR_DX / 2;
    ctx.strokeStyle = F.wrong; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x - gap, CR_YT - 14); ctx.lineTo(x - gap, CR_YB + 14);
    ctx.moveTo(x + gap, CR_YT - 14); ctx.lineTo(x + gap, CR_YB + 14); ctx.stroke();
    if (cut > .6) genText(ctx, "blunt DOUBLE-STRAND BREAK, 3 bp upstream of the PAM (between base " + CR.cutIdx + " and " + (CR.cutIdx + 1) + ")",
                          18, 196, F.wrong, 12);
  }

  /* outcome boxes — the CELL decides */
  if (stage >= 3) {
    gbBox(ctx, 40, 214, 396, 126, "rgba(232,161,60,.45)", "rgba(232,161,60,.05)");
    genText(ctx, "NHEJ — non-homologous end joining", 54, 236, F.post, 12);
    genText(ctx, "active all cycle · rejoins sloppily · leaves indels", 54, 256, "rgba(215,223,234,.7)", 11);
    genText(ctx, "delete 1 base → frame shifts: " + CR.fsNovel + " of the " + CR.fsCodons + " codons here", 54, 278, F.post, 11);
    genText(ctx, "become triplets that were never in the gene → KNOCKOUT", 54, 296, F.post, 11);
    genText(ctx, "delete 3 → frame survives: " + CR.ifKeep + " downstream codons intact", 54, 318, "rgba(215,223,234,.6)", 11);
    genText(ctx, "indel size is random, so ~2 in 3 land out of frame", 54, 336, "rgba(215,223,234,.6)", 11);
  }
  if (stage >= 4) {
    gbBox(ctx, 462, 214, 398, 126, "rgba(111,180,224,.45)", "rgba(111,180,224,.05)");
    genText(ctx, "HDR — homology-directed repair", 476, 236, GB_BLUE, 12);
    genText(ctx, "copies from a supplied donor template → PRECISE", 476, 256, "rgba(215,223,234,.7)", 11);
    ctx.fillStyle = GB_BLUE; ctx.globalAlpha = .35; ctx.fillRect(476, 266, 300, 12); ctx.globalAlpha = 1;
    genText(ctx, "donor template", 480, 276, "#0d1117", 10);
    genText(ctx, "but: restricted to S and G2 phase, and inefficient even there", 476, 300, F.wrong, 11);
    genText(ctx, "→ barely works in neurons, hepatocytes, mature muscle —", 476, 318, F.wrong, 11);
    genText(ctx, "which is where most genetic disease actually lives.", 476, 336, F.wrong, 11);
  }
  if (stage >= 5 && stage < 6) {
    genText(ctx, "The break itself is not innocent: large deletions, chromothripsis, whole-chromosome loss and p53 activation are all documented at cut sites.",
            18, 216, F.wrong, 12);
    genText(ctx, "Every one of those findings motivated an editor that does not break the DNA at all.", 18, 238, F.txt, 12);
  }
  if (stage >= 6) {
    const w0 = crLetterX(CR.W0) - CR_DX / 2, ww = (CR.W1 - CR.W0 + 1) * CR_DX;
    ctx.strokeStyle = F.post; ctx.lineWidth = 1.4; ctx.strokeRect(w0, CR_YT - 20, ww, 46);
    genText(ctx, "activity window", w0, CR_YT - 26, F.post, 10);
    gbBox(ctx, 40, 214, 396, 126, "rgba(95,191,149,.45)", "rgba(95,191,149,.05)");
    genText(ctx, "BASE EDITING — NO double-strand break", 54, 236, F.ok, 12);
    genText(ctx, "impaired Cas9 fused to a deaminase; chemistry, not cutting", 54, 256, "rgba(215,223,234,.7)", 11);
    genText(ctx, "CBE: C•G → T•A     ABE: A•T → G•C  (transitions only)", 54, 278, F.ok, 11);
    genText(ctx, "works in NON-DIVIDING cells — the gap HDR could not fill", 54, 298, F.ok, 11);
    genText(ctx, CR.winC + " cytosines sit in this window and both get rewritten —", 54, 320, F.wrong, 11);
    genText(ctx, "one was the target; the other is a BYSTANDER edit.", 54, 338, F.wrong, 11);
  }
  if (stage >= 7) {
    const nx = crLetterX(CR.cutIdx) - CR_DX / 2;
    ctx.strokeStyle = GB_VIO; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(nx, CR_YT - 12); ctx.lineTo(nx, CR_YT + 10); ctx.stroke();
    genText(ctx, "nick — ONE strand only", nx + 6, CR_YT - 16, GB_VIO, 10);
    gbBox(ctx, 462, 214, 398, 126, "rgba(168,140,216,.45)", "rgba(168,140,216,.05)");
    genText(ctx, "PRIME EDITING — a nick, not a break", 476, 236, GB_VIO, 12);
    genText(ctx, "Cas9 NICKASE fused to a reverse transcriptase", 476, 256, "rgba(215,223,234,.7)", 11);
    genText(ctx, "pegRNA carries a primer binding site + an RT template", 476, 276, "rgba(215,223,234,.7)", 11);
    genText(ctx, "all 12 substitutions + small insertions and deletions", 476, 298, GB_VIO, 11);
    genText(ctx, "no donor template, no double-strand break", 476, 318, GB_VIO, 11);
    genText(ctx, "price: lower efficiency, and a much bigger construct to deliver", 476, 338, F.wrong, 11);
  }
}
ANIMS.gen_crispr_static = (cv, ctx) => drawCrispr(ctx, cv, { stage: 2, scan: 1, cut: 0 });
ANIMS.gen_crispr = async (cv, ctx) => {
  drawCrispr(ctx, cv, { stage: 0 });
  await narrate("CRISPR — clustered regularly interspaced short palindromic repeats — is a bacterial immune system reprogrammed as a tool. Here is " + CR.seqLen +
    " base pairs of a target gene, both strands. Three things decide where it gets cut: a " + CR.guideLen +
    "-nucleotide spacer in the guide RNA, two nuclease domains in the Cas9 protein, and a short motif called the PAM — protospacer adjacent motif — which for this Cas9 is N-G-G. No PAM, no cut.");

  await tween(1600, k => drawCrispr(ctx, cv, { stage: 1, scan: k }));
  await narrate("Recognition happens PAM-FIRST. Cas9 collides with DNA, finds a PAM, and only then unwinds the neighbouring duplex to test whether the guide matches. There are " + CR.pams.length +
    " N-G-G sites in this stretch. It interrogates the one at position " + CR.pamDecoy + " and walks away — the guide does not pair there. It commits at position " + CR.pamReal +
    ", because that PAM sits immediately three-prime of the sequence the guide was designed against. This is also how a bacterium avoids shredding its own CRISPR array, which stores those spacers with no adjacent PAM.");

  drawCrispr(ctx, cv, { stage: 2, scan: 1 });
  await tween(900, k => drawCrispr(ctx, cv, { stage: 2, scan: 1, cut: k }));
  await narrate("Both domains fire — HNH on the target strand, RuvC on the other — and you get a blunt double-strand break about three base pairs upstream of the PAM, between base " + CR.cutIdx +
    " and base " + (CR.cutIdx + 1) + ". And now the crucial point, the one that gets skipped. Cas9 does not edit. It breaks. What happens next is decided entirely by the cell's own repair machinery.");

  drawCrispr(ctx, cv, { stage: 3, cut: 1 });
  await narrate("Path one: non-homologous end joining, NHEJ. It runs throughout the cell cycle and rejoins the ends sloppily, leaving small insertions or deletions. Delete a single base at this cut and the reading frame shifts — " + CR.fsNovel +
    " of the " + CR.fsCodons + " codons here become triplets that were never in the gene. Delete three bases instead and the frame survives: " + CR.ifKeep +
    " downstream codons stay intact and you simply lose one. Indel size is random, so roughly two in three land out of frame, which is why one guide reliably disables a gene across a population of cells. Breaking a gene is easy.");

  drawCrispr(ctx, cv, { stage: 4, cut: 1 });
  await narrate("Path two: homology-directed repair, HDR. Supply a donor template and the cell can copy a precise sequence in. But HDR is restricted to S and G2 phase and is inefficient even there, so it barely works in non-dividing cells — neurons, hepatocytes, mature muscle. Which is exactly where most genetic disease lives. That asymmetry is the whole problem: breaking a gene is easy, fixing one is not.");

  drawCrispr(ctx, cv, { stage: 5, cut: 1 });
  await narrate("And the break itself is not innocent. Work from 2018 onward documented large deletions and complex rearrangements at cut sites, chromothripsis and whole-chromosome loss after cutting, and p53 activation that preferentially selects for p53-deficient cells in culture. Every one of those findings motivated the same idea: change the letters without breaking the backbone.");

  drawCrispr(ctx, cv, { stage: 6, cut: 0 });
  await narrate("Base editing. A catalytically impaired Cas9 — it still finds the site, it no longer cuts — is fused to a deaminase that chemically rewrites one base inside a small window of exposed single strand. A cytosine base editor converts C to T; an adenine base editor converts A to G. No break, no donor template, and it works in non-dividing cells. The limits are equally specific: only transitions, never transversions, and bystander editing — " + CR.winC +
    " cytosines sit inside this window and the editor cannot tell them apart, so both get rewritten.");

  drawCrispr(ctx, cv, { stage: 7, cut: 0 });
  await narrate("Prime editing goes further. A Cas9 nickase — it cuts ONE strand, not two — is fused to a reverse transcriptase, and the guide is replaced by a pegRNA carrying a primer binding site plus a template encoding the edit you want. The nicked strand primes reverse transcription of that edit straight into the genome: all twelve base-to-base substitutions plus small insertions and deletions, with no double-strand break and no donor. The price is lower efficiency and a much larger construct — which lands you on the real bottleneck, which is not editing at all. It is getting the machine into the right tissue.");
};

/* ═════════════════════════════════════════════════════════════════════════════
   6) gen_crispr_clinic  →  concept "crispr-in-the-clinic"
   Casgevy: not a correction of the sickle mutation but a knockout of the BCL11A
   erythroid enhancer, re-awakening fetal haemoglobin. Then the caveats the card
   actually carries — conditioning, cost, access — and why delivery is the limit.
   ═════════════════════════════════════════════════════════════════════════════ */
const CLIN = (() => {
  const NCELL = 60, THRESH = 20;                    // per-cell HbF % that blocks polymerisation
  const HBF_PRE = 5, SD_PRE = 3, HBF_POST = 40, SD_POST = 12;
  const r = gbRng(20231208);                        // FDA approval date, 8 Dec 2023
  const z = [], pos = [];
  for (let i = 0; i < NCELL; i++) { z.push(gbNorm(r)); pos.push({ jx: r(), jy: r() }); }
  const pre  = z.map(v => Math.max(0, HBF_PRE + SD_PRE * v));
  const post = z.map(v => Math.max(0, Math.min(85, HBF_POST + SD_POST * v)));
  const sickPre  = pre .filter(v => v < THRESH).length;
  const sickPost = post.filter(v => v < THRESH).length;
  const meanPre  = pre .reduce((a, b) => a + b, 0) / NCELL;
  const meanPost = post.reduce((a, b) => a + b, 0) / NCELL;

  const COST_LO = 2.0, COST_HI = 3.0;               // $M list price, before the episode of care
  const NBIRTH = 100, AFRICA = 75;                  // share of affected births in sub-Saharan Africa
  const birth = []; for (let i = 0; i < NBIRTH; i++) birth.push(i < AFRICA ? "ssa" : "row");
  const nSsa = birth.filter(b => b === "ssa").length;

  const EXVIVO = ["apheresis — collect CD34+ stem cells", "edit BCL11A enhancer ex vivo (Cas9 RNP)",
                  "sequence and release the product", "myeloablative busulfan conditioning",
                  "weeks inpatient — cytopenia, infection risk", "reinfuse and wait for engraftment"];
  const INVIVO = ["inject the editor", "it edits the cells in place"];

  return { NCELL, THRESH, pre, post, pos, sickPre, sickPost, meanPre, meanPost,
           roundPost: NCELL - sickPost, roundPct: 100 * (NCELL - sickPost) / NCELL,
           hbfGain: meanPost - meanPre, COST_LO, COST_HI, COST_MID: (2.0 + 3.0) / 2,
           NBIRTH, nSsa, ssaPct: 100 * nSsa / NBIRTH, EXVIVO, INVIVO,
           stepGap: EXVIVO.length - INVIVO.length, birth };
})();

function clinCell(ctx, x, y, hbf, k) {
  const sick = hbf < CLIN.THRESH;
  const s = sick ? 1 : 0;
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = sick ? F.wrong : GB_BLUE; ctx.globalAlpha = .8;
  ctx.beginPath();
  if (s) { ctx.moveTo(-9, 6); ctx.quadraticCurveTo(0, -14, 9, 5); ctx.quadraticCurveTo(0, -3, -9, 6); }
  else ctx.arc(0, 0, 7, 0, 7);
  ctx.fill(); ctx.globalAlpha = 1; ctx.restore();
}

  if (scene === 2) {

  genText(ctx, "Lipid nanoparticles pick up an ApoE coat in circulation and are taken up by", 470, 196, "rgba(215,223,234,.7)", 11);
  genText(ctx, "hepatocytes via the LDL receptor — which is exactly why LIVER targets went first,", 470, 214, "rgba(215,223,234,.7)", 11);
  genText(ctx, "and why muscle, brain, lung and blood stem cells remain unsolved.", 470, 232, "rgba(215,223,234,.7)", 11);
  genText(ctx, "AAV delivers durably but caps cargo near 4.7 kb — SpCas9 barely fits and", 470, 258, "rgba(215,223,234,.7)", 11);
  genText(ctx, "prime editors do not — plus pre-existing immunity in much of the population.", 470, 276, "rgba(215,223,234,.7)", 11);
  genText(ctx, "Everything here is SOMATIC — confined to the treated patient's own cells, not inherited by their children. Heritable embryo editing is a different line, and in May 2025",
          22, 344, "rgba(215,223,234,.7)", 11);

}

ANIMS.gen_crispr_clinic = async (cv, ctx) => {
  drawClinic(ctx, cv, { scene: 0, k: 0 });
  await narrate("On the eighth of December 2023 the FDA approved two one-time therapies for severe sickle cell disease, and only one of them is gene editing. Casgevy is the CRISPR one. Here is what it actually involves — " + CLIN.EXVIVO.length + " steps, every one of them inside a specialised transplant centre.");

  await tween(1800, k => drawClinic(ctx, cv, { scene: 0, k }));
  await narrate("And now the design choice worth pausing on, because it is the cleverest thing in the whole product. Casgevy does NOT correct the sickle mutation. It knocks out the erythroid enhancer of BCL11A — the repressor that switches fetal haemoglobin, HbF, off shortly after birth. Disable the repressor and HbF comes back on; HbF interferes with sickle polymerisation and substitutes functionally for the defective beta-globin. That is a simple disabling edit of exactly the kind Cas9 does well, and it is far more tractable than precisely repairing the HBB gene inside a stem cell. The other approval that day, Lyfgenia, is not editing at all — a lentivirus adds a modified beta-globin gene, and it carries a boxed warning for haematologic malignancy.");

  drawClinic(ctx, cv, { scene: 1, k: 0 });
  await narrate("Here are " + CLIN.NCELL + " of the patient's red cells before treatment. Mean fetal haemoglobin " + CLIN.meanPre.toFixed(0) +
    " percent, and " + CLIN.sickPre + " of " + CLIN.NCELL + " are sickled. A cell resists polymerisation once its own HbF passes roughly " + CLIN.THRESH + " percent, and almost none of these do.");

  await tween(2600, k => drawClinic(ctx, cv, { scene: 1, k }));
  await narrate("Now the edited stem cells engraft and start making red cells. Mean HbF rises from " + CLIN.meanPre.toFixed(0) + " to " +
    CLIN.meanPost.toFixed(0) + " percent — a gain of " + CLIN.hbfGain.toFixed(0) + " points — and the sickled count falls from " + CLIN.sickPre + " to " +
    CLIN.sickPost + ", so " + CLIN.roundPct.toFixed(0) + " percent of these cells are now round. That matches what the trials report: mean HbF around forty percent of total haemoglobin, the great majority of red cells becoming F-cells, and the large majority of treated patients free of vaso-occlusive crises. The results in treated patients are genuinely impressive.");

  drawClinic(ctx, cv, { scene: 2 });
  await narrate("Then the caveats, and notice that not one of them is about editing. Cost: list prices sit at " + CLIN.COST_LO.toFixed(0) + " to " +
    CLIN.COST_HI.toFixed(0) + " million dollars, before apheresis, conditioning, the inpatient stay and monitoring. Conditioning: both products need myeloablative busulfan to clear marrow niches for the edited cells — infertility risk, prolonged cytopenia, weeks inpatient, and a patient has to be well enough to survive it in order to receive the cure. Access: " +
    CLIN.nSsa + " of every " + CLIN.NBIRTH + " affected births, about " + CLIN.ssaPct.toFixed(0) +
    " percent, are in sub-Saharan Africa, where none of that infrastructure exists. A therapy reaching hundreds of people is simultaneously a scientific triumph and a delivery failure.");

  drawClinic(ctx, cv, { scene: 3 });
  await narrate("Which is why delivery, not precision, is the frontier. Ex vivo means taking the cells out — " + CLIN.EXVIVO.length +
    " steps, maximum control, you can sequence the product before you dose it, but you are limited to transplantable tissue and you cannot avoid the conditioning. In vivo means injecting the editor and letting it find the tissue: " + CLIN.INVIVO.length +
    " steps, " + CLIN.stepGap + " fewer, and no transplant centre. Lipid nanoparticles pick up an ApoE coat in circulation and get taken into hepatocytes through the LDL receptor, which is exactly why liver targets went first — and why muscle, brain, lung and blood stem cells are still unsolved. In-vivo editing of blood stem cells, if it can be made to work, would change who gets treated far more than any further improvement in editing chemistry.");

  await narrate("One boundary to keep straight. Everything in this lesson is somatic: the change is confined to the treated patient's own cells and is not passed to their children. Heritable editing of embryos is a separate line, and in May 2025 the main gene and cell therapy societies jointly called for a ten-year global moratorium on it. The technical objection has been weakening — a 2026 preprint reported efficient base editing in human embryos with fewer chromosomal alterations than earlier nuclease work, though still with mosaicism and off-target edits. Which leaves governance, equity and enhancement as the real arguments, plus the awkward fact that preimplantation genetic testing already lets most at-risk couples select an unaffected embryo without editing anything.");
};

/* diabetes / dia_tightrope */
(function(){
const dt_X0=80,dt_X1=820,dt_Y0=330,dt_Y1=70,dt_ymax=300;
const dt_sy=y=>dt_Y0-(y/dt_ymax)*(dt_Y0-dt_Y1);
const dt_sx=t=>dt_X0+t*(dt_X1-dt_X0);
const dt_LO=70,dt_HI=180;
const dt_glu=(t)=>125+85*Math.exp(-Math.pow((t-0.28)/0.12,2))-70*Math.exp(-Math.pow((t-0.72)/0.12,2));
function dt_bands(ctx){
  ctx.fillStyle="rgba(212,106,98,0.18)";
  ctx.fillRect(dt_X0,dt_Y1,dt_X1-dt_X0,dt_sy(dt_HI)-dt_Y1);
  ctx.fillRect(dt_X0,dt_sy(dt_LO),dt_X1-dt_X0,dt_Y0-dt_sy(dt_LO));
  ctx.fillStyle="rgba(95,191,149,0.18)";
  ctx.fillRect(dt_X0,dt_sy(dt_HI),dt_X1-dt_X0,dt_sy(dt_LO)-dt_sy(dt_HI));
}
function dt_arrow(ctx,x1,y1,x2,y2){
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  const a=Math.atan2(y2-y1,x2-x1);
  ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-9*Math.cos(a-0.4),y2-9*Math.sin(a-0.4));
  ctx.lineTo(x2-9*Math.cos(a+0.4),y2-9*Math.sin(a+0.4));
  ctx.closePath();ctx.fill();
}
function dt_draw(ctx,cv,s){
  clear(ctx,cv);
  ctx.font="14px 'IBM Plex Mono'";
  dt_bands(ctx);
  ctx.strokeStyle=F.wrong;ctx.lineWidth=1.5;ctx.setLineDash([6,5]);
  ctx.beginPath();ctx.moveTo(dt_X0,dt_sy(dt_HI));ctx.lineTo(dt_X1,dt_sy(dt_HI));ctx.stroke();
  ctx.beginPath();ctx.moveTo(dt_X0,dt_sy(dt_LO));ctx.lineTo(dt_X1,dt_sy(dt_LO));ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle="#3A4C68";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(dt_X0,dt_Y0);ctx.lineTo(dt_X1,dt_Y0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(dt_X0,dt_Y1);ctx.lineTo(dt_X0,dt_Y0);ctx.stroke();
  ctx.fillStyle=F.wrong;ctx.textAlign="left";
  ctx.fillText("HIGH — hyperglycemia",dt_X0+8,dt_Y1+16);
  ctx.fillText("LOW — hypoglycemia",dt_X0+8,dt_Y0-8);
  ctx.fillStyle=F.ok;
  ctx.fillText("SAFE range  (70–180 mg/dL)",dt_X0+8,dt_sy(125)+5);
  ctx.fillStyle=F.txt;ctx.textAlign="right";
  ctx.fillText("blood glucose over time",dt_X1,dt_Y1-16);
  const p=s.p;
  ctx.strokeStyle=F.post;ctx.lineWidth=2.5;ctx.beginPath();
  let first=true;
  for(let t=0;t<=p+0.0001;t+=0.005){const px=dt_sx(t),py=dt_sy(dt_glu(t));if(first){ctx.moveTo(px,py);first=false;}else ctx.lineTo(px,py);}
  ctx.stroke();
  const gv=dt_glu(p),mx=dt_sx(p),my=dt_sy(gv);
  ctx.fillStyle=F.post;ctx.beginPath();ctx.arc(mx,my,6,0,7);ctx.fill();
  if(gv>dt_HI-25){
    ctx.strokeStyle=F.ok;ctx.fillStyle=F.ok;ctx.lineWidth=2;
    dt_arrow(ctx,mx,my-4,mx,my+36);
    ctx.textAlign="left";ctx.fillText("insulin pushes down",mx+12,my+14);
  }else if(gv<dt_LO+25){
    ctx.strokeStyle=F.ok;ctx.fillStyle=F.ok;ctx.lineWidth=2;
    dt_arrow(ctx,mx,my+4,mx,my-36);
    ctx.textAlign="left";ctx.fillText("glucagon pushes up",mx+12,my-8);
  }
  ctx.fillStyle=F.txt;ctx.textAlign="left";

  ctx.fillText("SMALL",110+smP/2,bs_BASE+24);
  ctx.fillStyle=F.ok;ctx.fillText("SA/V = "+bs_SAV(1).toFixed(1),110+smP/2,bs_BASE+42);
  ctx.fillText("(high — sheds heat fast)",110+smP/2,bs_BASE+60);
  // growing / large cube (right) — L from st.L
  const L=st.L;                       // 1 .. 4
  const bigP=54*L*0.42+30;            // pixel side grows with L (bounded)
  const bx=470;
  ctx.fillStyle=L>2?F.post:F.ok;
  bs_cube(ctx,bx,bs_BASE,bigP,L>2.2?F.post:F.ok);
  const sav=bs_SAV(L);
  ctx.fillStyle=F.txt;ctx.textAlign="center";
  ctx.fillText("L = "+L.toFixed(1)+"×",bx+bigP/2,bs_BASE+24);
  ctx.fillStyle=F.post;ctx.font="18px 'IBM Plex Mono'";
  ctx.fillText("SA/V = "+sav.toFixed(2),bx+bigP/2,bs_BASE+46);
  ctx.font="13px 'IBM Plex Mono'";ctx.fillStyle=F.txt;
  ctx.fillText(L>2.3?"(low — retains heat, needs thicker bones)":"(ratio falling…)",bx+bigP/2,bs_BASE+64);
  // consequence note top-right
  ctx.textAlign="right";ctx.fillStyle=F.prior;ctx.font="12px 'IBM Plex Mono'";
  ctx.fillText("strength ∝ area ∝ L²   but weight ∝ L³",860,50);
  ctx.textAlign="left";
}
ANIMS.bio_scaling_static=(cv,ctx)=>bs_frame(ctx,cv,{L:3.2});
ANIMS.bio_scaling=async(cv,ctx)=>{
  bs_frame(ctx,cv,{L:1.0});
  await narrate("Surface area grows as length squared, but volume and mass grow as length cubed.");
  await narrate("So as an animal gets bigger, its surface-to-volume ratio drops — here SA/V equals six divided by L.");
  await tween(2200,k=>bs_frame(ctx,cv,{L:1.0+k*3.0}));
  await narrate("Big animals have little surface per unit mass, so they lose body heat more slowly than small ones.");
  await narrate("But weight climbs faster than bone strength, so big animals need disproportionately thicker bones to stand up.");
};
})();

/* rome / rome_roads */
(function(){
const rr_XL=230, rr_XR=670, rr_cx=450, rr_halfW=220;
const rr_top=182, rr_crownH=16, rr_bottom=300;
const rr_layers=[
  {n:"Statumen — large foundation stones", y0:300, y1:262, fill:"#565f6e"},
  {n:"Rudus — crushed rock & rubble",       y0:262, y1:230, fill:"#6b7484"},
  {n:"Nucleus — fine gravel / concrete",    y0:230, y1:202, fill:"#8b93a2"},
  {n:"Summum dorsum — paved surface",       y0:202, y1:182, fill:"#aeb6c4"},
];
const rr_ED="#2c3a52";
const rr_clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rr_camberTop=(x,c)=>{const t=(x-rr_cx)/rr_halfW; return rr_top - c*rr_crownH*(1-t*t);};

// droplet path point for parameter p in 0..1 (surface -> shoulder -> ditch)
function rr_dropPt(p){
  if(p<0.5){const q=p/0.5, x=rr_cx+q*(rr_XR-rr_cx); return {x, y:rr_camberTop(x,1)};}
  if(p<0.8){const q=(p-0.5)/0.3; return {x:rr_XR+q*(694-rr_XR), y:rr_top+q*(300-rr_top)};}
  const q=(p-0.8)/0.2; return {x:694+q*8, y:300+q*16};
}

function rr_groma(ctx){
  ctx.strokeStyle="#3A4C68"; ctx.lineWidth=1.5;
  // staff
  ctx.beginPath(); ctx.moveTo(110,150); ctx.lineTo(110,70); ctx.stroke();
  // cross arm
  ctx.beginPath(); ctx.moveTo(80,74); ctx.lineTo(140,74); ctx.stroke();
  // plumb lines + bobs
  ctx.strokeStyle="#7C8DA5"; ctx.lineWidth=1;
  [80,140].forEach(px=>{
    ctx.beginPath(); ctx.moveTo(px,74); ctx.lineTo(px,96); ctx.stroke();
    ctx.fillStyle="#7C8DA5"; ctx.beginPath(); ctx.arc(px,99,2.5,0,7); ctx.fill();
  });
  // dead-straight sight line
  ctx.strokeStyle="#E8A13C"; ctx.setLineDash([7,6]); ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(140,74); ctx.lineTo(858,74); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle="#D7DFEA"; ctx.font="12px 'IBM Plex Mono'"; ctx.textAlign="left";
  ctx.fillText("surveyed dead straight — the groma", 300, 64);
}

function rr_draw(ctx,cv,s){
  clear(ctx,cv);
  ctx.font="14px 'IBM Plex Mono'"; ctx.textAlign="left";

  // existing grade line + side ditches
  ctx.strokeStyle="#3A4C68"; ctx.lineWidth=1.5; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(0,300); ctx.lineTo(180,300); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(720,300); ctx.lineTo(900,300); ctx.stroke();
  ctx.setLineDash([]);
  // ditch V notches
  ctx.strokeStyle="#3A4C68"; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(180,300); ctx.lineTo(196,318); ctx.lineTo(212,300); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(694,300); ctx.lineTo(702,316); ctx.lineTo(720,300); ctx.stroke();
  ctx.fillStyle="#4c6a8a"; // water hint in ditches
  ctx.beginPath(); ctx.moveTo(184,308); ctx.lineTo(196,315); ctx.lineTo(208,308); ctx.closePath(); ctx.fill();

  // build layers bottom-up
  for(let i=0;i<rr_layers.length;i++){
    const L=rr_layers[i], rf=rr_clamp(s.built-i,0,1);
    if(rf<=0) continue;
    ctx.fillStyle=L.fill; ctx.strokeStyle=rr_ED; ctx.lineWidth=1;
    if(i===3){
      // summum: crowned camber top once fully revealed, else flat partial fill
      if(rf>=1){
        ctx.beginPath(); ctx.moveTo(rr_XL,L.y0);
        for(let x=rr_XL;x<=rr_XR;x+=6) ctx.lineTo(x, rr_camberTop(x,s.camber));
        ctx.lineTo(rr_XR,L.y0); ctx.closePath(); ctx.fill(); ctx.stroke();
      }else{
        const ty=L.y0-rf*(L.y0-L.y1);
        ctx.fillRect(rr_XL,ty,rr_XR-rr_XL,L.y0-ty); ctx.strokeRect(rr_XL,ty,rr_XR-rr_XL,L.y0-ty);
      }
    }else{
      const ty=L.y0-rf*(L.y0-L.y1);
      ctx.fillRect(rr_XL,ty,rr_XR-rr_XL,L.y0-ty); ctx.strokeRect(rr_XL,ty,rr_XR-rr_XL,L.y0-ty);
    }
  }

  // textures for fully-built layers
  ctx.save(); ctx.beginPath(); ctx.rect(rr_XL,150,rr_XR-rr_XL,rr_bottom-150); ctx.clip();
  if(s.built>=1){ // statumen: big stones
    ctx.strokeStyle=rr_ED; ctx.lineWidth=1; ctx.fillStyle="rgba(0,0,0,0.10)";
    for(let x=rr_XL+24;x<rr_XR-8;x+=48){ctx.beginPath(); ctx.ellipse(x,281,20,11,0,0,7); ctx.fill(); ctx.stroke();}
  }
  if(s.built>=2){ // rudus: rubble
    ctx.fillStyle="rgba(20,26,38,0.45)";
    for(let x=rr_XL+12;x<rr_XR;x+=19)for(let r=0;r<2;r++){ctx.beginPath(); ctx.arc(x+(r?8:0),240+r*14,3,0,7); ctx.fill();}
  }
  if(s.built>=3){ // nucleus: fine grains
    ctx.fillStyle="rgba(30,38,54,0.40)";
    for(let x=rr_XL+8;x<rr_XR;x+=11){ctx.beginPath(); ctx.arc(x,216,1.6,0,7); ctx.fill();}
  }
  if(s.built>=4){ // summum: paving joints
    ctx.strokeStyle="rgba(30,38,54,0.55)"; ctx.lineWidth=1;
    for(let x=rr_XL+20;x<rr_XR;x+=27){ctx.beginPath(); ctx.moveTo(x,rr_camberTop(x,s.camber)); ctx.lineTo(x,202); ctx.stroke();}
  }
  ctx.restore();

  // shoulders (drainage slopes off the crown to the ditches)
  if(s.built>=4){
    ctx.strokeStyle="#8b93a2"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(rr_XR,rr_camberTop(rr_XR,s.camber)); ctx.lineTo(694,300); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(rr_XL,rr_camberTop(rr_XL,s.camber)); ctx.lineTo(206,300); ctx.stroke();
  }

  // camber crown indicator
  if(s.camber>0.9 && s.built>=4){
    ctx.strokeStyle="#E8A13C"; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(rr_cx,rr_camberTop(rr_cx,1)-6); ctx.lineTo(rr_cx,rr_camberTop(rr_cx,1)-26); ctx.stroke();
    ctx.fillStyle="#E8A13C"; ctx.font="12px 'IBM Plex Mono'"; ctx.textAlign="center";
    ctx.fillText("camber (crown)", rr_cx, rr_camberTop(rr_cx,1)-32); ctx.textAlign="left";
  }

  // water droplet running off
  if(s.drop>=0){
    const d=rr_dropPt(rr_clamp(s.drop,0,1));
    ctx.fillStyle="#4fa3d1"; ctx.beginPath(); ctx.arc(d.x,d.y-3,4,0,7); ctx.fill();
    ctx.strokeStyle="rgba(79,163,209,0.5)"; ctx.lineWidth=1;
    ctx.beginPath();
    for(let p=0;p<=rr_clamp(s.drop,0,1)+0.001;p+=0.03){const q=rr_dropPt(p); if(p===0)ctx.moveTo(q.x,q.y-3); else ctx.lineTo(q.x,q.y-3);} ctx.stroke();
  }

  // layer labels (left) with leaders
  ctx.font="12px 'IBM Plex Mono'";
  const rr_lblY=[118,158,198,238]; // summum..statumen order top-down
  const rr_mid=[186,216,246,281];
  for(let j=0;j<4;j++){
    const li=3-j; // label list top=summum(3)
    const rf=rr_clamp(s.built-li,0,1); if(rf<1) continue;
    ctx.fillStyle=rr_layers[li].fill; ctx.fillRect(14,rr_lblY[j]-9,10,10);
    ctx.strokeStyle=rr_ED; ctx.strokeRect(14,rr_lblY[j]-9,10,10);
    ctx.fillStyle="#D7DFEA"; ctx.fillText(rr_layers[li].n, 30, rr_lblY[j]);
    ctx.strokeStyle="#3A4C68"; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(208,rr_lblY[j]-3); ctx.lineTo(rr_XL,rr_mid[li]); ctx.stroke();
  }

  if(s.showGroma) rr_groma(ctx);
}

ANIMS.rome_roads_static=(cv,ctx)=>rr_draw(ctx,cv,{built:4,camber:1,drop:0.92,showGroma:true});
ANIMS.rome_roads=async(cv,ctx)=>{
  rr_draw(ctx,cv,{built:0,camber:0,drop:-1,showGroma:false});
  await narrate("Roman roads were built in engineered layers, dug into a trench and stacked for strength and drainage.");
  await tween(2400,k=>rr_draw(ctx,cv,{built:k*4,camber:0,drop:-1,showGroma:false}));
  await narrate("From the bottom up: statumen (large stones), rudus (crushed rock), nucleus (fine concrete), then the paved summum dorsum.");
  await tween(1400,k=>rr_draw(ctx,cv,{built:4,camber:k,drop:-1,showGroma:false}));
  await narrate("The surface was crowned into a camber, so rain runs off the middle to drainage ditches on each side.");
  await tween(1700,k=>rr_draw(ctx,cv,{built:4,camber:1,drop:k,showGroma:false}));
  await narrate("Surveyors sighted the route dead straight across the landscape using a tool called the groma.");
  rr_draw(ctx,cv,{built:4,camber:1,drop:0.99,showGroma:true});
};
})();

/* rome / rome_machines */
(function(){
const rm_beamY=88, rm_groundY=342;
const rm_bx=470;                 // block centre-line x
const rm_fixTop=100, rm_fixBot=122;  // fixed block sheaves
const rm_falls=[446,462,478,494];    // 4 rope falls -> mechanical advantage 4
const rm_clamp=(v,a,b)=>v<a?a:v>b?b:v;

function rm_arrow(ctx,x,y0,y1,col,w){
  ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=w;
  ctx.beginPath(); ctx.moveTo(x,y0); ctx.lineTo(x,y1); ctx.stroke();
  const d=y1>y0?1:-1;
  ctx.beginPath(); ctx.moveTo(x,y1); ctx.lineTo(x-5,y1-d*9); ctx.lineTo(x+5,y1-d*9); ctx.closePath(); ctx.fill();
}

function rm_worker(ctx,hx,hy){
  ctx.strokeStyle="#D7DFEA"; ctx.lineWidth=2; ctx.fillStyle="#D7DFEA";
  const fx=290, fy=rm_groundY;      // feet
  const head=fy-70;
  ctx.beginPath(); ctx.arc(fx,head,7,0,7); ctx.stroke();       // head
  ctx.beginPath(); ctx.moveTo(fx,head+7); ctx.lineTo(fx,fy-28); ctx.stroke(); // torso
  ctx.beginPath(); ctx.moveTo(fx,fy-28); ctx.lineTo(fx-12,fy); ctx.moveTo(fx,fy-28); ctx.lineTo(fx+12,fy); ctx.stroke(); // legs
  ctx.beginPath(); ctx.moveTo(fx,head+16); ctx.lineTo(hx,hy); ctx.stroke(); // arm to rope
}

function rm_treadwheel(ctx){
  // faint historical power source at the right post
  ctx.strokeStyle="#3A4C68"; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(742,300,30,0,7); ctx.stroke();
  ctx.beginPath(); ctx.arc(742,300,22,0,7); ctx.stroke();
  for(let a=0;a<6;a++){const an=a*Math.PI/3; ctx.beginPath(); ctx.moveTo(742,300); ctx.lineTo(742+30*Math.cos(an),300+30*Math.sin(an)); ctx.stroke();}
  ctx.fillStyle="#7C8DA5"; ctx.font="11px 'IBM Plex Mono'"; ctx.textAlign="center";
  ctx.fillText("treadwheel", 742, 348); ctx.textAlign="left";
}

function rm_draw(ctx,cv,s){
  clear(ctx,cv);
  ctx.font="14px 'IBM Plex Mono'"; ctx.textAlign="left";
  const lift=rm_clamp(s.lift,0,1);
  const liftPx=60*lift;
  const mvTop=248-liftPx;          // moving block top rises
  const mvBot=mvTop+18;
  const stoneTop=mvBot+18, stoneH=56, stoneW=94;

  // ground
  ctx.strokeStyle="#3A4C68"; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(0,rm_groundY); ctx.lineTo(900,rm_groundY); ctx.stroke();

  // gantry: beam + posts
  ctx.strokeStyle="#6b7484"; ctx.lineWidth=6;
  ctx.beginPath(); ctx.moveTo(180,rm_beamY); ctx.lineTo(760,rm_beamY); ctx.stroke();
  ctx.lineWidth=8;
  ctx.beginPath(); ctx.moveTo(200,rm_beamY); ctx.lineTo(200,rm_groundY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(740,rm_beamY); ctx.lineTo(740,rm_groundY); ctx.stroke();

  rm_treadwheel(ctx);

  // rope falls between the two blocks (the reeved tackle)
  ctx.strokeStyle="#c9a06a"; ctx.lineWidth=2;
  for(const fx of rm_falls){ctx.beginPath(); ctx.moveTo(fx,rm_fixBot); ctx.lineTo(fx,mvTop); ctx.stroke();}
  // reeving arcs: bottom (moving) between 1-2 and 3-4, top (fixed) between 2-3
  ctx.beginPath(); ctx.arc((rm_falls[0]+rm_falls[1])/2,mvTop,(rm_falls[1]-rm_falls[0])/2,0,Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.arc((rm_falls[2]+rm_falls[3])/2,mvTop,(rm_falls[3]-rm_falls[2])/2,0,Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.arc((rm_falls[1]+rm_falls[2])/2,rm_fixBot,(rm_falls[2]-rm_falls[1])/2,Math.PI,2*Math.PI); ctx.stroke();

  // lead rope: from fixed block over a guide at the beam, down to the worker's hands
  const handY=196+70*lift, handX=300;
  ctx.strokeStyle="#c9a06a"; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(rm_falls[0],rm_fixBot);
  ctx.lineTo(rm_falls[0],rm_fixTop-2);
  ctx.lineTo(handX,rm_beamY);
  ctx.lineTo(handX,handY);
  ctx.stroke();
  // guide sheave
  ctx.fillStyle="#8b93a2"; ctx.beginPath(); ctx.arc(handX,rm_beamY,4,0,7); ctx.fill();

  // fixed block
  ctx.fillStyle="#565f6e"; ctx.strokeStyle="#2c3a52"; ctx.lineWidth=1.5;
  ctx.fillRect(rm_bx-40,rm_fixTop-6,80,26); ctx.strokeRect(rm_bx-40,rm_fixTop-6,80,26);
  // hanger from beam
  ctx.strokeStyle="#6b7484"; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(rm_bx,rm_beamY); ctx.lineTo(rm_bx,rm_fixTop-6); ctx.stroke();

  // moving block
  ctx.fillStyle="#565f6e"; ctx.strokeStyle="#2c3a52"; ctx.lineWidth=1.5;
  ctx.fillRect(rm_bx-32,mvTop,64,22); ctx.strokeRect(rm_bx-32,mvTop,64,22);
  // short rope to stone
  ctx.strokeStyle="#c9a06a"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(rm_bx,mvBot); ctx.lineTo(rm_bx,stoneTop); ctx.stroke();

  // heavy stone block
  ctx.fillStyle="#8b93a2"; ctx.strokeStyle="#2c3a52"; ctx.lineWidth=1.5;
  ctx.fillRect(rm_bx-stoneW/2,stoneTop,stoneW,stoneH); ctx.strokeRect(rm_bx-stoneW/2,stoneTop,stoneW,stoneH);
  ctx.strokeStyle="rgba(30,38,54,0.5)";
  ctx.beginPath(); ctx.moveTo(rm_bx-stoneW/2,stoneTop+stoneH/2); ctx.lineTo(rm_bx+stoneW/2,stoneTop+stoneH/2); ctx.stroke();

  rm_worker(ctx,handX,handY);

  // force arrows + labels
  rm_arrow(ctx,rm_bx,stoneTop+stoneH+6,stoneTop+stoneH+56,"#D46A62",4); // big load
  ctx.fillStyle="#D46A62"; ctx.font="13px 'IBM Plex Mono'"; ctx.textAlign="left";
  // detected overlap: under the arrow this label lands at y=379 (off-canvas at
  // low lift) and crossed the trade-off strip at y=372. It now rides beside the
  // stone, which never leaves the canvas. Do not put it back under the arrow.
  ctx.fillText("Load W ≈ 2 t (20 kN)", rm_bx+stoneW/2+14, stoneTop+stoneH/2+5);

  rm_arrow(ctx,handX+16,handY-4,handY+30,"#5FBF95",2.5);           // small effort
  ctx.fillStyle="#5FBF95"; ctx.textAlign="left";
  ctx.fillText("Effort ≈ W÷4 ≈ 5 kN", handX+24, handY+16);

  // tackle annotation
  ctx.fillStyle="#E8A13C"; ctx.font="12px 'IBM Plex Mono'"; ctx.textAlign="left";
  ctx.fillText("4 supporting ropes", 540, 170);
  ctx.strokeStyle="#E8A13C"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(535,166); ctx.lineTo(rm_falls[3]+4,(rm_fixBot+mvTop)/2); ctx.stroke();

  // trade-off strip
  ctx.fillStyle="#D7DFEA"; ctx.font="13px 'IBM Plex Mono'"; ctx.textAlign="center";
  ctx.fillText("mechanical advantage 4×  —  pull 4× the rope for ¼ the force", 450, 372);
}

ANIMS.rome_machines_static=(cv,ctx)=>rm_draw(ctx,cv,{lift:0.55});
ANIMS.rome_machines=async(cv,ctx)=>{
  rm_draw(ctx,cv,{lift:0});
  await narrate("Roman cranes used a block and tackle: one rope threaded back and forth between two pulley blocks.");
  await tween(2200,k=>rm_draw(ctx,cv,{lift:k}));
  await narrate("Each of the four rope falls carries a share of the load, so the pull is only about a quarter of the weight.");
  await narrate("A 2-tonne stone needs a pull of just half a tonne — but the rope must be hauled four times as far.");
  await narrate("That is mechanical advantage: you trade a longer pull for a smaller force, energy in equalling energy out.");
  rm_draw(ctx,cv,{lift:1});
};
})();
